[mutmut]
# YTEST9 — mutation testing targets ONLY the highest-risk, most-consequential
# modules (never the whole repo — mutmut is O(mutants x full test run), a
# repo-wide sweep would never finish and would gate nothing usefully).
# Run manually / via the nightly workflow (.github/workflows/mutation.yml),
# NEVER as a per-commit gate. Triage of surviving mutants: docs/TESTING.md
# (Mutation section).
#
# QAH5 — READ BEFORE TOUCHING: mutmut 3.x REMOVED the 2.x `runner=<shell
# command>` config key outright (verified by reading the installed 3.8.0
# package's `Config` dataclass in `mutmut/configuration.py` — there is no
# `runner` field any more, and nothing in `_load_config()` reads a `runner`
# option). Mutmut now drives `pytest` DIRECTLY and in-process (forked
# workers), via `pytest_add_cli_args`/`pytest_add_cli_args_test_selection` —
# there is no supported way left to point it at `manage.py test`. This
# repo's Django `TestCase`s need `django.setup()` plus a migrated test
# database before pytest can even import a model (`AppRegistryNotReady`
# otherwise); `manage.py test`'s `DiscoverRunner` and the `pytest-django`
# plugin are the only two things that provide that, and NEITHER is wired
# here — `pytest-django` is a new dependency and QAH5's task scope keeps
# `requirements-dev.txt` to the mutmut version bump only, and no
# `conftest.py` is in scope either. Until that bridge is built, `mutmut run`
# in `.github/workflows/mutation.yml` is expected to fail to execute any
# real test, and the nightly summary/artifact will show empty or errored
# data — the job stays `continue-on-error`, so this blocks nothing. Full
# explanation: docs/TESTING.md's Mutation section.
#
# `paths_to_mutate`/`tests_dir` are mutmut-3-deprecated ALIASES (still read,
# just print a warning) for `source_paths`/`pytest_add_cli_args_test_selection`
# — kept under their 2.x names so this stays a readable diff of the previous
# scope. QAH5 extends that scope with the ventes MONEY CHAIN
# (`apps/ventes/domain/argent.py`, the façade `Devis.total_*` delegates to;
# `apps/facturation/totaux.py`, the single `TotauxDocumentMixin` shared by
# Facture/Avoir/NoteDebit — AUD105-107) and the company-scoping
# mixins/permissions (`core/mixins.py`'s `TenantMixin` +
# `SameCompanyFKSerializerMixin`; `core/permissions.py`'s `ScopedPermission` +
# `WriteScopedPermissionMixin`, the ARC2/ARC55 tenant-isolation base every
# `CompanyScopedModelViewSet` inherits).
paths_to_mutate=
    apps/ventes/quote_engine/builder.py,
    apps/ventes/utils/references.py,
    apps/roles/models.py,
    apps/ventes/domain/argent.py,
    apps/facturation/totaux.py,
    core/mixins.py,
    core/permissions.py
tests_dir=
    apps/ventes/tests/,
    apps/roles/,
    core/tests/
# DEAD under mutmut 3 (see the note above) — kept as an exact, honest record
# of the equivalent `manage.py test` invocation a human (or a future
# pytest-django bridge) can run by hand to check this same scope's coverage;
# mutmut 3 itself never reads this key.
runner=python manage.py test apps.ventes.tests.test_references apps.ventes.tests.test_quote_engine_builder apps.ventes.tests.test_quote_engine_formats apps.ventes.tests.test_quote_engine_documents apps.ventes.tests.test_quote_engine_residential apps.roles.tests apps.ventes.tests.test_qjr_argent_api apps.ventes.tests.test_aud106_avoir_remise apps.ventes.tests.test_aud107_note_debit_remise apps.ventes.tests.test_qx1_remise_globale_billing core.tests.test_company_scoped_viewset core.tests.test_write_scoped_mixin core.tests.test_action_permissions --exclude-tag=pdf --exclude-tag=slow
