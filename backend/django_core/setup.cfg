[mutmut]
# YTEST9 — mutation testing targets ONLY the highest-risk, most-consequential
# modules (never the whole repo — mutmut is O(mutants x full test run), a
# repo-wide sweep would never finish and would gate nothing usefully).
# Run manually / via the nightly workflow (.github/workflows/mutation.yml),
# NEVER as a per-commit gate. Triage of surviving mutants: docs/TESTING.md
# (Mutation section).
#
# QAH5 ROOT CAUSE (found while wiring the pytest bridge below) — this job has
# LITERALLY NEVER RUN A SINGLE MUTANT, since before this fix. `paths_to_mutate`/
# `tests_dir` used ConfigParser's multi-line-continuation form with a TRAILING
# COMMA per line:
#     paths_to_mutate=
#         apps/ventes/quote_engine/builder.py,
#         apps/ventes/utils/references.py,
# ConfigParser joins continuation lines with a real `\n`, so the stored value
# was `'\napps/.../builder.py,\napps/.../references.py,...'`. mutmut 2.4.4's
# `run` command splits that string on `,` and filters by `Path(p).exists()`
# — but the LEADING newline glued to each split path (`'\napps/...'`) makes
# `Path('\napps/...')` resolve to a bogus first segment (`"\napps"`, not
# `"apps"`), so EVERY path failed `.exists()` and mutmut aborted immediately
# with "You must specify a list of paths to mutate." — reproduced verbatim
# from a real CI run (`gh run view 36309232413 --log`), which "succeeded" in
# ~1.5 min because the workflow's `|| true` swallowed that fatal argument
# error. mutmut 3.8.0's list-config reader (`configuration.py`) splits the
# SAME multi-line value on `\n` instead of `,` — which would have left a
# TRAILING COMMA glued to every path but the last (`'apps/.../builder.py,'`),
# silently matching zero files during the source-copy walk (no error at all,
# just 6 of 7 target files never mutated). Both are fixed below the ONLY way
# that is safe for both: **one path per line, no commas, ever.**
#
# QAH5 — mutmut 3.x REMOVED the 2.x `runner=<shell command>` config key
# outright (verified by reading the installed 3.8.0 package's `Config`
# dataclass in `mutmut/configuration.py` — there is no `runner` field any
# more, and nothing in `_load_config()` reads a `runner` option). Mutmut now
# drives `pytest` DIRECTLY and in-process (forked workers), via
# `pytest_add_cli_args`/`pytest_add_cli_args_test_selection`. QAH5 (deepened)
# built that bridge: `[tool:pytest]` below gives pytest-django
# `DJANGO_SETTINGS_MODULE` (same module CI's `manage.py test` uses) + the
# `python_files` patterns this repo's Django test files actually use
# (`tests.py`, `tests_*.py` — NOT just `test_*.py`) + `--no-migrations`
# (pytest-django builds tables straight from models — skips the ~850-
# migration replay; checked the target apps' data migrations for RunPython
# seed steps the target tests could depend on — none of the targeted test
# modules read migration-seeded rows, they all build their own fixtures in
# `setUp`/`setUpTestData`, so this is believed safe, PROVEN LOCALLY ONLY for
# the two DB-free `SimpleTestCase` modules below — the rest needs a real
# Postgres, which this sandboxed lane doesn't have (no docker, no test DB) —
# CI is the first real proof). `requirements-dev.txt` gained `pytest` +
# `pytest-django`; `.github/workflows/mutation.yml` gained the same WeasyPrint
# system packages `backend-env`'s composite action installs (two of the
# targeted test files import `apps.ventes.utils.pdf`, which imports
# `weasyprint`, which `dlopen`s `libgobject`/`libpango` at import time —
# missing on a bare `ubuntu-latest` runner). Full explanation + what remains
# CI-only: docs/TESTING.md's Mutation section.
#
# 23/10/2026 — SCOPE RESSERRÉ (job nocturne mort chaque nuit : « runner shutdown
# signal » ~8 min après `mutmut run`, phase « Generating mutants », 5 608
# mutants dont l'essentiel dans builder.py = 5 305 lignes ; mutmut 3 écrit une
# copie de chaque module muté sous mutants/ et ouvre un pytest/Django complet —
# runner 2 coeurs / 7 Go + Postgres épuisé). On ne garde que 6 modules de
# logique pure et à forte conséquence (~1 480 lignes au total) : numérotation
# (core/numbering.py, derrière le shim apps/ventes/utils/references.py),
# chaîne monétaire, rôles, isolation société. Clés renommées vers les noms
# mutmut 3.x : `source_paths` (ex-`paths_to_mutate`) et
# `pytest_add_cli_args_test_selection` (ex-`tests_dir`).
source_paths=
    core/numbering.py
    apps/roles/models.py
    apps/ventes/domain/argent.py
    apps/facturation/totaux.py
    core/mixins.py
    core/permissions.py
# BOUNDED on purpose (QAH5 deepened) — the exact test FILES the money-chain
# and company-scoping targets above need, not whole directories: mutmut 3
# appends this list as pytest CLI arguments to EVERY mutant's test re-run, so
# a directory here would silently balloon each mutant's cost (verified: bare
# `apps/roles/` collects 108 tests once `python_files` below makes `tests.py`
# visible to pytest at all, vs the single intended `apps/roles/tests.py`).
# Mirrors the (now-dead, see above) `runner=` line's module list exactly.
# 23/10/2026 — mutmut 3.7 exécute pytest DEPUIS `mutants/` (`change_cwd` codé en
# dur) : sans copie, la sélection ci-dessous n'y existe pas → pytest code 4
# (« file or directory not found »), avalé par le spinner en
# `BadTestExecutionCommandsException`. `also_copy` recopie donc le projet
# Django entier (paquets, tests, settings, setup.cfg) sous mutants/ ; les 6
# fichiers de `source_paths` y sont ensuite réécrits avec leurs trampolines.
also_copy=
    apps
    authentication
    core
    erp_agentique
    templates
    testkit
    tests
    manage.py
    setup.cfg
# 23/10/2026 (dispatch 39992416342, première passe complète : 649 jugés, 46,8 %,
# 214 mutants SANS test dans la sélection — 134/190 dans facturation/totaux.py) :
# les modules de test RÉELS des 6 fichiers mutés rejoignent la sélection (totaux,
# argent, numérotation, mixins/permissions de société) ; le plancher de 50 % ne
# bouge pas (« jamais le baisser », check_mutation_score.py).
pytest_add_cli_args_test_selection=
    core/tests/test_documents_totaux.py
    apps/facturation/tests/test_atot_ventilation_avoir.py
    apps/ventes/tests/test_invariants_money.py
    apps/ventes/tests/test_arrondi_100.py
    apps/ventes/tests/test_remise_par_ligne.py
    apps/ventes/tests/test_qjr_argent_vues.py
    apps/ventes/tests/test_coherence_regles.py
    apps/ventes/tests/test_aud101_emission_unique.py
    apps/ventes/tests/test_adev24_numerotation_configuree.py
    core/tests/test_company_qs.py
    core/tests/test_acal_same_company_fk_borne.py
    core/tests/test_crx12_scoped_relations.py
    core/tests/test_object_scope_sweep.py
    core/tests/test_yrbac3_fine_grained_apps.py
    core/tests/test_sensitive_field_leak.py
    apps/calepinage/tests/test_permissions.py
    apps/roles/tests_ntprt5.py
    core/tests/test_numbering.py
    apps/ventes/tests/test_references.py
    apps/roles/tests.py
    apps/ventes/tests/test_qjr_argent_api.py
    apps/ventes/tests/test_aud106_avoir_remise.py
    apps/ventes/tests/test_aud107_note_debit_remise.py
    apps/ventes/tests/test_qx1_remise_globale_billing.py
    core/tests/test_company_scoped_viewset.py
    core/tests/test_write_scoped_mixin.py
    core/tests/test_action_permissions.py
# DEAD under mutmut 3 (see the note above) — kept as an exact, honest record
# of the equivalent `manage.py test` invocation a human can run by hand to
# check this same scope's coverage the ORIGINAL way; mutmut 3 itself never
# reads this key (it runs the `[tool:pytest]`-configured pytest instead, over
# the exact same file list via `pytest_add_cli_args_test_selection` above).
runner=python manage.py test core.tests.test_numbering apps.ventes.tests.test_references apps.roles.tests apps.ventes.tests.test_qjr_argent_api apps.ventes.tests.test_aud106_avoir_remise apps.ventes.tests.test_aud107_note_debit_remise apps.ventes.tests.test_qx1_remise_globale_billing core.tests.test_company_scoped_viewset core.tests.test_write_scoped_mixin core.tests.test_action_permissions core.tests.test_documents_totaux apps.facturation.tests.test_atot_ventilation_avoir apps.ventes.tests.test_invariants_money apps.ventes.tests.test_arrondi_100 apps.ventes.tests.test_remise_par_ligne apps.ventes.tests.test_qjr_argent_vues apps.ventes.tests.test_coherence_regles apps.ventes.tests.test_aud101_emission_unique apps.ventes.tests.test_adev24_numerotation_configuree core.tests.test_company_qs core.tests.test_acal_same_company_fk_borne core.tests.test_crx12_scoped_relations core.tests.test_object_scope_sweep core.tests.test_yrbac3_fine_grained_apps core.tests.test_sensitive_field_leak apps.calepinage.tests.test_permissions apps.roles.tests_ntprt5 --exclude-tag=pdf --exclude-tag=slow
# 28/09/2026 (PR #722) — `process_isolation=forkserver` RETIRÉ : la clé
# n'existe qu'à partir de mutmut 3.8.0, or 3.8.0 est incompatible avec
# pyHanko (click, voir requirements-dev.txt) ; 3.7.0 forke ses workers
# depuis le processus principal. La base de test est partagée via
# `--reuse-db` (addopts ci-dessous) : chaque worker rouvre sa propre
# connexion dans sa session pytest.

# QAH5 (deepened) — pytest-django bridge, SCOPED to this directory (nothing
# else runs bare `pytest` against `backend/django_core`: CI's `backend-tests`
# and this repo's local harness both call `manage.py test` exclusively —
# grepped `.github/workflows/*.yml` + `scripts/test-backend.ps1` to confirm —
# and `scripts/tests/*.py` run via `python -m unittest` from the REPO ROOT,
# a directory pytest's config search never descends INTO, so this section
# cannot reach them). Exists ONLY so `mutmut run` (and a human running
# `pytest` by hand in this directory) can execute this repo's Django
# `TestCase`s at all.
[tool:pytest]
DJANGO_SETTINGS_MODULE = erp_agentique.settings.dev
# This repo's Django test files are NOT all `test_*.py` (pytest's default) —
# plenty are `tests.py` (e.g. apps/roles/tests.py, one of QAH5's own
# targets) or `tests_<slug>.py` (e.g. apps/roles/tests_aud407_...py). Proven
# locally: `apps/roles/` collected 0 tests under the pytest default, 108
# once this pattern was added.
python_files = test_*.py tests.py tests_*.py
# --no-migrations: see the QAH5 note above (checked, believed safe, CI-only
# to actually prove against a real Postgres). `-m "not pdf and not slow"`
# mirrors the dead `runner=` line's `--exclude-tag=pdf --exclude-tag=slow`
# (Django's own `@tag(...)` decorator; pytest-django maps it to pytest marks
# automatically — proven locally: 65 deselected out of 429 collected).
addopts = --no-migrations --reuse-db -m "not pdf and not slow"
