fait:
  - "Top des annonces (`adsengine.ads.top`) : classement des créatifs par performance (lecture seule)."
  - "Campagnes publicitaires (`adsengine.campaigns.list`) : campagnes miroir : nom, statut, dépense (lecture seule)."
  - "Dépense publicitaire de la semaine (`adsengine.spend.week`) : KPI du tableau de bord pub : dépense, leads, conversations (lecture seule)."
  - "Proposer une règle d'automatisation (`automation.rule.propose_draft`) : brouillon de règle si/alors toujours créé DÉSACTIVÉ, à valider par un administrateur dans Paramètres › Automatisations. Administrateurs seulement."
  - "Créer un client (`crm.client.create`) : crée une fiche client (nom obligatoire) ; société et créateur posés par le serveur. Annulable tant qu'aucun devis ni facture ne le référence."
  - "Mon matin (`crm.digest_matin`) : relances du jour, visites du jour, devis envoyés sans réponse depuis plus de 7 jours, manques signalés hier (10 lignes max par bloc). Un commercial terrain ne reçoit que ses visites."
  - "Brouillon de message de suivi (`crm.lead.brouillon_suivi`) [lot hérité : servi seulement sans le copilote activé] : texte de suivi (relance devis, après visite, réveil) à relire puis copier ou ouvrir par wa.me, 500 caractères max sur WhatsApp ; sans modèle de la société le texte est vide. Remplacé par crm.suivi.preparer_touche quand le copilote est activé."
  - "Changer l'étape d'un lead (`crm.lead.changer_etape`) : fait AVANCER le lead dans le pipeline, après confirmation. Jamais « Signé » (l'acceptation d'un devis le fait), jamais « Froid » (geste de l'écran avec sa raison), jamais un retour en arrière."
  - "Retrouver un lead (`crm.lead.chercher`) [lot copilote : servi seulement avec le copilote activé] : retrouve un lead par nom, société, téléphone, ville ou référence, avec filtre d'étape (10 lignes par défaut, 25 max). Chaque ligne donne le lead_id et la prochaine touche."
  - "Créer un lead (`crm.lead.create`) : crée un lead pour un prospect solaire (société et responsable posés par le serveur ; étape initiale Nouveau)."
  - "Journaliser un échange (`crm.lead.journaliser`) [lot copilote : servi seulement avec le copilote activé] : consigne au fil du lead un appel, un e-mail ou un WhatsApp déjà passé (outcome « rappel » déplace la prochaine touche). Pour une simple note, utiliser crm.lead.note."
  - "Lister les leads (`crm.lead.list`) [lot hérité : servi seulement sans le copilote activé] : liste simple des leads de la société, sans filtre. Remplacé par crm.lead.chercher quand le copilote est activé."
  - "Noter un lead (`crm.lead.note`) : ajoute une note manuelle au chatter du lead. Auteur et société posés par le serveur."
  - "Qualifier un lead (`crm.lead.qualifier`) [lot copilote : servi seulement avec le copilote activé] : écrit sur la fiche ce que le client a dit à l'appel (factures, toit, foyer, équipements, délai, financement, décideur, frein). Jamais l'étape, le responsable, le parcage, le téléphone ni l'e-mail."
  - "Résumer un lead (`crm.lead.resume`) : prépare un appel : identité, étape, contact préféré, 5 dernières entrées du chatter, devis, visites, prochaine touche, alertes. Jamais de prix d'achat."
  - "Poser la date de relance (`crm.lead.update`) : pose la date de relance du lead (la prochaine touche est déplacée à cette date). Ne change plus l'étape."
  - "Préparer l'envoi WhatsApp d'un devis (`crm.lead.whatsapp_prepare`) : prépare le texte et le lien wa.me d'un ou plusieurs devis du lead. L'aperçu n'envoie rien et ne change aucun statut ; c'est le bouton « Ouvrir WhatsApp » de la carte qui marque les devis « envoyé »."
  - "Ma file de suivi (`crm.leads.a_relancer`) : liste les leads à relancer par le commercial connecté (portée : aujourd'hui, en retard, semaine ; 20 lignes max avec le total). Chaque ligne porte le touche_id."
  - "Préparer une touche (`crm.suivi.preparer_touche`) [lot copilote : servi seulement avec le copilote activé] : prépare UNE touche de la file : le message VALIDÉ du suivi (texte rendu par le serveur) ou le script d'appel. Rien n'est envoyé. Refus motivé pour un lead opposé, perdu, archivé ou une touche annulée ; une TÂCHE n'a pas de texte."
  - "Proposer la réponse d'une touche (`crm.suivi.proposer_reponse`) [lot copilote : servi seulement avec le copilote activé] : affiche la carte-écho de la réponse dictée (« pas de réponse », « rappel jeudi 11 h », refus…). N'enregistre RIEN : c'est la commerciale qui appuie sur la carte. Une seule touche à la fois."
  - "Message de visite (`crm.visite.message`) [lot copilote : servi seulement avec le copilote activé] : prépare le message VALIDÉ pour proposer ou confirmer la visite (clé de message, une langue). Rien n'est envoyé."
  - "Planifier une visite (`crm.visite.planifier`) [lot copilote : servi seulement avec le copilote activé] : pose la visite technique d'un lead (date, touche qui l'a demandée) ; le technicien est notifié. Pas pour une visite de maintenance de chantier."
  - "Rechercher dans les documents (`ged.docqa.retrieve`) : retrouve les passages de documents et manuels les plus proches d'une question (lecture, limitée à la société et aux coffres autorisés). Sans clé d'embedding, résultat vide."
  - "Commander les manques (`installations.chantier.commander_besoin`) : crée un bon de commande fournisseur BROUILLON pour les manques de matériel d'un chantier ; reste à confirmer à la main."
  - "Visite de maintenance (`installations.intervention.planifier_visite`) : planifie une intervention de type contrôle sur un chantier à une date (AAAA-MM-JJ)."
  - "Diagnostic (`reporting.assistant.diagnostic`) [lot copilote : servi seulement avec le copilote activé] : administrateurs seulement : problèmes récents vécus par les utilisateurs de la société, état de l'assistant (erreurs, repli, coût), signalements récents (jours de 1 à 7)."
  - "Ouvrir un ticket SAV (`sav.ticket.create`) : ouvre un ticket SAV pour un client (priorité, type, chantier facultatifs)."
  - "Mettre à jour un ticket SAV (`sav.ticket.update`) : change priorité, description, technicien responsable. Le statut ne se change pas ainsi : actions planifier, démarrer, résoudre, clôturer du ticket."
  - "BC fournisseur brouillon (`stock.bon_commande_fournisseur.create`) : crée un bon de commande fournisseur BROUILLON (référence BCF posée par le serveur) ; les prix d'achat restent internes."
  - "Ajuster le stock (`stock.mouvement.create`) : poste un mouvement de stock (entrée, sortie, ajustement) ; le serveur calcule quantités avant et après."
  - "Supprimer un produit (`stock.produit.delete`) : suppression définitive d'un produit du catalogue : confirmation, irréversible. Seulement sur demande explicite."
  - "Accepter un devis (`ventes.devis.accepter`) : marque le devis accepté (nom, date, option si deux options). Le lead passe Signé, les relances s'arrêtent, un chantier est déclenché. Proposition."
  - "Bon de commande (`ventes.devis.convertir_bc`) : crée le bon de commande d'un devis déjà accepté. Proposition."
  - "Créer un devis automatique (`ventes.devis.creer_auto`) : crée un devis BROUILLON dimensionné depuis la fiche lead ; le marché vient du type d'installation du lead (résidentiel, commercial, industriel, agricole). Jamais un devis vide : si une donnée manque, le serveur refuse en nommant le champ du lead à compléter."
  - "Facture de tranche (`ventes.devis.generer_facture`) : émet la prochaine facture de l'échéancier du devis (acompte, matériel, solde). Proposition."
  - "PDF de proposition (`ventes.devis.generer_pdf`) : rend le LIEN du PDF client d'un devis (/proposal, seul chemin) ; options pdf_mode full/onepage, include_etude, include_calepinage, langue. Aucun statut ne change."
  - "Ajouter une ligne (`ventes.devis.ligne_ajouter`) : ajoute un produit du catalogue à un devis brouillon (quantité, prix HT facultatif). Change un montant : proposition."
  - "Modifier une ligne (`ventes.devis.ligne_modifier`) : change prix HT, quantité, remise ou désignation d'une ligne (id de la LIGNE, pas du devis). Change un montant : proposition."
  - "Retirer une ligne (`ventes.devis.ligne_supprimer`) : retire une ligne d'un devis brouillon. Change un montant : proposition."
  - "Remise globale (`ventes.devis.remise`) : fixe la remise globale (en %) d'un devis brouillon. Proposition, jamais appliquée sans confirmation."
  - "Enregistrer un paiement (`ventes.facture.enregistrer_paiement`) : enregistre un encaissement (montant, date, mode) ; jamais plus que le reste à payer. Geste comptable non réversible : confirmation."
