fait:
  - "Dépense publicitaire de la semaine (`adsengine.spend.week`) : Combien a-t-on dépensé en publicité cette semaine ? Renvoie les KPIs du tableau de bord pub (dépense, leads, conversations)."
  - "Top des annonces (`adsengine.ads.top`) : Quelles sont les 3 meilleures annonces ? Renvoie le classement des créatifs par performance."
  - "Lister les campagnes publicitaires (`adsengine.campaigns.list`) : Quelles campagnes publicitaires ai-je ? Renvoie les campagnes miroir (nom, statut, dépense)."
  - "Créer un lead (`crm.lead.create`) : créer un lead (opportunité) pour un prospect solaire (société et responsable posés côté serveur)."
  - "Mettre à jour un lead (`crm.lead.update`) : faire avancer l'étape du pipeline d'un lead et/ou poser sa date de relance."
  - "Noter un lead (`crm.lead.note`) : ajouter une note manuelle (appel, commentaire) au chatter d'un lead."
  - "Préparer un envoi WhatsApp de devis (`crm.lead.whatsapp_prepare`) : préparer le texte et le lien `wa.me` d'un ou plusieurs devis du lead ; n'envoie jamais, le commercial valide lui-même."
  - "Mes leads à relancer (`crm.leads.a_relancer`) : lister les leads que le commercial connecté doit relancer (nom, étape, touche prévue, retard en jours ouvrés, canal, dernier contact), 20 lignes max avec le total."
  - "Résumer un lead (`crm.lead.resume`) : préparer un appel — identité, étape, contact préféré, 5 dernières entrées du chatter, devis, visites, prochaine touche, alertes."
  - "Brouillon de message de suivi (`crm.lead.brouillon_suivi`) : rédiger un TEXTE de suivi (relance devis, après visite, réveil) à relire puis copier ou ouvrir via wa.me."
  - "Mon matin (`crm.digest_matin`) : commencer la journée — relances du jour, visites du jour, devis envoyés sans réponse depuis plus de 7 jours (10 lignes max par bloc, avec les totaux)."
  - "Planifier une visite de maintenance (`installations.intervention.planifier_visite`) : Planifie une visite de maintenance (intervention de type contrôle) sur un chantier à une date donnée (AAAA-MM-JJ). Remplaçante-catalogue de l'outil FastAPI planifier_visite_maintenance : crée l'intervention via l'endpoint interventions ; la société est forcée côté serveur."
  - "Brouillonner un bon de commande chantier (`installations.chantier.commander_besoin`) : Crée un bon de commande fournisseur BROUILLON pour les manques de matériel d'un chantier. Remplaçante-catalogue de l'outil FastAPI brouillon_bon_commande_chantier : appelle l'endpoint commander-besoin du chantier ; la société est forcée côté serveur, le brouillon reste à confirmer manuellement."
  - "Ouvrir un ticket SAV (`sav.ticket.create`) : Ouvre un nouveau ticket SAV (service après-vente) pour un client. À utiliser quand l'utilisateur demande de créer/ouvrir un ticket ou de signaler une panne. La société est posée côté serveur."
  - "Mettre à jour un ticket SAV (`sav.ticket.update`) : Met à jour un ticket SAV existant (priorité, description, technicien responsable…). La société reste celle du ticket. YDOCF1 — le statut ne se change plus par ce PATCH (machine d'états gardée) : utiliser les actions dédiées planifier/demarrer/resoudre/cloturer sur /api/django/sav/tickets/{id}/<action>/."
  - "Ajuster le stock (`stock.mouvement.create`) : Poste un mouvement de stock (entrée, sortie ou ajustement) sur un produit. Le serveur calcule quantité_avant/quantité_après, applique le verrou de ligne produit et force la société du caller."
  - "Créer un brouillon de bon de commande fournisseur (`stock.bon_commande_fournisseur.create`) : Crée un bon de commande fournisseur (achat) en statut BROUILLON. La référence numérotée (préfixe BCF) et la société sont attribuées côté serveur ; les prix d'achat restent internes."
  - "Créer un devis (automatique) (`ventes.devis.creer_auto`) : créer un devis résidentiel dimensionné depuis la fiche lead (facture d'électricité ou taille souhaitée) ; seul moyen de créer un devis."
  - "Ajouter une ligne au devis (`ventes.devis.ligne_ajouter`) : ajouter un produit du catalogue à un devis brouillon."
  - "Modifier une ligne de devis (`ventes.devis.ligne_modifier`) : changer le prix unitaire HT, la quantité, la remise ou la désignation d'une ligne de devis brouillon."
  - "Retirer une ligne de devis (`ventes.devis.ligne_supprimer`) : retirer une ligne d'un devis brouillon, par id de ligne."
  - "Appliquer une remise au devis (`ventes.devis.remise`) : fixer la remise globale (en %) d'un devis brouillon."
  - "Générer le PDF de proposition (devis) (`ventes.devis.generer_pdf`) : produire le PDF client d'un devis. PDF client = `/proposal` uniquement (règle #4) : options pdf_mode (full/onepage), include_etude… filtrées par une liste blanche serveur."
  - "Accepter un devis (`ventes.devis.accepter`) : marquer un devis accepté par le client (nom, date, option si le devis en a deux) ; change un statut : proposition puis confirmation obligatoire."
  - "Convertir le devis en bon de commande (`ventes.devis.convertir_bc`) : créer le bon de commande d'un devis déjà accepté ; change un statut : proposition puis confirmation obligatoire."
  - "Générer la facture (tranche suivante) (`ventes.devis.generer_facture`) : émettre la prochaine facture de tranche de l'échéancier du devis (acompte → matériel → solde) ; change un statut : proposition puis confirmation obligatoire."
  - "Enregistrer un paiement (`ventes.facture.enregistrer_paiement`) : enregistrer un encaissement sur une facture (montant, date, mode) ; change un statut : proposition puis confirmation obligatoire — geste comptable non réversible."
