suggestions:
  /crm:
    - "Ma file du jour : qui dois-je relancer ?"
    - "Mon matin : qu'ai-je à faire aujourd'hui ?"
    - "Prépare ma prochaine relance."
  /crm/leads:
    - "Résume ce lead avant mon appel."
    - "Prépare la prochaine touche de ce lead."
    - "Quel est l'état du suivi de ce lead ?"
  /crm/relances:
    - "Ma file du jour : qui dois-je relancer ?"
    - "Que veut dire cette étape et que fait chaque réponse ?"
