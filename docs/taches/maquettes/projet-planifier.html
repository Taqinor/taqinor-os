<body data-heure="8:30" data-onglet="projets" data-projet="ciel">

<div class="ep-ecran"><div data-coque="statut"></div><div class="titre-compact mobile-seul" aria-hidden="true">Aujourd&#39;hui</div><div class="page trois deux ep-deux bureau-seul ep-fond-voile" aria-hidden="true">

  </div>
  <div class="ep-ia-ombre" style="z-index:3"></div>
  <div class="ep-feuille dialogue" role="dialog" aria-label="Planifier le projet Site web" data-p="ciel">

        <button class="ep-lien">Passer</button>

        <span class="droite"></span>
      </div>
      <div class="ep-pas" aria-hidden="true"><i class="fait"></i><i class=""></i></div>
      <div class="ep-feuille-corps">
        <div class="ep-q"><h2 class="ep-q-titre">Ce sera fini quand…</h2>
          <div class="ep-champ"><span class="ep-ph">Une phrase</span><button class="micro" aria-label="Dicter"><svg class="i" aria-hidden="true"><use href="#i-mic"/></svg></button></div>
          </div>
        <div class="ep-q"><h2 class="ep-q-titre">Échéance</h2>
          <div class="ep-puces-choix" role="radiogroup" aria-label="Échéance">
            <button class="puce" role="radio" aria-checked="false">1 semaine</button>
            <button class="puce" role="radio" aria-checked="false">2 semaines</button>
            <button class="puce" role="radio" aria-checked="false">1 mois</button>
            <button class="puce" role="radio" aria-checked="false">6 semaines</button>
            <button class="puce" role="radio" aria-checked="false">3 mois</button>

          </div></div>
        <div class="ep-q"><h2 class="ep-q-titre">Priorité</h2><div class="ep-trois" role="radiogroup" aria-label="Priorité du projet">
            <button role="radio" aria-checked="false"><b><span class="barres" aria-hidden="true"><i></i><i></i><i></i></span>Haute</b><span>passe avant les autres</span></button>
            <button role="radio" aria-checked="true"><b><span class="barres" aria-hidden="true"><i></i><i></i><i class="eteinte"></i></span>Moyenne</b><span>le rythme normal</span></button>
            <button role="radio" aria-checked="false"><b><span class="barres" aria-hidden="true"><i></i><i class="eteinte"></i><i class="eteinte"></i></span>Basse</b><span>quand il reste du temps</span></button>
          </div></div>
      </div>
      <div class="ep-feuille-pied"><button class="bouton plein">Suivant</button></div>
  </div><span class="accueil-indic" aria-hidden="true"></span>
