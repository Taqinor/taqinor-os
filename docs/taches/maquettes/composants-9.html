<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tâches · États vides</title>
<link rel="stylesheet" href="taches.css">
<script src="icones.js" defer></script>
<script src="coque.js" defer></script>
</head>
<body>

<main class="planche">
  <p class="planche-titre">Planche 9 · États vides</p>
  <div class="colonnes trois">
    <section>
      <p class="note"><b>Aujourd'hui</b> premier jour, aucun projet</p>
      <div class="vide-etat">
        <span class="vide-picto"><svg class="i"><use href="#i-clipboard-paste"/></svg></span>
        <p class="vide-phrase">Colle ou dicte tes listes : je les range par projet.</p>
        <button class="bouton plein">Coller mes listes</button>
      </div>
    </section>
    <section>
      <p class="note"><b>À trier</b> tout est rangé</p>
      <div class="vide-etat">
        <span class="vide-picto"><svg class="i"><use href="#i-inbox"/></svg></span>
        <p class="vide-phrase">Rien à trier. Ce que tu notes sans jour ni projet arrive ici.</p>
        <button class="bouton second">Ajouter</button>
      </div>
    </section>
    <section>
      <p class="note"><b>Projet</b> sans tâche</p>
      <div class="vide-etat">
        <span class="vide-picto" data-p="vert"><svg class="i"><use href="#i-list-plus"/></svg></span>
        <p class="vide-phrase">Recrutement technicien n'a pas encore de tâche.</p>
        <button class="bouton second">Planifier le projet</button>
      </div>
    </section>
  </div>
</main>
</body>
</html>
