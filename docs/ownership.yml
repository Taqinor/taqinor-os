# docs/ownership.yml — registre de PROPRIÉTÉ des fichiers (OWN, 02/10/2026)
#
# RÈGLE (mémoire docs/claude-memory/propriete-fichiers.md) : une tâche va dans le plan du
# propriétaire de ses fichiers ; multi-propriétaires → plan transverse
# (docs/plans/PLAN_AUDIT_TRANSVERSE.md), qui ne tourne JAMAIS en parallèle d'un plan dont il
# touche un propriétaire.
#
# Propriétaires = les unités de docs/audits/unites.yml qui possèdent des fichiers (clé = mot du
# déclencheur, `unite:` = son id), + web (docs/WEB_PLAN.md), parked (coquilles des apps parquées),
# platform (files historiques multi-propriétaires), transverse (ne possède AUCUN fichier). Ce
# registre PRIME sur le champ `possede` de unites.yml (METHODE.md §D.3) ; il en part et l'affine :
#   - un test suit son sujet (DevisGenerator* = générateur, tests du moteur = moteur…) ;
#   - le résiduel front d'X5 (« frontend/src/** ») est remplacé par la liste explicite du socle,
#     pour qu'un module NEUF reste sans propriétaire jusqu'à sa déclaration (règle c) ;
#   - les fichiers d'une unité logés chez une autre (réglages cadence/stock/chantiers dans
#     Paramètres, moteur de calepinage sous core/, studio toiture dans apps/web…) rejoignent
#     leur unité ;
#   - apps/web reste au propriétaire `web` (sa session WEB_PLAN, déploiement Cloudflare séparé),
#     SAUF le studio toiture partagé avec l'ERP (calepinage) : mesuré le 04/10, les pages
#     proposition/questionnaire/suivi, devis/mon-toit et lib/lead.ts, pages/api/** sont
#     éditées par la session web (13 tâches ouvertes + 8 archivées de WEB_PLAN, contre 3 de
#     PLAN2 ; lead.ts : 7 tâches web, 2 devis, 0 acquisition) — les claims J0/J1a/J1b/J6 de
#     unites.yml sur apps/web les auraient rendues multi-propriétaires ;
#   - les racines couvrent TOUT le code et l'outillage (backend/, frontend/, scripts/, .github/,
#     services/…) : un fichier hors racines (docs/, CLAUDE.md, .claude/) n'a pas de propriétaire.
#     Les conteneurs (backend/, backend/django_core/, apps/, frontend/, src/, features/, pages/,
#     api/) n'acceptent pas de glob ouvert : un dossier NEUF y reste sans propriétaire (règle c).
#     Sous un résiduel (core/**, components/**, ventes/**…), un fichier neuf hérite du résiduel.
#
# Résolution (scripts/check_ownership.py) : `paths` = revendication précise et STRICTE (deux
# propriétaires = refus) ; à défaut `fallback` = résiduel d'un sous-arbre, le plus long préfixe
# littéral gagne (« fichier > dossier > résiduel ») ; égalité = refus ; aucun = refus. `**` =
# toute profondeur, `*` = un segment. Un glob ne s'ouvre jamais directement sur un `container`.
#
# Vérifier : python scripts/check_ownership.py   (job CI stage-names)
# Interroger : python scripts/check_ownership.py --owner-of <chemin…>   |   --stats
# Sous-ensemble YAML lu par plan_lanes._MiniYamlParser (pas de PyYAML en CI) : mappings
# indentés de 2, listes « - x », listes [a, b], chaînes entre guillemets, commentaires #.

version: 1
roots: [backend/, frontend/, apps/, scripts/, .github/, services/, mobile/, tools/, load/, loadtests/, STAGES.py, docker-compose, .env.example, .dockerignore, .gitignore, .bandit.baseline, .lanes.json, .mcp.json, .blocked.json, .semgrep/]
containers: [backend/, backend/django_core/, backend/django_core/apps/, frontend/, frontend/src/, frontend/src/features/, frontend/src/pages/, frontend/src/api/]
exempt: [transverse, platform, parked]

