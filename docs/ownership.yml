    plan: docs/plans/PLAN_AUDIT_TRANSVERSE.md
    titre: "Tâches multi-propriétaires (aucun fichier) — jamais en parallèle d'un plan qui chevauche"
# Surfaces APPEND-ONLY : tout propriétaire peut y AJOUTER selon la règle écrite à côté (jamais
# réordonner, renommer ni réécrire l'ajout d'un autre) ; elles n'unissent pas deux lanes
# (plan_lanes.py) et ne rendent pas une tâche multi-propriétaires (règle b). Conflit à
# l'update-branch = garder les DEUX ajouts. Le fichier garde son propriétaire (règle a).
append_only:
  - path: "backend/django_core/apps/*/migrations/**"
    rule: "un NOUVEAU fichier seulement, jamais d'édition d'une migration appliquée ; si deux sessions créent la même tête, celle qui fusionne en second régénère SA migration au-dessus (jamais de migration de fusion)"
  - path: "backend/django_core/apps/*/urls.py"
    rule: "une ligne router.register/path (et son import) par ressource, sous un commentaire de tâche ; jamais modifier une route existante (contrat public)"
  - path: "backend/django_core/apps/*/apps.py"
    rule: "un bloc d'import/abonnement par fonctionnalité dans ready(), commenté de son ID de tâche ; jamais éditer un bloc existant"
  - path: "backend/django_core/apps/*/admin.py"
    rule: "une classe ModelAdmin par nouveau modèle ; jamais éditer celle d'un autre"
  - path: "backend/django_core/apps/*/platform.py"
    rule: "manifeste ARC28 : ajouter une clé ou un fournisseur, jamais réécrire une entrée"
  - path: "backend/django_core/apps/*/agent_actions.py"
    rule: "registre ARC33 : ajouter un enregistrement, jamais éditer celui d'un autre module"
  - path: "backend/django_core/apps/*/bi_datasets.py"
    rule: "registre de jeux BI : ajouter un jeu, jamais éditer celui d'un autre"
  - path: "backend/django_core/apps/*/contract_samples/README.md"
    rule: "une ligne d'index par nouveau contrat JSON (PACT10) ; le JSON lui-même appartient au propriétaire de la fonctionnalité"
  - path: backend/django_core/apps/crm/tasks.py
    rule: "une @shared_task par fonctionnalité, nom unique « crm.<x> », ajoutée en fin ; jamais éditer la tâche d'un autre"
  - path: backend/django_core/apps/ventes/services.py
    rule: "façade pure (QJR68/QJR76) : seulement des ré-exports « nom = _module.nom » + __all__, jamais un corps"
  - path: backend/django_core/apps/ventes/tests/test_services_surface.py
    rule: "liste dorée de la façade services.py : ajouter les noms ré-exportés, ne rien retirer hors tâche de nettoyage"
  - path: backend/django_core/apps/ventes/tests/test_qx11_beat_reachability.py
    rule: "ON_DEMAND_ALLOWLIST : UNE ligne « '<app>.<tâche>' » ajoutée en fin de liste (garde de joignabilité beat) ; rien d'autre dans ce fichier"
  - path: backend/django_core/apps/ventes/views/__init__.py
    rule: "une ligne de ré-export par nouvelle vue ; jamais modifier les existantes"
  - path: backend/django_core/apps/stock/views/__init__.py
    rule: "une ligne de ré-export par nouvelle vue"
  - path: backend/django_core/apps/installations/views/__init__.py
    rule: "une ligne de ré-export par nouvelle vue"
  - path: backend/django_core/apps/installations/models.py
    rule: "surface de ré-export pure : ajouter une ligne d'import ; le code va dans models_*.py"
  - path: backend/django_core/apps/parametres/models.py
    rule: "surface de ré-export pure : ajouter une ligne d'import ; le code va dans models_*.py"
  - path: backend/django_core/apps/notifications/models.py
    rule: "EventType : un membre ajouté EN FIN avec clé unique (+ son entrée module_map dans le même commit) ; les autres classes restent au propriétaire"
  - path: backend/django_core/apps/notifications/module_map.py
    rule: "une entrée par nouvel EventType, en fin"
  - path: backend/django_core/core/events.py
    rule: "un Signal EN FIN sous une bannière « # ── <TASKID> — … ── » (+ puce du catalogue) ; jamais renommer un événement émis"
  - path: backend/django_core/core/event_catalog.py
    rule: "une entrée par nouvel événement, en fin"
  - path: backend/django_core/core/event_coverage.py
    rule: "une entrée par nouvel événement, en fin"
  - path: backend/django_core/apps/roles/models.py
    rule: "un code de droit ajouté EN FIN du groupe de son module dans ALL_PERMISSIONS (+ son entrée PERMISSION_*) ; jamais renommer un code existant"
  - path: backend/django_core/apps/audit/signals.py
    rule: "TRACKED_MODELS : un tuple (<app>, <Model>) en fin de liste, commenté de son ID de tâche"
  - path: backend/django_core/apps/publicapi/constants.py
    rule: "une constante SCOPE_* en fin du bloc des portées (+ son choix) ; jamais renommer un identifiant publié"
  - path: "backend/django_core/apps/records/platform_baselines/*.txt"
    rule: "cliquet DÉCROISSANT : supprimer seulement les lignes du module corrigé, jamais en ajouter"
  - path: backend/django_core/apps/calepinage/views/rattachements.py
    rule: "une action de rattachement ajoutée EN FIN avec « # CALX<id> » (D-CALX 13)"
  - path: backend/django_core/apps/calepinage/services/parametres_cles.py
    rule: "une clé de paramètre ajoutée EN FIN avec « # CALX<id> » (D-CALX 13)"
  - path: "frontend/src/features/*/module.config.jsx"
    rule: "routes et nav d'un module : ajouter une entrée lazy() et une entrée de nav, jamais réordonner (le premier item CRM reste la porte Leads, APX1)"
  - path: frontend/src/api/calepinageApi.js
    rule: "une capacité = UNE fonction ajoutée EN FIN avec « // CALX<id> » (D-CALX 13)"
  - path: frontend/src/features/calepinage/atelier/onglets.js
    rule: "un onglet ajouté EN FIN avec « // CALX<id> » (D-CALX 13)"
  - path: frontend/src/router/index.jsx
    rule: "un écran avec layout passe par features/<module>/module.config.jsx (import.meta.glob) ; ici seulement une route hors layout, ajoutée en fin de bloc"
  - path: frontend/src/router/prefetchMap.js
    rule: "UNE entrée « '/chemin': () => import('../pages/…') » en fin de PREFETCH_MAP, copie exacte de l'import lazy du module.config"
  - path: frontend/src/components/layout/routes.meta.js
    rule: "blocs historiques seulement : une ligne en fin du bloc de son module ; un module inscrit par module.config.jsx n'y touche pas"
  - path: frontend/src/lib/apps/appSkus.js
    rule: "UNE ligne « <app_label>: { sku, libelle, installable } » à sa place ALPHABÉTIQUE dans MANIFESTES"
  - path: frontend/src/lib/search/entityRoutes.js
    rule: "un type d'entité = UNE ligne en fin de chacune des tables ROUTE, LIST_ROUTE, TYPE_LABEL"
  - path: frontend/src/store/index.js
    rule: "un slice = UN import + UNE clé de combineReducers(), ajoutés en fin de liste"
  - path: frontend/src/providers/shortcuts.js
    rule: "UNE entrée { keys, to, label } en fin de GOTO_SHORTCUTS / CREATE_SHORTCUTS ; keys unique"
  - path: frontend/src/providers/index.js
    rule: "UNE ligne « export * from './X' » en fin"
  - path: "frontend/src/i18n/catalogs/*.json"
    rule: "clés sous le préfixe de leur module, à la MÊME position relative dans fr/en/ar ; jamais renommer une clé"
  - path: frontend/src/ui/index.js
    rule: "UNE ligne « export * from './X' » ajoutée en fin de sa section"
  - path: "frontend/src/ui/*/index.js"
    rule: "UNE ligne « export * from './X' » ajoutée en fin"
  - path: frontend/src/test/fixtures/contractSamples.js
    rule: "un export par nouvel échantillon de contrat (PACT10), ajouté en fin"
  - path: frontend/src/index.css
    rule: "UN bloc ajouté EN FIN, ouvert par « /* ── <TASKID> — <titre> ── */ », classes préfixées par le module ; jamais réécrire une règle existante"
  - path: frontend/src/design/tokens.css
    rule: "un jeton déclaré EN FIN de CHAQUE bloc (clair :root et variantes sunlight) sous « /* <TASKID> */ »"
  - path: frontend/src/styles/print.css
    rule: "une règle ajoutée en fin de @media print"
  - path: frontend/src/components/records-panels.css
    rule: "fichier historique (contenu migré dans index.css) : n'y rien ajouter"
  - path: frontend/src/main.jsx
    rule: "surface historique de plan_lanes : un import ou un provider ajouté en fin de sa liste, rien d'autre"
  - path: frontend/src/App.jsx
    rule: "surface historique de plan_lanes (fichier absent aujourd'hui)"
  - path: docs/PLAN.md
    rule: "file de plan : ajout de tâches et de lignes de DONE LOG (hors racines du registre)"
  - path: docs/PLAN2.md
    rule: "file de plan : ajout de tâches et de lignes de DONE LOG (hors racines du registre)"
  - path: docs/CODEMAP.md
    rule: "carte régénérée ; conflit = arbre fusionné + codemap_fingerprint.py --write"
  - path: "scripts/*.txt"
    rule: "liste de référence (allowlist / baseline) : une ligne = une exception d'UN fichier ; une tâche n'ajoute, ne re-clé ou ne retire QUE les lignes qui nomment SES fichiers ; jamais réordonner"
  - path: scripts/check_money_rounding.py
    rule: "TARGET_FILES seulement : ajouter ou re-clé les chemins de SES modules, rien d'autre dans ce fichier"
  - path: scripts/check_api_shapes.py
    rule: "ECHANTILLONS_POSES_AVANT_LEUR_VUE seulement : ajouter les échantillons de SON module, rien d'autre dans ce fichier"
  - path: scripts/ci_guards.py
    rule: "GARDES : UNE entrée (nom, commande, dossier) ajoutée en fin du job, jamais une étape ci.yml"
  - path: backend/django_core/erp_agentique/settings/base.py
    rule: "un réglage ou un label sous le bloc commenté de l'app propriétaire ; JAMAIS réordonner INSTALLED_APPS (graphe des coquilles parquées)"
  - path: backend/django_core/erp_agentique/urls.py
    rule: "UNE ligne path('<prefixe>/', include('apps.<x>.urls')) avant le bloc admin/schéma"
  - path: backend/django_core/erp_agentique/celery.py
    rule: "beat_schedule : UNE entrée en fin, clé « <app>-<verbe> » + commentaire de tâche"
  - path: .env.example
    rule: "variables ajoutées sous le bloc commenté de leur module ; jamais renommer une variable existante"
  - path: docs/ownership.yml
    rule: "une tâche n'ajoute ou ne retire QUE les globs de SON propriétaire (dans son bloc) ; jamais réordonner ni toucher le bloc d'un autre (hors racines : vérifié par la garde elle-même)"

# Plan → propriétaire(s). Chaque owners.<x>.plan lie déjà son plan ; ici les fichiers plan
# historiques. Les propriétaires `platform` / `transverse` / `parked` sont exemptés de la règle
# (b) : leurs files touchent plusieurs propriétaires et ne tournent donc jamais en parallèle d'un
# plan qu'elles chevauchent.
plans:
  docs/PLAN2.md: platform
  docs/new_tasks_plan.md: platform
  docs/FRONTEND_GAP_PLAN.md: platform
  docs/ERROR_PLAN.md: platform
  docs/WEB_ERROR_PLAN.md: web
  docs/backlog/FULL_SAAS_PLAN.md: parked
  docs/plans/PLAN_VEILLE.md: acquisition
  docs/plans/PLAN_CRM_VENTES.md: [acquisition, lead, crm, devis, facturation, moteur, generateur, calepinage]
