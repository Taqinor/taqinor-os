# NTPLT21 — Manifeste des budgets de requêtes PAR ENDPOINT (contrat de perf).
#
# Ce fichier est le CONTRAT de performance par endpoint : chaque entrée
# associe un endpoint LISTE à fort trafic à un plafond de requêtes SQL (le
# nombre de requêtes ne doit PAS grandir avec le nombre de lignes — O(1)).
#
# `scripts/check_query_budgets.py` échoue si une entrée `enforced: true` n'a
# PAS de test de budget correspondant (un fichier de test qui référence l'URL
# de l'endpoint ET utilise `assertMaxQueries` / `assertNumQueries`). Complète
# la sonde de parité YAPIC11.
#
# AUD831 — réellement branché dans le job CI `stage-names` (jamais gaté par
# le filtre `changes` — tourne sur CHAQUE push/PR) depuis le 06/09/2026 ;
# avant cette date, ce commentaire affirmait ce branchement alors que
# `grep -rn query_budgets .github/` rendait 0 occurrence : un endpoint
# `enforced: true` sans test de budget ne faisait rougir AUCUN job CI.
#
# Ajouter un endpoint :
#   1. écrire son test de budget (pattern 10 -> 25 objets, cf.
#      apps/*/tests_yopsb13_*.py) ;
#   2. l'ajouter ici en `enforced: true` avec le plafond mesuré.
# Un endpoint encore non couvert se déclare `enforced: false` (documenté,
# non gardé) en attendant son test.

version: 1

endpoints:
  - path: /api/django/crm/leads/
    budget: 12
    enforced: true
    note: "Liste des leads (YOPSB13)."

  - path: /api/django/sav/tickets/
    budget: 12
    enforced: true
    note: "Liste des tickets SAV (YOPSB13)."

  - path: /api/django/stock/produits/
    budget: 24
    enforced: true
    note: "Liste des produits (YOPSB13) — plafond 24 : régime fixe mesuré en CI (22 requêtes à 5 comme à 50 lignes, hors compteur de catégories) + 1 requête groupée nb_produits."

  # APRF5 (09/10/2026) — plafond MESURÉ par
  # apps/ventes/tests/test_yopsb13_devis_query_budget.py : 23 requêtes à 10 ET
  # à 25 devis (page mixte : deux options, facturé, mono), donc O(1). Le 15
  # d'origine datait d'avant le dé-skip et ne comptait ni l'authentification
  # (3 lectures utilisateur + module + politique réseau), ni les 3 singletons
  # de config du moteur d'affichage (profil, gabarits, tarification), ni les
  # préchargements de solde par facture (paiements, avoirs, affectations,
  # lignes, notes de débit, retenues — APRF4/APRF5).
  - path: /api/django/ventes/devis/
    budget: 23
    enforced: true
    note: "Liste des devis (YOPSB13) — appelle le moteur d'affichage TTC."

  # CALX390 — module calepinage. Plafonds MESURÉS en régime permanent (après
  # un appel « à blanc »), identiques à 10 puis 25 objets, par
  # apps/calepinage/tests/test_calx390_budgets_requetes.py, qui LIT ces
  # valeurs ici (aucune recopie). Mesure du 24/09/2026 : 10 / 20 / 13.
  # 29/09/2026 (ERR-QAH-CALEPINAGE-LISTE-SANS-RATTACHEMENT) : +1 requête O(1) —
  # la liste précharge les leads de la page en UNE requête (lead_id est un
  # identifiant OPAQUE, jamais une FK joignable). Mesuré 11 à 10 et à 25 lignes.
  - path: /api/django/calepinage/calepinages/
    budget: 11
    enforced: true
    note: "Liste des calepinages (CALX390) — layout_stale lu sur le devis lié (select_related + prefetch devis__lignes) + UN préchargement des leads de la page (CALX407)."

  - path: /api/django/calepinage/calepinages/<pk>/
    budget: 20
    enforced: true
    note: "Détail agrégé (CALX390) — lead, client, devis, compteurs de versions/variantes, contexte géographique, droits."

  - path: /api/django/calepinage/calepinages/<pk>/resultat/
    budget: 15
    enforced: true
    note: "Résultat servi (CALX390) — pose, électrique, simulation persistée et fraîcheur. 13 → 15 (ACAL56, D-ACAL-10) : le matériel électrique sans désignation explicite est lu sur le DEVIS LIÉ — +1 devis, +1 lignes du devis (mesuré à 15, constant)."

  # --- Endpoints à couvrir (test de budget pas encore écrit) ---------------
  - path: /api/django/ventes/factures/
    budget: 15
    enforced: false
    note: "À couvrir : liste des factures."

  - path: /api/django/stock/mouvements/
    budget: 12
    enforced: false
    note: "À couvrir : liste des mouvements de stock."

  - path: /api/django/installations/interventions/
    budget: 12
    enforced: false
    note: "À couvrir : liste des interventions."

  - path: /api/django/core/notifications/
    budget: 10
    enforced: false
    note: "À couvrir : liste des notifications (polling du bell)."
