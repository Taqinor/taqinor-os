# docs/audits/unites.yml — registre versionné des unités d'audit (commande « audit »)
#
# Lu par le skill `.claude/skills/audit/SKILL.md` ; méthode : docs/audits/METHODE.md.
# Source de vérité PARTAGÉE entre machines : on le lit toujours sur origin/main
# (`git fetch origin` puis `git show origin/main:docs/audits/unites.yml`).
#
# - `rang` : ordre de passage (règle : METHODE.md §D.2). `audit first` = rang 1 ;
#   `audit next` = plus petit rang dont statut = « à auditer » et sans branche de
#   claim `audit-<id>` vivante sur origin (METHODE.md §D.5).
# - `possede` : chemins dont l'unité est PROPRIÉTAIRE D'ÉCRITURE (routage des tâches,
#   METHODE.md §D.3). Le chemin le plus spécifique gagne (fichier > dossier > glob
#   résiduel). Si docs/ownership.yml existe, IL PRIME sur ce champ.
#   Une unité sans `possede` (X2, X4, X6) est une PISTE : elle audite à travers les
#   autres et route toutes ses tâches vers leurs propriétaires.
# - `perimetre_lu` : ce que l'audit LIT en plus (coutures), sans en être propriétaire.
# - `statut` ∈ {à auditer, en cours, audité, construit, vérifié}.
#   « en cours » se lit d'abord sur la branche de claim ; il n'est écrit ici que si
#   un audit livre volontairement un dossier partiel.
# - `groupe` : préfixe d'ID des tâches produites (vérifié libre dans docs/*.md,
#   docs/plans/*.md et docs/BUILD_ORDER.yml le 02/10/2026).
# - `plan` : fichier du propriétaire (docs/plans/PLAN_AUDIT_<UNITE>.md) ;
#   `plans_alimentes` : fichiers où les tâches d'un audit de cette unité sont allées.
# - Faits vérifiés sur origin/main 6742fc3a1 ; P et I = probabilité et impact (1-5),
#   score = P × I (METHODE.md §D.2).
#
# Hors périmètre de TOUTES les unités : les 47 apps parquées
# (backend/django_core/core/parked.py, APPS_PARQUEES), backend/parked/**, et
# apps/web/** hors des fichiers listés ci-dessous (domaine de docs/WEB_PLAN.md).

