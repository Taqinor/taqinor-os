  - id: D-AGM-1
    question: "Moteur de pompe donné en CV (5,5 CV = 4,05 kW) : quel kW pour la pompe et le variateur (constat R1 AGM : variateur 5,5 kW choisi pour un moteur normalisé de 4 kW) ?"
    options:
      - cle: a
        texte: "CV ramené à la puissance normalisée IEC la plus proche quand l'écart relatif est ≤ 2 % (écart maximal mesuré 1,97 %, 40 CV → 30 kW) ; pompe et variateur affichent le même kW"
      - cle: b
        texte: "garder la conversion brute CV × 0,7355"
    reponse: a
    date: "2026-10-27"
    source: "décision prise pour le fondateur (à revoir) — règle fondateur du 27/10/2026 « ne jamais attendre le fondateur » ; session L3 AGM"
    taches: [AGM1]
