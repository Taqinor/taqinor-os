    date: "2026-10-02"
    source: "docs/claude-memory/agricole-decisions-fondateur.md (D-AGR-4)"
    taches: []

  - id: D-AGR-5
    question: "Comment calculer les economies agricoles ?"
    options:
      - cle: a
        texte: "Economies = chiffres declares du client moins l'entretien solaire ; horizon 10 ans ; pompe remplacee a l'annee 7 ; variateur a la fin de sa garantie ; retour sans aide deduite ; bloc omis si rien n'est declare."
    reponse: a
    date: "2026-10-02"
    source: "docs/claude-memory/agricole-decisions-fondateur.md (D-AGR-5)"
    taches: []

