    taches: [ACAL1923]
  - id: D-ACAL-150
    question: "Un calepinage sans facture ni socle où l'utilisateur ne déclare qu'une charge (voiture électrique, pompe à chaleur) : les anciens documents portent une courbe de base de 24 zéros, les nouveaux n'en portent plus. Les deux doivent-ils donner le même résultat ?"
