    question: "TVA recuperable et chaine HT/TTC du C&I ?"
    options:
      - cle: a
        texte: "Champ declare « TVA recuperable oui/non » : economies, retour et TRI en HT si oui, TTC si non ; le document garde la chaine HT, TVA, TTC ; saisie du generateur 100 % TTC."
    reponse: a
    date: "2026-10-03"
    source: "docs/claude-memory/ci-decisions-fondateur.md (D-CIQ-3)"
