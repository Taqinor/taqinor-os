  - id: D-CADV-9
    question: "Réparation unique des données : 125 leads rebondis par l'alignement Odoo ramenés en Froid avec raison, perdus / archivés / opposés sortis des comptages vivants, ~160 réveils aveugles annulés — avec dry-run, liste d'ids validée par le fondateur, puis --apply ?"
