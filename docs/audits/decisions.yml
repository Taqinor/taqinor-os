      - cle: un_panneau_par_defaut_partout
        texte: "Un seul panneau par défaut pour tout l'ERP (le 715 W aujourd'hui), montré dans le stock (réponse libre du fondateur)"
    reponse: un_panneau_par_defaut_partout
    date: "2026-11-26"
    source: "fondateur, questions interactives du 26/11/2026 (cinquième séance), réponse tapée mot pour mot : « always use 715w everywhere, and have somewhere in the stock to show the default used pannels ». Lecture de l'orchestrateur, à confirmer : (1) UN panneau par défaut par société, désigné sur la fiche produit du stock (drapeau unique, action réservée à qui modifie les produits), lu par tous les choix automatiques — devis automatique et tailles (aujourd'hui 710 en dur : ventes/domain/taille.py::_AUTO_PANEL_WATT), assistant, C&I et pompage (panneau désigné d'abord s'il est tarifé et sa fiche complète), premier module d'un nouveau pan au calepinage, valeur de départ du générateur ; (2) le stock le montre (pastille « Panneau par défaut » et ligne « Panneau par défaut : X ») ; (3) l'entrée électrique d'un calepinage suit le panneau POSÉ quand il change, et le dit ; (4) rien d'existant n'est recalculé : devis enregistrés ou envoyés, calepinages enregistrés gardent LEUR panneau ; (5) sans panneau désigné, tarifé et non archivé : la règle d'aujourd'hui s'applique et l'écran le dit. Choix pris par l'orchestrateur, à confirmer : les estimateurs du site public passent aussi au panneau par défaut (les textes d'installations réelles ne changent pas) ; les calepinages de production dont le panneau stocké diffère du toit sont d'abord LISTÉS en lecture seule. Désigner le 715 W en production reste un geste du fondateur. Note de conception : inventaire des 16 endroits (session du 26/11). Construit au lot 9 : la désignation est réservée à la permission `catalogue_prix_modifier` ; à l'atelier le panneau par défaut passe avant les favoris ; une désignation est refusée si la puissance du nom diffère de celle de la fiche ; le panneau par défaut ne décide que d'une composition NEUVE (un devis existant lit son propre panneau, brouillons seulement). NON construit, questions ouvertes au fondateur : le site public (aucune voie propre sans point d'accès relayé, rapport de la branche `lot9/panneau-defaut-web`) ; les leads qui ont déjà une conception n'y passent qu'à leur prochain recalcul ; la marque de panneau épinglée d'une gamme l'emporte en résidentiel, pas en C&I ni en pompage. RÉPONDU PAR LE FONDATEUR le 27/11/2026 (questions interactives, option recommandée à chaque fois) : (a) le SITE PUBLIC estime aussi avec le panneau par défaut — point d'accès relayé pour que le site lise le panneau par défaut de la société (10 kWc : 15 → 14 panneaux), les textes d'installations réelles ne changent pas ; état : lane site-panneau-defaut pliée en local (51c8761a4), contestée avec preuve sur un point (l'estimateur résidentiel du site ne lit aucun watt de panneau), point d'accès relayé à vérifier ; (b) un lead qui a déjà une conception passe au panneau par défaut AU PROCHAIN RECALCUL, rien d'existant n'est recalculé seul (comportement d'aujourd'hui, rien à construire) ; (c) la marque de panneau ÉPINGLÉE d'une gamme l'emporte PARTOUT (résidentiel, C&I, pompage) sur le panneau par défaut — construit sous l'alias D-27/11-4 (266595fd0, 5d168e177 : sans panneau utilisable de la marque épinglée le défaut est retenu et c'est dit) ; reste ouvert : l'épingle est ignorée quand le défaut EST de la marque mais refusé ou absent"
    taches: [ACAL2049]
