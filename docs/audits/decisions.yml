  - id: D-CADV-10
    question: "Chemins par segment : parcours C&I (pièces → devis, second contact, veille trimestrielle, jamais Froid à J14) et agricole en veille aux dates du client, via chaînes moteur et règles de veille sans second gabarit (CAD124 reste fermée ; rouvre CAD52 et B2B7), ou un seul chemin résidentiel pour tous ?"
