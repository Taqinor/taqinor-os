  - id: D-ACAL-131
    question: "Schéma électrique du devis (lot 6 — le schéma unifilaire de la page client, de la fiche devis et de l'annexe PDF prend le dessin du calepinage) : d'où viennent les chaînes dessinées, et quelle option chaque schéma montre-t-il ?"
    options:
      - cle: calepinage_sinon_conception_par_option
        texte: "Chaque option du devis a SON schéma. Les chaînes réelles du calepinage lié quand la conception du devis est celle du calepinage (empreintes layout_hash égales) et que l'option dessinée est celle que le calepinage retient ; sinon la conception électrique de CETTE option (chaînes du moteur), dans le même dessin ; sans conception pour l'option, le champ de panneaux sans découpage inventé. Batterie dessinée quand l'option en a une (unités, capacité nominale de la fiche × unités, tension de la fiche ; aucune protection batterie, décision du 19/08/2026). Page client : le schéma suit l'option choisie par le client. Fiche devis : les deux options, l'une ou l'autre à l'écran. Annexe PDF : le dessin neuf pour les nouveaux rendus seulement (un devis envoyé avant la coupure garde l'annexe reçue), même option qu'aujourd'hui (avec batterie quand elle est servable)"
      - cle: conception_du_devis_seule
        texte: "Toujours la conception électrique rangée du devis (une seule option, avec batterie quand elle est servable), jamais les chaînes du calepinage ; la page montre le même schéma quelle que soit l'option choisie"
    reponse: calepinage_sinon_conception_par_option
    date: "2026-11-26"
    source: "décision prise par l'orchestrateur en l'absence du fondateur, CONFIRMÉE PAR LE FONDATEUR le 26/11/2026 (« all the 18 choices are good ») (option recommandée et réversible) ; demande du fondateur le 26/11/2026, mot pour mot : « i want this shema unifilaire i hade to be changed by the new schema electique that calpinage use that shows the chaines of pannels in 4 colors and show the inverter the grid and everything (if it does not show the battery make is show it) » ; conception et lanes : docs/audits/l5-calepinage/schema-electrique-devis.md ; contrat : backend/django_core/apps/ventes/contract_samples/schema_electrique.json"

  - id: D-HYB-6
    question: "Le moteur de devis RÉSIDENTIEL (apps/ventes/solar_design.py::match_inverter) écarte tout onduleur au-delà d'un rapport DC/AC de 1,35 (MAX_DC_AC), hybride compris, et prend le plus gros quand aucun ne convient (« plus grosse puissance retenue, vérifier la conception »). Le calepinage et le moteur C&I jugent déjà un hybride à la puissance PV maximale de sa fiche (D-HYB-1). Le devis résidentiel doit-il juger un hybride de la même façon ?"
    options:
      - cle: a_capacite_publiee
        texte: "(recommandée) Oui : un hybride dont la fiche publie sa puissance PV maximale (ond_dc_max_kwc) est retenu jusqu'à elle, par la même fonction du noyau (core.electrique.onduleurs.capacite_dc_appareil_kwc) ; sans valeur publiée, 1,35 reste la borne. Change l'onduleur choisi par les NOUVEAUX devis résidentiels ; les devis envoyés gardent ce que le client a reçu"
      - cle: b_inchange
        texte: "Non : le devis résidentiel garde 1,35 pour tout onduleur ; le calepinage et le devis résidentiel peuvent alors se contredire sur le même hybride (le calepinage « bon », le devis « vérifier la conception »)"
    reponse: b_inchange
    date: "2026-11-26"
    source: "RÉPONDUE par le fondateur le 26/11/2026 (soir), en deux temps : d'abord « même règle que le calepinage » sur une question MAL POSÉE (le devis résidentiel ne choisit pas par 1,35 : `match_inverter` n'a aucun appelant en production ; le choix réel est le plus petit onduleur d'au moins 0,8 × la puissance des panneaux, `domain/composition_residentielle.py::choisir_onduleur`, et le contrôle à 1,35 applique déjà la capacité publiée d'un hybride, D-HYB-1) ; puis, la question corrigée, « garder le choix d'aujourd'hui » : rien ne change dans les devis, un vendeur peut toujours choisir un hybride plus petit à la main. La branche lot8/hyb6-residentiel n'est pas pliée. lane lot6/ratio-hybride (lead 1742 : 48 × 715 W = 34,32 kWc sur un hybride Deye 20 kW, « 1,72 pour 1,35 au plus » dans « Prêt à envoyer ? ») ; conséquence calculée sur le catalogue de départ (migration stock 0182, puissances PV maximales des fiches Deye : 10 kW → 20 kWc, 12 kW → 24 kWc, 15 kW → 30 kWc, 20 kW → 40 kWc, soit 2,0 × la puissance AC) : avec (a) un hybride porte jusqu'à 2,0 × sa puissance AC au lieu de 1,35 ×, donc pour 34,32 kWc le 20 kW convient (34,32 ≤ 40) alors qu'avec (b) aucun hybride du catalogue ne passe et le 20 kW n'est pris qu'en repli signalé ; aucune lecture de la production faite (nombre de devis résidentiels concernés non mesuré)"
    taches: []
