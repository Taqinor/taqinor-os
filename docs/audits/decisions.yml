  - id: D-AARG-1
    question: "Un avoir sur une facture déjà payée (12 000 payés, avoir 2 400) fait disparaître le montant crédité : que devient le surplus ?"
    options:
      - cle: avance_client
        texte: "Le surplus crédité devient une avance client (trop-perçu) visible au relevé, imputable sur une prochaine facture ou remboursable"
      - cle: refuser
        texte: "409 : aucun avoir au-delà du reste dû ; une facture payée se rembourse ou s'annule d'abord"
      - cle: remboursement_du
        texte: "Un remboursement dû au client (paiement négatif à régler), sans avance"
    reponse: avance_client
    date: "2026-11-02"
    source: "Reda, question interactive, audit parcours PA4"
    taches: [AARG1]

  - id: D-AARG-2
    question: "Retenue à la source (RAS-TVA) après un avoir : quelle base ?"
    options:
      - cle: tva_nette
        texte: "Base = TVA de la facture − avoirs + notes de débit (D-ASTK171 « toute la TVA, acompte compris » reste vraie pour les acomptes)"
      - cle: tva_totale
        texte: "Garder la TVA totale de la facture, même après avoir (comportement actuel)"
    reponse: tva_nette
    date: "2026-11-02"
    source: "Reda, question interactive, audit parcours PA4"
    taches: [AARG4]

  - id: D-AARG-3
    question: "Émettre une facture exige `encaisser` sur « Facturer la vente » mais pas sur « Émettre » ni l'action groupée : quelle règle ?"
    options:
      - cle: exiger_encaisser
        texte: "Émettre crée une créance : toute porte d'émission exige `encaisser` (cohérent avec D-ASEC-VER-1 « tout l'argent »)"
      - cle: ne_pas_exiger
        texte: "Émettre reste un geste commercial : retirer l'exigence de « Facturer la vente » aussi"
    reponse: exiger_encaisser
    date: "2026-11-02"
    source: "Reda, question interactive, audit parcours PA4"
    taches: [AARG9]

  - id: D-AARG-4
    question: "Remise en brouillon puis réémission d'une facture émise : le numéro légal est redaté au jour (N peut finir daté après N+1). Quelle règle ?"
    options:
      - cle: garder_date
        texte: "La réémission garde la date et le numéro d'origine ; retour en brouillon permis seulement avant envoi ou transmission DGI"
      - cle: interdire_retour
        texte: "Une facture émise ne revient jamais en brouillon : corriger par avoir seulement"
      - cle: actuel
        texte: "Garder le redatage à la réémission (testé volontairement aujourd'hui)"
    reponse: garder_date
    date: "2026-11-02"
    source: "Reda, question interactive, audit parcours PA4"
    taches: [AARG23]

  - id: D-AARG-5
    question: "Escompte pour paiement anticipé appliqué à l'encaissement sans avoir (journal des ventes, TVA et UBL au montant plein) : comment le comptabiliser ?"
    options:
      - cle: par_avoir
        texte: "Chaque escompte accordé génère un avoir qui réduit HT et TVA ; journal, TVA et UBL suivent l'encaissé réel"
      - cle: hors_tva
        texte: "Escompte financier hors TVA (comportement actuel), libellé « Escompte » et non « règlement » au relevé"
      - cle: retirer
        texte: "Retirer la fonction d'escompte (aucun usage MVP)"
    reponse: par_avoir
    date: "2026-11-02"
    source: "Reda, question interactive, audit parcours PA4 (critique de complétude)"
    taches: [AARG57]

  - id: D-ADVS-1
    question: "Un devis envoyé, rendu à nouveau (PDF /proposal, page publique), relit les réglages actuels de la société (productible, barème, redevance) et les fiches produit (garantie) : que voit le client ?"
    options:
      - cle: figer_a_l_envoi
        texte: "Réglages et fiches lus au premier envoi figés dans le devis ; un nouveau réglage ne vaut que pour les nouveaux envois ou une révision"
      - cle: reglages_actuels
        texte: "Le rendu suit les réglages du jour ; la modification change l'empreinte et force la relecture (409)"
    reponse: figer_a_l_envoi
    date: "2026-11-02"
    source: "Reda, question interactive, audit parcours PA3"
    taches: [ADVS1, ADVS2, ADVS45]

  - id: D-ADVS-2
    question: "Une vente dés-acceptée, corrigée puis signée une seconde fois garde la première preuve et le premier exemplaire signé : que faire ?"
    options:
      - cle: nouvelle_preuve
        texte: "La seconde signature crée une nouvelle preuve et un nouvel exemplaire ; l'ancienne preuve et l'ancien PDF restent archivés à l'historique"
      - cle: interdire
        texte: "Un devis dés-accepté ne se re-signe plus : 409, réviser en V2"
    reponse: nouvelle_preuve
    date: "2026-11-02"
    source: "Reda, question interactive, audit parcours PA3"
    taches: [ADVS4]

  - id: D-ADVS-3
    question: "Un accessoire de batterie (câble batterie classé cable_dc) et une batterie au nom sans « batterie » : dans quelle option les compter ?"
    options:
      - cle: suit_la_batterie
        texte: "Une seule règle partout : tout ce qui sert la batterie n'est que dans « Avec batterie » ; rôle stocké de la ligne d'abord, mots-clés en repli"
      - cle: role_stocke_seul
        texte: "Une seule règle partout, par le rôle stocké : un câble cable_dc reste dans les deux options"
    reponse: suit_la_batterie
    date: "2026-11-02"
    source: "Reda, question interactive, audit parcours PA3"
    taches: [ADVS5, ADVS6]

  - id: D-ADVS-4
    question: "Un prix tapé TTC × quantité perd des centimes en HT, puis l'arrondi à la centaine vers le bas retire 100 MAD (3 × 1 000 TTC → 2 900) : que faire ?"
    options:
      - cle: tolerance_un_dirham
        texte: "Un total à moins d'1 MAD sous une centaine remonte à cette centaine ; l'arrondi à la centaine reste pour les autres totaux"
      - cle: jamais_sur_prix_tape
        texte: "Aucun arrondi à la centaine dès qu'une ligne a un prix saisi"
      - cle: supprimer
        texte: "Plus aucun arrondi à la centaine"
    reponse: tolerance_un_dirham
    date: "2026-11-02"
    source: "Reda, question interactive, audit parcours PA3"
    taches: [ADVS3]

  - id: D-ADVS-5
    question: "Désacceptation d'une vente dont le chantier a déjà un bon de commande fournisseur envoyé (ou une DA commandée) : bloquer ou laisser passer ?"
    options:
      - cle: refuser_409
        texte: "409 nommant le BCF tant qu'il n'est pas annulé chez le fournisseur"
      - cle: avertir
        texte: "La désacceptation passe ; le BCF ouvert est signalé à l'acheteur (tâche ou alerte)"
    reponse: refuser_409
    date: "2026-11-03"
    source: "Reda, question interactive, 03/11/2026 ; audit parcours PA3 (C-ADVS-027), non posée au lot interactif (S3)"
    taches: [ADVS40]

  - id: D-ENF15-STOCK-22
    question: "22 endpoints stock sans écran (passif de check_calepinage_actions_consommees.py, ENF15) : un écran ou l'API seule ?"
    options:
      - cle: six_ecrans_seize_api_seule
        texte: "Six reçoivent un écran (documents-expirants, export-conformite, delai-mesure, releve-deductions-tva, tracabilite, valorisation-a-date) ; les seize autres restent en API seule, marquées headless (lignes-import, ressource/engagements-budget, pesees, lignes/<id>/pesee, rapprocher-pesees, ressource/tolerances-rapprochement-categorie, depuis-ubl, importer-datasheet, decoupes, classe-abc, plan-picking, etiquettes-prix, suggestions-rangement, proposer-cross-dock, affecter-cross-dock, valider-scanne)"
