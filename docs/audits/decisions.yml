    options:
      - cle: a
        texte: "Taille = la plus grande dont chaque tranche de 5 kWc se rembourse en 10 ans ou moins sur l'autoconsommation horaire, bornee par toit, puissance souscrite, onduleurs et 82-21 ; une taille explicite reste souveraine."
    reponse: a
    date: "2026-10-03"
    source: "docs/claude-memory/ci-decisions-fondateur.md (D-CIQ-2)"
