      - {cle: b, texte: "garder le re-net de tout avoir dans la dernière échéance"}
    reponse: a
    date: "2026-10-09"
    source: "session 2026-10-09 ; constat C-AMET-004 ; test_solde_net_des_avoirs à réécrire"
    taches: [ATOT36]

