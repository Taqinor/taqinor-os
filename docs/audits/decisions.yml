    taches: [ACAL367]

  - id: D-CADV-1
    question: "Protocole de contact résidentiel : garder les 11 touches sur 14 j (règle du 21/09 « ni nombre ni ordre ni J+N », CAD25) ou passer à la v4 (5 appels + 3 WhatsApp sur 7 j, fenêtres 10-14 h / 16-18 h, sans barreau dimanche ni heure 17:30-18:30) ?"
