    date: "2026-11-02"
    source: "Reda, question interactive, audit parcours PA3"
    taches: [ADVS5, ADVS6]

  - id: D-ADVS-4
    question: "Un prix tapé TTC × quantité perd des centimes en HT, puis l'arrondi à la centaine vers le bas retire 100 MAD (3 × 1 000 TTC → 2 900) : que faire ?"
    options:
