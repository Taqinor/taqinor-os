    source: "tour 2 du L5 (23/11/2026) : après « Démarrage rapide », aucun calepinage n'a de résultat complet au premier jour (19 pertes sur 22 sans valeur selon l'écran) ; le profil de départ ne publie rien pour la salissure, la dégradation initiale et l'indisponibilité, et les pertes de câbles n'ont pas de clé de réglage ; ACAL1349 déclarée impossible sans valeurs inventées ; rappel de la demande du fondateur du 22/11 : « my ERP should have default for everything » ; contrôle C2 du 23/11/2026 : tant que cette décision est ouverte, tout résultat reste « incomplet » et `ventes/horaire/productible_pose.py::base_depuis_servi` le rejette — la production de la pose réelle (D-ACAL-36, 44, 46) n'atteint donc AUCUN devis ; seule valeur publiée trouvée au dépôt : dégradation initiale 2 % suggérée par PVsyst ; repère : le devis applique déjà une enveloppe de 20 % de pertes au total ; RÉPONSE DU FONDATEUR le 23/11/2026 (questions interactives) : « search yourself on right values to be added », puis valeurs proposées ACCEPTÉES : salissure 3 % par an ; dégradation initiale 1,5 % (PERC et technologie inconnue), 1 % (TOPCon, HJT) ; indisponibilité 2 % ; câbles 1,5 % en continu + 1 % en alternatif ; chacune affichée « supposé » avec sa source, modifiable par société ; sources et fourchettes : docs/audits/l5-calepinage/controles/R-pertes-par-defaut.md"
    taches: [ACAL1349, ACAL1968]

