  - id: D-CADV-7
    question: "Routage des nouveaux leads résidentiels : file partagée « À prendre » avec commercial de permanence et propriété après le premier contact (les C&I gardent le propriétaire pro nommé, D-CIQ-20 ; les leads de Reda entrent dans la file ; Asmaa ≥ 0,8 siège), ou tout le flux Meta à Meryem seule ?"
    options:
