    question: "Visite avant le devis agricole ?"
    options:
      - cle: a
        texte: "Visite « releve du point d'eau » AVANT le devis quand le niveau d'eau ou le debit du forage est inconnu apres l'appel ; sinon devis comme aujourd'hui."
