    source: "Reda, question interactive, session all-plans"
    taches: [ENF15]

  - id: D-CADV22-PROMESSE
    question: "Le dernier parcage de contact est refusé par CADV22 (moins de 5 appels tracés, ou zéro touche) alors que l'écran promet Froid : que dit l'écran ?"
    options:
      - cle: dire_pourquoi_proposer_appel
        texte: "L'écran énonce la condition (par exemple « 3 appels sur 5 tracés ») et l'étape suivante est un autre appel, jamais « Préparer et envoyer le devis »"
