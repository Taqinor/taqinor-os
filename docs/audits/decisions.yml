  - id: D-CADV-5
    question: "Accusé de réception automatique hors heures : WhatsApp Business Platform avec gabarit UTILITAIRE (≈ 2 $/mois) après la case d'opt-in sur le formulaire Meta, ou WhatsApp entièrement manuel (balayages seuls) ?"
