    question: "Écrire dans le registre des consentements et dans le registre des traitements (RGPD) : quel droit ?"
    options:
      - cle: dsr_traiter
        texte: "Le droit de traiter les demandes RGPD, comme pour les demandes elles-mêmes"
      - cle: palier_responsable
        texte: "Le niveau responsable suffit, comme aujourd'hui"
    reponse: dsr_traiter
    date: "2026-11-11"
    source: "Reda, question interactive, 11/11/2026 (après-midi, session loop audit) ; avant : audit de parcours PF4 (10/11/2026) : non posée (défaut recommandé : dsr_traiter) ; constat C-ADRG-060"
    taches: []

  - id: D-ADRG-14
    question: "Créer, modifier ou supprimer un rôle : l'Admin Ventes le fait aujourd'hui sans « Gérer les utilisateurs » (jamais plus large que son propre rôle). Faut-il exiger ce droit ?"
    options:
      - cle: users_gerer
        texte: "Oui : écrire un rôle exige « Gérer les utilisateurs » (seul l'Admin Ventes est touché)"
      - cle: palier_responsable
        texte: "Non : le niveau responsable suffit, avec les bornes actuelles"
    reponse: users_gerer
    date: "2026-11-11"
    source: "Reda, question interactive, 11/11/2026 (après-midi, session loop audit) ; avant : audit de parcours PF4 (10/11/2026) : non posée (défaut recommandé : users_gerer) ; constat C-ADRG-061"
    taches: []

  - id: D-ALEC-1
    question: "Les tarifs de transport (prix de base d'un transporteur, offres de prix d'une expédition) sont servis sans masque à des rôles sans « voir les prix d'achat », alors que le coût réel d'une expédition et le coût de transport d'une livraison sont masqués. Un tarif de transport est-il un montant d'achat ?"
    options:
      - cle: masque_prix_achat
        texte: "Oui : un tarif de transport est un prix payé à un fournisseur ; il est masqué sans le droit « voir les prix d'achat », comme le coût réel"
      - cle: ouvert
        texte: "Non : c'est un prix public du transporteur ; il reste visible de qui lit le stock et les chantiers"
    reponse: masque_prix_achat
    date: "2026-11-11"
    source: "Reda, question interactive, 11/11/2026 (après-midi, session loop audit) ; avant : audit de parcours PF6 (11/11/2026) : non posée (défaut recommandé : masque_prix_achat)"
    taches: [ALEC5, ALEC6]

  - id: D-ALEC-2
    question: "Les tableaux de bord (accueil, ventes, rapports, objectifs) montrent à un commercial le chiffre d'affaires, le pipeline et l'objectif réalisé de chaque collègue nommé, et les plus gros débiteurs, alors que ses listes ne montrent que ses propres affaires. Les tableaux de bord suivent-ils la portée du rôle ?"
    options:
      - cle: portee_du_role
        texte: "Oui : chacun ne voit que les chiffres de sa portée (les siens, son équipe, son sous-arbre) ; un classement peut nommer les collègues sans leurs montants"
      - cle: societe_entiere
        texte: "Non : les tableaux de bord restent à l'échelle de la société pour tout rôle qui lit les rapports"
    reponse: portee_du_role
    date: "2026-11-11"
    source: "Reda, question interactive, 11/11/2026 (après-midi, session loop audit) ; avant : audit de parcours PF6 (11/11/2026) : non posée (défaut recommandé : portee_du_role) ; D-ACVI-2 ne vise que le CRM"
    taches: [ALEC22, ALEC23, ALEC24]

  - id: D-ALEC-3
    question: "Le journal des réglages (qui a changé quel réglage de la société, ancienne et nouvelle valeur) est lisible au palier responsable, sans le droit « Journal d'activité » réservé au Directeur. Faut-il ce droit ?"
    options:
      - cle: journal_activite_voir
        texte: "Oui : le journal des réglages est un extrait du journal d'activité, il exige le droit « Journal d'activité »"
      - cle: lecture_parametres
        texte: "Non : il suffit de pouvoir lire les paramètres"
    reponse: journal_activite_voir
    date: "2026-11-11"
    source: "Reda, question interactive, 11/11/2026 (après-midi, session loop audit) ; avant : audit de parcours PF6 (11/11/2026) : non posée (défaut recommandé : journal_activite_voir)"
    taches: [ALEC28]

  - id: D-ALEC-4
    question: "Quand la « vue restreinte » du calepinage est éteinte, un commercial voit les calepinages (nom et ville du lead) de tous ses collègues, alors que ses leads sont limités aux siens. Le calepinage suit-il la portée du rôle ?"
    options:
      - cle: portee_du_role
        texte: "Oui : un calepinage se voit comme son lead, selon la portée du rôle (les siens, son équipe, son sous-arbre)"
      - cle: reglage_seul
        texte: "Non : seul le réglage « vue restreinte » décide, pour toute la société"
    reponse: portee_du_role
    date: "2026-11-11"
    source: "Reda, question interactive, 11/11/2026 (après-midi, session loop audit) ; avant : audit de parcours PF6 (11/11/2026) : non posée (défaut recommandé : portee_du_role)"
    taches: [ALEC29]

  - id: D-ALEC-5
    question: "Trois montants internes sortent sans masque : les frais de livraison estimés d'un fournisseur, l'économie estimée d'un regroupement de bons de commande, la caution d'un matériel consigné. Sont-ils des montants d'achat à masquer ?"
    options:
      - cle: masque_prix_achat
        texte: "Oui : ce sont des montants d'achat ; masqués sans le droit « voir les prix d'achat »"
      - cle: ouvert
        texte: "Non : ce sont des paramètres de travail, visibles de qui lit le stock et les chantiers"
    reponse: masque_prix_achat
    date: "2026-11-11"
    source: "Reda, question interactive, 11/11/2026 (après-midi, session loop audit) ; avant : audit de parcours PF6 (11/11/2026) : non posée (défaut recommandé : masque_prix_achat) ; aucune tâche tant qu'elle est ouverte"
    taches: []

  - id: D-APUB-1
    question: "Une demande de « rappel » faite depuis le lien du devis lève aujourd'hui l'opposition loi 09-08 de la personne (elle redevient joignable) et l'inscrit « à la demande du client », sans preuve que c'est bien elle. Faut-il garder cette levée directe ?"
    options:
      - cle: confirmer_par_commercial
        texte: "Non : la demande crée une tâche de rappel ; l'opposition n'est levée que par le commercial, après l'appel, à son nom"
      - cle: levee_directe
        texte: "Oui : la demande faite depuis le lien lève l'opposition tout de suite, comme aujourd'hui"
    reponse: confirmer_par_commercial
    date: "2026-11-11"
    source: "Reda, question interactive, 11/11/2026 (après-midi, session loop audit) ; avant : audit de parcours PF5 (11/11/2026) : non posée (défaut recommandé : confirmer_par_commercial)"
    taches: [APUB39]

  - id: D-APUB-2
    question: "Le chat public du site (livechat) est ouvert à tous mais aucun écran ni le site ne l'utilisent ; un visiteur anonyme peut créer des leads et écrire dans l'historique d'un lead existant. Faut-il le fermer ?"
    options:
      - cle: parquer
        texte: "Oui : il est fermé par défaut derrière un réglage (404), comme le formulaire de contact ; on le rouvre le jour où un écran l'utilise"
      - cle: garder_ouvert
        texte: "Non : il reste ouvert, avec un anti-robot et sans écriture dans un lead existant"
    reponse: parquer
    date: "2026-11-11"
    source: "Reda, question interactive, 11/11/2026 (après-midi, session loop audit) ; avant : audit de parcours PF5 (11/11/2026) : non posée (défaut recommandé : parquer)"
    taches: [APUB10]

  - id: D-APUB-3
    question: "L'API publique par clé (46 routes) n'est pas servie par le serveur de production : elle est injoignable, alors qu'une clé existe. Faut-il l'ouvrir ?"
    options:
      - cle: ouvrir_apres_correctifs
        texte: "Oui : ouvrir la route dans le serveur, après correction de la sortie de « Signé » par l'API et des exports CSV"
      - cle: parquer
        texte: "Non : la déclarer parquée et retirer ses deux appels de l'écran Paramètres"
    reponse: ouvrir_apres_correctifs
    date: "2026-11-11"
    source: "Reda, question interactive, 11/11/2026 (après-midi, session loop audit) ; avant : audit de parcours PF5 (11/11/2026) : non posée (défaut recommandé : ouvrir_apres_correctifs)"
    taches: [APUB15]

  - id: D-APUB-4
    question: "Le lien public du compte-rendu d'intervention (photos du domicile, numéros de série, signataire) ne s'arrête jamais. Combien de temps doit-il rester ouvert ?"
    options:
      - cle: expire_90j_revocable
        texte: "90 jours après la clôture de l'intervention, avec en plus un bouton « Couper le lien » pour le responsable"
      - cle: revocable_seul
        texte: "Sans limite de durée : seulement le bouton « Couper le lien »"
    reponse: expire_90j_revocable
    date: "2026-11-11"
    source: "Reda, question interactive, 11/11/2026 (après-midi, session loop audit) ; avant : audit de parcours PF5 (11/11/2026) : non posée (défaut recommandé : expire_90j_revocable)"
    taches: [APUB7]

  - id: D-APUB-5
    question: "Le site public (taqinor.ma, www) a le droit d'appeler l'ERP avec la session de l'employé connecté : un script piégé sur le site pourrait lire et écrire l'ERP en son nom. Le site n'en a pas besoin (il passe par ses relais). Faut-il retirer ce droit ?"
    options:
      - cle: sans_identifiants
        texte: "Oui : le site ne peut plus appeler l'ERP avec la session de l'employé (ou seulement les routes publiques)"
      - cle: garder
        texte: "Non : garder le réglage actuel"
    reponse: sans_identifiants
    date: "2026-11-11"
    source: "Reda, question interactive, 11/11/2026 (après-midi, session loop audit) ; avant : audit de parcours PF5 (11/11/2026) : non posée (défaut recommandé : sans_identifiants)"
    taches: [APUB73]

  - id: D-ATST-1
    question: "Un rôle qui porte un code de droit absent du registre (faute de frappe, code inventé dans un test : « tickets_gerer », « stock_gerer ») est compté aujourd'hui comme un rôle qui écrit, donc « responsable ». Un code absent du registre doit-il n'accorder aucun palier ?"
    options:
      - cle: code_inconnu_n_accorde_rien
        texte: "Oui : seul un code du registre compte ; un code inconnu n'accorde aucun palier, et les tests à codes inventés passent aux vrais codes"
      - cle: garder
        texte: "Non : tout code autre qu'une lecture continue de valoir écriture (comportement actuel)"
    reponse: code_inconnu_n_accorde_rien
    date: "2026-11-11"
    source: "Reda, question interactive, 11/11/2026 (après-midi, session loop audit) ; avant : audit de parcours PF7 (11/11/2026) : non posée (défaut recommandé : code_inconnu_n_accorde_rien) ; aucun rôle réel ne porte de code inconnu (5 comptes, rôles livrés)"
    taches: [ATST13]

  - id: D-ATST-2
    question: "Les trois tests navigateur de la page publique de proposition (français et arabe) sont toujours sautés : l'adresse du site n'est donnée à aucun run. Faut-il servir le site dans le run de bout en bout et y vérifier les montants, ou retirer ces trois tests ?"
    options:
      - cle: servir_le_site
        texte: "Servir le site public dans le run de bout en bout et vérifier les montants affichés de la proposition, en français et en arabe"
      - cle: retirer
        texte: "Retirer les trois tests ; la page reste prouvée par les tests du site et la parité écran / données"
    reponse: servir_le_site
    date: "2026-11-11"
    source: "Reda, question interactive, 11/11/2026 (après-midi, session loop audit) ; avant : audit de parcours PF7 (11/11/2026) : non posée (défaut recommandé : servir_le_site)"
    taches: [ATST30, ATST54]

  - id: D-AMSG-1
    question: "Les messages clients hors cadence commerciale partent avant 8 h 30 et le week-end : relances de facture 07:00, rappel avant échéance 07:20, rappel de pose J-1 07:45, relance de signature 07:45, relevé du 1er à 08:00. La règle « messages à partir de 8 h 30 » ne vise par écrit que la cadence commerciale. Ces messages suivent-ils la même fenêtre ?"
    options:
      - cle: fenetre_commerciale
        texte: "Oui : même fenêtre que les messages commerciaux, à partir de 08:30, jours ouvrés, report au créneau suivant"
      - cle: heures_actuelles
        texte: "Non : garder les heures actuelles, ce sont des messages contractuels"
    reponse: fenetre_commerciale
    date: "2026-11-11"
    source: "Reda, question interactive, 11/11/2026 (après-midi, session loop audit) ; avant : audit de parcours PF8 (11/11/2026) : non posée (défaut recommandé : fenetre_commerciale)"
    taches: [AMSG44, AMSG72, AMSG73]

  - id: D-AMSG-2
    question: "Quand une personne répond STOP sur une fiche, une AUTRE fiche déjà existante au même numéro ou au même e-mail reste contactable (relances, WhatsApp en masse, liens). D-ACVI-6 ne vise que les fiches créées ou fusionnées après. L'opposition s'étend-elle aux fiches déjà existantes ?"
    options:
      - cle: toutes_les_fiches
        texte: "Oui : au STOP, toutes les fiches vivantes de la société aux mêmes coordonnées deviennent « ne plus contacter », et c'est relu à chaque changement de coordonnées"
      - cle: nouvelles_fiches_seulement
        texte: "Non : seules les fiches créées ou fusionnées après le STOP en héritent"
    reponse: toutes_les_fiches
    date: "2026-11-11"
    source: "Reda, question interactive, 11/11/2026 (après-midi, session loop audit) ; avant : audit de parcours PF8 (11/11/2026) : non posée (défaut recommandé : toutes_les_fiches)"
    taches: [AMSG3]

  - id: D-AMSG-3
    question: "Les conversions envoyées à Meta (étape du lead, visite faite, devis signé) portent l'e-mail et le téléphone hachés d'un lead qui a demandé à ne plus être contacté. D-ACRM-5 l'exclut de toute audience, pas des conversions. Envoie-t-on ces conversions pour une personne opposée ?"
    options:
      - cle: rien_vers_meta
        texte: "Non : rien n'est envoyé à Meta pour une personne opposée"
      - cle: envoyer_quand_meme
        texte: "Oui : la conversion part quand même, pour mesurer les campagnes"
    reponse: rien_vers_meta
    date: "2026-11-11"
    source: "Reda, question interactive, 11/11/2026 (après-midi, session loop audit) ; avant : audit de parcours PF8 (11/11/2026) : non posée (défaut recommandé : rien_vers_meta)"
    taches: [AMSG10, AMSG36]

  - id: D-AMSG-4
    question: "Aujourd'hui tout rôle qui peut modifier une fiche peut décocher « ne plus contacter », sans motif (la trace et la reprise des relances existent). Qui peut lever l'opposition hors demande du client ?"
    options:
      - cle: responsable_avec_motif
        texte: "Seulement un responsable ou un administrateur, avec un motif obligatoire"
      - cle: tout_role_trace
        texte: "Tout rôle qui modifie la fiche, comme aujourd'hui, avec la trace"
    reponse: responsable_avec_motif
    date: "2026-11-11"
    source: "Reda, question interactive, 11/11/2026 (après-midi, session loop audit) ; avant : audit de parcours PF8 (11/11/2026) : non posée (défaut recommandé : responsable_avec_motif)"
    taches: []

  - id: D-AMSG-5
    question: "Quatre factures en retard ont consommé leurs trois niveaux de relance automatique alors qu'aucun e-mail n'est parti (e-mail éteint) : elles ne seront plus jamais relancées automatiquement. Leur rend-on leur relance ?"
    options:
      - cle: remettre_niveau_1
        texte: "Oui : après une liste des 4 factures montrée au fondateur, leur relance repart au niveau 1 (elles partiront quand l'e-mail sera allumé ; celle du client de démonstration attend D-AMSG-6)"
      - cle: laisser_consommees
        texte: "Non : les laisser telles quelles, relance à la main"
    reponse: remettre_niveau_1
    date: "2026-11-11"
    source: "Reda, question interactive, 11/11/2026 (après-midi, session loop audit) ; avant : audit de parcours PF8 (11/11/2026) : non posée (défaut recommandé : remettre_niveau_1)"
    taches: [AMSG30]

  - id: D-AMSG-6
    question: "Cinq clients et deux fournisseurs du jeu de démonstration, avec des adresses e-mail de vrais fournisseurs de messagerie, sont restés dans la société réelle ; deux portent de vrais documents. Que fait-on de leurs coordonnées ?"
    options:
      - cle: neutraliser_sauf_confirmes
        texte: "Après une liste montrée au fondateur, remplacer leurs e-mails et téléphones par des valeurs qui ne peuvent rien recevoir, sauf ceux que le fondateur confirme réels"
      - cle: garder
        texte: "Les garder telles quelles"
    reponse: neutraliser_sauf_confirmes
    date: "2026-11-11"
    source: "Reda, question interactive, 11/11/2026 (après-midi, session loop audit) ; avant : audit de parcours PF8 (11/11/2026) : non posée (défaut recommandé : neutraliser_sauf_confirmes)"
    taches: [AMSG62]

  - id: D-ASUP-1
    question: "À l'effacement d'une personne, ses anciennes valeurs sont-elles caviardées dans le journal d'audit ?"
    options:
      - cle: caviarder
        texte: "Oui : à l'effacement, les anciennes valeurs des champs personnels sont remplacées dans le journal d'audit (la trace du changement reste)"
      - cle: garder
        texte: "Non : le journal d'audit garde les anciennes valeurs (preuve complète, mais la donnée effacée y survit)"
    reponse: ouverte
    date: "2026-11-11"
    source: "audit de parcours PF10 (11/11/2026) : non posée (défaut recommandé : caviarder)"
    taches: [ASUP13]

  - id: D-ASUP-2
    question: "Un compte d'employé qui a laissé des traces peut-il être supprimé, ou seulement désactivé ?"
    options:
      - cle: desactiver_seulement
        texte: "Seulement désactivé : un compte qui a laissé des traces (auteur, propriétaire de leads, documents) ne se supprime pas ; seul un compte sans aucune trace se supprime"
      - cle: supprimer
        texte: "Supprimable : la suppression reste offerte, les traces perdent leur auteur"
    reponse: ouverte
    date: "2026-11-11"
    source: "audit de parcours PF10 (11/11/2026) : non posée (défaut recommandé : desactiver_seulement)"
    taches: [ASUP5, ASUP6, ASUP55]

  - id: D-ASUP-3
    question: "Supprimer définitivement un produit qui a des mouvements de stock : refuser, ou effacer son historique ?"
    options:
      - cle: refuser
        texte: "Refuser : un produit qui a des mouvements de stock reste archivé, son historique est gardé"
      - cle: effacer
        texte: "Garder : la suppression définitive efface aussi l'historique de stock du produit"
    reponse: ouverte
    date: "2026-11-11"
    source: "audit de parcours PF10 (11/11/2026) : non posée (défaut recommandé : refuser)"
    taches: [ASUP4]

  - id: D-ASUP-4
    question: "Combien de temps garder l'export d'une demande d'accès après l'effacement de la personne ?"
    options:
      - cle: supprimer_a_l_effacement
        texte: "L'export est supprimé quand la personne est effacée ; seule la trace « demande traitée le … » reste"
      - cle: garder
        texte: "L'export reste gardé comme preuve de la réponse"
    reponse: ouverte
    date: "2026-11-11"
    source: "audit de parcours PF10 (11/11/2026) : non posée (défaut recommandé : supprimer_a_l_effacement)"
    taches: [ASUP14]

  - id: D-ASUP-5
    question: "Quelle durée minimale pour le journal d'audit des pièces comptables ?"
    options:
      - cle: dix_ans
        texte: "10 ans pour le journal des factures, avoirs, paiements et mouvements de stock (durée comptable), quel que soit le réglage"
      - cle: reglage_libre
        texte: "Le réglage du Directeur s'applique à tout le journal (plancher actuel : 1 an)"
    reponse: ouverte
    date: "2026-11-11"
    source: "audit de parcours PF10 (11/11/2026) : non posée (défaut recommandé : dix_ans)"
    taches: [ASUP17, ASUP18]

  - id: D-ASUP-6
    question: "Archiver un lead signé : refuser comme la sortie d'étape, ou laisser archiver ?"
    options:
      - cle: refuser
        texte: "Refuser comme la sortie de « Signé » : 409 tant qu'une facture, un BC ou un chantier avancé existe"
      - cle: laisser_archiver
        texte: "Laisser archiver un lead signé (il sort alors des « signés »)"
    reponse: ouverte
    date: "2026-11-11"
    source: "audit de parcours PF10 (11/11/2026) : non posée (défaut recommandé : refuser)"
    taches: [ASUP48]

  - id: D-ACEL-1
    question: "L'écran « Envois programmés » laisse choisir l'heure d'envoi d'un rapport, mais la tâche ne passe qu'à 6 h : un rapport réglé à une autre heure ne part jamais. Faut-il respecter l'heure choisie, ou tout envoyer à 6 h et retirer le champ ?"
    options:
      - cle: heure_respectee
        texte: "Respecter l'heure choisie : la tâche passe chaque heure de 6 h à 23 h et envoie le rapport dès que son heure est atteinte, une fois par jour ; sans heure, il part à 6 h"
      - cle: tout_a_6h
        texte: "Tout part à 6 h : retirer le champ « Heure d'envoi » de l'écran"
    reponse: ouverte
    date: "2026-11-11"
    source: "audit de parcours PF11 (11/11/2026) : non posée (défaut recommandé : heure_respectee)"
    taches: [ACEL1, ACEL31]

  - id: D-ACEL-2
    question: "Des réglages allument une tâche planifiée mais n'ont aucun écran (relance automatique des commandes fournisseur en retard, délai de désactivation des comptes dormants, relevé de compte mensuel automatique d'un client, récurrences d'intervention) : personne ne peut les allumer. Faut-il les montrer dans l'ERP, ou les retirer avec leurs tâches ?"
    options:
      - cle: montrer_dans_parametres
        texte: "Les montrer : chaque réglage reçoit son interrupteur ou son champ à l'écran (paramètres, fiche client, fiche chantier)"
      - cle: retirer
        texte: "Les retirer, avec les tâches planifiées qui en dépendent"
    reponse: ouverte
    date: "2026-11-11"
    source: "audit de parcours PF11 (11/11/2026) : non posée (défaut recommandé : montrer_dans_parametres)"
    taches: [ACEL13, ACEL42, ACEL43, ACEL46, ACEL78]

  - id: D-ACEL-3
    question: "La page d'état publique et son taux de disponibilité sont calculés par le worker lui-même : si le worker s'arrête, la page reste « opérationnel » à 100 %. Faut-il afficher « données périmées » quand le dernier contrôle a plus de 15 minutes ?"
    options:
      - cle: donnees_perimees
        texte: "Oui : au-delà de 15 minutes sans contrôle, la page dit « inconnu, données périmées » et la disponibilité du jour n'est plus comptée à 100 %"
      - cle: garder
        texte: "Non : garder l'affichage actuel"
    reponse: ouverte
    date: "2026-11-11"
    source: "audit de parcours PF11 (11/11/2026) : non posée (défaut recommandé : donnees_perimees)"
    taches: [ACEL36]
