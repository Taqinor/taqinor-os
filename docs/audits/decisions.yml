  - id: D-CADV-3
    question: "Après-devis : garder les 10 touches / 14 j et la validité CAD57 (J+14, J+30 si financé, liée au dernier barreau par VALID1), ou passer à la v4 (J1 WA, J2 appel, J3 conditionnel, J7 appel, J10 contenu, J14 appel, J28 appel, J60, J90 ; validité 30 j depuis l'envoi, découplée de la cadence ; J28 = point de prolongation) ?"
    options:
      - cle: v4
        texte: "six touches sur 14 jours puis J28/J60/J90 ; validité 30 jours depuis l'envoi, découplée du dernier barreau ; prolongation à J28 tant que le devis est « envoyé » ; expiré = révision"
