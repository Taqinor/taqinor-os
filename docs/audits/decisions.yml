    source: "RÉPONDUE par le fondateur, séance de questions du 26/11/2026 (soir) ; tour 5 du L5, rejeu du paquet C sur la pile de revue (26/11/2026), constat T4-X5-010 « pas corrigé » ; composition et prix relèvent d'apps/ventes"
