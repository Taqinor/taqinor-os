  - id: D-CADV-11
    question: "Les 155 leads Meta mai-août jamais joints (K6 palier 2) : un WhatsApp 1:1 tapé à la main citant leur demande, avec ligne STOP et 20-25 par jour, SEULEMENT après le récépissé F211 et la lecture du disclaimer du formulaire Meta ; ou appels seuls ; ou rien ?"
    options:
      - cle: messages_conditionnes
        texte: "un message 1:1 chacun, après le récépissé F211 et la vérification du disclaimer ; appels seuls sinon ; arrêt du lot à 2 blocages sur 20 ou < 2 réponses sur 100"
      - cle: appels_seuls
        texte: "aucun message : appels sur la marge de capacité ou rien"
      - cle: rien
        texte: "aucune action sur ce palier"
    reponse: messages_conditionnes
    date: "2026-11-01"
    source: "Reda, 01/11/2026, quatre questions interactives groupées (AskUserQuestion) en session cadence-suivi-clients ; conception docs/crm/cadence-v4-design-2026-11-01.md §9"
