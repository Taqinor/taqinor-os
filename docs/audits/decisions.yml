  - id: D-CADV22-GABARIT-COURT
    question: "Un gabarit de moins de 5 appels ne peut jamais atteindre Froid avec la règle des 5 appels tracés : quelle règle ?"
    options:
      - cle: tous_les_appels_du_gabarit
        texte: "Tous les appels du gabarit tracés, plafonnés à 5"
    reponse: tous_les_appels_du_gabarit
    date: "2026-11-02"
    source: "Reda, question interactive, session all-plans"
    taches: [CADV22]

  - id: D-ACVI-1
    question: "Un Commercial terrain (portée « all », privé d'énumération des leads) crée aujourd'hui une visite sur n'importe quel id de lead et reçoit client_panel et devis (C-ACVI-101) : que doit faire la porte POST /visites/visites/ ?"
    options:
      - cle: assignation
        texte: "Le terrain ne crée une visite que sur un lead déjà assigné ou proposé par un responsable (lead hors portée = 404), comme la porte de la fiche"
      - cle: creation_sans_panel
        texte: "Création libre gardée, mais la réponse n'expose ni client_panel ni devis tant que la visite n'est pas assignée"
    reponse: assignation
