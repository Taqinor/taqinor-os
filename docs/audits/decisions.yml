    taches: [ADRG75]

  - id: D-ADRG-8
    question: "Les droits d'accès aux documents, les quotas et le tampon de la société (GED) : quel droit les écrit ?"
    options:
      - cle: ged_gouvernance
        texte: "Le droit « Gouvernance » de la GED"
      - cle: ged_gerer
        texte: "Le droit « Gérer » de la GED, comme aujourd'hui"
    reponse: ged_gouvernance
    date: "2026-11-11"
    source: "Reda, question interactive, 11/11/2026 (après-midi, session loop audit) ; avant : audit de parcours PF4 (10/11/2026) : non posée (défaut recommandé : ged_gouvernance) ; constat C-ADRG-035"
    taches: [ADRG80]

  - id: D-ADRG-9
    question: "Mettre un client en relance « manuelle » le sort de la relance automatique (la créance reste suivie à la main). Faut-il le droit « Encaisser » ?"
    options:
      - cle: palier_vente
        texte: "Non : c'est de l'organisation du suivi, le droit de vente suffit"
      - cle: exiger_encaisser
        texte: "Oui : le droit « Encaisser » est exigé"
    reponse: palier_vente
    date: "2026-11-11"
    source: "Reda, question interactive, 11/11/2026 (après-midi, session loop audit) ; avant : audit de parcours PF4 (10/11/2026) : non posée (défaut recommandé : palier_vente) ; constat C-ADRG-023"
    taches: []

  - id: D-ADRG-10
    question: "Les référentiels de logistique logés dans le module chantiers (casiers, kits, règles de réapprovisionnement, transporteurs, sous-traitants) : quel droit les écrit ?"
    options:
      - cle: stock_modifier
        texte: "Le droit « Modifier » du stock, comme leurs jumeaux du stock (au moins pour les sous-traitants, qui créent un fournisseur, et les kits)"
      - cle: gerer_chantier
        texte: "Le droit « Gérer » chantier, comme aujourd'hui"
    reponse: stock_modifier
    date: "2026-11-11"
    source: "Reda, question interactive, 11/11/2026 (après-midi, session loop audit) ; avant : audit de parcours PF4 (10/11/2026) : non posée (défaut recommandé : stock_modifier) ; constat C-ADRG-017"
    taches: [ADRG41]

  - id: D-ADRG-11
    question: "Clôturer un comptage d'entrepôt depuis les chantiers poste des ajustements de stock ; côté stock, ces ajustements sont réservés à l'administrateur. Lequel suivre ?"
    options:
      - cle: admin_comme_stock
        texte: "Aligner sur le stock : l'ajustement est réservé à l'administrateur (il change la valeur du stock)"
      - cle: mouvement_grille
        texte: "Garder le droit « Mouvement » du stock, comme le dit la grille"
    reponse: admin_comme_stock
    date: "2026-11-11"
    source: "Reda, question interactive, 11/11/2026 (après-midi, session loop audit) ; avant : audit de parcours PF4 (10/11/2026) : non posée (défaut recommandé : admin_comme_stock) ; constat C-ADRG-032"
    taches: [ADRG43]

  - id: D-ADRG-12
    question: "Restaurer un lead ou un calepinage depuis la corbeille commune : le droit « corbeille » de la grille suffit-il ?"
    options:
      - cle: droit_du_module
        texte: "Non : il faut aussi le droit d'écriture du module de l'élément (CRM pour un lead, « Gérer » calepinage pour un calepinage)"
      - cle: code_corbeille
        texte: "Oui : le droit « corbeille » de la grille suffit"
    reponse: droit_du_module
    date: "2026-11-11"
    source: "Reda, question interactive, 11/11/2026 (après-midi, session loop audit) ; avant : audit de parcours PF4 (10/11/2026) : non posée (défaut recommandé : droit_du_module) ; constat C-ADRG-058"
    taches: []

