        texte: "10° plein sud (systèmes lestés K2 Dome 6.10, Renusol FS Pro 10-S, ValkPro+ P10) — PVGIS 5.3 Casablanca 1 621 kWh/kWc contre 1 719 à 30° (−5,7 %)"
      - cle: b
        texte: "15° (Renusol ConSole+, K2 Dome 6.15) — −3,4 %"
      - cle: c
        texte: "garder 30° par défaut ; inclinaison modifiable dans le générateur (toit.pente_deg)"
    reponse: c
    date: "2026-10-27"
    source: "décision fondateur 27/10/2026 (Reda) : 30° par défaut, inclinaison modifiable dans le générateur — remplace la réponse a prise pour lui le même jour"
