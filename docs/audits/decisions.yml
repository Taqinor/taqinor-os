    taches: [ASTK262, ASTK263]

  - id: D-ACHT-VER4-1
    question: "Dans l'Agenda de la société, un technicien voit aussi les interventions, dates et noms de techniciens de chantiers hors de sa portée (sans téléphone ni GPS), alors que les listes de chantiers les lui cachent. Que doit montrer l'Agenda à un technicien ou un commercial ?"
    options:
      - cle: meme_portee_que_listes
        texte: "L'Agenda ne montre que les interventions et chantiers que la personne voit déjà dans les listes"
      - cle: societe_entiere
        texte: "Comportement actuel : tout rôle qui a l'Agenda voit le planning de toute la société (lecture de D-ASEC11)"
    reponse: meme_portee_que_listes
    date: "2026-11-04"
    source: "Reda, question interactive, contre-visite vérifie ACHT"
    taches: [ACHT136, ACHT137]

  - id: D-AMOT-VER4-1
    question: "Devis à deux options, option recommandée « Sans batterie », acompte fixé en dirhams : les cases de paiement du PDF suivent l'option « Sans » (44 % / 56 % de 22 800) tandis que le texte des conditions et la page publique suivent « Avec » (18 % de 55 200), l'option dont le total est affiché et facturé. Quelle option tout l'échéancier doit-il suivre ?"
    options:
      - cle: option_facturee
        texte: "Cases, texte et page publique suivent l'option dont le devis tire son total et sa facture (option_effective)"
      - cle: option_recommandee
        texte: "Cases, texte et page publique suivent le scénario puis l'option recommandée, même si le total affiché est l'autre option"
    reponse: option_facturee
    date: "2026-11-04"
    source: "Reda, question interactive, contre-visite vérifie AMOT"
    taches: [AMOT122]

  - id: D-AANA-VER4-1
    question: "L'import de factures et de devis (API seule, aucun écran aujourd'hui) propose les colonnes date d'émission, statut de paiement et date de création, mais ne les lit jamais : une facture 2024 « payée » migrée sort émise aujourd'hui, numérotée dans la série du mois, montant 0 (aucune relance). Que doit faire l'import de ces colonnes ?"
    options:
      - cle: retirer_colonnes
        texte: "Les retirer du mapping : l'aperçu les dit « non mappées » ; les factures migrées gardent le comportement d'aujourd'hui jusqu'à un vrai besoin de migration"
      - cle: lire_colonnes
        texte: "Les lire vraiment : date source appliquée, posted + paid = payée, et une facture migrée non brouillon garde son numéro source au lieu d'en prendre un dans la série vivante"
    reponse: retirer_colonnes
    date: "2026-11-04"
    source: "Reda, question interactive, contre-visite vérifie AANA"
    taches: [AANA82]

  - id: D-ASEC-VER4-1
    question: "Appliquer la grille des rôles côté serveur fait perdre aux rôles Commercial et Commercial responsable (3 comptes actifs en prod) les exports stock (produits, mouvements), leurs rôles ne portant pas « Exporter » stock. Que faire ?"
    options:
      - cle: appliquer_grille
        texte: "Le serveur suit la grille : ces rôles perdent l'export stock ; un admin coche « Exporter » dans Paramètres au besoin"
      - cle: ajouter_code
        texte: "Appliquer la grille mais ajouter d'abord stock_export aux rôles Commercial et Commercial responsable"
    reponse: appliquer_grille
    date: "2026-11-04"
    source: "Reda, question interactive, contre-visite vérifie ASEC"
    taches: [ASEC70]

  - id: D-ACVI-10
    question: "Un lead « ne plus contacter » peut déjà être un client signé. D-ACVI-7 refuse tout message devis / visite / cadence vers un lead opposé. Les messages vers cette personne en tant que CLIENT sous contrat (facture, relance de paiement, notifications chantier et SAV, accès portail) doivent-ils aussi être bloqués ?"
    options:
      - cle: contractuel_autorise
        texte: "Opposition = prospection (loi 09-08 art. 9) : factures, relances, messages chantier / SAV / portail vers un client sous contrat partent, tracés ; tout rendu ou envoi de devis reste refusé"
      - cle: tout_bloquer
        texte: "Tout message ou lien vers une personne dont le lead est opposé est refusé, contractuels compris"
    reponse: contractuel_autorise
    date: "2026-11-05"
    source: "Reda, question interactive, contre-visite vérifie ACVI"
    taches: [ACVI102, ACVI107]

  - id: D-ADVS-VER5-1
    question: "Un envoi « les deux gammes » (Essentielle + Premium) ne passe que le devis principal en envoyé ; la gamme sœur reste brouillon et la page client n'affiche jamais le comparatif ni « choisir cette gamme ». Que doit faire un envoi « les deux » ?"
    options:
      - cle: envoyer_les_deux
        texte: "L'envoi passe les DEUX devis en envoyé (par le seul chemin d'envoi), chacun avec un lien vivant ; le client voit et peut choisir l'une ou l'autre gamme"
      - cle: garder_tel_quel
        texte: "La sœur reste brouillon ; le commercial l'envoie à part quand il veut le comparatif"
    reponse: envoyer_les_deux
    date: "2026-11-05"
    source: "Reda, question interactive, contre-visite vérifie ADVS"
    taches: [ADVS49]
  - id: D-ACSV-1
    question: "La réception définitive peut être prononcée le lendemain de la provisoire, alors que la date prévue vaut provisoire + délai contractuel (ex. 12 mois). Quelle règle ?"
    options:
      - cle: plancher_et_derogation
        texte: "Refus (409) avant la date prévue, sauf dérogation d'un Directeur avec motif tracé (même schéma que CIQ621)"
      - cle: plancher_strict
        texte: "Toujours refusée avant la date prévue, sans dérogation"
      - cle: libre
        texte: "Possible à tout moment après la provisoire ; la date prévue n'est qu'un rappel"
    reponse: plancher_et_derogation
    date: "2026-11-06"
    source: "Reda, question interactive, audit de parcours PA5"
    taches: [ACSV35]
  - id: D-ACSV-2
    question: "Parc SAV : un Technicien qui voit un chantier voit 0 de ses équipements, car le parc est filtré par auteur (le responsable les a créés à la réception). Qui voit les équipements d'un chantier ?"
    options:
      - cle: qui_voit_le_chantier
        texte: "Quiconque voit le chantier voit tout son parc"
      - cle: par_auteur
        texte: "Garder la portée par auteur (comportement actuel)"
    reponse: qui_voit_le_chantier
    date: "2026-11-06"
    source: "Reda, question interactive, audit de parcours PA5"
    taches: [ACSV58]
  - id: D-ACSV-3
    question: "Sur un ticket SAV, un Technicien sans droit ventes crée devis et facture, et un Commercial responsable sans droit de mouvement de stock sort des pièces — `sav_gerer` suffit. Que doivent exiger ces gestes ?"
    options:
      - cle: droits_metier_exiges
        texte: "Devis / facture du ticket exigent les droits ventes, sorties de pièces le droit de mouvement de stock, en plus de sav_gerer"
      - cle: sav_gerer_suffit
        texte: "Garder : sav_gerer suffit pour devis, facture et pièces depuis un ticket"
    reponse: droits_metier_exiges
    date: "2026-11-06"
    source: "Reda, question interactive, audit de parcours PA5"
    taches: [ACSV62]
  - id: D-ACSV-4
    question: "La signature client du chantier (PV / bon de livraison) fonctionne dans tout état, même sur un chantier annulé ; le BL se signe « à la livraison du matériel », avant « Installé ». Que refuser ?"
    options:
      - cle: annule_seulement
        texte: "Refuser la signature sur un chantier annulé seulement ; la signature à la livraison (avant Installé) reste permise"
      - cle: avant_installe_aussi
        texte: "Refuser aussi avant « Installé »"
    reponse: annule_seulement
    date: "2026-11-07"
    source: "Reda, question interactive, audit de parcours PA5"
    taches: [ACSV34]
  - id: D-AAPV-1
    question: "RAS-TVA fournisseur : après imputation d'un avoir fournisseur, la retenue de 75 % porte-t-elle sur la TVA nette des avoirs ou sur la TVA totale de la facture ? (aujourd'hui : totale — 200 retenus au lieu de 100 sur une facture avec un avoir de 600 TTC)"
    options:
      - cle: tva_nette
        texte: "Base = TVA de la facture − TVA des avoirs imputés, comme D-AARG-2 côté client"
      - cle: tva_totale
        texte: "Base = TVA totale de la facture ; comportement actuel conforme"
    reponse: tva_nette
    date: "2026-11-06"
    source: "Reda, question interactive, audit de parcours PA6"
    taches: [AAPV4]
  - id: D-AAPV-2
    question: "Quand une imputation d'acompte ou d'avoir (et non un paiement) solde la facture fournisseur, où va la retenue RAS-TVA restante ?"
    options:
      - cle: imputation_porte_le_reste
        texte: "L'imputation qui solde porte la retenue restante : le total retenu vaut toujours 75 % de la TVA (D-ASTK-171)"
      - cle: paiement_final_exige
        texte: "Refuser une imputation qui solderait la facture tant qu'une retenue reste due ; le dernier règlement doit être un paiement"
    reponse: imputation_porte_le_reste
    date: "2026-11-06"
    source: "Reda, question interactive, audit de parcours PA6"
    taches: [AAPV5]
  - id: D-AAPV-3
    question: "Chantier posé en plusieurs interventions : valider la F11 de l'intervention 1 libère aujourd'hui TOUTES les réservations du chantier (l'onduleur réservé pour l'intervention 2 part sur un autre chantier). Que doit libérer une F11 ?"
    options:
      - cle: produits_de_la_f11
        texte: "Seulement les réservations des produits réconciliés par cette F11 ; le reste demeure réservé jusqu'à sa F11 ou la clôture / l'annulation du chantier"
      - cle: rien_avant_installe
        texte: "Aucune F11 ne libère ; le reliquat n'est libéré qu'à « Installé » ou à l'annulation"
      - cle: garder_actuel
        texte: "Comportement actuel voulu (une F11 par chantier)"
    reponse: produits_de_la_f11
    date: "2026-11-06"
    source: "Reda, question interactive, audit de parcours PA6 (précise D-ACHT-1 « reliquat libéré »)"
    taches: [AAPV31]
  - id: D-AAPV-4
    question: "La RAS-TVA dépend de la nature de la facture fournisseur (biens 0 %, services 75 %), mais aucune porte ne renseigne `type_achat` : toute facture compte comme « biens ». D'où vient la nature ?"
    options:
      - cle: defaut_fournisseur_et_ecran
        texte: "Pré-remplie depuis le type du fournisseur, modifiable à l'écran de facture ; OCR / UBL / factures nées d'un BCF prennent le défaut fournisseur"
      - cle: champ_ecran_obligatoire
        texte: "Choix obligatoire à l'écran ; les autres portes prennent le défaut fournisseur"
      - cle: depuis_les_produits
        texte: "Dérivée des produits / catégories des lignes"
    reponse: defaut_fournisseur_et_ecran
    date: "2026-11-06"
    source: "Reda, question interactive, audit de parcours PA6"
    taches: [AAPV6]
  - id: D-AAPV-5
    question: "Un BCF annulé dont l'annulation a rouvert la demande d'achat (AAPV71) et rendu l'engagement budgétaire (AAPV17) peut être « Réouvert » en brouillon : la DA re-génère alors un second BCF (40 000 commandés pour 20 000 demandés, budget réalisé 20 000). Que fait « Réouvrir » ?"
    options:
      - cle: refus
        texte: "Refus 409 nommé : le BCF né d'une DA rouverte ne se réouvre pas ; on régénère le BC depuis la demande (recommandé)"
      - cle: recommander
        texte: "Réouvrir re-commande la DA (si elle est encore approuvée sans BCF) et re-consomme l'engagement ; 409 si la DA a déjà un autre BCF"
    reponse: recommander
    date: "2026-11-08"
    source: "Reda, question interactive du 08/11/2026 (boucle work on the plan) — « Re-order the request » ; question posée par la vérifie AAPV du 08/11"
    taches: [AAPV85]
  - id: D-AAPV-6
    question: "D-AAPV-2 fait porter la RAS-TVA restante par l'imputation qui solde (AAPV5). Quand c'est un acompte DÉJÀ versé brut (paiement 840 net puis acompte 360), 60 de RAS sont déclarés sans avoir été retenus : 1 260 décaissés pour 1 200 TTC. Que faire ?"
    options:
      - cle: garder
        texte: "Garder : la RAS est due à l'État, la créance de 60 sur le fournisseur se règle hors ERP"
      - cle: creance_fournisseur
        texte: "L'ERP constate une créance de 60 sur le fournisseur (avoir à réclamer) à l'imputation"
      - cle: retenir_avant
        texte: "Retenir la RAS de l'acompte dès son versement (acompte versé net), plus jamais à l'imputation"
    reponse: creance_fournisseur
    date: "2026-11-08"
    source: "Reda, question interactive du 08/11/2026 (boucle work on the plan) — « Supplier receivable » ; question posée par la vérifie AAPV du 08/11"
    taches: [AAPV86]
  - id: D-AMON-1
    question: "Un abonnement de supervision (mensuel ou annuel, SAV → Supervision → Abonnements) n'est jamais facturé : sa « prochaine échéance » est posée une fois et reste dans le passé. L'ERP doit-il le facturer ?"
    options:
      - cle: vendu_une_fois
        texte: "Comme les contrats de maintenance (D-ASAV-3) : vendu une fois avec le devis / facturé à la main ; « prochaine échéance » et « dernière facturation » retirées de l'écran et de l'API"
      - cle: facturer_a_chaque_echeance
        texte: "Facture brouillon créée à chaque échéance, échéance avancée d'une période (idempotent)"
    reponse: vendu_une_fois
    date: "2026-11-07"
    source: "Reda, question interactive, audit de parcours PA7"
    taches: [AMON2]
  - id: D-AMON-2
    question: "La pénalité de disponibilité de l'installation client (calculée sur les relevés) est affichée à l'écran et dans le rapport O&M mais jamais stockée, décidée ni créditée. Que doit-elle devenir ?"
    options:
      - cle: affichage_interne
        texte: "Indicateur interne seulement : jamais un montant dû ni imprimé dans le rapport client ; fenêtre juste et rien sans relevé"
      - cle: stockee_decidee_avoir
        texte: "Stockée par période, décision humaine tracée (émise / refusée), avoir via la facturation si émise"
    reponse: affichage_interne
    date: "2026-11-07"
    source: "Reda, question interactive, audit de parcours PA7"
    taches: [AMON21]
  - id: D-AMON-3
    question: "Le productible garanti de la garantie de production est proraté À PLAT sur l'année (jours / jours de l'année) alors que la production attendue suit le profil mensuel : un système sain au profil porte une pénalité de janvier à avril et un « recours fabricant » jusqu'à mi-mai. Quelle règle de prorata en cours d'année ?"
    options:
      - cle: profil_mensuel
        texte: "Garanti proraté au profil mensuel déjà servi à l'attendu (aucune pénalité pour un système produisant au profil)"
      - cle: prorata_a_plat
        texte: "Garder le prorata temporis à plat annoncé par la mention légale (aucun code ; la pénalité d'hiver reste provisoire jusqu'à la clôture de l'année)"
    reponse: profil_mensuel
    date: "2026-11-10"
    source: "Reda, question interactive, 10/11/2026 (soir, session loop audit) ; avant : vérifie AMON du 10/11/2026 (critique de complétude) : non posée, Reda absent (défaut recommandé : profil_mensuel) ; réglage garantie_production_autorisee éteint par défaut, 0 garantie en prod au 07/11"
    taches: [AMON107]
  - id: D-ACON-1
    question: "« Générer le devis » depuis un calepinage (et la route from-layout) sur un lead commercial / industriel construit un devis RÉSIDENTIEL avec la production et les économies de l'outil toiture (interdit en C&I par CIQ117). Quelle règle ?"
    options:
      - cle: refus_nomme
        texte: "409 nommé sur les deux portes (agricole compris sur from-layout), rien créé"
      - cle: devis_au_marche_du_lead
        texte: "Devis construit au marché du lead : aucune production / économie prise du layout, étude par le moteur C&I serveur"
    reponse: devis_au_marche_du_lead
    date: "2026-11-08"
    source: "Reda, question interactive, audit de parcours PA2"
    taches: [ACON40]
  - id: D-ACON-2
    question: "Un lead a un calepinage ouvert C1 lié au devis actif A ; un second devis actif B (pas une V2) demande une conception : aujourd'hui un C2 est créé et « Concevoir » l'ouvre en silence. Quelle règle ?"
    options:
      - cle: une_par_devis_actif
        texte: "Un calepinage ouvert par devis actif (+ un sans devis par lead) ; « Concevoir » demande lequel ouvrir"
      - cle: refus_409
        texte: "Garder un calepinage ouvert par lead : 409 nommant C1"
      - cle: variante_de_c1
        texte: "Le devis B devient une variante de C1 (lien devis ↔ variante, nouvelle conception)"
    reponse: variante_de_c1
    date: "2026-11-08"
    source: "Reda, question interactive, audit de parcours PA2"
    taches: [ACON6]
  - id: D-ACON-3
    question: "L'approbation d'une conception ne couvre que le layout dessiné : changer l'onduleur, une longueur de chaîne forcée ou la fixation après accord garde l'accord valide et les pièces d'exécution ouvertes. L'empreinte d'approbation doit-elle les couvrir ?"
    options:
      - cle: tout_perime
        texte: "Oui : tout changement électrique ou de fixation périme l'accord et referme les pièces d'exécution"
      - cle: conception_seule
        texte: "Non : l'accord ne porte que sur la conception imprimée (D-ACAL-4/21), limite écrite dans l'écran Approbation"
    reponse: conception_seule
    date: "2026-11-08"
    source: "Reda, question interactive, audit de parcours PA2"
    taches: [ACON24]
  - id: D-ACON-4
    question: "La page publique de proposition ne dessine que 600 panneaux par zone (et la visionneuse web partage un seul budget de 600 entre toutes les zones), alors que le compte affiché reste complet. Que faire ?"
    options:
      - cle: tout_dessiner_2000
        texte: "Dessiner tous les panneaux jusqu'au plafond dur de 2 000 (décision du 23/10), par zone ; au-delà, mention « vue simplifiée »"
      - cle: garder_600_mention
        texte: "Garder 600 mais dire sur la page que le dessin est simplifié quand des panneaux sont omis"
    reponse: tout_dessiner_2000
    date: "2026-11-08"
    source: "Reda, question interactive, audit de parcours PA2"
    taches: [ACON50]
  - id: D-ASOC-1
    question: "Un devis envoyé sans échéancier propre lit l'échéancier société EN DIRECT jusqu'à l'acceptation : passer le réglage de 30 % à 40 % d'acompte après l'envoi fait figer 40 % à l'acceptation (acompte 8 920 au lieu de 6 690, alors que le PDF client disait 30 %). Quelle règle ?"
    options:
      - cle: figer_a_l_envoi
        texte: "Figer l'échéancier (et le % des CGV) à l'envoi du devis, comme les autres champs d'un document engagé ; l'acceptation reprend le figé"
      - cle: refuser_si_change
        texte: "Garder le gel à l'acceptation, mais refuser l'acceptation (409) si l'échéancier société a changé depuis l'envoi"
    reponse: figer_a_l_envoi
    date: "2026-11-08"
    source: "Reda, question interactive, audit de parcours PF2 (prolonge D-ECH-FIGE)"
    taches: [ASOC95]
  - id: D-ASOC-2
    question: "Le module « Chantiers » désinstallé, accepter un devis crée quand même un chantier et des réservations de stock (chantier invisible ensuite). Quelle règle ?"
    options:
      - cle: rien_creer
        texte: "Les abonnés d'un module désinstallé ne font rien : ni chantier, ni réservation, ni contrat SAV"
      - cle: non_desinstallable
        texte: "Un module dont dépend un abonné obligatoire ne peut pas être désinstallé tant que le module dépendant est actif"
    reponse: rien_creer
    date: "2026-11-08"
    source: "Reda, question interactive, audit de parcours PF2"
    taches: [ASOC2]
  - id: D-ASOC-3
    question: "Après un effacement loi 09-08, l'historique des modifications du lead (LeadActivity) garde en clair les anciennes et nouvelles valeurs d'identité. Quelle règle ?"
    options:
      - cle: caviarder
        texte: "Garder chaque ligne d'historique (qui, quand, quel champ) mais remplacer les valeurs d'identité par « Anonymisé » à l'effacement"
      - cle: garder_tel_quel
        texte: "Historique conservé tel quel (doctrine « historique conservé »)"
    reponse: caviarder
    date: "2026-11-08"
    source: "Reda, question interactive, audit de parcours PF2"
    taches: [ASOC62]
  - id: D-ASOC-4
    question: "La rétention de 3 ans des prospects exclut tout lead qui a un client — or le client est créé au premier devis : tout prospect ayant reçu un devis est gardé à vie, et les clients n'ont aucune rétention. Quelle règle ?"
    options:
      - cle: client_sans_facture_est_prospect
        texte: "Un client sans aucune facture est un prospect pour la rétention : purgé après 3 ans d'inactivité ; les clients facturés gardent la rétention comptable légale"
      - cle: garder_actuel
        texte: "Garder la règle actuelle"
    reponse: client_sans_facture_est_prospect
    date: "2026-11-08"
    source: "Reda, question interactive, audit de parcours PF2"
    taches: [ASOC74]
  - id: D-ASOC-5
    question: "Les métriques gouvernées de CA ignorent les avoirs alors que le tableau de bord les déduit (11 000 contre 8 000 sur les mêmes factures). Qu'est-ce que le « CA facturé » ?"
    options:
      - cle: net_d_avoirs
        texte: "CA = factures moins avoirs partout (métriques, tableau de bord, rapports) ; une facture soldée par avoir total compte 0"
      - cle: brut
        texte: "CA = facturé brut ; avoirs montrés à part ; le tableau de bord s'aligne sur le brut"
    reponse: net_d_avoirs
    date: "2026-11-08"
    source: "Reda, question interactive, audit de parcours PF2"
    taches: [ASOC73]
  - id: D-ASOC-6
    question: "Un effacement 09-08 qui échoue sur une source est marqué « traitée » (final), erreur enfouie, sans relance possible. Quelle règle ?"
    options:
      - cle: statut_partielle
        texte: "Statut « partielle » : sources en échec affichées, relance possible jusqu'à complétude"
      - cle: tout_ou_rien
        texte: "Effacement atomique : tout échec annule tout, la demande reste à traiter"
    reponse: statut_partielle
    date: "2026-11-08"
    source: "Reda, question interactive, audit de parcours PF2"
    taches: [ASOC65]
  - id: D-ASOC-7
    question: "Le réglage « Parrainage activé » n'a aucun lecteur : création automatique et notifications de parrainage tournent même éteint. Que faire ?"
    options:
      - cle: cabler_le_reglage
        texte: "Éteint : aucun parrainage créé automatiquement, aucune notification, écrans et liens de parrainage masqués"
      - cle: retirer_le_reglage
        texte: "Retirer l'interrupteur : parrainage toujours actif"
    reponse: cabler_le_reglage
    date: "2026-11-08"
    source: "Reda, question interactive, audit de parcours PF2"
    taches: [ASOC70]
  - id: D-ASOC-8
    question: "Le fuseau horaire de la société est « affichage seulement » : fenêtres de cadence, heures calmes et récapitulatifs suivent toujours Casablanca, même pour une société à Dakar. Quelle règle ?"
    options:
      - cle: fuseau_de_la_societe
        texte: "Plannings, fenêtres et « aujourd'hui » suivent le fuseau de la société"
      - cle: casablanca_partout
        texte: "Casablanca partout ; réglage de fuseau limité au Maroc tant que les autres pays ne sont pas pris en charge"
    reponse: fuseau_de_la_societe
    date: "2026-11-08"
    source: "Reda, question interactive, audit de parcours PF2"
    taches: [ASOC84]
  - id: D-APFS-1
    question: "Les rôles porteurs de `users_voir` (Admin RH, Admin Ventes, Technicien responsable, Commercial responsable) comptent comme palier « responsable » : clés d'API / webhooks, désactivation de module, matrices et workflows, décision des demandes d'approbation, demandes loi 09-08 (accès / effacement), restauration de la corbeille. Quelle garde ?"
    options:
      - cle: code_dedie_ou_domaine
        texte: "Un code dédié par geste pour clés d'API, modules et demandes 09-08 ; palier + code du domaine pour matrices, workflows, marque, approbations ; plan de quotas d'API réservé à l'administrateur"
      - cle: administrateur_seul
        texte: "Tous ces gestes réservés à l'administrateur (Administrateur / Directeur)"
    reponse: code_dedie_ou_domaine
    date: "2026-11-08"
    source: "Reda, question interactive, audit de parcours PF1"
    taches: [APFS40]
  - id: D-APFS-2
    question: "Un superutilisateur rattaché à la société A peut renommer ou suspendre la société B (opérateur plateforme partout), alors qu'ailleurs il est borné à A. Quelle règle ?"
    options:
      - cle: borne_a_sa_societe
        texte: "Un superutilisateur rattaché à une société n'est qu'un utilisateur ERP de cette société ; pouvoirs plateforme seulement sans société (ou rôle support)"
      - cle: operateur_partout
        texte: "Tout superutilisateur est opérateur plateforme pour toutes les sociétés"
    reponse: borne_a_sa_societe
    date: "2026-11-08"
    source: "Reda, question interactive, audit de parcours PF1"
    taches: [APFS61]
  - id: D-APFS-3
    question: "Un utilisateur membre de plusieurs sociétés garde le rôle de sa société d'origine après bascule (un Administrateur de A est administrateur dans B sans que B le voie). Quelle règle ?"
    options:
      - cle: role_par_societe
        texte: "Chaque appartenance porte son propre rôle fixé par la société ; B voit et gère ses membres ; aucun rôle dans B = refus"
      - cle: garder_role_origine
        texte: "Garder le rôle d'origine dans toute société accessible"
    reponse: role_par_societe
    date: "2026-11-08"
    source: "Reda, question interactive, audit de parcours PF1"
    taches: [APFS66]
  - id: D-APFS-4
    question: "160 vues de liste / détail métier (chantiers, fournisseurs, lignes de devis, remises, contrats SAV…) sont lisibles par tout rôle interne, quels que soient ses droits de module. Exiger le droit de lecture du module couperait aussi le Commercial des chantiers et le Technicien des ventes / du CRM. Quelle règle ?"
    options:
      - cle: droit_du_module_et_octrois
        texte: "La lecture exige un droit du module ; les lectures inter-modules réellement nécessaires (Commercial → chantiers de ses ventes, Technicien → devis de son chantier) sont octroyées explicitement dans le registre des rôles"
      - cle: droit_du_module_strict
        texte: "La lecture exige un droit du module, rien de plus"
      - cle: ouvert_champs_masques
        texte: "Lecture ouverte aux rôles internes, champs sensibles (PII, RIB, prix) masqués sans le droit"
    reponse: droit_du_module_et_octrois
    date: "2026-11-08"
    source: "Reda, question interactive, audit de parcours PF1"
    taches: [APFS28]
  - id: D-ADCG-1
    question: "Les sauvegardes de la production (base, et bientôt fichiers) restent sur le même serveur que la base : la copie distante est éteinte faute de réglage. Où envoyer la copie hors du serveur ?"
    options:
      - cle: espace_objet_externe
        texte: "Un espace de stockage objet chez un autre fournisseur que l'hébergeur (quatre variables BACKUP_OFFSITE_* à poser, copie chiffrée)"
      - cle: stockage_hebergeur
        texte: "Un espace de stockage du même hébergeur, dans un autre centre de données"
      - cle: option_backups_hebergeur_seule
        texte: "S'en remettre à l'option Backups de l'hébergeur (image entière du serveur), sans copie applicative"
    reponse: espace_objet_externe
    date: "2026-11-10"
    source: "Reda, question interactive, 10/11/2026 (soir, session loop audit) ; avant : audit de parcours PF3 (10/11/2026) : non posée, Reda absent (défaut recommandé : espace_objet_externe) ; prod lue le 10/11 : copie distante off, 33 dumps et 271 Mo de fichiers sur le même disque ; option Backups de l'hébergeur non vérifiée"
    taches: [ADCG32]
  - id: D-ADCG-2
    question: "40 PR Dependabot sont ouvertes, dont des correctifs de sécurité verts à un seul paquet que personne ne fusionne. Les fusionner automatiquement quand la CI est verte ?"
    options:
      - cle: fusion_auto_securite_mono_paquet
        texte: "Oui : fusion automatique des PR de sécurité à un seul paquet, mineures et correctifs seulement, CI verte exigée"
      - cle: manuel
        texte: "Non : toute montée de dépendance reste une fusion à la main"
    reponse: fusion_auto_securite_mono_paquet
    date: "2026-11-10"
    source: "Reda, question interactive, 10/11/2026 (soir, session loop audit) ; avant : audit de parcours PF3 (10/11/2026) : non posée, Reda absent (défaut recommandé : fusion_auto_securite_mono_paquet) ; 217 alertes ouvertes dont 11 critiques le 10/11"
    taches: [ADCG67]
  - id: D-ADCG-3
    question: "Un devis à micro-onduleurs n'est rangé dans aucune famille d'onduleur par le moteur : son PDF à options est refusé. Faut-il classer un micro-onduleur comme onduleur réseau (injection) ?"
    options:
      - cle: reseau
        texte: "Oui : un micro-onduleur est un onduleur réseau, le devis se rend comme une installation sans batterie"
      - cle: non_classe
        texte: "Non : il reste hors famille ; un devis à micro-onduleurs ne propose pas le PDF à options"
    reponse: reseau
    date: "2026-11-10"
    source: "Reda, question interactive, 10/11/2026 (soir, session loop audit) ; avant : audit de parcours PF3 (10/11/2026) : non posée, Reda absent (défaut recommandé : reseau) ; vu sur un devis de démonstration ; 4 devis réels sans onduleur reconnu non identifiés"
    taches: [ADCG45]

  - id: D-ASEC-VER6-1
    question: "Annuler une facture à référence légale (émise, ou payée dont on garde l'avance, ou brouillon déjà remis) émet un avoir de contre-passation numéroté. Aujourd'hui ce geste ne demande pas le droit d'encaisser : les rôles Admin Ventes et Responsable y arrivent. Tout geste qui émet un tel avoir doit-il exiger le droit d'encaisser ?"
    options:
      - cle: exiger_encaisser
        texte: "Oui : émettre un avoir de contre-passation est un geste sur une créance, il exige le droit d'encaisser (annulation d'une facture, création de facture depuis un bon de commande, prix négocié qui retire un brouillon remis)"
      - cle: palier_seul
        texte: "Non : l'annulation sans mouvement d'argent reste ouverte au palier responsable, comme la tâche AARG7 l'avait laissée"
    reponse: exiger_encaisser
    date: "2026-11-10"
    source: "Reda, décision fondateur du 10/11/2026 (question interactive, run loop work on all plans 99392c) : exiger_encaisser, dans le prolongement de D-ASEC-VER-1 ; posée par la vérifie ASEC du 10/11/2026"
    taches: [ASEC90, ASEC93]

  - id: D-ADRG-1
    question: "Le Responsable et l'Admin Ventes peuvent baisser le prix d'une vente déjà signée (« prix négocié ») sans le droit « Encaisser » ; aucune facture existante n'est touchée. Faut-il exiger ce droit ?"
    options:
      - cle: palier_vente
        texte: "Non : le geste reste au droit de vente ; la profondeur de la remise est déjà bornée par le seuil d'approbation"
      - cle: exiger_encaisser
        texte: "Oui : toute baisse du prix d'une vente signée exige le droit « Encaisser »"
    reponse: palier_vente
    date: "2026-11-11"
    source: "Reda, question interactive, 11/11/2026 (après-midi, session loop audit) ; avant : audit de parcours PF4 (10/11/2026) : non posée (défaut recommandé : palier_vente) ; hors tableau des constats"
    taches: []

  - id: D-ADRG-2
    question: "Supprimer un élément rattaché à un lead (fiche du site, point de contact, rendez-vous) : est-ce « modifier le lead » ou « supprimer » ?"
    options:
      - cle: crm_modifier
        texte: "C'est modifier le lead : le droit « Modifier » du CRM suffit, comme pour retirer une ligne d'un devis"
      - cle: crm_supprimer
        texte: "C'est supprimer : la case « Supprimer » du CRM est exigée"
    reponse: crm_modifier
    date: "2026-11-11"
    source: "Reda, question interactive, 11/11/2026 (après-midi, session loop audit) ; avant : audit de parcours PF4 (10/11/2026) : non posée (défaut recommandé : crm_modifier) ; constat C-ADRG-013 (3 emplacements)"
    taches: []

  - id: D-ADRG-3
    question: "La recette de mise en service (IEC 62446, courbes I-V, attestations) s'écrit aujourd'hui avec les droits de vente : le Commercial peut la saisir, le Technicien est refusé. Faut-il la ranger dans les droits des chantiers ?"
    options:
      - cle: chantiers
        texte: "Oui : elle exige « Gérer » chantier ; le Technicien la saisit, le Commercial non"
      - cle: ventes
        texte: "Non : elle reste sous les droits de vente"
    reponse: chantiers
    date: "2026-11-11"
    source: "Reda, question interactive, 11/11/2026 (après-midi, session loop audit) ; avant : audit de parcours PF4 (10/11/2026) : non posée (défaut recommandé : chantiers) ; constats C-ADRG-040 et C-ADRG-013"
    taches: [ADRG16]

  - id: D-ADRG-4
    question: "Le bouton « Exporter » en CSV des tableaux (une copie de ce que l'écran affiche) doit-il disparaître quand la case « Exporter » du module est décochée ?"
    options:
      - cle: suit_la_case
        texte: "Oui : décocher « Exporter » cache aussi ce bouton dans les tableaux du module"
      - cle: copie_ecran
        texte: "Non : c'est une copie de l'écran, le bouton reste"
    reponse: suit_la_case
