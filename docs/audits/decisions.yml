        texte: "chaînes de longueur égale par entrée MPPT, entrées libres entre elles ; tout panneau vendu est raccordé ; chaînes par entrée = fiche, sinon ⌊I max ÷ Imp⌋ (jamais d'écrêtage permanent conçu) ; aucune découpe ⇒ combinaison suivante, sinon bloquant nommé"
      - cle: b
        texte: "garder la conception mono-pan du calepinage (chaînes égales sur tout le champ, modules en réserve)"
    reponse: a
    date: "2026-10-27"
    source: "décision prise pour le fondateur (à revoir) — règle fondateur du 27/10/2026 « ne jamais attendre le fondateur » ; session L3 CMP"
    taches: [CMP1, CMP2]
  - id: D-CMP-2
    question: "Câble DC C&I : que vaut la longueur déclarée (aujourd'hui défaut = 2 × chaînes × 30 m, déclarée = chaînes × L) ?"
    options:
      - cle: a
        texte: "distance ALLER SIMPLE champ → onduleur ; câble = 2 (polarités) × chaînes × distance, déclarée ou par défaut"
      - cle: b
        texte: "longueur déclarée = longueur totale par chaîne (aller-retour compris), câble = chaînes × L"
    reponse: a
    date: "2026-10-27"
    source: "décision prise pour le fondateur (à revoir) — alignée sur la règle fondateur du 26/10/2026 (2 × chaînes × 30 m) ; session L3 CMP"
    taches: [CMP4]
  - id: D-CMP-3
    question: "Option « avec batterie » C&I : combien d'onduleurs hybrides basse tension en parallèle au plus (constat R1 CMP : 19 Deye à 500 kWc) ?"
    options:
      - cle: a
        texte: "au plus 10 (datasheet Deye SUN-14-20K-SG05LP3-EU-SM2 et SUN-3-12K-SG05LP3-EU-SM2 : « Max. 10 pcs parallel »), d'un seul modèle (manuel SUN-3-12K-SG05LP3-EU-SM2 p. 51, « same model ») ; au-delà, le champ « avec » est borné et une alerte interne le dit"
      - cle: b
        texte: "aucune borne"
    reponse: a
    date: "2026-10-27"
    source: "décision prise pour le fondateur (à revoir) — datasheets Deye ; session L3 CMP"
    taches: [CMP3, CMP11]
  - id: D-CMP-4
    question: "Production d'un toit plat (lesté ou fixé) sans pente déclarée : quelle inclinaison (aujourd'hui 30° de la table PVGIS) ?"
