  - id: D-ACAL-97
    question: "Combien de moteurs calculent une installation dans l'ERP, et où vivent leurs résultats ?"
    options:
      - cle: un_moteur_stocke_sur_le_lead
        texte: "UN seul moteur (celui du CRM / du devis), appelé de partout (fiche du lead, devis, calepinage) ; ses résultats sont rangés UNE fois sur le lead et relus partout ; personne ne recalcule, et surtout pas avec un autre code ; sans devis, le calepinage lance ce même moteur ; quand une entrée change, le moteur est relancé une fois, les anciennes valeurs vont à l'historique et l'écran dit pourquoi ; un devis envoyé n'est jamais touché (révision proposée)"
      - cle: lire_le_devis_lie
        texte: "Le calepinage lit les valeurs du devis lié quand il en a un, et garde ses propres calculs sinon (ce que la vague C du 23/11 a construit)"
    reponse: un_moteur_stocke_sur_le_lead
    date: "2026-11-23"
    source: "réponse du fondateur le 23/11/2026, mot pour mot : « i dont want calpinage to always take it design from sent quote, and what if we dont have a sent quote, i want to have one engine used everywhere and if the engine was used somewhere we just keep its values and use them everywhere no need to recompute and specially using some other engine, so only one engine should be in my ERP » ; puis, par questions interactives : résultats rangés « On the lead », « Recalculate on an input change, and say it », « Design it now, build it in a fresh session » ; conception : docs/audits/l5-calepinage/controles/C4-un-seul-moteur.md ; complète D-ACAL-86 (un seul chiffre) et D-ACAL-96 (devis envoyé jamais modifié) ; quatre précisions du fondateur le même jour (§9 de la conception) : sans toit tracé, MÊME simulation sur un toit supposé (liste des écarts montrée avant la bascule) ; un brouillon de devis suit la conception sauf s'il a été retouché à la main (« Mettre à jour » proposé sinon) ; sans lead, le résultat est porté par le calepinage (les dossiers d'appel d'offres gardent leurs règles hors moteur) ; pendant le dessin, l'atelier ne montre que panneaux et kWc, la production arrive du moteur à l'enregistrement"
    taches: [ADEV129, ADEV130, ADEV131, ADEV132, ADEV133, ADEV134, ADEV135, ADEV136, ADEV137, ADEV138, ADEV139, ADEV140, ADEV141, ADEV142, ADEV143, ADEV144, ADEV145, ADEV146, ADEV147, ADEV148, ADEV149, ADEV150, ADEV151, ADEV152, ADEV153, ADEV154, ADEV155, ALEA68, ALEA69, ALEA70, ALEA71, ACAL2010, ACAL2011, ACAL2012, ACAL2013, ACAL2014, ACAL2015, ACAL2016, ACAL2017, ACAL2018, ACAL2019, ACAL2020, ACAL2022, ACAL2023, ACAL2024, ACAL2025, ACAL2026, ACAL2027, ACAL2028, ACAL2029, AGEN11, AGEN12, ADEP108, ACAL2021, AGEN13]

