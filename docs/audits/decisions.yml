    source: "décision prise par l'orchestrateur en l'absence du fondateur, CONFIRMÉE PAR LE FONDATEUR le 26/11/2026 (« all the 18 choices are good ») ; relecture finale du lot 7 : deux lanes justes chacune, deux résultats différents pour la même saisie selon l'âge du document (ACAL1962)"
