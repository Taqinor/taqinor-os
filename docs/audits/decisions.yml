    question: "Réveils : garder J30/J60 pour tout lead parqué, ou les conditionner à l'historique (aucun barreau individuel pour un lead jamais joint ni chiffré ; appel humain J30 + message J60 pour un lead joint ou chiffré ; pilote d'appel sur les jamais-joints à facture ≥ 2 000 MAD) ?"
