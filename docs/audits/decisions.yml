  - id: D-AERR-2
    question: "Changer l'étape d'un lead au clavier (touches 1 à 4 de la fiche) ou par la palette ⌘K fait avancer le lead sans confirmation ni retour, alors que le kanban offre un toast « Annuler ». Faut-il une confirmation, ou un toast « Annuler » comme sur le kanban ?"
