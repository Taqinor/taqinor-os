# docs/audits/decisions.yml — décisions fondateur lisibles par machine (METHODE v3 §B.6, §C.4)
#
# Règle : une tâche ne dit JAMAIS « Si (a)/(b) » ; une tâche par option ; une tâche GATED nomme son D-id ;
# quand la réponse arrive, les tâches dépendantes sont réécrites dans la même PR (`python scripts/decisions.py appliquer`)
# et `python scripts/check_decisions.py` (CI, AMET94) refuse tout texte conditionnel sur une décision répondue.
# Écrit UNIQUEMENT à partir d'un lot AskUserQuestion ; jamais une réponse inventée.
#
# Champs : id · question (une ligne) · options (liste de blocs `- cle: x` + `texte:` : le mini-parseur de plan_lanes ne lit pas
# les mappings en flux) · reponse (cle | ouverte) · date · source · taches [ids des tâches qui en dépendent].
# Les options listent les branches CONNUES ; quand le fichier mémoire ne donne que la branche retenue, une seule option figure.
# Un tag `(@decision: D-x=a)` dans une tâche doit viser l'option REPONDUE (check_decisions.py).
# Inventaire historique (AMET94) : une entrée par décision des 10 fichiers docs/claude-memory/*decisions*.md ; id minté
# préfixe+numéro quand le fichier n'en donne pas (D-ASEC-4, D-QJR5-659...) ; `ouverte` quand le fichier ne donne pas la réponse.

