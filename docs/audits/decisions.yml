  - id: D-ASUP-7
    question: "Le résumé d'attention (GET notifications/attention-summary/) sert « en retard », « aujourd'hui » et « actions dues » que AUCUN écran ne lit (seul le nombre d'approbations est lu, par le badge et la cloche) ; la tuile du tableau de bord qu'ASUP60 corrigeait n'existe pas. Que faire de ces compteurs ?"
