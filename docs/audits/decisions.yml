    question: "Que dire de l'aide FDA sur le devis ?"
    options:
      - cle: a
        texte: "On imprime la regle (conditions, plafonds, accord avant travaux, versement apres), jamais un montant propre au client ; « jusqu'a 30 % » retire partout."
    reponse: a
    date: "2026-10-02"
    source: "docs/claude-memory/agricole-decisions-fondateur.md (D-AGR-6)"
    taches: []

  - id: D-AGR-7
    question: "Pompe neuve ou existante ?"
    options:
