# docs/audits/decisions.yml — décisions fondateur lisibles par machine (METHODE v3 §B.6, §C.4)
#
# Règle : une tâche ne dit JAMAIS « Si (a)/(b) » ; une tâche par option ; une tâche GATED nomme son D-id ;
# quand la réponse arrive, les tâches dépendantes sont réécrites dans la même PR (`scripts/decisions.py appliquer`,
# AMET, à construire) et `scripts/check_decisions.py` (AMET) refuse tout texte conditionnel sur une décision répondue.
# Écrit UNIQUEMENT à partir d'un lot AskUserQuestion ; jamais une réponse inventée.
#
# Champs : id · question (une ligne) · options [{cle, texte}] · reponse (cle | ouverte) · date · source · taches [ids].
# Les décisions antérieures au 09/10/2026 vivent dans docs/claude-memory/*decisions*.md (source de vérité historique) ;
# elles sont référencées ici par pointeur, pas recopiées — l'inventaire complet est la tâche AMET « decisions ».

version: 1
date_maj: "2026-10-09"

decisions:

  - id: D-ECH-FIGE
    question: "Les conditions de paiement sont lues en direct depuis Paramètres pour un devis signé sans échéancier propre : que faire ?"
    options:
      - {cle: a, texte: "figer l'échéancier sur le devis à l'acceptation ; devis déjà signés tamponnés avec les conditions du jour après dry-run"}
      - {cle: b, texte: "figer à la signature, laisser les anciens signés en lecture directe"}
      - {cle: c, texte: "garder la lecture directe comme choix produit"}
    reponse: a
    date: "2026-10-09"
    source: "session 2026-10-09 (AskUserQuestion) ; constat C-AMET-003, sonde R3_V1"
