    options:
      - cle: valeurs_fondateur
        texte: "Le fondateur donne les quatre valeurs, étiquetées « supposé » à l'écran et au rapport"
      - cle: valeurs_publiees
        texte: "Reprendre des valeurs publiées par un outil de référence, citées avec leur source, étiquetées « supposé »"
      - cle: rester_incomplet
        texte: "Aucune valeur : le résultat reste « incomplet » tant que la société ne les a pas saisies"
      - cle: valeurs_recherchees
        texte: "Valeurs publiées recherchées par Claude à la demande du fondateur, proposées puis acceptées"
