    date: "2026-11-19"
    source: "Reda, question interactive, 19/11/2026 (« why would be replace the battery after 10 years ? the 16kwh have 8000 cycle so it is roughly 20 to 25 years ! ») ; construit au niveau de règles 13 (nouveaux rendus seulement) ; fichier docs/claude-memory/batterie-duree-cycles.md"
    taches: []

