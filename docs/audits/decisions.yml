  - id: D-CADV-8
    question: "Liste Odoo (519 contacts sans historique ERP) : étiquette archive_odoo sur les 423 froids/perdus dans Odoo + pilote de 50 appels humains sur les 96 dossiers avancés dans Odoo, ou une diffusion WhatsApp en juin, ou rien ?"
    options:
      - cle: archive_pilote
