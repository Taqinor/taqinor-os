    source: "Reda, question interactive, 11/11/2026 (après-midi, session loop audit) ; avant : audit de parcours PF4 (10/11/2026) : non posée (défaut recommandé : suit_la_case) ; constat C-ADRG-026"
    taches: [ADRG77]

  - id: D-ADRG-5
    question: "Les réglages de toute la société écrits depuis un module (négoce, délais SAV, monitoring, pourcentage de variante des devis, ordre des gammes) : quel droit les écrit ?"
    options:
      - cle: parametres_modifier
        texte: "Le droit « Modifier » des paramètres, comme les autres réglages de la société ; l'ordre des lignes réglé depuis le générateur reste au droit de vente"
      - cle: gerer_du_module
        texte: "Le droit « Gérer » du module concerné"
    reponse: parametres_modifier
    date: "2026-11-11"
    source: "Reda, question interactive, 11/11/2026 (après-midi, session loop audit) ; avant : audit de parcours PF4 (10/11/2026) : non posée (défaut recommandé : parametres_modifier) ; constats C-ADRG-012, C-ADRG-036, C-ADRG-037"
    taches: [ADRG11, ADRG12, ADRG13, ADRG38, ADRG46]

  - id: D-ADRG-6
    question: "Une règle d'équipe datée du 28/10/2026 (objectifs, attribution des leads, permanences réglés par l'administrateur, le responsable d'équipe ou la tête du département, quel que soit son rôle) est appliquée par le code mais absente du registre des décisions. Comment la consigner ?"
    options:
      - cle: consigner_et_code_crm
        texte: "La consigner ET exiger en plus un droit d'écriture du CRM : un Lecteur nommé responsable d'équipe ne fixe plus d'objectifs"
      - cle: consigner_telle_quelle
        texte: "La consigner telle que codée : le rôle ne compte pas"
    reponse: consigner_et_code_crm
    date: "2026-11-11"
    source: "Reda, question interactive, 11/11/2026 (après-midi, session loop audit) ; avant : audit de parcours PF4 (10/11/2026) : non posée (défaut recommandé : consigner_et_code_crm) ; constat C-ADRG-039"
    taches: [ADRG15]

  - id: D-ADRG-7
    question: "Verrouiller (extraire) un document de la GED : qui peut le faire ?"
    options:
      - cle: ged_gerer
        texte: "Seuls ceux qui ont « Gérer » les documents (verrouiller, c'est s'apprêter à modifier)"
      - cle: tout_lecteur
        texte: "Tout lecteur du document, comme aujourd'hui"
    reponse: ged_gerer
    date: "2026-11-11"
