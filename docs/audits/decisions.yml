  - id: D-AERR-1
    question: "Une action publicitaire approuvée par erreur, pas encore appliquée chez Meta, ne peut plus revenir à « proposée » : l'approbation est définitive depuis l'écran, alors que la touche « a » l'approuve d'un seul geste. Doit-elle pouvoir revenir à « proposée » ?"
    options:
      - cle: desapprouver
        texte: "Oui : une route de retour tant que l'action n'est pas appliquée, un bouton « Retirer l'approbation » sur la carte et un toast « Annuler » juste après l'approbation par la touche « a »"
      - cle: garder
        texte: "Non : l'approbation reste définitive ; seule la confirmation avant la touche « a » est ajoutée"
