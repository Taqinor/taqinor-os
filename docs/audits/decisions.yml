  - id: D-ACAL-149
    question: "Quatre lecteurs prennent encore la pente mémorisée d'un toit plat (22° par défaut) pour une vraie pente : la traduction vers le moteur (pose affleurante au lieu de rangées espacées, donc trop de modules — derrière un réglage aujourd'hui éteint), la pente imprimée sur la planche du PDF du devis, et l'inclinaison utilisée pour la production de l'étude (deux fonctions). Les corriger change des chiffres de documents client."
