  - id: D-CADV-12
    question: "Un lead déjà parqué en Froid renvoie le formulaire Meta : rouvrir ce lead chez son propriétaire (conception v4 §4.5 ; revient sur D-CRX1 du 02/09 pour le SEUL cas Froid) ou garder D-CRX1 (toujours un nouveau lead) ?"
    options:
      - cle: rouvrir
        texte: "le lead Froid repasse en Live chez son propriétaire, historique sur une seule fiche ; les leads vivants, signés ou archivés gardent D-CRX1 (nouveau lead)"
      - cle: nouveau_lead
        texte: "toujours un nouveau lead qui hérite du propriétaire du lead Froid, avec une ligne de chatter reliant les deux fiches"
    reponse: rouvrir
    date: "2026-11-02"
    source: "Reda, 02/11/2026, question interactive (AskUserQuestion) en session cadence-suivi-clients, posée par le drafter CADV101 (conflit avec D-CRX1)"
