  # ── Moteur de devis C&I : investigation L3 du 23/10/2026 (dossier docs/audits/2026-10-23-moteur-ci.md) ──
  - id: D-ACI-1
    question: "Lead pro avec un relevé de consommation incomplet (< 12 mois) et aucun autre kWh : que fait le devis automatique ?"
    options:
      - cle: a
        texte: "refuser en nommant le champ (« relevé incomplet n/12 : saisir la conso mensuelle »)"
      - cle: b
        texte: "estimer : moyenne des mois relevés × 12, étiquetée « estimation (n mois relevés) » à l'écran et au document"
    reponse: b
    date: "2026-10-23"
    source: "question interactive du 23/10/2026 (session moteur C&I, go-deep L3) ; constat C-ACI-002 (lead prod 1650)"
    taches: [ADEV77, ALEA49]

  - id: D-ACI-2
    question: "Lignes dépendant de la visite (structure sans type de toit, câbles sans longueurs) sans prix : que fait le devis automatique C&I ?"
    options:
      - cle: a
        texte: "devis indicatif SANS ces lignes, « estimation sous réserve de visite » (D-CIQ-5) ; lignes « à chiffrer après visite » hors total ; retour non imprimé tant que le total est incomplet"
      - cle: b
        texte: "refuser jusqu'à la visite technique"
    reponse: a
    date: "2026-10-23"
    source: "question interactive du 23/10/2026 ; constat C-ACI-005"
    taches: [ADEV79]

  - id: D-ACI-3
    question: "Lead commercial en monophasé (petit commerce) alors que le catalogue C&I n'a que des onduleurs triphasés : que fait-on ?"
    options:
      - cle: a
        texte: "refuser en le disant (passer la fiche en résidentiel ou déclarer le triphasé)"
      - cle: b
        texte: "ouvrir le C&I au monophasé : rôle onduleur C&I monophasé au catalogue et à la combinaison, même document commercial"
    reponse: b
    date: "2026-10-23"
    source: "question interactive du 23/10/2026 ; constat C-ACI-010 (lead anonymisé 1307)"
    taches: [ADEV86]

  - id: D-ACI-4
    question: "Les prestations C&I ont un prix saisi en Stock mais le moteur ne lit que les forfaits de Paramètres › Devis : quelle source ?"
    options:
      - cle: a
        texte: "Paramètres seuls ; la fiche Stock de ces articles dit « tarif réglé dans Paramètres › Devis › Prestations C&I » et sort du filtre « à compléter »"
      - cle: b
        texte: "repli sur le prix de vente Stock comme forfait fixe"
    reponse: a
    date: "2026-10-23"
    source: "question interactive du 23/10/2026 ; constat C-ACI-007"
    taches: [ASTK254]

  - id: D-ACI-5
    question: "La fiche lead dit « devis auto prêt » dès que la consommation est connue (CIQ404) alors que le moteur exige aussi le contrat BT et le rythme : que doit dire la fiche ?"
    options:
      - cle: a
        texte: "prêt = tout ce que le moteur exige (une règle partagée calculée par le moteur) ; remplace CIQ404 « conso seule »"
      - cle: b
        texte: "garder « prêt = conso », corriger seulement le 409 (champ nommé + bouton Compléter)"
    reponse: a
    date: "2026-10-23"
    source: "question interactive du 23/10/2026 ; constat C-ACI-001 (lead prod 1637)"
    taches: [ADEV76, ALEA47]

  - id: D-ACI-6
    question: "Postes FIXES sans prix (coffrets, protections, forfaits non saisis) : le devis automatique C&I…"
    options:
      - cle: a
        texte: "refuse en nommant les postes et le chemin Paramètres › Devis › Prestations C&I / fiche produit (CIQ105 : rien d'inventé, jamais un 0)"
      - cle: b
        texte: "crée le brouillon sans ces lignes avec alertes ; PDF client bloqué tant que le total est incomplet"
    reponse: a
    date: "2026-10-23"
    source: "question interactive du 23/10/2026 ; constats C-ACI-004, C-ACI-006"
    taches: [ADEV79]

  - id: D-ACI-7
    question: "Profil de charge SAISI par la société pour un lead industriel : quand le moteur l'utilise-t-il ?"
    options:
      - cle: a
        texte: "seulement si sa clé = secteur industriel déclaré du lead (ou catégorie commerciale) ; sinon profil déclaré exigé"
      - cle: b
        texte: "jamais pour l'industriel"
    reponse: a
    date: "2026-10-23"
    source: "question interactive du 23/10/2026 ; constat C-ACI-003"
    taches: [ADEV76]

  - id: D-ACI-8
    question: "Investissement du devis incomplet (lignes sans prix) : la page finance et le retour sur investissement…"
    options:
      - cle: a
        texte: "sont omis avec le motif « investissement non encore chiffré (N articles sans prix) » (D-CIQ-10, QJR119)"
      - cle: b
        texte: "sont imprimés sur le total partiel avec la mention « investissement partiel »"
    reponse: a
    date: "2026-10-23"
    source: "question interactive du 23/10/2026 ; constat C-ACI-008 (TRI 895 % sur 2 lignes)"
    taches: [ADEV81, AMOT80]

  - id: D-ACI-9
    question: "Quand le rendu premium commercial/industriel refuse un devis, le moteur sert le document RÉSIDENTIEL legacy au client C&I : que faire ?"
    options:
      - cle: a
        texte: "refuser : erreur nommée, jamais un document résidentiel à une entreprise (étend AMOT36 à tous les motifs)"
      - cle: b
        texte: "garder le repli en retirant les textes résidentiels"
    reponse: a
    date: "2026-10-23"
    source: "question interactive du 23/10/2026 ; constat C-ACI-012"
    taches: [AMOT79]

  - id: D-ACI-10
    question: "Badge « Prix ONEE en hausse » du document legacy (contredit QRES54 tarif constant, aucune source) : que faire ?"
    options:
      - cle: a
        texte: "le retirer de tous les documents"
      - cle: b
        texte: "le garder seulement avec une indexation sourcée saisie"
    reponse: a
    date: "2026-10-23"
    source: "question interactive du 23/10/2026 ; constat C-ACI-013"
    taches: [AMOT82]

  - id: D-ACI-11
    question: "Ligne 82-21 du document C&I (D-CIQ-18) : quel texte ?"
    options:
      - cle: a
        texte: "phrase fixe « Raccordement et autorisations du site : dossier monté et suivi par TAQINOR », imprimée quand le régime calculé n'est pas « aucun » (jamais le texte de loi, D-CIQ-6)"
      - cle: b
        texte: "texte saisi par Reda dans Paramètres, rien tant qu'il est vide"
    reponse: a
    date: "2026-10-23"
    source: "question interactive du 23/10/2026 ; constat C-ACI-014"
    taches: [AMOT83]

  - id: D-ACI-12
    question: "Suivi de production sur le devis C&I sans délai d'intervention saisi (D-CIQ-12) : que faire ?"
    options:
      - cle: a
        texte: "nommer le service sans délai (« Suivi de production inclus ») ; l'option O&M nommée s'imprime « tarif à renseigner » tant qu'elle n'a pas de prix"
      - cle: b
        texte: "rien tant que le délai manque"
    reponse: a
    date: "2026-10-23"
    source: "question interactive du 23/10/2026 ; constat C-ACI-015"
    taches: [AMOT83]

  - id: D-ACI-13
    question: "Borne de toit du moteur C&I quand le mode de pose n'est pas déclaré (constat C-ACI-026 : 92 panneaux retenus sur 200 m² déclarés, la contenance restait « non bornée ») : que faire ?"
    options:
      - cle: a
        texte: "estimer la contenance avec un mode de pose par défaut selon le type de surface (toiture → surimposition, terrasse/sol → lestée) et la dire « estimation, à confirmer au calepinage » ; la borne s'applique"
      - cle: b
        texte: "refuser le devis automatique tant que le mode de pose n'est pas déclaré (prérequis du lead, bouton « Compléter »)"
      - cle: c
        texte: "laisser non borné (comportement actuel), l'alerte interne suffit"
    reponse: a
    date: "2026-10-24"
    source: "rejeu humain du 23/10/2026 (session moteur C&I) ; constat C-ACI-026 ; tranchée par la question interactive du 24/10/2026"
    taches: [ADEV90]

  - id: D-ACI-14
    question: "Entretien (O&M) dans les flux C&I quand l'option n'est pas souscrite (aujourd'hui 0, production supposée propre) : que faire dans les nouveaux rendus ?"
    options:
      - cle: a
        texte: "un « entretien minimum à votre charge » (MAD/kWc/an) réglé dans Paramètres, toujours déduit des économies et étiqueté sur le document"
      - cle: b
        texte: "sans O&M souscrite, une perte de production d'encrassement réglable"
      - cle: c
        texte: "rien (D-CIQ-12 / CIQ342 tels quels)"
    reponse: a
    date: "2026-10-24"
    source: "question interactive du 24/10/2026 (L3 « best quote making machine ») ; constat C-L3-MOT-01"
    taches: [AMOT96]

  - id: D-ACI-15
    question: "Incertitude par défaut sur le document C&I (production P90, tarif +x %/an, dégradation 0,75 %, contribution art. 13) ?"
    options:
      - cle: a
        texte: "4 scénarios seedés dans Paramètres (valeurs sourcées, modifiables), imprimés sur l'industriel et résumés sur le commercial à côté du scénario central"
      - cle: b
        texte: "rien tant que le fondateur ne saisit pas (D-CIQ-10 tel quel)"
    reponse: a
    date: "2026-10-24"
    source: "question interactive du 24/10/2026 ; constat C-L3-MOT-01"
    taches: [AMOT97]

  - id: D-ACI-16
    question: "Postes hors total (structure, câbles à chiffrer après la visite) : provision estimée ajoutée au total, ou omission ?"
    options:
      - cle: a
        texte: "garder l'omission (D-ACI-2=a) avec le titre « Investissement hors postes à chiffrer après la visite » et la liste des postes sans montant"
      - cle: b
        texte: "provision estimée par poste (fourchette Paramètres) ajoutée au total avec mention"
    reponse: a
    date: "2026-10-24"
    source: "question interactive du 24/10/2026 ; confirme D-ACI-2=a et AMOT86"
    taches: [AMOT86]

  - id: D-ACI-17
    question: "« Exploitation et maintenance (O&M) C&I — prix à renseigner » sur le document client (D-ACI-12=a) : formulation côté client ?"
    options:
      - cle: a
        texte: "« tarif sur demande » côté client ; l'ERP garde l'alerte interne « prix à renseigner »"
      - cle: b
        texte: "garder « prix à renseigner »"
      - cle: c
        texte: "masquer la ligne tant qu'elle n'a pas de prix"
    reponse: a
    date: "2026-10-24"
    source: "question interactive du 24/10/2026 ; vérificateur R4 (« état interne du catalogue sur un document client »)"
    taches: [AMOT98]

  - id: D-ACI-18
    question: "Précision des calculs C&I (journées moyennes, 30° plein sud, dégradation 0,5 %/an aujourd'hui affichés) : passer au calcul complet ?"
    options:
      - cle: a
        texte: "autoconsommation sur 8 760 h (série horaire PVGIS), production selon pente/azimut/pose déclarés, dégradation selon la courbe de garantie (≈ 1 % an 1 puis 0,4 %/an)"
      - cle: b
        texte: "garder les journées moyennes, 30° sud, 0,5 % en les affichant (AMOT91)"
    reponse: a
    date: "2026-10-24"
    source: "question interactive du 24/10/2026 ; constat C-L3-MOT-01"
    taches: [AMOT99]

  - id: D-ACI-19
    question: "CO₂ évité sur le document C&I ?"
    options:
      - cle: a
        texte: "oui, avec un facteur réseau marocain fourni par le fondateur (gCO₂/kWh + source), imprimé avec sa source ; rien tant que le facteur n'est pas réglé"
      - cle: b
        texte: "jamais (CIQ344)"
    reponse: a
    date: "2026-10-24"
    source: "question interactive du 24/10/2026"
    taches: [AMOT100]

  - id: D-ACI-20
    question: "Signature des gros contrats C&I sur le lien public ?"
    options:
      - cle: a
        texte: "signature simple + piste d'audit renforcée (attestation de pouvoir, ICE croisé, sceau v3, SHA du PDF — ADEV95/96) pour tous les montants"
      - cle: b
        texte: "signature qualifiée (prestataire agréé DGSSI) exigée au-delà d'un montant"
    reponse: a
    date: "2026-10-24"
    source: "question interactive du 24/10/2026 ; confirme ADEV95-96"
    taches: [ADEV95, ADEV96]

  - id: D-ACI-21
    question: "Format des nombres dans les documents C&I en anglais (aujourd'hui « 484 992,48 », comme en français) ?"
    options:
      - cle: a
        texte: "format anglais dans les rendus EN (« 484,992.48 MAD », « 65.32 kWp ») ; FR et AR inchangés"
      - cle: b
        texte: "garder le format français partout"
    reponse: a
    date: "2026-10-24"
    source: "question interactive du 24/10/2026 ; constat C-L3-DOC-06"
    taches: [AMOT101]

  - id: D-CMP-1
    question: "Chaînes de panneaux C&I : comment découper un champ sur un onduleur (constat R1 CMP : 8 panneaux « en réserve » non raccordés à 20 kWc, 47 chaînes de 6 avec écrêtage permanent à 200 kWc) ?"
    options:
      - cle: a
        texte: "chaînes de longueur égale par entrée MPPT, entrées libres entre elles ; tout panneau vendu est raccordé ; chaînes par entrée = fiche, sinon ⌊I max ÷ Imp⌋ (jamais d'écrêtage permanent conçu) ; aucune découpe ⇒ combinaison suivante, sinon bloquant nommé"
      - cle: b
        texte: "garder la conception mono-pan du calepinage (chaînes égales sur tout le champ, modules en réserve)"
    reponse: a
    date: "2026-10-27"
    source: "décision prise pour le fondateur (à revoir) — règle fondateur du 27/10/2026 « ne jamais attendre le fondateur » ; session L3 CMP"
    taches: [CMP1, CMP2]

  - id: D-CMP-2
    question: "Câble DC C&I : que vaut la longueur déclarée (aujourd'hui défaut = 2 × chaînes × 30 m, déclarée = chaînes × L) ?"
    options:
      - cle: a
        texte: "distance ALLER SIMPLE champ → onduleur ; câble = 2 (polarités) × chaînes × distance, déclarée ou par défaut"
      - cle: b
        texte: "longueur déclarée = longueur totale par chaîne (aller-retour compris), câble = chaînes × L"
    reponse: a
    date: "2026-10-27"
    source: "décision prise pour le fondateur (à revoir) — alignée sur la règle fondateur du 26/10/2026 (2 × chaînes × 30 m) ; session L3 CMP"
    taches: [CMP4]

  - id: D-CMP-3
    question: "Option « avec batterie » C&I : combien d'onduleurs hybrides basse tension en parallèle au plus (constat R1 CMP : 19 Deye à 500 kWc) ?"
    options:
      - cle: a
        texte: "au plus 10 (datasheet Deye SUN-14-20K-SG05LP3-EU-SM2 et SUN-3-12K-SG05LP3-EU-SM2 : « Max. 10 pcs parallel »), d'un seul modèle (manuel SUN-3-12K-SG05LP3-EU-SM2 p. 51, « same model ») ; au-delà, le champ « avec » est borné et une alerte interne le dit"
      - cle: b
        texte: "aucune borne"
    reponse: a
    date: "2026-10-27"
    source: "décision prise pour le fondateur (à revoir) — datasheets Deye ; session L3 CMP"
    taches: [CMP3, CMP11]

  - id: D-CMP-4
    question: "Production d'un toit plat (lesté ou fixé) sans pente déclarée : quelle inclinaison (aujourd'hui 30° de la table PVGIS) ?"
    options:
      - cle: a
        texte: "10° plein sud (systèmes lestés K2 Dome 6.10, Renusol FS Pro 10-S, ValkPro+ P10) — PVGIS 5.3 Casablanca 1 621 kWh/kWc contre 1 719 à 30° (−5,7 %)"
      - cle: b
        texte: "15° (Renusol ConSole+, K2 Dome 6.15) — −3,4 %"
      - cle: c
        texte: "garder 30° par défaut ; inclinaison modifiable dans le générateur (toit.pente_deg)"
    reponse: c
    date: "2026-10-27"
    source: "décision fondateur 27/10/2026 (Reda) : 30° par défaut, inclinaison modifiable dans le générateur — remplace la réponse a prise pour lui le même jour"
    taches: [CMP5]

  - id: D-CMP-5
    question: "Option « avec batterie » DOMINÉE (plus chère ET économie annuelle plus faible que l'option sans — rendu réel usine MT : 1 140 483 HT / 229 971 MAD contre 928 317 HT / 233 192 MAD) : la proposer ?"
    options:
      - cle: a
        texte: "ne pas la proposer ; alerte interne nommant la cause (10 hybrides au plus, banque réduite) ; choix « avec » du lead ⇒ refus nommé"
      - cle: b
        texte: "la proposer quand même (règle « deux options par défaut »)"
    reponse: a
    date: "2026-10-27"
    source: "décision prise pour le fondateur (à revoir) — session L3 CMP, rendu réel du lead de démo 2231"
    taches: [CMP9]

  - id: D-CMP-6
    question: "Compteur d'injection / logger d'une option dont les onduleurs sont d'une autre marque que l'article retenu (Smart Meter Huawei sur 10 hybrides Deye) ?"
    options:
      - cle: a
        texte: "article compatible d'abord (fiche ond_compteurs_compatibles, sinon même marque) ; aucun ⇒ ligne gardée + alerte interne nommant la marque"
      - cle: b
        texte: "garder l'article actuel sans alerte"
    reponse: a
    date: "2026-10-27"
    source: "décision prise pour le fondateur (à revoir) — session L3 CMP, rendu réel des leads de démo 2228 / 2231"
    taches: [CMP10]
    source: "décision prise pour le fondateur (à revoir) — PVGIS 5.3 PVcalc relevé le 27/10/2026 ; session L3 CMP"
    taches: [CMP5]

  - id: D-CMP-7
    question: "Un devis C&I envoyé au niveau de règles ≤ 2 recalculé par force_etudes reçoit aujourd'hui les corrections de chiffre CMP5 / CMP7 / CMP8 du moteur C&I (gardées par la seule empreinte de l'étude) : que faire ?"
    options:
      - cle: a
        texte: "tout recalcul forcé passe d'abord le devis au niveau de règles 3 (toutes les corrections du 27/10 ensemble, tracé au chatter)"
      - cle: b
        texte: "garder le niveau du devis et gater chaque correction (CMP5, CMP7, CMP8) par regles_au_moins(devis, 3) dans moteur_ci"
    reponse: a
    date: "2026-11-03"
    source: "Reda, question interactive, 03/11/2026 ; audit Fable final du run L3 devis (PC2, 28/10/2026), consigné par la coordinatrice ; option recommandée (a) — non construite, décision fondateur"
    taches: [CMP12]

  - id: D-AGM-1
    question: "Moteur de pompe donné en CV (5,5 CV = 4,05 kW) : quel kW pour la pompe et le variateur (constat R1 AGM : variateur 5,5 kW choisi pour un moteur normalisé de 4 kW) ?"
    options:
      - cle: a
        texte: "CV ramené à la puissance normalisée IEC la plus proche quand l'écart relatif est ≤ 2 % (écart maximal mesuré 1,97 %, 40 CV → 30 kW) ; pompe et variateur affichent le même kW"
      - cle: b
        texte: "garder la conversion brute CV × 0,7355"
    reponse: a
    date: "2026-10-27"
    source: "décision prise pour le fondateur (à revoir) — règle fondateur du 27/10/2026 « ne jamais attendre le fondateur » ; session L3 AGM"
    taches: [AGM1]

  - id: D-AGM-2
    question: "Besoin en eau qu'aucun champ ne couvre : jusqu'où grossit le champ de repli (constat R1 AGM : OSP 30/8 à 800 m³/j → 121 panneaux) ?"
    options:
      - cle: a
        texte: "repli borné à 1,5 × la puissance de plaque (borne haute de `ratio_champ_pompe`, table AGR110), jamais sous le minimum du variateur ; la recherche et tout cas couvrable inchangés ; l'alerte le dit"
      - cle: b
        texte: "garder la croissance sans borne"
    reponse: a
    date: "2026-10-27"
    source: "décision prise pour le fondateur (à revoir) — session L3 AGM"
    taches: [AGM2, AGM14]

  - id: D-AGM-3
    question: "Pompe sans courbe (couverture du besoin non vérifiable) : le bloc « Votre argent » reste-t-il publiable au client ?"
    options:
      - cle: a
        texte: "non publiable au client (motif existant repris) ; l'écran vendeur garde l'aperçu"
      - cle: b
        texte: "publiable avec couverture supposée à 100 %"
    reponse: a
    date: "2026-10-27"
    source: "décision prise pour le fondateur (à revoir) — session L3 AGM"
    taches: [AGM9]

  - id: D-AGC-1
    question: "Les notes « rendement non publié … production en borne haute / rendement prudent » du PDF agricole sont-elles imprimées au client ?"
    options:
      - cle: a
        texte: "non : retirées du PDF client (règle « rien d'incertain imprimé », ci-decisions-2610) ; le vendeur garde l'information"
      - cle: b
        texte: "oui, imprimées telles quelles"
    reponse: a
    date: "2026-10-27"
    source: "décision prise pour le fondateur (à revoir) — session L3 AGC"
    taches: [AGC1]

  - id: D-AGC-2
    question: "Le une-page agricole imprime-t-il « (hypothèse) » à côté des heures de pompage ?"
    options:
      - cle: a
        texte: "non : « estimation » suffit (même règle que D-AGC-1)"
      - cle: b
        texte: "oui, « (hypothèse) » reste imprimé"
    reponse: a
    date: "2026-10-27"
    source: "décision prise pour le fondateur (à revoir) — session L3 AGC"
    taches: [AGC2]

  - id: D-AGC-6
    question: "Bloc « Votre argent » agricole non publiable alors que le client a DÉCLARÉ sa dépense actuelle : que dit le document ?"
    options:
      - cle: a
        texte: "une ligne neutre avec la SEULE somme déclarée (« Votre dépense actuelle déclarée : X MAD par an. »), jamais une économie ; rien sur des mois du calendrier non confirmés"
      - cle: b
        texte: "rien"
    reponse: a
    date: "2026-10-28"
    source: "décision prise pour le fondateur (à revoir) — session L3 AGC (validation R3)"
    taches: [AGC11, AGC14, AGC15, AGC16]

  - id: D-AGC-7
    question: "Vide redistribué par page du PDF agricole (pages 1-2 à plus d'un quart vides) : quel plafond ?"
    options:
      - cle: a
        texte: "45 mm (au lieu de 95)"
      - cle: b
        texte: "95 mm inchangé"
    reponse: a
    date: "2026-10-27"
