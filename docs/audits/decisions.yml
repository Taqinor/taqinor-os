  - id: D-ASUP-8
    question: "Faut-il refuser l'anonymisation d'un client qui a une créance ouverte ou un contentieux ? Aujourd'hui elle est acceptée, et la lettre de relance comme le dossier contentieux sortent « anonymisés »."
    options:
      - cle: refuser
        texte: "Refuser « Anonymiser (RGPD) » (et l'effacement d'une demande de droit) tant que le client doit encore de l'argent sur une facture émise ou porte un contentieux ouvert, avec un message qui dit pourquoi et quoi faire (solder ou clore d'abord)"
      - cle: autoriser
        texte: "Laisser anonymiser comme aujourd'hui : relances et dossier contentieux sortent au nom « anonymisé », sans adresse"
    reponse: refuser
    date: "2026-11-17"
    source: "Reda, question interactive, 17/11/2026 (session loop audit) ; avant : contre-visites ASUP du 14/11 (docs/audits/2026-11-14-suppression-archivage-verifie.md §5) et du 17/11 (docs/audits/2026-11-17-suppression-archivage-verifie.md §5) : une seule garde d'effacement (`pieces_legales_sans_identite_figee`), aucune sur la créance"
    taches: [ASUP70]

  - id: D-ADCG-4
    question: "La preuve d'ADCG14 attend « (unhealthy) » dans `docker compose ps` après `docker compose pause redis`, mais Docker affiche « (Paused) » (la santé y passe bien à unhealthy, visible par `docker inspect`) ; un gel par SIGSTOP donne « (unhealthy) » en ~76 s. Que change-t-on ?"
    options:
      - cle: lire_state_health
        texte: "Garder le geste `docker compose pause redis` et lire la santé par `docker inspect --format {{.State.Health.Status}}` (unhealthy)"
      - cle: sigstop
        texte: "Garder la lecture `docker compose ps` et changer le geste : geler redis-server par SIGSTOP (`kill -STOP 1` dans le conteneur), attendre ~80 s"
    reponse: lire_state_health
    date: "2026-11-17"
    source: "Reda, question interactive, 17/11/2026 (session loop work on all plans) ; avant : enregistrement docs/audits/acceptation/ADCG/2026-11-13-8c4a0a109.md (ADCG14 FAIL hors couvre, l. 51) ; vague d'acceptation 6 (16-17/11/2026) : non posée (option recommandée en premier)"
    taches: [ADCG119]

  - id: D-BATCYC-1
    question: "Sur le flux 25 ans de l'option C&I « avec batterie », quand la batterie est-elle remplacée ? (DEV-202611-0080 : remplacée en année 11, l'année après la garantie de 10 ans, alors que la fiche publie 8 000 cycles)"
    options:
      - cle: cycles_usage_reel
        texte: "Cycles publiés, usage réel : cycles publiés de la fiche ÷ cycles par an calculés par l'étude pour ce client, + 1 ; la garantie n'est plus un plafond ; aucun remplacement compté au-delà de l'horizon de 25 ans (8 000 ÷ ≈ 289 ≈ 27 ans → aucun)"
