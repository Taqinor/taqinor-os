  - id: D-ACNC-2
    question: "Un encaissement groupé dont toutes les factures sont déjà soldées devient aujourd'hui, en entier, une avance client (AFAC8 l'a voulu pour un reliquat, sans viser ce cas). Que fait l'ERP ?"
    options:
