    source: "décision prise par l'orchestrateur en l'absence du fondateur, CONFIRMÉE PAR LE FONDATEUR le 26/11/2026 (« all the 18 choices are good ») ; relecture indépendante de la lane de l'atelier web (26/11) : l'ancienne phrase annonçait une pose qui n'a pas lieu (ACAL1970)"
    taches: [ACAL1970]
  - id: D-ACAL-145
    question: "ACAL1923 demandait d'enregistrer un toit plat avec une pente de 0. Construite ainsi, elle réécrit au prochain enregistrement tous les toits plats stockés (la pente mémorisée du curseur, 22° par défaut) : document modifié sans geste, empreinte déplacée, production recalculée. Comment la faire ?"
    options:
      - cle: lecture_seulement
        texte: "(recommandée) Ne rien réécrire : les lecteurs du serveur ignorent la pente mémorisée d'un toit plat (fonction unique `pente_du_pan`) ; le contrat dit que cette valeur n'est pas une pente"
      - cle: ecriture_zero
        texte: "Écrire 0 à l'enregistrement, en acceptant que les documents stockés changent"
    reponse: lecture_seulement
    date: "2026-11-26"
    source: "décision prise par l'orchestrateur en l'absence du fondateur, CONFIRMÉE PAR LE FONDATEUR le 26/11/2026 (« all the 18 choices are good ») ; lane construite puis retirée (cinq tests d'aller-retour rouges), relecture indépendante du 26/11 ; faite pour la contenance, la reprise de visite et le diff de versions — quatre autres lecteurs attendent D-ACAL-149"
    taches: [ACAL1923]
  - id: D-ACAL-146
    question: "Une simulation périmée disait toujours « le document a changé ». La trace gardée au calcul ne prouve la cause que pour deux familles de réglages de la société. Que disent le motif et le bouton quand la cause n'est pas prouvée ?"
    options:
      - cle: cause_prouvee_seulement
        texte: "(recommandée) Cause nommée seulement si elle est prouvée : « un réglage de la société a changé » et « Relancer (réglages modifiés) » ; sinon « le document ou un réglage de la société a changé » et « Relancer la simulation »"
      - cle: toujours_document
        texte: "Garder « le document a changé » dans tous les cas"
    reponse: cause_prouvee_seulement
    date: "2026-11-26"
    source: "décision prise par l'orchestrateur en l'absence du fondateur, CONFIRMÉE PAR LE FONDATEUR le 26/11/2026 (« all the 18 choices are good ») ; relecture indépendante du 26/11 : la norme électrique et la grille horaire entrent dans l'empreinte sans être figées au calcul (ACAL1647)"
    taches: [ACAL1647]
  - id: D-ACAL-147
    question: "Pour un fichier météo horizontal, les étapes qui dépendent du soleil (angle d'incidence, horizon, inter-rangées, ombrage, bifacial) plaçaient le soleil à l'heure pile alors que la transposition le plaçait à la demi-heure. Elles prennent maintenant le même instant : les nouvelles simulations sur ces fichiers changent légèrement. Faut-il changer la version de la simulation ?"
    options:
      - cle: trace_sans_version
        texte: "(recommandée) Non : changer la version périmerait toutes les simulations stockées ; la trace est la présence de `meteo.transposition.instant_soleil` dans le résultat (absente = soleil à l'heure pile), dite au contrat et au journal des versions"
      - cle: nouvelle_version
        texte: "Oui : nouvelle version, toutes les simulations stockées deviennent « périmées »"
    reponse: trace_sans_version
    date: "2026-11-26"
    source: "décision prise par l'orchestrateur en l'absence du fondateur, CONFIRMÉE PAR LE FONDATEUR le 26/11/2026 (« all the 18 choices are good ») ; relecture indépendante du 26/11 ; mesuré sur la fixture : l'écart est-ouest passe de 12,5 % à 5,5 % en année type"
    taches: [ACAL1715]
  - id: D-ACAL-148
    question: "Le devis généré depuis un calepinage chiffre l'onduleur de la conception du lead, pas celui désigné à l'étape Électrique du calepinage (constaté au tour 5 : Deye 5 kW hybride désigné, « Onduleur réseau Huawei 5 kW » au devis). L'écran le dit maintenant, mais le devis ne suit pas. Le devis doit-il chiffrer l'onduleur désigné ?"
