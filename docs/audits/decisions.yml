  - id: D-ACAL-151
    question: "Les variateurs VEICHI SI22 / SI23 : la description du catalogue dit « protection marche à sec », leur fiche technique ne le dit pas et rien dans le dépôt ne le rattache à un document du fabricant. Que disent les nouveaux devis de pompage ?"
