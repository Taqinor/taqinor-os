      - cle: confirmation_toujours
        texte: "Une confirmation qui nomme le lead et l'étape avant chaque changement d'étape par la touche ou la palette"
      - cle: garder
        texte: "Ne rien changer : le changement d'étape au clavier et par la palette reste immédiat"
