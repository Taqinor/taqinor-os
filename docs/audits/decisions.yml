        texte: "La seconde signature crée une nouvelle preuve et un nouvel exemplaire ; l'ancienne preuve et l'ancien PDF restent archivés à l'historique"
      - cle: interdire
        texte: "Un devis dés-accepté ne se re-signe plus : 409, réviser en V2"
    reponse: nouvelle_preuve
    date: "2026-11-02"
    source: "Reda, question interactive, audit parcours PA3"
    taches: [ADVS4]

  - id: D-ADVS-3
    question: "Un accessoire de batterie (câble batterie classé cable_dc) et une batterie au nom sans « batterie » : dans quelle option les compter ?"
    options:
