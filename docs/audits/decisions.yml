    taches: []

  - id: D-AGR-5
    question: "Comment calculer les economies agricoles ?"
    options:
      - cle: a
        texte: "Economies = chiffres declares du client moins l'entretien solaire ; horizon 10 ans ; pompe remplacee a l'annee 7 ; variateur a la fin de sa garantie ; retour sans aide deduite ; bloc omis si rien n'est declare."
    reponse: a
    date: "2026-10-02"
    source: "docs/claude-memory/agricole-decisions-fondateur.md (D-AGR-5)"
    taches: []

  - id: D-AGR-6
    question: "Que dire de l'aide FDA sur le devis ?"
    options:
      - cle: a
        texte: "On imprime la regle (conditions, plafonds, accord avant travaux, versement apres), jamais un montant propre au client ; « jusqu'a 30 % » retire partout."
    reponse: a
    date: "2026-10-02"
    source: "docs/claude-memory/agricole-decisions-fondateur.md (D-AGR-6)"
    taches: []

  - id: D-AGR-7
