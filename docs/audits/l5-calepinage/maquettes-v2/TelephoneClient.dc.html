<!doctype html>

<body>
<x-dc>
<helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #f5f4f0; color: #0c1335; font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 16px; font-variant-numeric: tabular-nums">

      <linearGradient id="tcPignon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e3d3b7"/><stop offset="1" stop-color="#d2c0a0"/></linearGradient>

      <filter id="tcFlouFin" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>

    <rect width="390" height="470" fill="url(#tcCiel)"/>
    <circle cx="318" cy="118" r="82" fill="url(#tcSoleil)"/>
    <circle cx="318" cy="118" r="22" fill="#fbe38f"/>

    <g transform="translate(193 318) scale(0.5) translate(-612 -512)">
    <g transform="translate(0 -54)">

      <path d="M271 523L755 629V805L271 702z" fill="url(#tcMur)"/>

      <polygon points="319.4,580.1 392,596 392,660.5 319.4,644.6" fill="url(#tcVitre)" stroke="#ffffff" stroke-width="4"/>
      <polygon points="454.9,609.8 527.5,625.7 527.5,690.2 454.9,674.3" fill="url(#tcVitre)" stroke="#ffffff" stroke-width="4"/>

      <polygon points="822.3,655.6 885.7,631 885.7,694.3 822.3,719" fill="url(#tcVitre)" stroke="#f6ecd9" stroke-width="4"/>

      <path d="M370 328L850 431" stroke="#f1d5c0" stroke-opacity="0.6" stroke-width="2"/>

        <polygon points="399.2,375.4 458.4,388.1 427.2,449.5 368,436.8"/><polygon points="464.2,389.3 523.4,402 492.2,463.4 433,450.7"/><polygon points="529.1,403.2 588.3,415.9 557.1,477.4 497.9,464.7"/><polygon points="594.1,417.2 653.3,429.9 622.1,491.3 562.9,478.6"/><polygon points="659,431.1 718.2,443.8 687,505.2 627.8,492.5"/><polygon points="724,445 783.2,457.8 752,519.2 692.8,506.5"/>

      <path d="M659 431.1L718.2 443.8 708 464 649 451z" fill="#ffffff" opacity="0.10"/>
    </g>
    </g>
  </svg>

  <!-- Qui, où -->
  <div style="position: absolute; left: 16px; top: 16px; display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 16px; background: rgba(255,255,255,0.86); border: 1px solid rgba(255,255,255,0.7); box-shadow: 0 10px 30px rgba(12,19,53,0.14); backdrop-filter: blur(18px)">
    <span style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #0c1335"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e2b54a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5L12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg></span>
    <span style="display: flex; flex-direction: column; gap: 1px">
      <span style="font: 600 16px/1.2 'Archivo', sans-serif; letter-spacing: -0.01em">Villa Bennani</span>
      <span style="font-size: 12px; color: #4a5072">Casablanca · pan sud</span>
    </span>
  </div>

  <!-- Geste -->
  <div style="position: absolute; left: 16px; top: 80px; height: 32px; display: flex; align-items: center; gap: 7px; padding: 0 12px; border-radius: 16px; background: rgba(12,19,53,0.72); color: #ffffff; font-size: 12px; font-weight: 500; backdrop-filter: blur(12px)">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 10-3 6.2"/><path d="M20 6v6h-6"/></svg>
    Glissez un doigt pour tourner autour
  </div>

  <!-- Le bas : le soleil, les trois chiffres, le pied -->
  <div style="position: absolute; left: 0; right: 0; top: 426px; bottom: 0; display: flex; flex-direction: column; border-radius: 26px 26px 0 0; background: #f5f4f0; box-shadow: 0 -12px 30px rgba(12,19,53,0.14)">
    <div style="flex: 1; min-height: 0; padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 12px">

      <div style="display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 8px; border-radius: 18px; background: #ffffff; box-shadow: 0 8px 24px rgba(12,19,53,0.07), 0 1px 2px rgba(12,19,53,0.06)">
        <button type="button" aria-label="Faire passer la journée" style="flex: none; width: 48px; height: 48px; border: 0; border-radius: 14px; background: #0c1335; color: #ffffff; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 14px rgba(12,19,53,0.28)"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5l13 7.5-13 7.5z"/></svg></button>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 9px">
          <span style="font: 600 15px 'Archivo', sans-serif">21 juin · 12 h</span>
          <div style="position: relative; height: 6px; border-radius: 3px; background: rgba(12,19,53,0.10)" aria-hidden="true">
            <span style="position: absolute; left: 0; top: 0; width: 46%; height: 6px; border-radius: 3px; background: #e2b54a"></span>
            <span style="position: absolute; left: calc(46% - 10px); top: -7px; width: 20px; height: 20px; box-sizing: border-box; border-radius: 10px; background: #ffffff; border: 3px solid #e2b54a; box-shadow: 0 3px 8px rgba(12,19,53,0.24)"></span>
          </div>
        </div>
        <div role="group" aria-label="Saison" style="flex: none; display: flex; padding: 3px; background: rgba(12,19,53,0.07); border-radius: 13px">
          <button type="button" aria-pressed="false" style="height: 44px; padding: 0 11px; border: 0; border-radius: 10px; background: transparent; color: #4a5072; font: 500 14px 'Hanken Grotesk', sans-serif">Hiver</button>
          <button type="button" aria-pressed="true" style="height: 44px; padding: 0 11px; border: 0; border-radius: 10px; background: #ffffff; color: #0c1335; font: 600 14px 'Hanken Grotesk', sans-serif; box-shadow: 0 1px 3px rgba(12,19,53,0.16)">Été</button>
        </div>
      </div>

      <section aria-label="Votre installation en trois chiffres" style="position: relative; box-sizing: border-box; padding: 16px 20px; border-radius: 22px; background: #0c1335; color: #ffffff; overflow: hidden; box-shadow: 0 16px 36px rgba(12,19,53,0.30)">
        <svg width="358" height="200" viewBox="0 0 358 200" aria-hidden="true" style="position: absolute; left: 0; top: 0"><defs><radialGradient id="tcLueur" cx="94%" cy="0%" r="70%"><stop offset="0" stop-color="#e2b54a" stop-opacity="0.30"/><stop offset="0.6" stop-color="#e2b54a" stop-opacity="0.04"/><stop offset="1" stop-color="#e2b54a" stop-opacity="0"/></radialGradient></defs><rect width="358" height="200" fill="url(#tcLueur)"/></svg>
        <div style="position: relative; display: flex; flex-direction: column">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
            <span style="font: 700 46px/1 'Archivo', sans-serif; letter-spacing: -0.025em; white-space: nowrap">11 480</span>
            <span style="height: 24px; display: flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 12px; background: rgba(226,181,74,0.18); font-size: 12px; font-weight: 600; color: #f0d48a"><span style="width: 6px; height: 6px; border-radius: 3px; background: #e2b54a"></span>Estimation</span>
          </div>
          <span style="margin-top: 6px; font: 500 15px 'Hanken Grotesk', sans-serif; color: #c7cce3">kWh par an</span>
          <div style="height: 1px; margin: 12px 0 12px; background: rgba(255,255,255,0.12)"></div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
            <div style="display: flex; flex-direction: column; gap: 4px">
              <span style="font: 700 30px/1 'Archivo', sans-serif; letter-spacing: -0.02em">12</span>
              <span style="font-size: 14px; color: #c7cce3">panneaux</span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 4px">
              <span style="font: 700 30px/1 'Archivo', sans-serif; letter-spacing: -0.02em">82 <span style="font: 500 16px 'Hanken Grotesk', sans-serif; color: #c7cce3">%</span></span>
              <span style="font-size: 14px; color: #c7cce3">de votre facture</span>
            </div>
          </div>
        </div>
      </section>
      <span style="padding: 0 4px; font-size: 12px; line-height: 1.5; color: #4a5072">Estimation pour une année moyenne à Casablanca. Les montants figurent dans le devis.</span>
    </div>

    <footer style="flex: none; display: flex; gap: 8px; padding: 12px 16px 18px; background: #ffffff; box-shadow: 0 -1px 0 rgba(12,19,53,0.08)">
      <a href="#" style="flex: none; height: 54px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 16px 0 12px; border: 1px solid rgba(12,19,53,0.18); border-radius: 15px; color: #0c1335; font: 600 15px 'Hanken Grotesk', sans-serif; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Retour au relevé</a>
      <button type="button" style="flex: 1; height: 54px; display: flex; align-items: center; justify-content: center; gap: 9px; border: 0; border-radius: 15px; background: #e2b54a; color: #0c1335; font: 700 16px 'Hanken Grotesk', sans-serif; box-shadow: 0 8px 20px rgba(201,154,43,0.38), inset 0 1px 0 rgba(255,255,255,0.45)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="6" r="2.6"/><circle cx="18" cy="18" r="2.6"/><path d="M8.3 10.8l7.4-3.6M8.3 13.2l7.4 3.6"/></svg>
        Envoyer le lien
      </button>
    </footer>
  </div>
</div>
