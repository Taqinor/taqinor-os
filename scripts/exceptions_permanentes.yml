safe_migrations:
  raison: migrations historiques déjà appliquées en production — immuables (check_safe_migrations.py)
  entrees:
    # YOPSB4 — allowlist of HISTORICAL migrations already merged to main that trip
    # scripts/check_safe_migrations.py's heuristics. Each was reviewed and is safe
    # in its actual context (e.g. RunPython using .all() without an explicit
    # .iterator()/batch marker on a table that was empty/small at migration time,
    # or an AddIndex predating the concurrent-index convention — YOPSB6). A NEW
    # migration is NOT added here: it must fix the flagged pattern instead.
    #
    # One relative repo path per line (forward slashes).
    # WIR95 — conversion des 8 références opaques `*_id` du module portail en
    # vraies FK string-référencées (5 modèles). Signalements : 8 RemoveField,
    # 8 RenameField, 1 RunPython `.update()` non batché. Ils sont INHÉRENTS au
    # patron entier -> FK (il n'existe pas de variante « corrigée » sans
    # RemoveField/RenameField), d'où l'exception à la règle d'en-tête, et non un
    # contournement : la revue a d'abord CORRIGÉ un vrai défaut avant d'autoriser
    # le fichier. Audit opération par opération (docstring en tête de la
    # migration) :
    #   - ALLER sans perte : la copie des ids (passe 3) précède TOUS les
    #     RemoveField (passe 4) ; le renommage (passe 5) ramène chaque colonne à
    #     son nom d'origine `<champ>_id`, donc `.filter(x_id=)/.create(x_id=)`
    #     continuent de fonctionner. `MigrationAutodetector` : 0 écart vs les
    #     modèles réels.
    #   - RETOUR corrigé pendant cette revue : le reverse était un `pass`, qui
    #     recréait les colonnes entières VIDES puis supprimait les `*_tmp_id`
    #     porteuses de la donnée => perte silencieuse des 8 références. Corrigé
    #     par (a) une passe 1 rendant nullables les 5 anciens entiers NOT NULL
    #     (sinon le ADD COLUMN du rollback est refusé sur table peuplée) et
    #     (b) un reverse qui RECOPIE `*_tmp_id -> *_id`. Rollback vérifié sans
    #     perte ; il échoue bruyamment (jamais silencieusement) si une ligne
    #     créée après coup porte une référence NULL.
    #   - `.update()` global assumé : tables `compta_*portail` à faible volume.
    # U3-900 (fondateur 29/08/2026) — RemoveField reviewed as part of the founder
    # order itself: `panneaux_par_900mad` fed the sizing rule `estimerPanneaux`,
    # which was deleted from the whole product this week (backend + generator
    # screen, PR #577/027d83eb); the column had no remaining reader anywhere in
    # the codebase (sweep verified). Reversible via migration reversal (restores
    # the column with its default of 8) — no companion data plan needed.
    # CRX35 (audit L3 CRM du 02/09/2026) — RemoveField reviewed: `Playbook.bloquant`
    # promised a hard block on stage changes with unchecked mandatory tasks, but NO
    # code ever read the column (verified twice by the audit, and again by a repo
    # sweep here: only the model declaration and the serializer field list). A UI
    # promise with no enforcement is worse than no feature. Reversible via migration
    # reversal (restores the column with its default of False) — no companion data
    # plan needed, the column carried no decision anywhere.
    # NTGRC3 (12/09/2026) — index (company, date_echeance) sur core.DataSubjectRequest :
    # table DSR quasi vide en production (quelques demandes), la construction de
    # l'index est instantanee — le verrou d'un AddIndex nu y est negligeable, et une
    # migration concurrent separee recreerait une collision de numerotation inter-lots.
    # SOLMVP12 (20/09/2026) — RemoveField reviewed as part of the founder-decided
    # Groupe SOLMVP detachment itself (docs/PLAN.md, "coquille de migrations" —
    # stock detaches from the parked flotte/qhse/rh apps): 4 kept->parked link
    # columns (StockVehicule.actif_flotte, PlanChargement.vehicule,
    # BlocageQualite.non_conformite, BudgetDepartement.departement), destructive
    # but explicitly revertable — restoring the parked app's folder + `migrate
    # stock <n-1>` recreates the column via Django's reverse RemoveField; only the
    # link VALUES are lost (standard RemoveField behaviour), noted at the DONE LOG
    # per the Groupe SOLMVP preamble. No table dropped, no django_migrations row
    # touched.
    # SOLMVP30b (20/09/2026) — same Groupe SOLMVP detachment: `CustomUser.poste_ref`
    # was the last kept->parked FK on `authentication` (nullable SET_NULL to
    # 'rh.Poste', rh now parked). Only the link column goes; `rh_poste` table and
    # rows are untouched (rh's shell is database_operations=[]), and the free-text
    # `CustomUser.poste` (the readable label) is unaffected — no job title lost.
    # Revertable: `migrate authentication 0032` recreates the (empty) column, then
    # `authentication.poste_sync.backfill_poste_ref` re-links it (return recipe:
    # docs/parked-modules.md).
    # SOLMVP14 (20/09/2026) — same Groupe SOLMVP detachment: sav drops its 3
    # link/feature columns to the parked rh app (`CategorieTicket.competences_
    # requises`/`niveau_competence_min`, `SavSlaSettings.affectation_par_
    # competence` — the "RH-required skills per category" feature retired with
    # rh.Competence). No SAV business table dropped, no django_migrations row
    # touched; destructive-revertable per the Groupe SOLMVP recipe.
    # AGR208 (Groupe AGR, 02/10/2026) — `agricole_prix_bonbonne` /
    # `agricole_cout_reel_bonbonne` (Q4, lus par aucun calcul depuis QJR236)
    # retirés APRÈS recopie de leurs valeurs dans le JSON
    # `reperes_energie_agricole` (RunPython réversible : le retour restaure les
    # deux colonnes et leurs valeurs). Destructive-revertable, revue humaine via
    # la tâche AGR208 (modèle opus).
    # AGR401 (02/10/2026) — RenameField pompe_cv -> pompe_actuelle_cv (Lead +
    # SiteProfile) : données conservées (elles décrivent déjà la pompe existante),
    # réversible (rename inverse), colonnes décimales identiques. Revue humaine.
    # AGR104 — RunPython .update() borné : une ligne de catalogue par SKU nommé
    # (≈40 SKU, filtre role_pompage='' ; jamais un update global de table),
    # réversible (retirer_roles). Pas de verrou long possible.
    # ACAL320 (C-ACAL-065, D-ACAL decision) — RemoveField de la section JSON
    # ParametresCalepinage.gabarits_dossier, jumelle dormante du modele
    # GabaritDossierReglementaire (aucune lecture hors serialisation). Reversible
    # (colonne recreee, defaut {}). Dry-run en lecture avant deploiement. Revue.
    - "backend/django_core/authentication/migrations/0004_customuser_role_legacy.py"
