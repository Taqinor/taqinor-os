tenant_exempt_models:
  raison: modèles globaux/inter-sociétés PAR CONCEPTION, sans société propriétaire (check_company_fk.py)
  entrees:
    # YDATA4 — models exempt from the company-scope guard (scripts/check_company_fk.py).
    # One 'app.Model' per line. Generated from the current repo state: after the
    # TextChoices/Exception classes living in models*.py were filtered out (they
    # are not Django models at all), exactly one genuine model remains global by
    # design — reviewed, not a gap to fix here.
    # XPLT20 inter-société group config — inherently cross-company (societe_a/
    # societe_b), ships inert/founder-gated (docs/decisions/XPLT20-inter-societes.md);
    # scope decided when the founder configures a pair. No single owning company.
    # YOPSB11 — cold-storage archive tables (append-only chatter/runs/webhooks). By
    # design they DENORMALISE their FKs to plain integer ids (company_id/lead_id/…) so
    # an archive never couples to the live table's lifecycle; company_id is retained so
    # per-company aggregate counts survive, but there is no company FK / TenantModel base.
    # NTEXT13 — global extension-marketplace CATALOGUE (shared, read-only reference
    # table of installable package templates). Not tenant business data: catalogue
    # rows are global gabarits any tenant browses before installing. Per-tenant
    # materialisation/installation (which IS company-scoped) is a separate brick
    # (NTEXT14, unbuilt). Reviewed global-by-design 2026-07-16.
    # NTADM18 — référentiel PLATEFORME des annonces produit de l'éditeur (« Quoi de
    # neuf » de l'ERP) + leurs accusés de lecture. Global par conception : une
    # nouveauté produit est publiée UNE fois par l'éditeur et concerne toutes les
    # sociétés — aucune n'en est propriétaire, ce n'est pas de la donnée métier de
    # tenant. La société du lecteur reste portée par `utilisateur.company`. Les
    # annonces INTERNES d'un tenant à ses équipes restent, elles, scopées société
    # (`notifications.Annonce`). Publication réservée à l'éditeur (superuser /
    # is_taqinor_support) : un Administrateur de tenant ne peut jamais diffuser
    # vers les autres sociétés. Reviewed global-by-design 2026-08-05.
    # N101 — demande d'inscription self-service (installateurs pilotes). Global par
    # conception : au moment du dépôt, la société N'EXISTE PAS ENCORE — c'est
    # justement ce que le fondateur va décider de créer. La rattacher à un tenant
    # serait un contresens. L'endpoint public ne crée jamais de compte ni de
    # société ; il est de plus PARQUÉ par défaut (TENANT_SIGNUP_ENABLED, 404 quand
    # éteint). Reviewed global-by-design 2026-08-05.
    # NTOBS15 — abonné PUBLIC de la page de statut (e-mail + jeton opaque, double
    # opt-in). S'abonne aux incidents SYSTÈME (company=None) : aucun tenant
    # propriétaire par conception — l'e-mail est l'identité, le jeton est l'accès.
    - "notifications.VapidKeyPair"
    - "compta.RegleInterSociete"
    - "compta.EcritureLiaisonInterSociete"
    - "automation.AutomationRunArchive"
    - "crm.LeadActivityArchive"
    - "publicapi.WebhookDeliveryArchive"
    - "extensions.ExtensionPackage"
    - "adminops.AnnonceProduit"
    - "adminops.LectureAnnonce"
    - "adminops.DemandeInscription"
    - "adminops.PlanLicence"
    - "statuspage.StatusSubscriber"

dockerignore_racine:
  raison: motifs .dockerignore racine-seul voulus (contexte de build explicite), clé fichier::motif (check_dockerignore.py)
  entrees:
    # ADEP4 - base DECROISSANTE des motifs .dockerignore racine-seul (une ligne =
    # `fichier::motif`). Ne jamais AJOUTER : ancrer le motif (`**/motif`) ou l'ecrire
    # `/motif` si la racine est voulue. Les lignes backend/fastapi_ia/ sont retirees par ADEP41
    # (propriete analyse). Racine / frontend : chemins de contexte explicites, voulus.
    - ".dockerignore::.git"
    - ".dockerignore::.github"
    - ".dockerignore::.claude"
    - ".dockerignore::.venv"
    - ".dockerignore::*.md"
    - ".dockerignore::docs"
    - ".dockerignore::backend"
    - ".dockerignore::.env"
    - ".dockerignore::frontend/parked"
    - ".dockerignore::backend/parked"
    - "frontend/.dockerignore::node_modules"
    - "frontend/.dockerignore::.git"
    - "frontend/.dockerignore::dist"
    - "frontend/.dockerignore::parked"

