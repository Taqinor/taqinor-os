  raison: colonnes dont decimal_places hors {2,4} est l'unité même (coût unitaire, taux par unité), clé fichier::Classe.champ (check_money_fields.py)
  entrees:
    # ASTK44 — MouvementStock.cout_unitaire : coût UNITAIRE interne, 4 décimales pour ne pas créer/détruire de valeur à l'arrondi.
