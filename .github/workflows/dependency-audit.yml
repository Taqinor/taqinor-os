name: dependency audit (CVE)

# NTPLT54 — audit CVE des dépendances : `pip-audit` sur requirements.txt +
# `npm audit` sur le frontend (dépendances de prod).
#
# ENF12 (règle fondateur 09/10/2026, docs/claude-memory/enforce-all-checks.md) :
# job BLOQUANT — plus de `continue-on-error`, plus de `|| true`.
# Seuil : toute vulnérabilité HIGH ou CRITICAL fait échouer le job.
#   * backend : pip-audit ne donne pas la sévérité → scripts/check_cve_severite.py
#     la lit sur OSV (avis GHSA) ; sévérité introuvable = bloquante.
#   * frontend : `npm audit --omit dev --audit-level=high` (natif).
# Mesure du 09/10/2026 : 5 HIGH backend (Django 5.1.15, cryptography 46.0.7 ×3,
# langchain-core 0.3.86) + 1 HIGH frontend (axios 1.19.0) — corrigées par
# montée de version (Django 5.2.18, cryptography 50, langchain-text-splitters
# 1.1.3, axios 1.20).
# ADCG60-62 (10/11/2026) : la garde ne bloquait pas (tee sans pipefail) ; run
# 42642271013 = 31 HIGH/CRITICAL backend + 1 HIGH frontend imprimés en vert.
# Montées : Pillow 13.0.0, djangorestframework 3.18.2, dnspython 2.9.0,
# follow-redirects 1.16.2 (transitif d'axios).
#
# Déclencheurs : hebdomadaire (nouvelles CVE publiées sur un arbre inchangé),
# lancement manuel, et `workflow_call` : ADCG72 — toute PR / entrée de merge
# queue qui modifie un manifeste l'appelle depuis `ci.yml` (job
# `dependency-audit`, suivi par le check REQUIS `backend-lint`).
on:
  workflow_dispatch: {}
  workflow_call: {}
  schedule:
    - cron: '0 6 * * 1'   # lundi 06:00 UTC, hebdomadaire

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      # pip-audit rend 1 dès qu'il trouve UNE vulnérabilité (même LOW) : ce
      # code est attendu, la décision revient à la garde de sévérité qui suit.
      # Tout AUTRE code (résolution impossible, réseau) fait échouer l'étape.
      - name: pip-audit (backend)
        run: |
          set +e
          pip-audit -r backend/django_core/requirements.txt -f json -o pip-audit.json
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "pip-audit en erreur (code $rc)"; exit "$rc"
          fi

      # ADCG62 (C-ADCG-033) — `set -o pipefail` : sans lui le code de `tee` (0)
      # masquait celui de la garde (31 HIGH/CRITICAL imprimés, étape verte).
      - name: Garde HIGH/CRITICAL (backend)
        run: |
          set -o pipefail
          python scripts/check_cve_severite.py pip-audit.json | tee pip-audit-gate.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: npm audit (frontend, prod deps, HIGH/CRITICAL bloquant)
        working-directory: frontend
        run: |
          set -o pipefail
          npm audit --omit dev --audit-level=high | tee ../npm-audit.txt

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: |
            pip-audit.json
            pip-audit-gate.txt
            npm-audit.txt

      # ADCG70 — passage HEBDOMADAIRE vert : l'issue ouverte reçoit le lien du run
      # puis est fermée (patron api-fuzz-full.yml::alerte).
      - name: Close issue (passage hebdomadaire vert)
        if: success() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'dependency-audit',
            });
            const dup = existing.data.find(i => i.title.startsWith('[dependency-audit]'));
            if (dup) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: dup.number,
                body: `Audit CVE hebdomadaire de nouveau vert : ${run}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: dup.number, state: 'closed',
              });
            }

      # Échec du passage HEBDOMADAIRE : une issue récapitulative (pas de doublon).
      - name: Open issue on HIGH/CRITICAL (hebdomadaire)
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const lire = (f) => { try { return fs.readFileSync(f, 'utf8'); } catch (e) { return '(absent)'; } };
            const body = `## Audit CVE hebdomadaire (NTPLT54 / ENF12)\n\n### Backend\n\`\`\`\n${lire('pip-audit-gate.txt')}\n\`\`\`\n\n### Frontend\n\`\`\`\n${lire('npm-audit.txt').slice(0, 4000)}\n\`\`\``;
            const title = '[dependency-audit] vulnérabilité(s) HIGH/CRITICAL';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'dependency-audit',
            });
            const dup = existing.data.find(i => i.title.startsWith('[dependency-audit]'));
            if (dup) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: dup.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['dependency-audit'],
              });
            }
