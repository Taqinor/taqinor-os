name: dependency audit (CVE)

# NTPLT54 — audit CVE des dépendances : `pip-audit` sur requirements.txt +
# `npm audit` sur le frontend (dépendances de prod).
#
# ENF12 (règle fondateur 09/10/2026, docs/claude-memory/enforce-all-checks.md) :
# job BLOQUANT — plus de `continue-on-error`, plus de `|| true`.
# Seuil : toute vulnérabilité HIGH ou CRITICAL fait échouer le job.
#   * backend : pip-audit ne donne pas la sévérité → scripts/check_cve_severite.py
#     la lit sur OSV (avis GHSA) ; sévérité introuvable = bloquante.
#   * frontend : `npm audit --omit dev --audit-level=high` (natif).
# Mesure du 09/10/2026 : 5 HIGH backend (Django 5.1.15, cryptography 46.0.7 ×3,
# langchain-core 0.3.86) + 1 HIGH frontend (axios 1.19.0) — corrigées par
# montée de version (Django 5.2.18, cryptography 50, langchain-text-splitters
# 1.1.3, axios 1.20). Restent 2 MODERATE (djangorestframework 3.15.2, corrigé
# en 3.17.2) : listées, non bloquantes à ce seuil.
#
# Déclencheurs : hebdomadaire (nouvelles CVE publiées sur un arbre inchangé),
# toute PR qui modifie un manifeste de dépendances, lancement manuel.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * 1'   # lundi 06:00 UTC, hebdomadaire
  pull_request:
    paths:
      - 'backend/django_core/requirements.txt'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'scripts/check_cve_severite.py'
      - '.github/workflows/dependency-audit.yml'

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      # pip-audit rend 1 dès qu'il trouve UNE vulnérabilité (même LOW) : ce
      # code est attendu, la décision revient à la garde de sévérité qui suit.
      # Tout AUTRE code (résolution impossible, réseau) fait échouer l'étape.
      - name: pip-audit (backend)
        run: |
          set +e
          pip-audit -r backend/django_core/requirements.txt -f json -o pip-audit.json
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "pip-audit en erreur (code $rc)"; exit "$rc"
          fi

      - name: Garde HIGH/CRITICAL (backend)
        run: python scripts/check_cve_severite.py pip-audit.json | tee pip-audit-gate.txt

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: npm audit (frontend, prod deps, HIGH/CRITICAL bloquant)
        working-directory: frontend
        run: npm audit --omit dev --audit-level=high | tee ../npm-audit.txt

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-report
          path: |
            pip-audit.json
            pip-audit-gate.txt
            npm-audit.txt

      # Échec du passage HEBDOMADAIRE : une issue récapitulative (pas de doublon).
      - name: Open issue on HIGH/CRITICAL (hebdomadaire)
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const lire = (f) => { try { return fs.readFileSync(f, 'utf8'); } catch (e) { return '(absent)'; } };
            const body = `## Audit CVE hebdomadaire (NTPLT54 / ENF12)\n\n### Backend\n\`\`\`\n${lire('pip-audit-gate.txt')}\n\`\`\`\n\n### Frontend\n\`\`\`\n${lire('npm-audit.txt').slice(0, 4000)}\n\`\`\``;
            const title = '[dependency-audit] vulnérabilité(s) HIGH/CRITICAL';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'dependency-audit',
            });
            const dup = existing.data.find(i => i.title.startsWith('[dependency-audit]'));
            if (dup) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: dup.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['dependency-audit'],
              });
            }
