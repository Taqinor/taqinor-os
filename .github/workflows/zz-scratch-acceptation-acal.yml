name: zz scratch - acceptation ACAL366/367 (essai runner, TEMPORAIRE)

# ESSAI (13/11/2026) : jouer les preuves en direct ACAL366 / ACAL367 (spec frontend/e2e/acceptation/acal4.spec.js)
# sur un runner GitHub. Squelette = `ci-image-check` + `e2e-full` de release-verify.yml. La cle carte est la cle
# CLIENT PUBLIQUE servie par le site public (GET https://taqinor.ma/api/roof-config), lue a l'execution et masquee :
# jamais ecrite dans le depot. Declenche seulement par un push sur la branche d'essai ; supprime au dernier commit.
on:
  push:
    branches: [acceptation-acal-runner]

concurrency:
  group: zz-scratch-acceptation-acal
  cancel-in-progress: true

jobs:
  ci-image-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
      image_e2e: ${{ steps.tag.outputs.image_e2e }}
    steps:
      - uses: actions/checkout@v4
      - name: Calculer les etiquettes des images
        id: tag
        run: bash .github/ci-image/tag.sh "${{ github.repository }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Les images sont-elles deja publiees ?
        id: exists
        run: |
          set -uo pipefail
          for couple in "backend:${{ steps.tag.outputs.image }}" "e2e:${{ steps.tag.outputs.image_e2e }}"; do
            cle="${couple%%:*}"; ref="${couple#*:}"
            if docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "Presente : $ref"; echo "${cle}=true" >> "$GITHUB_OUTPUT"
            else
              echo "ABSENTE : $ref"; echo "${cle}=false" >> "$GITHUB_OUTPUT"
            fi
          done
          exit 0
      - uses: docker/setup-buildx-action@v3
        if: ${{ steps.exists.outputs.backend != 'true' || steps.exists.outputs.e2e != 'true' }}
      - name: Construire et pousser ci-backend si elle manque
        if: ${{ steps.exists.outputs.backend != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: backend/django_core
          file: .github/ci-image/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Construire et pousser ci-e2e si elle manque
        if: ${{ steps.exists.outputs.e2e != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: .github/ci-image/Dockerfile.e2e
          build-args: |
            CI_BACKEND_IMAGE=${{ steps.tag.outputs.image }}
          push: true
          tags: ${{ steps.tag.outputs.image_e2e }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  acceptation-acal:
    needs: ci-image-check
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    container:
      image: ${{ needs.ci-image-check.outputs.image_e2e }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      redis:
        image: mirror.gcr.io/library/redis:7.4-alpine
        ports:
          - 6379:6379
    env:
      DJANGO_SETTINGS_MODULE: erp_agentique.settings.dev
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
      DJANGO_DEBUG: 'True'
      DB_NAME: erp_db
      DB_USER: erp_user
      DB_PASSWORD: ci_password
      DB_HOST: localhost
      DB_PORT: '5432'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      WEBSITE_LEAD_WEBHOOK_SECRET: e2e-webhook-secret
      E2E_WEBHOOK_SECRET: e2e-webhook-secret
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      MINIO_ENDPOINT: localhost:9000
      MINIO_ROOT_USER: erp_admin
      MINIO_ROOT_PASSWORD: erp_minio_password
      MINIO_BUCKET_PDF: erp-pdf
      MINIO_BUCKET_UPLOADS: erp-uploads
      TENANT_RATE_LIMIT: '0'
      LOGIN_RATE_LIMIT: '1000/minute'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: ./.github/actions/backend-env
        with:
          testdb-cache-into: erp_db
          prebuilt-image: 'true'
          testdb-save: 'false'
      - name: Migrate + seed demo
        working-directory: backend/django_core
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo
          python manage.py seed_catalogue
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Playwright chromium (deja dans l'image)
        working-directory: frontend
        run: npx playwright install chromium
      - name: Build frontend (sans service worker)
        working-directory: frontend
        env:
          VITE_E2E: '1'
        run: npm run build
      - name: Cle carte publique (lue a l'execution, masquee, jamais commitee)
        run: |
          set -euo pipefail
          rep=$(curl -fsS https://taqinor.ma/api/roof-config)
          cle=$(printf '%s' "$rep" | python -c "import sys,json; print(json.load(sys.stdin).get('maptilerKey') or '')")
          jeton=$(printf '%s' "$rep" | python -c "import sys,json; print(json.load(sys.stdin).get('mapboxToken') or '')")
          echo "::add-mask::$cle"
          if [ -n "$jeton" ]; then echo "::add-mask::$jeton"; fi
          if [ -z "$cle" ]; then echo "roof-config ne sert aucune cle MapTiler"; exit 1; fi
          echo "cle MapTiler lue (${#cle} caracteres), jeton Mapbox (${#jeton} caracteres)"
          echo "PUBLIC_MAPTILER_KEY=$cle" >> "$GITHUB_ENV"
          echo "PUBLIC_MAPBOX_TOKEN=$jeton" >> "$GITHUB_ENV"
          # Diagnostic : la cle est-elle restreinte par origine ? (statut HTTP seulement)
          for o in http://localhost:4173 http://127.0.0.1:4173 https://taqinor.ma; do
            s=$(curl -s -o /dev/null -w '%{http_code}' -H "Origin: $o" -H "Referer: $o/" "https://api.maptiler.com/maps/hybrid/style.json?key=$cle" || true)
            t=$(curl -s -o /dev/null -w '%{http_code}' -H "Origin: $o" -H "Referer: $o/" "https://api.maptiler.com/tiles/satellite-v2/18/125929/104555.jpg?key=$cle" || true)
            echo "Origine $o : style.json HTTP $s ; tuile satellite HTTP $t"
          done
      - name: Django + spec d'acceptation ACAL (acal4)
        working-directory: backend/django_core
        env:
          E2E_ACCEPTATION: '1'
          ACCEPTATION_SHA: ${{ github.sha }}
        run: |
          gunicorn erp_agentique.wsgi:application \
            --bind 127.0.0.1:8000 --workers 3 --timeout 120 --worker-class sync \
            --access-logfile /tmp/gunicorn-access.log \
            --error-logfile /tmp/gunicorn-error.log --capture-output &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/django/admin/login/ || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then echo "Django pret (HTTP $code)"; break; fi
            echo "Attente Django ($i)"; sleep 2
            if [ "$i" = "30" ]; then echo "Django indisponible"; exit 1; fi
          done
          export E2E_DJANGO_EXEC="env -C ${GITHUB_WORKSPACE}/backend/django_core"
          cd ../../frontend
          npx playwright test --project=acceptation e2e/acceptation/acal4.spec.js
      - name: Queue des journaux gunicorn (diagnostic)
        if: ${{ !cancelled() }}
        run: |
          tail -n 120 /tmp/gunicorn-error.log || true
      - name: Upload enregistrement d'acceptation (petit)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: acceptation-acal-enregistrement
          path: |
            docs/audits/acceptation/ACAL/
            docs/qa-explorer/captures/*/ACCEPTATION-ACAL-*
          retention-days: 7
          if-no-files-found: warn
      - name: Upload rapport Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: acceptation-acal-rapport-playwright
          path: frontend/playwright-report
          retention-days: 7
          if-no-files-found: ignore
