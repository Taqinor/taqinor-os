# ATELIER TEMPORAIRE (PR #1041, moteur C&I L3 lot 4) — SUPPRIMÉ AVANT LE MERGE.
# Recapture, dans l'image CI avec la base de test restaurée, des goldens que
# le lot 4 (AMOT95-101, ADEV104-105) change légitimement et qui ne se recapturent pas sur l'hôte
# (ni WeasyPrint ni Postgres ici — mémoire nightly-verify-scratch-workflow) :
#   - apps/ventes/tests/golden/moteur/build_quote_data/ (UPDATE_GOLDEN=1)
#   - apps/ventes/tests/golden/split_pv_comportement.json (SPLIT_GOLDEN_CAPTURE=1)
#   - apps/crm/golden/scission_crm*/ (UPDATE_GOLDEN=1 — AST, serialiseurs, HTTP)
# puis rejoue les modules rouges pour lister ce qui reste. Les goldens sortent
# en artefact ; l'orchestrateur les télécharge et les commite.
name: zz-scratch-l3-lot4-goldens

on:
  push:
    branches: [claude/ci-quote-l3-lot4]

concurrency:
  group: zz-scratch-l3-lot4-goldens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-image-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Calculer les etiquettes des images
        id: tag
        run: bash .github/ci-image/tag.sh "${{ github.repository }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: L'image backend est-elle publiee ?
        run: docker manifest inspect "${{ steps.tag.outputs.image }}" >/dev/null

  goldens:
    needs: ci-image-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    container:
      image: ${{ needs.ci-image-check.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      redis:
        image: mirror.gcr.io/library/redis:7.4-alpine
        ports:
          - 6379:6379
    env:
      DJANGO_SETTINGS_MODULE: erp_agentique.settings.dev
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
      DJANGO_DEBUG: 'True'
      DB_NAME: erp_db
      DB_USER: erp_user
      DB_PASSWORD: ci_password
      DB_HOST: localhost
      DB_PORT: '5432'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      MINIO_ENDPOINT: localhost:9000
      MINIO_ROOT_USER: erp_admin
      MINIO_ROOT_PASSWORD: erp_minio_password
      MINIO_BUCKET_PDF: erp-pdf
      MINIO_BUCKET_UPLOADS: erp-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/backend-env
        with:
          testdb-cache-into: test_erp_db
          prebuilt-image: 'true'
          testdb-save: 'false'
      - name: Recapturer les goldens (build_quote_data, split public, scission crm)
        working-directory: backend/django_core
        run: |
          set -o pipefail
          UPDATE_GOLDEN=1 python manage.py test apps.ventes.tests.test_moteur_golden_build_quote_data apps.crm.tests_services_split_golden --keepdb -v 2 2>&1 | tail -40 || true
          SPLIT_GOLDEN_CAPTURE=1 python manage.py test apps.ventes.tests.test_split_devis_public.ComportementPublicTests --keepdb -v 2 2>&1 | tail -20 || true
          git status --short -- apps/ventes/tests/golden apps/crm/golden | head -40
      - name: Rejouer les modules rouges de la PR (verdict apres recapture)
        working-directory: backend/django_core
        run: |
          python manage.py test apps.ventes.tests.test_moteur_golden_build_quote_data apps.ventes.tests.test_split_devis_public apps.ventes.tests.test_regles_calcul_rendu_origine apps.crm.tests_services_split_golden apps.ventes.tests.test_quote_engine apps.ventes.tests.test_ciq342_finance_25_ans apps.ventes.tests.test_ciq333_commercial_langues apps.ventes.tests.test_ciq345_industriel_langues apps.ventes.tests.test_ciq210_onepage_ci apps.ventes.tests.test_ciq210_branchement apps.ventes.tests.test_qx46_commercial_quote apps.ventes.tests.test_qx45_industriel_quote apps.ventes.tests.test_ciq206_flux_ci apps.ventes.tests.test_ciq118_etude_ci_preview apps.ventes.tests.test_ciq314_services_ci apps.ventes.tests.test_ciq315_base_ht_ttc apps.ventes.tests.test_ciq343_indicateurs_cfo apps.ventes.tests.test_ciq331_pdf_commercial_complet apps.ventes.tests.test_ciq341_couverture_industrielle apps.parametres.tests_ciq211_reglages_ci --keepdb -v 2 2>&1 | grep -E "^(FAIL|ERROR)|^Ran|^OK|FAILED|Error" | tail -80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goldens-l3-lot4
          path: |
            backend/django_core/apps/ventes/tests/golden/
            backend/django_core/apps/crm/golden/
          if-no-files-found: error
