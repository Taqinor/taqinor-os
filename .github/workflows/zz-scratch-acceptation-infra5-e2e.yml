name: zz scratch - acceptation infra5 e2e /proposition (ATST30, essai runner, TEMPORAIRE)

# ESSAI (14/11/2026) : rejoue la partie /proposition du job `e2e-shard (2)` de ci.yml (apps/web servi en
# dev, WEB_URL pose) pour les 3 specs AGR318/CIQ334/CIQ346 d'ATST30 et publie le rapport Playwright AVEC
# les captures FR/AR (dans ci.yml la seconde invocation playwright ecrase playwright-report).
# Declenche seulement par un push sur la branche d'essai ; supprime au dernier commit.
on:
  push:
    branches: [acceptation-infra5-94854b]
    paths: ['.github/workflows/zz-scratch-acceptation-infra5-e2e.yml']

concurrency:
  group: zz-scratch-acceptation-infra5-e2e
  cancel-in-progress: true

jobs:
  ci-image-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
      image_e2e: ${{ steps.tag.outputs.image_e2e }}
    steps:
      - uses: actions/checkout@v4
      - name: Calculer les etiquettes des images
        id: tag
        run: bash .github/ci-image/tag.sh "${{ github.repository }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Les images sont-elles deja publiees ?
        id: exists
        run: |
          set -uo pipefail
          for couple in "backend:${{ steps.tag.outputs.image }}" "e2e:${{ steps.tag.outputs.image_e2e }}"; do
            cle="${couple%%:*}"; ref="${couple#*:}"
            if docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "Presente : $ref"; echo "${cle}=true" >> "$GITHUB_OUTPUT"
            else
              echo "ABSENTE : $ref"; echo "${cle}=false" >> "$GITHUB_OUTPUT"
            fi
          done
          exit 0
      - uses: docker/setup-buildx-action@v3
        if: ${{ steps.exists.outputs.backend != 'true' || steps.exists.outputs.e2e != 'true' }}
      - name: Construire et pousser ci-backend si elle manque
        if: ${{ steps.exists.outputs.backend != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: backend/django_core
          file: .github/ci-image/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Construire et pousser ci-e2e si elle manque
        if: ${{ steps.exists.outputs.e2e != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: .github/ci-image/Dockerfile.e2e
          build-args: |
            CI_BACKEND_IMAGE=${{ steps.tag.outputs.image }}
          push: true
          tags: ${{ steps.tag.outputs.image_e2e }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  e2e-proposition:
    needs: ci-image-check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    container:
      image: ${{ needs.ci-image-check.outputs.image_e2e }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      redis:
        image: mirror.gcr.io/library/redis:7.4-alpine
        ports:
          - 6379:6379
    env:
      DJANGO_SETTINGS_MODULE: erp_agentique.settings.dev
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
      DJANGO_DEBUG: 'True'
      DB_NAME: erp_db
      DB_USER: erp_user
      DB_PASSWORD: ci_password
      DB_HOST: localhost
      DB_PORT: '5432'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      MINIO_ENDPOINT: localhost:9000
      MINIO_ROOT_USER: erp_admin
      MINIO_ROOT_PASSWORD: erp_minio_password
      MINIO_BUCKET_PDF: erp-pdf
      MINIO_BUCKET_UPLOADS: erp-uploads
      TENANT_RATE_LIMIT: '0'
      LOGIN_RATE_LIMIT: '1000/minute'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: ./.github/actions/backend-env
        with:
          testdb-cache-into: erp_db
          prebuilt-image: 'true'
          testdb-save: 'false'
      - name: Migrate + seed demo
        working-directory: backend/django_core
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo
          python manage.py seed_catalogue
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Playwright chromium (deja dans l'image)
        working-directory: frontend
        run: npx playwright install chromium
      - name: Build frontend (sans service worker)
        working-directory: frontend
        env:
          VITE_E2E: '1'
        run: npm run build
      - name: Django + apps/web (dev) + specs /proposition FR/AR (comme e2e-shard 2 de ci.yml)
        working-directory: backend/django_core
        run: |
          gunicorn erp_agentique.wsgi:application \
            --bind 127.0.0.1:8000 --workers 4 --timeout 120 --worker-class sync &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/django/admin/login/ || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then echo "Django pret (HTTP $code)"; break; fi
            echo "Attente Django ($i)"; sleep 2
            if [ "$i" = "30" ]; then echo "Django indisponible"; exit 1; fi
          done
          cd ../../frontend
          (cd ../apps/web && npm ci --prefer-offline --no-audit --no-fund)
          (cd ../apps/web && PUBLIC_API_BASE=http://127.0.0.1:8000 \
            npm run dev -- --host 127.0.0.1 --port 4321 > /tmp/web-dev.log 2>&1) &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4321/ || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then echo "apps/web pret (HTTP $code)"; break; fi
            sleep 2
            if [ "$i" = "60" ]; then cat /tmp/web-dev.log; echo "apps/web indisponible"; exit 1; fi
          done
          export WEB_URL=http://127.0.0.1:4321
          npx playwright test --project=chromium devis-agricole-document.spec.js \
            devis-ci-commercial.spec.js devis-ci-industriel.spec.js
      - name: Upload rapport Playwright (captures FR/AR)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: acceptation-infra5-proposition-rapport
          path: frontend/playwright-report
          retention-days: 7
          if-no-files-found: warn
