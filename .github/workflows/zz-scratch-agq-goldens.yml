# ATELIER TEMPORAIRE (PR #1035, audit agricole AGQ phase 2) — SUPPRIMÉ AVANT LE MERGE.
# Recapture, dans l'image CI avec la base de test restaurée, des goldens que
# le drain AGQ change légitimement et qui ne se recapturent pas sur l'hôte
# (ni WeasyPrint ni Postgres ici — mémoire nightly-verify-scratch-workflow) :
#   - apps/ventes/tests/golden/moteur/build_quote_data/ (UPDATE_GOLDEN=1)
#   - apps/ventes/tests/golden/split_pv_comportement.json (SPLIT_GOLDEN_CAPTURE=1)
#   - apps/crm/golden/scission_crm*/ (UPDATE_GOLDEN=1 — AST, serialiseurs, HTTP)
# puis rejoue les modules rouges pour lister ce qui reste. Les goldens sortent
# en artefact ; l'orchestrateur les télécharge et les commite.
name: zz-scratch-agq-goldens

on:
  push:
    branches: [claude/agq-acceptation-phase2]

concurrency:
  group: zz-scratch-agq-goldens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-image-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Calculer les etiquettes des images
        id: tag
        run: bash .github/ci-image/tag.sh "${{ github.repository }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: L'image backend est-elle publiee ?
        run: docker manifest inspect "${{ steps.tag.outputs.image }}" >/dev/null

  goldens:
    needs: ci-image-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    container:
      image: ${{ needs.ci-image-check.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      redis:
        image: mirror.gcr.io/library/redis:7.4-alpine
        ports:
          - 6379:6379
    env:
      DJANGO_SETTINGS_MODULE: erp_agentique.settings.dev
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
      DJANGO_DEBUG: 'True'
      DB_NAME: erp_db
      DB_USER: erp_user
      DB_PASSWORD: ci_password
      DB_HOST: localhost
      DB_PORT: '5432'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      MINIO_ENDPOINT: localhost:9000
      MINIO_ROOT_USER: erp_admin
      MINIO_ROOT_PASSWORD: erp_minio_password
      MINIO_BUCKET_PDF: erp-pdf
      MINIO_BUCKET_UPLOADS: erp-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/backend-env
        with:
          testdb-cache-into: test_erp_db
          prebuilt-image: 'true'
          testdb-save: 'false'
      - name: Diagnostic rendu d'origine (dump branche puis main)
        working-directory: backend/django_core
        run: |
          cat > /tmp/zz_dump_rendu.py <<'PY'
          import hashlib, itertools, os
          import apps.ventes.tests.test_regles_calcul_rendu_origine as m
          _c = itertools.count()
          class _H:
              def __getattr__(self, n):
                  return getattr(hashlib, n)
              def sha256(self, b=b''):
                  with open(os.path.join(os.environ['DUMP_DIR'], '%03d.json' % next(_c)), 'wb') as f:
                      f.write(b)
                  return hashlib.sha256(b)
          m.hashlib = _H()
          class Dump(m.RenduReglesOrigineTests):
              pass
          PY
          mkdir -p /tmp/dump_branche /tmp/dump_main
          cp /tmp/zz_dump_rendu.py apps/ventes/tests/zz_dump_rendu.py
          DUMP_DIR=/tmp/dump_branche python manage.py test apps.ventes.tests.zz_dump_rendu.Dump.test_devis_envoye_rendu_comme_avant_les_correctifs --keepdb 2>&1 | tail -3 || true
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin main
          git -C "$GITHUB_WORKSPACE" worktree add /tmp/main FETCH_HEAD
          cp /tmp/zz_dump_rendu.py /tmp/main/backend/django_core/apps/ventes/tests/zz_dump_rendu.py
          cp "$GITHUB_WORKSPACE/STAGES.py" /tmp/main/ 2>/dev/null || true
          cd /tmp/main/backend/django_core
          DUMP_DIR=/tmp/dump_main python manage.py test apps.ventes.tests.zz_dump_rendu.Dump.test_devis_envoye_rendu_comme_avant_les_correctifs --keepdb 2>&1 | tail -3 || true
          ls /tmp/dump_branche | wc -l; ls /tmp/dump_main | wc -l
          for f in /tmp/dump_branche/*.json; do b=$(basename $f); cmp -s $f /tmp/dump_main/$b || echo "DIFF $b"; done | head -40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dump-rendu
          path: |
            /tmp/dump_branche/
            /tmp/dump_main/
      - name: Rejouer les modules rouges de la PR (verdict apres recapture)
        working-directory: backend/django_core
        run: |
          python manage.py test apps.ventes.tests.test_moteur_golden_build_quote_data apps.ventes.tests.test_split_devis_public apps.ventes.tests.test_regles_calcul_rendu_origine apps.crm.tests_services_split_golden apps.ventes.tests.test_agr121_etude_pompage_preview apps.ventes.tests.test_agr124_devis_auto_agricole apps.ventes.tests.test_agr_economie_pompage apps.ventes.tests.test_agr304_synthese_agricole apps.ventes.tests.test_agr310_renderer_agricole apps.ventes.tests.test_agr319_note_calcul --keepdb -v 2 2>&1 | grep -E "^(FAIL|ERROR)|^Ran|^OK|FAILED|Error" | tail -60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goldens-agq
          path: |
            backend/django_core/apps/ventes/tests/golden/
            backend/django_core/apps/crm/golden/
          if-no-files-found: error
