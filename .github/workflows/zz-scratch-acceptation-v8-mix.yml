name: zz scratch - acceptation v8 mix (AIC98 ASTK250 ACEL31 ADCG14, TEMPORAIRE)

# Vague d'acceptation 8 (17/11/2026), lane mix8 : AIC98 (aic4), ASTK250 (astk5), ACEL31 (acel3), ADCG14 (pile compose) - METHODE §C.4 point 7
# sur un runner GitHub au lieu de la pile Docker locale. Squelette = `ci-image-check` + `e2e-full` de
# release-verify.yml. Declenche seulement par un push sur la branche d'essai ; supprime au dernier commit.
on:
  push:
    branches: [acceptation-v8-mix]

concurrency:
  group: zz-scratch-acceptation-v8-mix
  cancel-in-progress: true

jobs:
  ci-image-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
      image_e2e: ${{ steps.tag.outputs.image_e2e }}
    steps:
      - uses: actions/checkout@v4
      - name: Calculer les etiquettes des images
        id: tag
        run: bash .github/ci-image/tag.sh "${{ github.repository }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Les images sont-elles deja publiees ?
        id: exists
        run: |
          set -uo pipefail
          for couple in "backend:${{ steps.tag.outputs.image }}" "e2e:${{ steps.tag.outputs.image_e2e }}"; do
            cle="${couple%%:*}"; ref="${couple#*:}"
            if docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "Presente : $ref"; echo "${cle}=true" >> "$GITHUB_OUTPUT"
            else
              echo "ABSENTE : $ref"; echo "${cle}=false" >> "$GITHUB_OUTPUT"
            fi
          done
          exit 0
      - uses: docker/setup-buildx-action@v3
        if: ${{ steps.exists.outputs.backend != 'true' || steps.exists.outputs.e2e != 'true' }}
      - name: Construire et pousser ci-backend si elle manque
        if: ${{ steps.exists.outputs.backend != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: backend/django_core
          file: .github/ci-image/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Construire et pousser ci-e2e si elle manque
        if: ${{ steps.exists.outputs.e2e != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: .github/ci-image/Dockerfile.e2e
          build-args: |
            CI_BACKEND_IMAGE=${{ steps.tag.outputs.image }}
          push: true
          tags: ${{ steps.tag.outputs.image_e2e }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  acceptation-v8-mix:
    needs: ci-image-check
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    container:
      image: ${{ needs.ci-image-check.outputs.image_e2e }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      redis:
        image: mirror.gcr.io/library/redis:7.4-alpine
        ports:
          - 6379:6379
    env:
      DJANGO_SETTINGS_MODULE: erp_agentique.settings.dev
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
      DJANGO_DEBUG: 'True'
      DB_NAME: erp_db
      DB_USER: erp_user
      DB_PASSWORD: ci_password
      DB_HOST: localhost
      DB_PORT: '5432'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      WEBSITE_LEAD_WEBHOOK_SECRET: e2e-webhook-secret
      E2E_WEBHOOK_SECRET: e2e-webhook-secret
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      MINIO_ENDPOINT: localhost:9000
      MINIO_ROOT_USER: erp_admin
      MINIO_ROOT_PASSWORD: erp_minio_password
      MINIO_BUCKET_PDF: erp-pdf
      MINIO_BUCKET_UPLOADS: erp-uploads
      TENANT_RATE_LIMIT: '0'
      LOGIN_RATE_LIMIT: '1000/minute'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: ./.github/actions/backend-env
        with:
          testdb-cache-into: erp_db
          prebuilt-image: 'true'
          testdb-save: 'false'
      - name: Migrate + seed demo
        working-directory: backend/django_core
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo
          python manage.py seed_catalogue
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Playwright chromium (deja dans l'image)
        working-directory: frontend
        run: npx playwright install chromium
      - name: Build frontend (sans service worker)
        working-directory: frontend
        env:
          VITE_E2E: '1'
        run: npm run build
      - name: Django + specs d acceptation v8 mix
        working-directory: backend/django_core
        env:
          E2E_ACCEPTATION: '1'
          E2E_SONDE_LOCALE: '1'
          ACCEPTATION_SHA: ${{ github.sha }}
        run: |
          gunicorn erp_agentique.wsgi:application \
            --bind 127.0.0.1:8000 --workers 3 --timeout 120 --worker-class sync \
            --access-logfile /tmp/gunicorn-access.log \
            --error-logfile /tmp/gunicorn-error.log --capture-output &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/django/admin/login/ || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then echo "Django pret (HTTP $code)"; break; fi
            echo "Attente Django ($i)"; sleep 2
            if [ "$i" = "30" ]; then echo "Django indisponible"; exit 1; fi
          done
          export E2E_DJANGO_EXEC="env -C ${GITHUB_WORKSPACE}/backend/django_core"
          cd ../../frontend
          npx playwright test --project=acceptation e2e/acceptation/aic4.spec.js e2e/acceptation/astk5.spec.js e2e/acceptation/acel3.spec.js
      - name: Queue des journaux gunicorn (diagnostic)
        if: ${{ !cancelled() }}
        run: |
          tail -n 120 /tmp/gunicorn-error.log || true
      - name: Upload enregistrement d'acceptation (petit)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: acceptation-v8-mix-enregistrement
          path: |
            docs/audits/acceptation/AIC/
            docs/audits/acceptation/ASTK/
            docs/audits/acceptation/ACEL/
            docs/qa-explorer/captures/*/ACCEPTATION-AIC-*.jpg
            docs/qa-explorer/captures/*/ACCEPTATION-ASTK-*.jpg
            docs/qa-explorer/captures/*/ACCEPTATION-ACEL-*.jpg
          retention-days: 7
          if-no-files-found: warn
      - name: Upload rapport Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: acceptation-v8-mix-rapport-playwright
          path: frontend/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  # ADCG14 (clause realignee par ADCG119, D-ADCG-4 = lire_state_health) : pile compose COMPLETE `docker compose up -d` dans un
  # job ubuntu-latest SEPARE (jamais dans le conteneur e2e) ; ps => 3 (healthy) ; pause redis => State.Health.Status unhealthy,
  # nginx toujours 200 ; unpause => healthy. Trace ecrite en fichier, rapatriee puis enregistrement ecrit a la main.
  pile-compose-adcg14:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Liberer de la place disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: .env de la pile = copie de .env.example (aucune retouche)
        run: |
          cp .env.example .env
          D="adcg14-trace"; mkdir -p "$D"; echo "TRACES=$D" >> "$GITHUB_ENV"
      - name: Construire les images de la pile (journal en fichier)
        run: |
          set -o pipefail
          if ! docker compose build > /tmp/compose-build.log 2>&1; then tail -n 150 /tmp/compose-build.log; exit 1; fi
          tail -n 15 /tmp/compose-build.log; df -h /
      - name: ADCG14 - docker compose up -d, 3 (healthy), pause redis => unhealthy, nginx servi, unpause => healthy
        run: |
          set -uo pipefail
          T="$TRACES/ADCG14-compose-healthcheck.txt"; v=PASS; motif=""
          sante() { docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q "$1")"; }
          { echo "# ADCG14 (clause ADCG119, D-ADCG-4 = lire_state_health) rejoue sur runner GitHub ($(date -u +%FT%TZ)), sha ${GITHUB_SHA} ; .env = .env.example"
            echo "# pile complete : docker compose up -d (job ubuntu-latest separe)"; } > "$T"
          docker compose up -d >> "$T" 2>&1 || { v=FAIL; motif="docker compose up -d en echec ;"; }
          ok=0
          for i in $(seq 1 72); do
            a=$(sante db); b=$(sante redis); c=$(sante django_core)
            if [ "$a" = healthy ] && [ "$b" = healthy ] && [ "$c" = healthy ]; then ok=1; break; fi
            sleep 5
          done
          { echo; echo "== docker compose ps apres up -d (attente ~$((i*5)) s ; db=$a redis=$b django_core=$c)"; docker compose ps; } >> "$T"
          for s in db redis django_core; do
            docker compose ps "$s" | grep -q '(healthy)' || { v=FAIL; motif="$motif $s sans (healthy) dans docker compose ps ;"; }
          done
          cid=$(docker compose ps -q redis)
          { echo; echo "== conteneur redis : $(docker inspect --format '{{.Name}}' "$cid")"; } >> "$T"
          docker compose pause redis >> "$T" 2>&1
          dep=$(date +%s)
          for i in $(seq 1 60); do [ "$(sante redis)" = unhealthy ] && break; sleep 5; done
          etat=$(docker inspect --format '{{.State.Health.Status}}' "$cid")
          { echo; echo "== docker inspect --format '{{.State.Health.Status}}' $(docker inspect --format '{{.Name}}' "$cid") apres docker compose pause redis (depuis $(( $(date +%s) - dep )) s) => $etat"; docker compose ps; } >> "$T"
          [ "$etat" = unhealthy ] || { v=FAIL; motif="$motif redis en pause : State.Health.Status = $etat (unhealthy attendu) ;"; }
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 http://localhost/ || true)
          echo "nginx : GET http://localhost/ pendant la pause de redis => HTTP $code" >> "$T"
          [ "$code" = 200 ] || { v=FAIL; motif="$motif nginx non servi ($code) ;"; }
          docker compose unpause redis >> "$T" 2>&1
          for i in $(seq 1 36); do [ "$(sante redis)" = healthy ] && break; sleep 5; done
          fin=$(docker inspect --format '{{.State.Health.Status}}' "$cid")
          { echo; echo "== docker inspect --format '{{.State.Health.Status}}' apres docker compose unpause redis => $fin"; docker compose ps; echo; echo "VERDICT ADCG14 : $v $motif"; } >> "$T"
          [ "$fin" = healthy ] || { v=FAIL; motif="$motif redis jamais rendu healthy ($fin) ;"; echo "VERDICT FINAL : $v $motif" >> "$T"; }
          cat "$T"
          [ "$v" = PASS ]
      - name: Journaux (diagnostic)
        if: ${{ failure() }}
        run: |
          tail -n 60 /tmp/compose-build.log || true
          docker compose logs --tail 60 django_core nginx redis || true
      - name: Upload trace ADCG14
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: acceptation-v8-mix-adcg14-trace
          path: adcg14-trace/
          retention-days: 7
          if-no-files-found: warn
