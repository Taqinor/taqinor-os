name: zz scratch - acceptation ACAL490 preuves L5 tour 2 (acal10 + perf ACAL440 avant-apres + telephone ACAL482 - TEMPORAIRE)

# ESSAI (19/11/2026) : preuves en direct d'AERR169 (aerr14), des six tâches ACAL bloquées sur la carte
# (acal6, fond de repli ACAL377) et d'AANA90 (aana8). Specs lues dans .github/zz-acceptation-specs.txt.
# Enregistrements remontés en artefact (pas de push du runner). Jamais la production. Supprimé au dernier commit.
on:
  push:
    branches: [claude/scratch-acc-l5-rejeu]

concurrency:
  group: zz-scratch-acc-l5-preuves2-${{ github.sha }}
  cancel-in-progress: false

jobs:
  ci-image-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
      image_e2e: ${{ steps.tag.outputs.image_e2e }}
    steps:
      - uses: actions/checkout@v4
      - name: Calculer les etiquettes des images
        id: tag
        run: bash .github/ci-image/tag.sh "${{ github.repository }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Les images sont-elles deja publiees ?
        id: exists
        run: |
          set -uo pipefail
          for couple in "backend:${{ steps.tag.outputs.image }}" "e2e:${{ steps.tag.outputs.image_e2e }}"; do
            cle="${couple%%:*}"; ref="${couple#*:}"
            if docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "Presente : $ref"; echo "${cle}=true" >> "$GITHUB_OUTPUT"
            else
              echo "ABSENTE : $ref"; echo "${cle}=false" >> "$GITHUB_OUTPUT"
            fi
          done
          exit 0
      - uses: docker/setup-buildx-action@v3
        if: ${{ steps.exists.outputs.backend != 'true' || steps.exists.outputs.e2e != 'true' }}
      - name: Construire et pousser ci-backend si elle manque
        if: ${{ steps.exists.outputs.backend != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: backend/django_core
          file: .github/ci-image/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Construire et pousser ci-e2e si elle manque
        if: ${{ steps.exists.outputs.e2e != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: .github/ci-image/Dockerfile.e2e
          build-args: |
            CI_BACKEND_IMAGE=${{ steps.tag.outputs.image }}
          push: true
          tags: ${{ steps.tag.outputs.image_e2e }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  pages:
    needs: ci-image-check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    container:
      image: ${{ needs.ci-image-check.outputs.image_e2e }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      redis:
        image: mirror.gcr.io/library/redis:7.4-alpine
        ports:
          - 6379:6379
    env:
      DJANGO_SETTINGS_MODULE: erp_agentique.settings.dev
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
      DJANGO_DEBUG: 'True'
      DB_NAME: erp_db
      DB_USER: erp_user
      DB_PASSWORD: ci_password
      DB_HOST: localhost
      DB_PORT: '5432'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      WEBSITE_LEAD_WEBHOOK_SECRET: e2e-webhook-secret
      E2E_WEBHOOK_SECRET: e2e-webhook-secret
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      MINIO_ENDPOINT: localhost:9000
      MINIO_ROOT_USER: erp_admin
      MINIO_ROOT_PASSWORD: erp_minio_password
      MINIO_BUCKET_PDF: erp-pdf
      MINIO_BUCKET_UPLOADS: erp-uploads
      TENANT_RATE_LIMIT: '0'
      LOGIN_RATE_LIMIT: '1000/minute'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: ./.github/actions/backend-env
        with:
          testdb-cache-into: erp_db
          prebuilt-image: 'true'
          testdb-save: 'false'
      - name: Migrate + seed demo + roles du registre
        working-directory: backend/django_core
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo
          python manage.py seed_catalogue
          python manage.py init_roles
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Playwright chromium (deja dans l'image)
        working-directory: frontend
        run: npx playwright install chromium
      - name: Playwright webkit (ACAL482, spec telephone)
        working-directory: frontend
        run: npx playwright install webkit --with-deps
      - name: Build frontend (sans service worker)
        working-directory: frontend
        env:
          VITE_E2E: '1'
        run: npm run build
      - name: Django + specs d'acceptation (liste .github/zz-acceptation-specs.txt)
        working-directory: backend/django_core
        env:
          E2E_ACCEPTATION: '1'
          E2E_SONDE_LOCALE: '1'
          ACCEPTATION_SHA: ${{ github.sha }}
        run: |
          gunicorn erp_agentique.wsgi:application \
            --bind 127.0.0.1:8000 --workers 3 --timeout 120 --worker-class sync \
            --access-logfile /tmp/gunicorn-access.log \
            --error-logfile /tmp/gunicorn-error.log --capture-output &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/django/admin/login/ || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then echo "Django pret (HTTP $code)"; break; fi
            echo "Attente Django ($i)"; sleep 2
            if [ "$i" = "30" ]; then echo "Django indisponible"; exit 1; fi
          done
          export E2E_DJANGO_EXEC="env -C ${GITHUB_WORKSPACE}/backend/django_core"
          cd ../../frontend
          rc=0
          for s in $(grep -v '^#' ../.github/zz-acceptation-specs.txt); do
            [ -f "e2e/acceptation/$s.spec.js" ] || { echo "spec $s absente"; rc=1; continue; }
            npx playwright test --project=acceptation --grep-invert "ACAL421" "e2e/acceptation/$s.spec.js" || rc=1
          done
          JOUR=$(date +%F); CAPT="../docs/qa-explorer/captures/$JOUR"; mkdir -p "$CAPT"
          echo "=== ACAL482 : calepinage-atelier-telephone.spec.js (WebKit) ==="
          tel=0
          CI=1 PLAYWRIGHT_HTML_REPORT=playwright-report-tel npx playwright test --project=chromium e2e/calepinage-atelier-telephone.spec.js --reporter=list,html --output=test-results-tel 2>&1 | tee /tmp/tel.log || { tel=1; rc=1; }
          echo "=== ACAL439 : calepinage-a11y.spec.js (axe-core) ==="
          axe=0
          CI=1 PLAYWRIGHT_HTML_REPORT=playwright-report-a11y npx playwright test --project=chromium e2e/calepinage-a11y.spec.js --reporter=list,html --output=test-results-a11y 2>&1 | tee /tmp/a11y.log || { axe=1; rc=1; }
          echo "=== ACAL440 : calepinage-perf.spec.js (CI=1), code courant (apres ACAL431+433) ==="
          apres=0
          CI=1 ACAL440_VERSION="apres ACAL431+433" PLAYWRIGHT_HTML_REPORT=playwright-report-perf npx playwright test --project=chromium e2e/calepinage-perf.spec.js --reporter=list,html --output=test-results-perf 2>&1 | tee /tmp/perf-apres.log || { apres=1; rc=1; }
          echo "=== ACAL440 : meme spec, code SANS les commits ACAL431 (68e485efd1) et ACAL433 (9abfad83d9) ==="
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          avant=0
          ( cd .. && for c in 9abfad83d9 68e485efd1; do git diff $c $c^ -- apps/web/src/scripts/roofPro11/panelTexture.ts apps/web/src/scripts/roofPro11/scene3d.ts apps/web/src/scripts/roofPro11/ciel.ts | git apply || exit 1; done ) || { avant=1; rc=1; }
          git -C .. diff --stat -- apps/web || true
          VITE_E2E=1 npm run build > /tmp/build-avant.log 2>&1 || { tail -40 /tmp/build-avant.log; avant=1; rc=1; }
          CI=1 ACAL440_VERSION="avant ACAL431+433" PLAYWRIGHT_HTML_REPORT=playwright-report-perf-avant npx playwright test --project=chromium e2e/calepinage-perf.spec.js --reporter=list,html --output=test-results-perf-avant 2>&1 | tee /tmp/perf-avant.log || { avant=1; rc=1; }
          git -C .. checkout -- apps/web
          grep -h "ACAL440\]" /tmp/perf-apres.log /tmp/perf-avant.log || true
          AXE=$axe TEL=$tel APRES=$apres AVANT=$avant CAPT="$CAPT" node ../.github/zz-acceptation-etapes.mjs || rc=1
          node e2e/acceptation/_enregistrement.js ACAL --etapes-supplementaires /tmp/etapes-supp.json || rc=1
          exit $rc
      - name: Queue des journaux gunicorn (diagnostic)
        if: ${{ !cancelled() }}
        run: tail -n 120 /tmp/gunicorn-error.log || true
      - name: Upload enregistrements d'acceptation
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: acc-l5-preuves2-enregistrements
          path: |
            docs/audits/acceptation
            docs/qa-explorer/captures
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload rapport Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: acc-l5-preuves2-rapport
          path: |
            frontend/playwright-report
            frontend/playwright-report-perf
            frontend/playwright-report-perf-avant
            frontend/playwright-report-tel
            frontend/playwright-report-a11y
            frontend/test-results-a11y
            frontend/test-results
            frontend/test-results-perf
            frontend/test-results-perf-avant
            frontend/test-results-tel
          retention-days: 7
          if-no-files-found: ignore
