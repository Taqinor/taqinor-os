name: zz-scratch nightly check (TEMPORAIRE — supprimé avant merge)

# Vérification CIBLÉE des correctifs du nocturne (issue #726) sur l'image CI :
# le module AMOT20 (WeasyPrint absent de l'hôte) + les specs e2e touchées + la
# passe visuelle. Dispatch manuel sur la branche de travail uniquement.
on:
  workflow_dispatch:
  push:
    branches: ['claude/nightly-run-issue-52f2a9']

concurrency:
  group: zz-scratch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-image-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
      image_e2e: ${{ steps.tag.outputs.image_e2e }}
    steps:
      - uses: actions/checkout@v4
      - name: Calculer les etiquettes des images
        id: tag
        run: bash .github/ci-image/tag.sh "${{ github.repository }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Les images sont-elles deja publiees ?
        id: exists
        run: |
          set -uo pipefail
          for couple in "backend:${{ steps.tag.outputs.image }}" "e2e:${{ steps.tag.outputs.image_e2e }}"; do
            cle="${couple%%:*}"; ref="${couple#*:}"
            if docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "${cle}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${cle}=false" >> "$GITHUB_OUTPUT"
            fi
          done
          exit 0
      - uses: docker/setup-buildx-action@v3
        if: ${{ steps.exists.outputs.backend != 'true' || steps.exists.outputs.e2e != 'true' }}
      - name: Construire et pousser ci-backend si elle manque
        if: ${{ steps.exists.outputs.backend != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: backend/django_core
          file: .github/ci-image/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Construire et pousser ci-e2e si elle manque
        if: ${{ steps.exists.outputs.e2e != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: .github/ci-image/Dockerfile.e2e
          build-args: |
            CI_BACKEND_IMAGE=${{ steps.tag.outputs.image }}
          push: true
          tags: ${{ steps.tag.outputs.image_e2e }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  amot20:
    needs: ci-image-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    container:
      image: ${{ needs.ci-image-check.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      redis:
        image: mirror.gcr.io/library/redis:7.4-alpine
        ports:
          - 6379:6379
    env:
      DJANGO_SETTINGS_MODULE: erp_agentique.settings.dev
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
      DJANGO_DEBUG: 'True'
      DB_NAME: erp_db
      DB_USER: erp_user
      DB_PASSWORD: ci_password
      DB_HOST: localhost
      DB_PORT: '5432'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      MINIO_ENDPOINT: localhost:9000
      MINIO_ROOT_USER: erp_admin
      MINIO_ROOT_PASSWORD: erp_minio_password
      MINIO_BUCKET_PDF: erp-pdf
      MINIO_BUCKET_UPLOADS: erp-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/backend-env
        with:
          testdb-cache-into: test_erp_db
          prebuilt-image: 'true'
          testdb-save: 'false'
      - name: Module AMOT20 (pdf) seul
        working-directory: backend/django_core
        run: |
          set +e
          python manage.py test apps.ventes.tests.test_quote_engine_amot20_onepage_dernier_bloc -v 2 --keepdb
          echo "rc=$?" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Rendu instrumenté du fixture AMOT20 (fr)
        working-directory: backend/django_core
        env:
          DB_NAME: test_erp_db
        run: |
          cat > /tmp/amot20_debug.py <<'PY'
          from apps.ventes.models import Devis
          from apps.ventes.quote_engine import generate_devis_premium as G
          from apps.ventes.quote_engine.builder import build_quote_data, clean_pdf_options
          from apps.ventes.tests._quote_engine_common import (
              make_client, make_company, make_devis, make_user)
          company = make_company(slug='amot20-dbg', nom='AMOT20DBG')
          user = make_user(company)
          client = make_client(company)
          devis = make_devis(company, user, client, [
              ('Panneau mono 550W', '10', '1100'),
              ('Onduleur réseau Huawei 5kW', '1', '8000'),
              ('Structure acier', '10', '300'),
              ('Installation et mise en service', '1', '4000'),
          ], reference='DEV-AMOT20-DBG')
          Devis.objects.filter(pk=devis.pk).update(
              note=('Note longue du commercial pour le client. ' * 60).strip(),
              clauses_appliquees=[{'type': 'clause', 'nom': f'Clause {i}',
                                   'corps_texte': ('Texte contractuel de la clause. ' * 20)}
                                  for i in (1, 2, 3)])
          devis.refresh_from_db()
          orig = G._mesure_onepage
          def spy(html):
              r = orig(html)
              print('MESURE', r, '| TRONQUES', G.ONEPAGE_TEXTES_TRONQUES,
                    '| renvoi in html', 'proposition en ligne' in html)
              print('  formes_fin', G._formes_bloc_fin())
              print('  formes_ttc', G._formes_total_ttc())
              print('  puces', G.CGV_IMPRIMEES)
              from weasyprint import HTML
              pages = HTML(string=html).render().pages
              page = pages[0]
              print('  pages', len(pages), 'page.height', page.height,
                    'limite', page.height - G.ONEPAGE_FOOTER_PX,
                    'bas_fin', G._bas_bloc_fin(page))
              for b in G._boites_texte_onepage(page):
                  t = (b.text or '')
                  if any(k in t for k in ('Acompte', 'Clause', 'Note longue', 'TTC',
                                          'mise en marche', 'Validit', 'proposition')):
                      print('  box y=%.0f bottom=%.0f %r' % (
                          b.position_y, b.position_y + b.height, t[:70]))
              return r
          G._mesure_onepage = spy
          for langue in ('fr', 'ar'):
              print('===== LANGUE', langue)
              with G._RENDER_LOCK:
                  data = build_quote_data(devis, clean_pdf_options(
                      {'pdf_mode': 'onepage', 'langue_sortie': langue}))
                  html = G.render_html_for({**data, 'pdf_mode': 'onepage'})
              print('FINAL renvoi présent :', G._renvoi_texte_integral() in html,
                    '| TRONQUES', G.ONEPAGE_TEXTES_TRONQUES)
              open(f'/tmp/amot20_{langue}.html', 'w', encoding='utf-8').write(html)
          PY
          python manage.py shell < /tmp/amot20_debug.py
      - name: Upload HTML rendus
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: amot20-html
          path: /tmp/amot20_*.html
          if-no-files-found: ignore

  e2e-subset:
    needs: ci-image-check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    container:
      image: ${{ needs.ci-image-check.outputs.image_e2e }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      redis:
        image: mirror.gcr.io/library/redis:7.4-alpine
        ports:
          - 6379:6379
    env:
      DJANGO_SETTINGS_MODULE: erp_agentique.settings.dev
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
      DJANGO_DEBUG: 'True'
      DB_NAME: erp_db
      DB_USER: erp_user
      DB_PASSWORD: ci_password
      DB_HOST: localhost
      DB_PORT: '5432'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      WEBSITE_LEAD_WEBHOOK_SECRET: e2e-webhook-secret
      E2E_WEBHOOK_SECRET: e2e-webhook-secret
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      MINIO_ENDPOINT: localhost:9000
      MINIO_ROOT_USER: erp_admin
      MINIO_ROOT_PASSWORD: erp_minio_password
      MINIO_BUCKET_PDF: erp-pdf
      MINIO_BUCKET_UPLOADS: erp-uploads
      TENANT_RATE_LIMIT: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: ./.github/actions/backend-env
        with:
          testdb-cache-into: erp_db
          prebuilt-image: 'true'
          testdb-save: 'false'
      - name: Migrate + seed throwaway demo data
        working-directory: backend/django_core
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo
          python manage.py seed_catalogue
          pip install Faker==40.28.1
          python manage.py seed_demo_company
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium webkit
      - name: Build frontend (no service worker for E2E)
        working-directory: frontend
        env:
          VITE_E2E: '1'
        run: npm run build
      - name: Start Django + specs touchées (chromium)
        working-directory: backend/django_core
        run: |
          gunicorn erp_agentique.wsgi:application \
            --bind 127.0.0.1:8000 --workers 3 --timeout 120 --worker-class sync \
            --access-logfile /tmp/gunicorn-access.log \
            --error-logfile /tmp/gunicorn-error.log --capture-output &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              http://127.0.0.1:8000/api/django/admin/login/ || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "Django prêt (HTTP $code)"; break
            fi
            sleep 2
            if [ "$i" = "30" ]; then echo "Django indisponible"; exit 1; fi
          done
          cd ../../frontend
          set +e
          npx playwright test --project=chromium \
            parcours-budget.spec.js devis-ci-commercial.spec.js devis-ci-industriel.spec.js \
            ci-site-mt-recette.spec.js ci-visite-chantier-reception.spec.js \
            agricole-chantier-recette.spec.js suivi-commercial.spec.js
          echo "specs rc=$?" | tee -a "$GITHUB_STEP_SUMMARY"
          npx playwright test --grep @visual --output test-results-visual
          echo "visual rc=$?" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Diagnostic VNT82 (etat_vente d'une vente montée comme le spec)
        if: ${{ !cancelled() }}
        working-directory: backend/django_core
        run: |
          cat > /tmp/vnt82_debug.py <<'PY'
          import json
          from rest_framework.test import APIClient
          from django.contrib.auth import get_user_model
          u = get_user_model().objects.get(username='demo_admin')
          c = APIClient(); c.force_authenticate(u)
          prods = c.get('/api/django/stock/produits/?page_size=100').json()
          prods = prods.get('results', prods)
          p = next(x for x in prods if float(x.get('prix_vente') or 0) > 0)
          lead = c.post('/api/django/crm/leads/', {'nom': 'VNT82 dbg', 'ville': 'Casablanca', 'telephone': '0611223344', 'type_installation': 'residentiel', 'facture_hiver': '800'}, format='json').json()
          print('LEAD', lead.get('id'), lead.get('type_installation'))
          d = c.post('/api/django/ventes/devis/', {'lead': lead['id'], 'taux_tva': '20.00', 'mode_installation': 'residentiel'}, format='json').json()
          print('DEVIS', d.get('id'), d.get('statut'))
          r = c.post(f"/api/django/ventes/devis/{d['id']}/replace-lines/", {'lignes': [{'produit': p['id'], 'designation': p['nom'], 'quantite': '1.00', 'prix_unitaire': '50000.00', 'remise': '0.00', 'taux_tva': '20.00', 'type_ligne': 'produit', 'ordre': 0}]}, format='json')
          print('LINES', r.status_code)
          r = c.post(f"/api/django/ventes/devis/{d['id']}/accepter/", {'nom': 'Client VNT82 dbg'}, format='json')
          print('ACCEPT', r.status_code, json.dumps(r.json(), default=str)[:400])
          det = c.get(f"/api/django/ventes/devis/{d['id']}/").json()
          print('STATUT', det.get('statut'), 'echeancier', det.get('echeancier'))
          print('VENTE', json.dumps(det.get('vente'), default=str, indent=1)[:3000])
          from apps.ventes.utils.echeancier import tranches_normalisees
          from apps.ventes.models import Devis
          print('TRANCHES', tranches_normalisees(Devis.objects.get(pk=d['id'])))
          lw = c.get(f"/api/django/crm/leads/{lead['id']}/").json()
          print('LEAD devis keys', [k for k in lw.keys() if 'devis' in k])
          PY
          python manage.py shell < /tmp/vnt82_debug.py
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-scratch
          path: |
            frontend/playwright-report
            frontend/test-results
            /tmp/gunicorn-error.log
          retention-days: 3
