name: zz scratch - fix-sleeps-v6 (TEMPORAIRE)

# ESSAI (17/11/2026) : rejoue les specs dont les attentes fixes ont ete remplacees par des attentes sur condition
# (garde ADEP24 check_test_determinism). Job llm = harnais de zz-scratch-acceptation-v6-llm ; job ecran = harnais
# de zz-scratch-acceptation-v6-amsg / aerr-apub-atst. Declenche seulement par un push sur la branche ; supprime au dernier commit.
on:
  push:
    branches: [fix-sleeps-v6]

concurrency:
  group: zz-scratch-fix-sleeps-v6
  cancel-in-progress: true

jobs:
  ci-image-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
      image_e2e: ${{ steps.tag.outputs.image_e2e }}
    steps:
      - uses: actions/checkout@v4
      - name: Calculer les etiquettes des images
        id: tag
        run: bash .github/ci-image/tag.sh "${{ github.repository }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Les images sont-elles deja publiees ?
        id: exists
        run: |
          set -uo pipefail
          for couple in "backend:${{ steps.tag.outputs.image }}" "e2e:${{ steps.tag.outputs.image_e2e }}"; do
            cle="${couple%%:*}"; ref="${couple#*:}"
            if docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "Presente : $ref"; echo "${cle}=true" >> "$GITHUB_OUTPUT"
            else
              echo "ABSENTE : $ref"; echo "${cle}=false" >> "$GITHUB_OUTPUT"
            fi
          done
          exit 0
      - uses: docker/setup-buildx-action@v3
        if: ${{ steps.exists.outputs.backend != 'true' || steps.exists.outputs.e2e != 'true' }}
      - name: Construire et pousser ci-backend si elle manque
        if: ${{ steps.exists.outputs.backend != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: backend/django_core
          file: .github/ci-image/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Construire et pousser ci-e2e si elle manque
        if: ${{ steps.exists.outputs.e2e != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: .github/ci-image/Dockerfile.e2e
          build-args: |
            CI_BACKEND_IMAGE=${{ steps.tag.outputs.image }}
          push: true
          tags: ${{ steps.tag.outputs.image_e2e }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  llm:
    needs: ci-image-check
    runs-on: ubuntu-latest
    timeout-minutes: 110
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    container:
      image: ${{ needs.ci-image-check.outputs.image_e2e }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      redis:
        image: mirror.gcr.io/library/redis:7.4-alpine
        ports:
          - 6379:6379
    env:
      DJANGO_SETTINGS_MODULE: erp_agentique.settings.dev
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
      DJANGO_DEBUG: 'True'
      DB_NAME: erp_db
      DB_USER: erp_user
      DB_PASSWORD: ci_password
      DB_HOST: localhost
      DB_PORT: '5432'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      WEBSITE_LEAD_WEBHOOK_SECRET: e2e-webhook-secret
      E2E_WEBHOOK_SECRET: e2e-webhook-secret
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      MINIO_ENDPOINT: localhost:9000
      MINIO_ROOT_USER: erp_admin
      MINIO_ROOT_PASSWORD: erp_minio_password
      MINIO_BUCKET_PDF: erp-pdf
      MINIO_BUCKET_UPLOADS: erp-uploads
      TENANT_RATE_LIMIT: '0'
      LOGIN_RATE_LIMIT: '1000/minute'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: ./.github/actions/backend-env
        with:
          testdb-cache-into: erp_db
          prebuilt-image: 'true'
          testdb-save: 'false'
      - name: Migrate + seed demo
        working-directory: backend/django_core
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo
          python manage.py seed_catalogue
          # Roles systeme alignes sur le registre livre (CANONICAL_SYSTEM_ROLES) : la spec le verifie.
          python manage.py init_roles
      - name: Role Postgres lecture seule de l'agent (sql_agent_ro) + journal de ses requetes
        run: |
          set -euo pipefail
          PSQL="/usr/lib/postgresql/16/bin/psql -h localhost -U erp_user -d erp_db -v ON_ERROR_STOP=1 -q"
          # Section 4 de rls_roles.sql (une seule source des GRANT), mot de passe jetable du job.
          { sed -n '/^-- 4) AANA30/,$p' backend/db/rls_roles.sql; echo "ALTER ROLE sql_agent_ro PASSWORD 'ci-sql-agent-ro';"; } | $PSQL
          # Preuve « aucune requete executee » : chaque instruction du SEUL role sql_agent_ro est journalisee, avec le role.
          $PSQL -c "ALTER ROLE sql_agent_ro SET log_statement = 'all';"
          $PSQL -c "ALTER SYSTEM SET log_line_prefix = '%m [%p] %u ';"
          $PSQL -c "SELECT pg_reload_conf();"
          $PSQL -tAc "SELECT rolname, rolsuper, rolbypassrls FROM pg_roles WHERE rolname = 'sql_agent_ro'"
      - name: Venv FastAPI (service IA reel)
        run: |
          set -euo pipefail
          python -m venv /tmp/venv-ia
          /tmp/venv-ia/bin/pip install -q --disable-pip-version-check --upgrade pip
          # torch CPU d'abord (sentence-transformers) : evite les ~4 Go de bibliotheques CUDA ; non bloquant.
          /tmp/venv-ia/bin/pip install -q --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu || echo "torch CPU indisponible : wheel par defaut"
          grep -vE '^faster-whisper' backend/fastapi_ia/requirements.txt > /tmp/req-ia.txt
          /tmp/venv-ia/bin/pip install -q --disable-pip-version-check -r /tmp/req-ia.txt
          /tmp/venv-ia/bin/python -c "import fastapi, uvicorn, langchain_anthropic, langchain_groq, sqlglot, httpx; print('venv IA pret')"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Playwright chromium (deja dans l'image)
        working-directory: frontend
        run: npx playwright install chromium
      - name: Build frontend (sans service worker)
        working-directory: frontend
        env:
          VITE_E2E: '1'
        run: npm run build
      - name: Django + service IA reel + specs d'acceptation v6 llm
        working-directory: backend/django_core
        env:
          E2E_ACCEPTATION: '1'
          E2E_SONDE_LOCALE: '1'
          ACCEPTATION_SHA: ${{ github.sha }}
          E2E_IA_URL: http://127.0.0.1:8100
          E2E_IA_PYTHON: /tmp/venv-ia/bin/python
          E2E_PG_LOG: /tmp/pg.log
          E2E_IA_LOG: /tmp/uvicorn.log
          E2E_DJANGO_ACCESS_LOG: /tmp/gunicorn-access.log
          DJANGO_INTERNAL_URL: http://127.0.0.1:8000
          # Fournisseur reel (D2 : Sonnet 5.5 effort low, Groq en repli AIC4) ; interrupteurs ASSISTANT_* a leur defaut du merge.
          SQL_AGENT_PROVIDER: claude
          SQL_AGENT_MODEL: claude-sonnet-5-5
          SQL_AGENT_EFFORT: low
          SQL_AGENT_FALLBACK_PROVIDER: groq
          SQL_AGENT_DB_USER: sql_agent_ro
          SQL_AGENT_DB_PASSWORD: ci-sql-agent-ro
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -n "$CLAUDE_API_KEY" ]; then echo "Cle Claude : presente"; else echo "Cle Claude : ABSENTE"; fi
          if [ -n "$GROQ_API_KEY" ]; then echo "Cle Groq : presente"; else echo "Cle Groq : ABSENTE"; fi
          gunicorn erp_agentique.wsgi:application             --bind 127.0.0.1:8000 --workers 4 --timeout 300 --worker-class sync             --access-logfile /tmp/gunicorn-access.log             --error-logfile /tmp/gunicorn-error.log --capture-output &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/django/admin/login/ || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then echo "Django pret (HTTP $code)"; break; fi
            echo "Attente Django ($i)"; sleep 2
            if [ "$i" = "30" ]; then echo "Django indisponible"; exit 1; fi
          done
          # RUN_DB_DDL=1 : le service IA pose son schema (ia_ocr_document) comme sur une pile deployee ; sans la table,
          # toute question dont les tables pertinentes la citent echoue (« include_tables {'ia_ocr_document'} not found »).
          ( cd ../fastapi_ia && RUN_DB_DDL=1 /tmp/venv-ia/bin/uvicorn app.main:app --host 127.0.0.1 --port 8100 --workers 1 > /tmp/uvicorn.log 2>&1 & )
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8100/health || true)
            if [ "$code" = "200" ]; then echo "Service IA pret"; break; fi
            echo "Attente service IA ($i)"; sleep 2
            if [ "$i" = "60" ]; then echo "Service IA indisponible"; tail -n 60 /tmp/uvicorn.log; exit 1; fi
          done
          # GRANT de sql_agent_ro rejoue (rls_roles.sql, idempotent) maintenant que ia_ocr_document existe.
          { sed -n '/^-- 4) AANA30/,$p' ../../backend/db/rls_roles.sql; } | /usr/lib/postgresql/16/bin/psql -h localhost -U erp_user -d erp_db -v ON_ERROR_STOP=1 -q
          /usr/lib/postgresql/16/bin/psql -h localhost -U erp_user -d erp_db -tAc "SELECT to_regclass('public.ia_ocr_document') IS NOT NULL AS table_ocr, has_table_privilege('sql_agent_ro', 'public.ia_ocr_document', 'SELECT') AS grant_ocr" || true
          export E2E_DJANGO_EXEC="env -C ${GITHUB_WORKSPACE}/backend/django_core"
          cd ../../frontend
          npx playwright test --project=acceptation e2e/acceptation/amsg8.spec.js e2e/acceptation/aic.spec.js e2e/acceptation/aic2.spec.js e2e/acceptation/alec6.spec.js e2e/acceptation/alec7.spec.js e2e/acceptation/aana7.spec.js
      - name: Queue des journaux gunicorn (diagnostic)
        if: ${{ !cancelled() }}
        run: |
          tail -n 120 /tmp/gunicorn-error.log || true
          echo '--- service IA (cles masquees) ---'
          tail -n 150 /tmp/uvicorn.log 2>/dev/null | sed -E 's/(sk-ant-|gsk_)[A-Za-z0-9_-]+/MASQUE/g' || true
          echo '--- Postgres : requetes sql_agent_ro (fin) ---'
          grep -a ' sql_agent_ro ' /tmp/pg.log | grep -av 'pg_catalog' | tail -n 40 || true
      - name: Upload enregistrement d'acceptation (petit)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: fix-sleeps-llm-enregistrement
          path: |
            docs/audits/acceptation/AMSG/
            docs/audits/acceptation/AIC/
            docs/audits/acceptation/ALEC/
            docs/audits/acceptation/AANA/
            docs/qa-explorer/captures/*/ACCEPTATION-AMSG-PF8.1-AMSG6-*
            docs/qa-explorer/captures/*/ACCEPTATION-AIC-P*-AIC9*
            docs/qa-explorer/captures/*/ACCEPTATION-ALEC-PF6-ALEC4*
            docs/qa-explorer/captures/*/ACCEPTATION-AANA-PA4-AANA81-*
          retention-days: 7
          if-no-files-found: warn
      - name: Upload rapport Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: fix-sleeps-llm-rapport-playwright
          path: frontend/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  ecran:
    needs: ci-image-check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    container:
      image: ${{ needs.ci-image-check.outputs.image_e2e }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      redis:
        image: mirror.gcr.io/library/redis:7.4-alpine
        ports:
          - 6379:6379
    env:
      DJANGO_SETTINGS_MODULE: erp_agentique.settings.dev
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
      DJANGO_DEBUG: 'True'
      DB_NAME: erp_db
      DB_USER: erp_user
      DB_PASSWORD: ci_password
      DB_HOST: localhost
      DB_PORT: '5432'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      WEBSITE_LEAD_WEBHOOK_SECRET: e2e-webhook-secret
      E2E_WEBHOOK_SECRET: e2e-webhook-secret
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      MINIO_ENDPOINT: localhost:9000
      MINIO_ROOT_USER: erp_admin
      MINIO_ROOT_PASSWORD: erp_minio_password
      MINIO_BUCKET_PDF: erp-pdf
      MINIO_BUCKET_UPLOADS: erp-uploads
      TENANT_RATE_LIMIT: '0'
      LOGIN_RATE_LIMIT: '1000/minute'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: ./.github/actions/backend-env
        with:
          testdb-cache-into: erp_db
          prebuilt-image: 'true'
          testdb-save: 'false'
      - name: Migrate + seed demo
        working-directory: backend/django_core
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo
          python manage.py seed_catalogue
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Playwright chromium (deja dans l'image)
        working-directory: frontend
        run: npx playwright install chromium
      - name: Build frontend (sans service worker)
        working-directory: frontend
        env:
          VITE_E2E: '1'
        run: npm run build
      - name: Django + specs d acceptation v6 aerr-apub-atst
        working-directory: backend/django_core
        env:
          E2E_ACCEPTATION: '1'
          E2E_SONDE_LOCALE: '1'
          ACCEPTATION_SHA: ${{ github.sha }}
        run: |
          gunicorn erp_agentique.wsgi:application \
            --bind 127.0.0.1:8000 --workers 3 --timeout 120 --worker-class sync \
            --access-logfile /tmp/gunicorn-access.log \
            --error-logfile /tmp/gunicorn-error.log --capture-output &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/django/admin/login/ || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then echo "Django pret (HTTP $code)"; break; fi
            echo "Attente Django ($i)"; sleep 2
            if [ "$i" = "30" ]; then echo "Django indisponible"; exit 1; fi
          done
          export E2E_DJANGO_EXEC="env -C ${GITHUB_WORKSPACE}/backend/django_core"
          cd ../../frontend
          npx playwright test --project=acceptation e2e/acceptation/amsg6.spec.js e2e/acceptation/aerr11.spec.js e2e/acceptation/atst2.spec.js
      - name: Queue des journaux gunicorn (diagnostic)
        if: ${{ !cancelled() }}
        run: |
          tail -n 120 /tmp/gunicorn-error.log || true
      - name: Upload enregistrement d'acceptation (petit)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: fix-sleeps-ecran-enregistrement
          path: |
            docs/audits/acceptation/AERR/
            docs/audits/acceptation/AMSG/
            docs/audits/acceptation/ATST/
            docs/qa-explorer/captures/*/ACCEPTATION-AERR-*.jpg
            docs/qa-explorer/captures/*/ACCEPTATION-AMSG-*.jpg
            docs/qa-explorer/captures/*/ACCEPTATION-ATST-*.jpg
          retention-days: 7
          if-no-files-found: warn
      - name: Upload rapport Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: fix-sleeps-ecran-rapport-playwright
          path: frontend/playwright-report
          retention-days: 7
          if-no-files-found: ignore
