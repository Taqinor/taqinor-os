name: CI

on:
  # Run push-triggered CI ONLY on the integration branches. Feature/PR
  # branches are fully covered by the pull_request trigger below, which diffs
  # against the PR base (main) so the change-detector skips heavy jobs
  # correctly. Without this filter every feature-branch push (branch creation,
  # main-integration merges, each commit) re-ran the whole suite a second time
  # with a stale baseline — pure waste. The PR run remains the merge gate.
  push:
    branches: [main, dev]
  pull_request:

# Cancel a superseded run on the same PR when a newer commit is pushed, so
# rapid pushes don't pile up redundant runs. Never cancels push runs on
# main/dev (those gate the deploy and must finish).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# NOTE on path filtering (see docs/CODEMAP.md §7):
# We do NOT use top-level `on: paths`/`paths-ignore`. A workflow skipped by a
# top-level path filter leaves its checks stuck in "Pending", which would
# *block* a PR that requires them (GitHub Docs: "Troubleshooting required
# status checks"). Instead, every heavy/lint job is gated by a per-job `if:`
# on the `changes` detector below. A job skipped by an `if:` conditional
# reports "Success" to branch protection, so it never deadlocks a merge.
# `stage-names` is intentionally left ungated (it is fast and is the broad
# drift guard), and `ci-gate` is an always-running aggregate so a single
# required check can be pinned safely.

# ---------------------------------------------------------------------------
# CRENEAUX — BUDGET : 18 JOBS SIMULTANES A NOUS (mesure du 19/08/2026, majoree
# ronde 4).
#
# Le depot public plafonne a 20 jobs simultanes, et ce plafond est PARTAGE avec
# les workflows d'analyse lances sur le meme commit. Mesure sur le run
# 32206663106 : CodeQL en prend 3 (javascript-typescript / actions / python).
# Notre vague en demandait alors 20 : `backend-openapi` et
# `backend-tests-shard (5)` n'avaient TOUJOURS PAS DEMARRE a T+11 min.
#
# UN JOB QUI NE DEMARRE PAS EST LA PIRE LANE POSSIBLE. Moins de lanes bien
# equilibrees battent toujours plus de lanes dont une partie fait la queue.
#
# La vague simultanee = tous les jobs qui declarent `needs: changes` (ils
# partent ensemble des que `changes` finit, ~16 s) PLUS `stage-names`, qui ne
# declare aucun `needs` et tourne donc en parallele. `changes` est termine avant
# que la vague parte ; les agregateurs (backend-lint, backend-tests,
# frontend-lint, e2e, ci-gate) attendent leurs lanes. Ni l'un ni les autres ne
# comptent — verifie contre l'ordonnancement reel du run ci-dessus.
#
#   stage-names 1 + backend-lint-fast 1 + backend-openapi 1 + frontend-static 1
#   + web-build-test 1 + rls-tests 1                                     =  6
#   + backend-tests-shard 6 + frontend-vitest-shard 4 + e2e-shard 2      = 12
#                                                              TOTAL     = 18
#
# RONDE 5 (20/08) — `ci-image-check` AJOUTE UN CRENEAU, MAIS PAS DANS LA VAGUE.
# Il ne declare AUCUN `needs` : il part a T=0 en meme temps que `changes` et
# finit en ~25-35 s sur le chemin normal, donc AVANT que la vague backend parte
# (elle attend `changes` ET lui). Les deux fenetres ne se recouvrent pas :
#
#   Fenetre 1 (T=0 a ~T+35 s) — `changes` 1 + `ci-image-check` 1
#     + stage-names 1 + frontend-static 1 + frontend-vitest-shard 4
#     + web-build-test 1 + e2e-shard 2                              = 11
#   Fenetre 2 (apres) — les 6 de la ronde 4 (dont `ci-image-check`
#     et `changes` sont sortis) : stage-names 1 + backend-lint-fast 1
#     + backend-openapi 1 + frontend-static 1 + web-build-test 1
#     + rls-tests 1 = 6, + backend-tests-shard 6
#     + frontend-vitest-shard 4 + e2e-shard 2 = 12                  = 18
#
# LE PIC RESTE DONC 18, inchange — la marge mesuree de 2 creneaux sous le
# plafond de 20 est preservee. Le chemin LENT de `ci-image-check` (construction
# en ligne, ~8-12 min, uniquement quand un requirements ou le Dockerfile CI
# change) allonge sa fenetre mais ne l'elargit pas : c'est toujours 1 creneau,
# et la vague backend attend simplement plus longtemps pour demarrer.
#
# RONDE 4 (19/08) — la 4e lane vitest depense 1 des 3 creneaux libres MESURES
# sur le run 32265590843 (17 lanes a nous, 3 creneaux encore idle sous le
# plafond de 20 a ce moment-la — la contention CodeQL varie d'un run a l'autre,
# contrairement au pire cas fige ci-dessus). Il reste donc 2 creneaux de marge
# mesuree ; si une lane se met a faire la queue au demarrage, revenir a 3 lanes
# vitest en premier reflexe.
#
# PLAFONDS DE TEMPS (WOW-CI7, 19/08) — chaque lane porte un `timeout-minutes`.
# Le 19/08, `e2e-shard (2)` a brule 1 h 05 min 43 s sans qu'aucun garde-fou ne
# l'arrete : 59 min 44 s d'apt sur un miroir a 32 ko/s. Un plafond qui NOMME la
# lane est honnete ; une heure de silence ne l'est pas. Les valeurs sont ~2x la
# duree mesuree la plus longue, donc elles n'attrapent qu'une vraie pathologie.
#
# TOUTE augmentation d'une matrice doit etre compensee ailleurs. Si le fondateur
# desactive le CodeQL par defaut (reglage GitHub, pas un fichier de ce depot),
# des creneaux supplementaires se liberent jusqu'au plafond de 20.
# ---------------------------------------------------------------------------
jobs:
  # ---------------------------------------------------------------------------
  # Change detector. Resolves which surfaces a push/PR touched, using pure git
  # (no third-party action). It FAILS OPEN: whenever a precise diff range can't
  # be resolved (new branch, force-push, shallow history, missing base) it runs
  # the full suite, so a real code change can never silently skip its tests.
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
      web: ${{ steps.detect.outputs.web }}
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          backend=false; frontend=false; web=false
          run_all=false

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          elif [ "$EVENT_NAME" = "push" ]; then
            base="$PUSH_BEFORE"; head="$PUSH_AFTER"
          else
            base=""; head=""
          fi

          # Fail open on anything we cannot resolve to a precise diff range.
          if [ -z "$base" ] || [ -z "$head" ]; then run_all=true; fi
          case "$base" in *[!0]*) : ;; *) run_all=true ;; esac   # all-zeros => new branch
          if [ "$run_all" = false ]; then
            git cat-file -e "${base}^{commit}" 2>/dev/null || run_all=true
          fi
          if [ "$run_all" = false ]; then
            git cat-file -e "${head}^{commit}" 2>/dev/null || run_all=true
          fi

          if [ "$run_all" = true ]; then
            echo "Could not resolve a precise diff range — running the FULL suite (fail-open)."
            backend=true; frontend=true; web=true
          else
            changed="$(git diff --name-only "$base" "$head")"
            echo "Changed files between ${base} and ${head}:"
            echo "$changed"
            # CI / infra / docs / config changes (.github/**, docker-compose*,
            # docs, *.md, .gitignore, .claude/**, top-level state) do NOT run
            # the heavy jobs: they cannot change application behaviour, so the
            # only signal that matters is the always-on `stage-names` drift
            # guard (check_stages + CODEMAP fingerprint), which is ungated
            # below. A ci.yml edit that changes a test command is therefore not
            # re-validated on its own PR — by design (minimal CI); the fail-open
            # above still runs the FULL suite when the diff range itself is
            # unresolvable (new branch / force-push / shallow clone). The
            # `|| true` keeps a no-match (grep exit 1) from tripping `set -e`.
            # Use here-strings (NOT `echo | grep -q`): with a large `$changed`,
            # `grep -q` exits on first match before `echo` finishes writing, so
            # `echo` takes SIGPIPE and (under `set -o pipefail`) the pipeline
            # returns 141 — which made `&& backend=true` silently NOT run, so a
            # huge backend diff was mis-detected as backend=false and skipped the
            # required backend-tests gate. A here-string has no pipe writer to
            # kill, so grep's real exit status drives the `&&`.
            # Shared backend<->frontend contract: exercise both sides + e2e.
            grep -qE '^STAGES\.py$'  <<< "$changed" && { backend=true; frontend=true; } || true
            grep -qE '^backend/'     <<< "$changed" && backend=true  || true
            grep -qE '^frontend/'    <<< "$changed" && frontend=true || true
            grep -qE '^apps/web/'    <<< "$changed" && web=true      || true
            # Everything else (docs/**, *.md, top-level state files, etc.)
            # affects none of the heavy jobs — only the always-on stage-names
            # guard, which is not gated here.
          fi

          # The e2e browser suite is the cross-surface net: any application
          # code (backend OR frontend, incl. the STAGES.py contract) runs it;
          # website-only and docs-only changes do not.
          code=false
          if [ "$backend" = true ] || [ "$frontend" = true ]; then code=true; fi

          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "web=$web"
            echo "code=$code"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved -> backend=$backend frontend=$frontend web=$web e2e(code)=$code"

  # ---------------------------------------------------------------------------
  # WOW-CI RONDE 5 (20/08/2026) — L'IMAGE CI BACKEND PRE-CONSTRUITE.
  #
  # Les lanes backend ne reconstruisent plus leur environnement : elles tournent
  # DANS une image figee (`.github/ci-image/Dockerfile`, poussee sur GHCR par
  # `.github/workflows/ci-image.yml`) qui contient deja les bibliotheques
  # WeasyPrint, tout `requirements-dev.txt`, `postgresql-client-16` et les
  # binaires MinIO. Ce job calcule l'etiquette (empreinte des deux requirements
  # + du Dockerfile CI), verifie que le manifeste existe sur GHCR, et l'expose.
  #
  # POURQUOI IL NE DECLARE PAS `needs: changes` — pour ne RIEN ajouter au chemin
  # critique. Il part a T=0, en meme temps que `changes` (~16 s) ; sur le chemin
  # normal (image presente) il finit en ~25-35 s, soit ~15 s apres `changes`.
  # Les lanes backend attendent donc les deux et demarrent ~15 s plus tard
  # qu'avant — contre ~60 a 150 s d'apt+pip+setup-python economisees CHACUNE.
  #
  # CHEMIN LENT (miss) : si l'etiquette n'existe pas encore — la PREMIERE PR qui
  # modifie un requirements ou ce Dockerfile — l'image est construite et poussee
  # ICI, en ligne (~8-12 min). Ce cout est paye UNE fois : au merge, le workflow
  # `ci-image.yml` republie la meme etiquette sur `main` et toutes les PR
  # suivantes retombent sur le chemin rapide.
  #
  # PAS DE REPLI SILENCIEUX (regle explicite) : si le pull echoue cote lane, la
  # lane echoue FRANCHEMENT. On ne garde pas un second chemin « ancien style »
  # vivant en parallele — deux chemins finissent toujours par diverger, et
  # l'ancien serait teste par personne. Le repli est MANUEL et visible :
  # `workflow_dispatch` sur `ci-image.yml`.
  #
  # LIMITE CONNUE : une PR issue d'un FORK recoit un GITHUB_TOKEN degrade en
  # lecture seule ; elle peut PULLER l'image mais pas la construire en ligne.
  # Ce depot travaille sur des branches internes (`claude/...`), donc le cas ne
  # se presente pas aujourd'hui ; il est note comme risque residuel.
  # ---------------------------------------------------------------------------
  ci-image-check:
    runs-on: ubuntu-latest
    # 30 min = le chemin LENT (construction en ligne) avec de la marge. Le
    # chemin normal rend son verdict en ~25-35 s.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      # Source UNIQUE de l'etiquette, partagee avec `ci-image.yml` : si les deux
      # la calculaient separement, la moindre divergence reconstruirait l'image
      # a chaque run.
      - name: Calculer l'etiquette de l'image
        id: tag
        run: bash .github/ci-image/tag.sh "${{ github.repository }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: L'image est-elle deja publiee ?
        id: exists
        run: |
          set -uo pipefail
          if docker manifest inspect '${{ steps.tag.outputs.image }}' >/dev/null 2>&1; then
            echo "Image presente — chemin rapide."
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "Image ABSENTE (${{ steps.tag.outputs.image }}) — construction en ligne."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - uses: docker/setup-buildx-action@v3
        if: ${{ steps.exists.outputs.present != 'true' }}
      - name: Construire et pousser l'image manquante (chemin lent)
        if: ${{ steps.exists.outputs.present != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: backend/django_core
          file: .github/ci-image/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Resume
        run: |
          echo "image=${{ steps.tag.outputs.image }}"
          echo "deja presente = ${{ steps.exists.outputs.present }}"

  # ---------------------------------------------------------------------------
  # WOW-CI2 (2026-08-18, run 32182877239) — `backend-lint` durait 8 min 25 s, et
  # la mesure par étape a montré que TOUT tenait dans une seule : la génération
  # du schéma OpenAPI (YAPIC6) a pris 5 min 53 s à elle seule, en silence, sans
  # écrire une ligne. Sa vraie durée avait toujours été masquée par des rouges
  # antérieurs qui coupaient le job avant d'y arriver. Les 23 gardes statiques,
  # elles, coûtent 30 s EN TOUT.
  #
  # On sépare donc les deux moitiés en lanes parallèles : `backend-lint-fast`
  # rend son verdict en ~2 min 30 s (c'est celui qui attrape 99 % des rouges),
  # et `backend-openapi` paie seul sa génération. Le nom de check REQUIS
  # `backend-lint` est préservé par l'agrégateur mince plus bas — NE PAS le
  # renommer (protection de branche : contexte littéral).
  #
  # WOW-CI3 (2026-08-18) — la génération elle-même est désormais raccourcie,
  # mais dans le SCRIPT, pas ici. Profil par phase dans l'image de prod :
  # `get_schema()` 284 s (dont la moitié est le miroir `api/v1/` de l'arbre
  # `api/django/`, monté deux fois par urls.py), rendu YAML 99 s, `--validate`
  # 102 s, et surtout `yaml.safe_load` de 22,8 Mo 231 s. Corrigé par un
  # générateur qui n'introspecte qu'une fois puis reconstitue le miroir
  # (`erp_agentique/openapi_check.py`) et par un document intermédiaire JSON.
  # Aucune route d'exécution ne change, et l'instantané de contrat continue
  # d'être régénéré (`--write`) par le générateur de RÉFÉRENCE.
  # ---------------------------------------------------------------------------
  backend-lint-fast:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # MUST match prod (django_core/fastapi Dockerfiles: python:3.11.x). A 3.12+/3.13 CI would not catch 3.11-only SyntaxErrors (e.g. backslash in f-string) that crash the live PDF generator.
          cache: 'pip'
          cache-dependency-path: backend/django_core/requirements-dev.txt
      - name: Byte-compile on prod Python (catches 3.11-only SyntaxErrors, incl. in flake8-noqa files)
        run: python -m compileall -q backend/django_core/apps backend/django_core/erp_agentique backend/fastapi_ia
      - run: pip install flake8 import-linter==2.11
      - name: Lint backend (flake8)
        run: flake8 backend --max-line-length=120 --extend-ignore=E501 --exclude=migrations
      - name: Lint imports (import-linter contracts — M3)
        working-directory: backend/django_core
        run: lint-imports
      # ARC52 — garde-fous du socle en UN script DB-free (ARC8 *Activity, ARC26
      # FileField, ARC11 imports WeasyPrint hors allowlist, ARC6 numérotation
      # count()+1 hors socle). Étape ajoutée au job backend-lint EXISTANT — pas
      # un nouveau check requis (protection de branche inchangée).
      - name: Platform-kernel guards (check_platform — ARC8/26/11/6)
        run: python scripts/check_platform.py
      # YDATA1/3 — every FK/O2O declares on_delete=, every CASCADE is either
      # inline-justified ('# on_delete: <reason>') or reviewed+allowlisted;
      # every SET_NULL has null=True and never targets a tenant/owner field.
      - name: Check on_delete completeness/justification (YDATA1/3)
        run: python scripts/check_on_delete.py
      # YDATA2 — financial-target FK (Devis/Facture/BonCommande/Paiement/
      # Avoir/Company/Produit) sweep: fails only on a NEW un-reviewed
      # CASCADE/SET_NULL (docs/on-delete-financial-audit.md is the baseline).
      - name: Check financial-target on_delete sweep (YDATA2)
        run: python scripts/check_on_delete.py --financial
      # YDATA4 — every business-app model carries a company scope (direct
      # FK, TenantModel base, or transitively via a FK to a scoped model).
      - name: Check multi-tenant company-FK completeness (YDATA4)
        run: python scripts/check_company_fk.py
      # YDATA6/7 — money-semantic fields are DecimalField (never FloatField,
      # GPS/rate names excepted) with explicit max_digits/decimal_places=2
      # (4 tolerated for taux_*/*_pct/pourcentage rate fields).
      - name: Check money fields are DecimalField (YDATA6)
        run: python scripts/check_money_fields.py
      - name: Check money DecimalField max_digits/decimal_places (YDATA7)
        run: python scripts/check_money_fields.py --decimal-places
      # YDATA8 — advisory: round() on a money-looking value in a pricing/tax
      # module should use core.money.quantize_mad() instead (see
      # docs/money-convention.md); baseline-allowlisted, fails only on NEW.
      - name: Check money rounding convention (YDATA8, advisory)
        run: python scripts/check_money_rounding.py
      # YDATA10/11 — timezone.now() everywhere (no naive datetime.now()/
      # utcnow()/datetime(...) ctor); timestamp columns are aware
      # DateTimeField, never DateField(auto_now[_add]=True).
      - name: Check for naive datetime / DateField timestamps (YDATA10/11)
        run: python scripts/check_naive_datetime.py
      # YDATA14 — advisory: a Celery task with external effects should take
      # a pk, never a hydrated model instance, as a parameter.
      - name: Check Celery task signatures (YDATA14, advisory)
        run: python scripts/check_celery_tasks.py
      # YDATA15 — advisory: get_or_create/update_or_create lookup keys
      # should be backed by a UniqueConstraint; audit doc IS the baseline.
      - name: Check get_or_create/update_or_create audit (YDATA15, advisory)
        run: python scripts/check_get_or_create.py
      # YDATA22 — mono-devise MAD invariant sweep. Advisory only (per the plan
      # task: "v1 ... pas de blocage") — prints the currency audit for
      # visibility, never fails the build.
      - name: Currency mono-devise sweep (check_money_monodevise — YDATA22, advisory)
        run: python scripts/check_money_monodevise.py
      # YDATA16 — read-modify-write on a shared numeric field (counters/stock/
      # balances) must hold a lock (select_for_update) or use F(); fails on a
      # NEW unlocked site not in scripts/read_modify_write_allow.txt.
      - name: Check read-modify-write locking on shared counters (YDATA16)
        run: python scripts/check_read_modify_write.py
      - name: Test the read-modify-write checker itself (YDATA16)
        run: python -m unittest scripts.tests.test_check_read_modify_write -v
      # YDATA18 — business unique=True must be company-scoped; a unique on a
      # soft-delete model must be a partial index. Fails on a NEW unscoped
      # business unique not in scripts/unique_scoping_allow.txt.
      - name: Check unique constraints are tenant-scoped (YDATA18)
        run: python scripts/check_unique_scoping.py
      - name: Test the unique-scoping checker itself (YDATA18)
        run: python -m unittest scripts.tests.test_check_unique_scoping -v
      # YDATA20 — constraint-on-populated-table (AddField unique/not-null in one
      # step) + index/constraint name drift vs models.py. Fails on a NEW
      # migration not in scripts/migration_safety_allow.txt.
      - name: Check migration safety — 3-step constraints + name drift (YDATA20)
        run: python scripts/check_migration_safety.py
      - name: Test the migration-safety checker itself (YDATA20)
        run: python -m unittest scripts.tests.test_check_migration_safety -v
      # YDATA21 — tenant isolation: every business ModelViewSet/GenericAPIView
      # must scope by request.user.company and never accept company from the
      # body. Fails on a NEW view not in scripts/tenant_view_allowlist.txt.
      - name: Check multi-tenant view isolation (YDATA21)
        run: python scripts/check_tenant_isolation.py
      - name: Test the tenant-isolation checker itself (YDATA21)
        run: python -m unittest scripts.tests.test_check_tenant_isolation -v
      # Incident du 03/08/2026 (production) : les lanes frontend/ao et
      # backend/ao ont ete construites en parallele avec des contrats
      # DIFFERENTS — l'ecran Bibliotheque appelait /ao/bibliotheque/, route
      # jamais enregistree : 404 en production. Les tests vitest n'ont rien vu
      # (ils mockent l'API avec la forme SUPPOSEE par le front). Cette etape
      # compare statiquement les chemins appeles par frontend/src/api/aoApi.js
      # aux routes reellement enregistrees par apps/ao/urls.py. NE PAS
      # DESACTIVER : corriger le client (ou creer la route), pas la garde.
      - name: Check ao API contract — frontend calls vs registered routes
        run: python scripts/check_ao_api_contract.py
  # Lane dédiée : génération + validation du schéma OpenAPI. Mesurée à 5 min 53 s
  # sur le run 32182877239 (une seule invocation de `manage.py spectacular
  # --validate`, aucune sortie intermédiaire), puis raccourcie par WOW-CI3
  # (générateur `openapi_check.SchemaGeneratorAliasV1` + document JSON) — voir
  # l'en-tête de scripts/check_openapi_schema.py pour le profil par phase.
  # Elle tourne EN PARALLÈLE de `backend-lint-fast` et des 8 lanes de tests.
  backend-openapi:
    needs: [changes, ci-image-check]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    # WOW-CI RONDE 5 — l'image CI porte deja Python 3.11 (MEME version que la
    # prod), les bibliotheques WeasyPrint et TOUT requirements-dev.txt (qui
    # commence par `-r requirements.txt`, donc le sur-ensemble des deps prod
    # dont ce generateur a besoin). Les quatre etapes qui suivaient — cache apt,
    # apt-get, setup-python, pip install — ont disparu avec lui.
    container:
      image: ${{ needs.ci-image-check.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # YAPIC6 — le schéma OpenAPI (YAPIC5) doit rester GÉNÉRABLE, VALIDE
      # (validation OpenAPI 3 de drf-spectacular) et sans NOUVEL avertissement
      # de génération : un serializer non résolu ou une collision d'operationId
      # introduits par une PR font rougir ce job. Le repo porte ~990 constats
      # préexistants (386 vues sans serializer resolvable, champs
      # SerializerMethod non typés, collisions d'énums) qu'aucune tâche unique
      # ne peut solder : ils sont figés dans scripts/openapi_schema_allow.txt,
      # et SEULE une signature nouvelle échoue — c'est un `--fail-on-warn`
      # borné. docs/openapi-schema.yml versionne l'inventaire des opérations
      # (le document complet fait ~20 Mo, illisible en revue) pour que le diff
      # de contrat apparaisse dans la PR.
      #
      # COÛT : le générateur importe TOUT l'URLconf, donc les vraies
      # dépendances backend (WeasyPrint & co). AUCUNE base de données n'est
      # nécessaire (le générateur ne fait qu'introspecter vues et serializers).
      # WOW-CI RONDE 5 (20/08/2026) — les quatre étapes de mise en place qui
      # tenaient ici (redirection du magasin apt, cache apt partagé, `apt-get
      # install` des bibliothèques WeasyPrint, `pip install -r
      # requirements.txt`) ont été SUPPRIMÉES : l'image CI déclarée en
      # `container:` plus haut les contient déjà, figées. Le cache apt partagé
      # `apt-e2e-v2-…` reste alimenté et consommé par `e2e-shard`, qui n'est pas
      # conteneurisé — cette suppression ne le prive de rien.
      - name: Test the OpenAPI-schema checker itself (YAPIC6)
        run: python -m unittest scripts.tests.test_check_openapi_schema -v
      - name: OpenAPI schema — generate, validate, no NEW warning (YAPIC6)
        run: python scripts/check_openapi_schema.py


  # Agrégateur mince qui PRÉSERVE le nom de check requis `backend-lint`
  # (patron WOW6, identique à `backend-tests` et `frontend-lint`). Vert ssi
  # aucune des deux lanes n'a échoué ; vert aussi quand elles SAUTENT
  # (backend=false), ce qui conserve la sémantique « un check requis sauté
  # compte comme réussi » du filtre de chemins.
  backend-lint:
    needs: [changes, ci-image-check, backend-lint-fast, backend-openapi]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      # WOW-CI RONDE 5 — même garde que sur `backend-tests` : `backend-openapi`
      # dépend de l'image CI, donc un échec de `ci-image-check` le laisserait
      # « skipped » et ferait passer ce check REQUIS au vert sans rien valider.
      - name: Fail if the CI image could not be resolved
        if: ${{ needs.ci-image-check.result == 'failure' || needs.ci-image-check.result == 'cancelled' }}
        run: |
          echo "ci-image-check=${{ needs.ci-image-check.result }} — le job backend-openapi n'a pas tourné."
          exit 1
      - name: Fail if a backend-lint lane failed or was cancelled
        if: ${{ needs.backend-lint-fast.result == 'failure' || needs.backend-lint-fast.result == 'cancelled' || needs.backend-openapi.result == 'failure' || needs.backend-openapi.result == 'cancelled' }}
        run: |
          echo "backend-lint-fast=${{ needs.backend-lint-fast.result }} backend-openapi=${{ needs.backend-openapi.result }}"
          echo "Une lane backend-lint n'est pas passée — voir les jobs ci-dessus."
          exit 1
      - name: All backend-lint lanes passed (or were skipped)
        run: echo "backend-lint-fast=${{ needs.backend-lint-fast.result }} backend-openapi=${{ needs.backend-openapi.result }} — gate OK."

  # WOW6 — the fast backend suite is sharded across free public-repo runners
  # (matrix legs run concurrently, each on its own 4-vCPU runner + Postgres). The
  # REQUIRED `backend-tests` status check name is preserved by the thin
  # `backend-tests` aggregator job defined right after this one.
  #
  # WOW-CI2 (2026-08-18, run 32182877239) — 6 lanes -> 8, et surtout un découpage
  # ÉQUILIBRÉ. Le run à 6 lanes a mesuré des tests de 83 s à 767 s selon la lane :
  # le tourniquet alphabétique avait mis les deux poids lourds (`apps.crm` ET
  # `apps.ventes`) dans la MÊME lane. Comme le temps de mur = mise en place + la
  # PIRE lane, ce seul hasard d'ordre alphabétique fixait le gate backend à
  # ~12 min. `scripts/ci_shard.py` découpe désormais au MODULE de test (Django
  # accepte `apps.ventes.tests.test_x`) et place les modules par LPT sur les
  # durées MESURÉES (`scripts/ci_shard_timings.json`) : 1 692 s de tests répartis
  # à 1,00x d'équilibre. La complétude de l'union des lanes est prouvée par
  # `scripts/tests/test_ci_shard.py`, exécuté dans le job `stage-names` — un
  # module qui tomberait du découpage ne serait plus jamais testé pendant que la
  # CI resterait verte, c'est le seul risque que ce mécanisme doit interdire.
  #
  # ---------------------------------------------------------------------------
  # WOW-CI RONDE 5 (20/08/2026) — `--parallel` REPASSE DE 1 À 4, AVEC LA GARDE
  # QUI MANQUAIT LA PREMIÈRE FOIS.
  #
  # POURQUOI ÇA AVAIT CASSÉ (commit 0d66f6e1, 16/07 : « --parallel 2->1
  # max_locks OOM shard 3 test_rls+QW10 »). Le coupable n'est PAS la mémoire du
  # runner, c'est la TABLE DE VERROUS de Postgres. Un `TransactionTestCase`
  # termine chaque test par un `flush` = UN SEUL `TRUNCATE` qui, `CASCADE`
  # aidant, ratisse les ~900 tables du dépôt (c'est écrit noir sur blanc dans
  # `core/test_utils.WideTeardownTimeoutMixin`, qui existe parce que cette purge
  # dure 16 à 31 s). Chaque table, chaque index, chaque table TOAST y prend un
  # `AccessExclusiveLock` : de l'ordre de 4 500 verrous d'un coup. Or la table
  # de verrous d'un cluster vaut `max_locks_per_transaction × max_connections`
  # = 64 × 100 = 6 400 entrées, et un service `postgres:` d'Actions ne peut PAS
  # recevoir de `command:` — donc ce réglage n'est pas relevable ici. DEUX
  # purges simultanées = ~9 000 > 6 400 = « out of shared memory ». C'est
  # exactement ce que `--parallel 2` avait déclenché.
  #
  # LA GARDE. Django affecte une CLASSE de test entière à UN worker : le risque
  # n'apparaît donc que si un même shard contient DEUX modules à purge large.
  # Il n'en existe que trois dans tout le dépôt (`apps/crm/tests_webhook.py`,
  # `apps/ventes/tests/test_premium_security.py`, `core/tests/test_rls.py` — ce
  # dernier étant intégralement sauté ici, faute de `POSTGRES_RLS_ENABLED`), et
  # le découpage LPT actuel les place dans des shards différents. Mais ce
  # découpage se recalcule sur des durées mesurées : rien ne garantit qu'il en
  # sera de même demain. L'étape ci-dessous COMPTE donc, à chaque run, les
  # modules à purge large de SON shard et retombe à `--parallel 1` s'il y en a
  # deux ou plus. Un shard devient lent au lieu de devenir rouge — et la garde
  # s'adapte toute seule au prochain `TransactionTestCase` ajouté.
  #
  # PARALLÉLISME PROUVÉ AILLEURS : le harnais local canonique
  # (`scripts/test-backend.ps1`) tourne en `--keepdb --parallel 4` par défaut
  # depuis toujours — la sûreté des tests eux-mêmes est donc déjà éprouvée ;
  # seule la contention de verrous ci-dessus était propre à la CI.
  # ---------------------------------------------------------------------------
  # ROUND 3 (run 32200473257) — `backend-openapi` est retombé à 3 min 20 s une
  # fois son cache pip chaud : il n'est PLUS le plancher, les tests backend le
  # sont. Étape `Run Django test suite` par lane sur ce run :
  #   158 / 310 / 242 / 251 / 128 / 167 / 147 / 218 s — total 1 621 s, moyenne
  #   203 s, PIRE lane 310 s = 1,53x la moyenne. La pondération « durée mesurée
  #   par APPLICATION, repartie au prorata du nombre de tests » etait trop
  #   grossiere : le cout par test varie AUSSI fortement a l'interieur d'une
  #   meme application. La table est donc passee en durees MESUREES PAR MODULE
  #   (2 680 modules, 1 457 s ; scripts/ci_shard_timings.json, regeneree par
  #   `ci_shard.py --update-timings` sur les journaux de ce run).
  #
  # POURQUOI 6 — c'est le BUDGET DE CRENEAUX qui borne, plus un module.
  # Le plancher du module le plus lourd a ete leve le 19/08 (test_quote_engine
  # scinde en quatre), donc N n'est plus limite par un fichier ; il est limite
  # par les 18 creneaux (voir le bloc CRENEAUX en tete de fichier) et par le
  # fait que la lane la plus lente du gate est desormais `e2e-shard` (~6 min 45 s,
  # plancher desormais partage apres la scission de fumee-ecrans). Descendre le
  # backend sous ce seuil ne raccourcirait rien.
  # Mesure du run 32206663106, etape `Run Django test suite` par lane :
  #   283 / 134 / 197 / 181 / 197 / 210 / 191 / 165 s (shard 5 jamais demarre),
  #   dont 1 385 s de modules mesures + ~21,6 s de rodage Django par lane,
  #   remarquablement constant quel que soit le poids de la lane.
  # Cout par lane = ~135 s de mise en place + ~22 s de rodage + 1 385/N :
  #   N=6 -> ~6 min 28 s, N=8 -> ~5 min 30 s (hors budget de creneaux).
  backend-tests-shard:
    needs: [changes, ci-image-check]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    # WOW-CI RONDE 5 (20/08/2026) — la lane tourne DANS l'image CI figée
    # (`.github/ci-image/Dockerfile`) : plus d'apt, plus de pip, plus de
    # setup-python, et `postgresql-client-16` + MinIO sont déjà là. Le pull
    # (~20-40 s) remplace 60 à 150 s d'installation. AUCUN repli silencieux :
    # si le pull échoue, la lane échoue — cf. l'en-tête de `ci-image-check`.
    container:
      image: ${{ needs.ci-image-check.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: erp_db
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
    env:
      DJANGO_SETTINGS_MODULE: erp_agentique.settings.dev
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
      DJANGO_DEBUG: 'True'
      DB_NAME: erp_db
      DB_USER: erp_user
      DB_PASSWORD: ci_password
      # WOW-CI RONDE 5 — job `container:` : les services ne sont plus atteints
      # par un port publié sur l'hôte mais par leur NOM sur le réseau que le
      # runner crée pour le job. `localhost` désignerait le conteneur du job
      # lui-même (où tourne MinIO, d'où `MINIO_ENDPOINT` inchangé).
      DB_HOST: postgres
      DB_PORT: '5432'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      # WOW-CI RONDE 5 — LE GARDE-FOU DE PRODUCTION ÉLARGI POUR LE RUNNER DE
      # TESTS, ET UNIQUEMENT LUI. NTPLT18 pose `statement_timeout = 30 s` sur
      # CHAQUE connexion (settings/base.py) pour qu'une requête ORM folle ne
      # puisse pas épingler un worker gunicorn. Deux opérations légitimes du
      # runner dépassent ce seuil : le `CREATE DATABASE … WITH TEMPLATE` que
      # Django exécute pour cloner la base une fois par worker `--parallel`, et
      # la purge `TRUNCATE` de tout le schéma d'un `TransactionTestCase`
      # (mesurée 16 à 31 s — c'est précisément la raison d'être de
      # `core/test_utils.WideTeardownTimeoutMixin`). Annulées, elles laissent la
      # base à moitié purgée et le test SUIVANT échoue en doublon de clé, très
      # loin de la vraie cause. On élargit donc à 10 min ICI, dans le job de
      # test — le réglage de production n'est pas touché, et la variable reste
      # DÉFINIE, donc `core.tests.test_db_guards` (qui vérifie sa présence dans
      # OPTIONS, pas sa valeur) continue de passer.
      DB_STATEMENT_TIMEOUT_MS: '600000'
      MINIO_ENDPOINT: localhost:9000
      MINIO_ROOT_USER: erp_admin
      MINIO_ROOT_PASSWORD: erp_minio_password
      MINIO_BUCKET_PDF: erp-pdf
      MINIO_BUCKET_UPLOADS: erp-uploads
    steps:
      - uses: actions/checkout@v4
      # WOW7 — shared WeasyPrint + pip (requirements-dev.txt) + MinIO setup.
      # WOW8 — restore the cached pre-migrated test DB (measured: the ~850-
      # migration replay was 2255s of a 2388s shard — 97% of the job); the test
      # step's --keepdb then reuses it and only clones the 4 parallel workers.
      # WOW-CI RONDE 5 — `prebuilt-image: 'true'` : l'action saute apt/pip (déjà
      # dans l'image), lance MinIO via son binaire natif et appelle
      # pg_restore/pg_dump directement au lieu de passer par `docker run`
      # (indisponible dans un job `container:`).
      - uses: ./.github/actions/backend-env
        with:
          testdb-cache-into: test_erp_db
          prebuilt-image: 'true'
      # YOPSB5 — anti-dérive modèle<->migration : échoue si un changement de
      # modèle n'a pas sa migration (index nommé à la main divergent,
      # contrainte sans migration…). Tourne AVANT la suite de tests, même
      # service Postgres/env que celle-ci.
      - name: Check for missing migrations (makemigrations --check)
        working-directory: backend/django_core
        run: python manage.py makemigrations --check --dry-run
      # Palier « par-merge » : tout SAUF les tests lourds étiquetés `pdf`/`slow`
      # (rendu WeasyPrint, golden PDF…). Ceux-ci tournent dans release-verify
      # (manuel + nightly), pour un retour rapide sur chaque merge.
      # WOW6/WOW-CI2 — ce shard n'exécute QUE sa tranche de MODULES de test
      # (placement LPT déterministe via scripts/ci_shard.py) ; l'union des 8
      # shards == exactement l'ensemble des modules `test*.py` de `apps`,
      # `authentication` et `core`, prouvé par scripts/tests/test_ci_shard.py.
      # `coverage` reste hors du gate (WOW3).
      - name: Run Django test suite — shard ${{ matrix.shard }}/6 (fast tier — excludes pdf/slow)
        working-directory: backend/django_core
        run: |
          set -euo pipefail
          LABELS=$(python ../../scripts/ci_shard.py ${{ matrix.shard }} 6)
          echo "Shard ${{ matrix.shard }}/6 -> $(echo "$LABELS" | wc -w) modules"

          # WOW-CI RONDE 5 — GARDE ANTI-`max_locks` (raisonnement complet dans
          # l'en-tête du job). On compte les modules de CE shard qui déclarent un
          # `TransactionTestCase` : chacun termine ses tests par un TRUNCATE de
          # tout le schéma (~4 500 verrous), et la table de verrous du cluster
          # n'en tient que ~6 400. Un seul à la fois passe ; deux en même temps
          # font sauter le shard. `core/tests/test_rls.py` est exclu du compte :
          # sans `POSTGRES_RLS_ENABLED` toute sa classe est sautée, donc sa purge
          # ne s'exécute jamais dans ce job (elle a son propre job `rls-tests`).
          # Détection par AST, et non par `grep` : `core/test_utils.py` CITE
          # `TransactionTestCase` une dizaine de fois (docstring du mixin, exemple
          # d'usage) sans en déclarer un seul — un grep textuel le comptait et
          # déclenchait la garde pour rien. On ne retient donc que les CLASSES
          # dont une base est réellement `TransactionTestCase` (ou le mixin
          # maison `WideTeardownTimeoutMixin`, qui est précisément le marqueur de
          # cette purge large dans ce dépôt).
          cat > /tmp/purge_large.py <<'PY'
          import ast
          import sys

          MARQUEURS = {'TransactionTestCase', 'WideTeardownTimeoutMixin'}


          def noms_de_bases(classe):
              for base in classe.bases:
                  if isinstance(base, ast.Name):
                      yield base.id
                  elif isinstance(base, ast.Attribute):
                      # `django.test.TransactionTestCase` -> `TransactionTestCase`
                      yield base.attr


          for chemin in sys.argv[1:]:
              try:
                  with open(chemin, encoding='utf-8') as fichier:
                      arbre = ast.parse(fichier.read(), chemin)
              except (OSError, SyntaxError, UnicodeDecodeError):
                  # Un fichier illisible n'est pas une raison de bloquer le shard :
                  # au pire la garde ne le compte pas, au mieux il n'existe pas.
                  continue
              for noeud in ast.walk(arbre):
                  if isinstance(noeud, ast.ClassDef) and MARQUEURS & set(noms_de_bases(noeud)):
                      print(chemin)
                      break
          PY
          FILES=""
          for label in $LABELS; do
            case "$label" in *test_rls*) continue ;; esac
            p="$(printf '%s' "$label" | tr '.' '/').py"
            if [ -f "$p" ]; then FILES="$FILES $p"; fi
          done
          WIDE_FILES=""
          if [ -n "$FILES" ]; then
            WIDE_FILES=$(python /tmp/purge_large.py $FILES)
          fi
          WIDE=$(printf '%s' "$WIDE_FILES" | grep -c . || true)
          if [ "${WIDE:-0}" -ge 2 ]; then
            PARALLEL=1
            echo "GARDE max_locks : $WIDE modules a purge large dans ce shard —"
            echo "$WIDE_FILES"
            echo "on retombe a --parallel 1 pour ce shard (lent, mais jamais rouge)."
          else
            PARALLEL=4
            echo "Purges larges dans ce shard : ${WIDE:-0} — --parallel 4."
          fi

          python manage.py test $LABELS -v 2 --exclude-tag=pdf --exclude-tag=slow --parallel "$PARALLEL" --keepdb

  # WOW6 — thin aggregator that PRESERVES the required `backend-tests` status
  # check name. Branch protection requires the literal `backend-tests` context
  # (NOT `ci-gate`), so the real job renamed to `backend-tests-shard` above must
  # be paired with a job still literally named `backend-tests`. Passes iff no
  # shard failed; also passes when the shards SKIP (backend=false), preserving the
  # path-filter "a skipped required check counts as success" behaviour.
  backend-tests:
    needs: [changes, ci-image-check, backend-tests-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      # WOW-CI RONDE 5 — GARDE OBLIGATOIRE. Les shards déclarent désormais
      # `needs: ci-image-check` ; si ce job échoue, les shards ne sont pas
      # « failure » mais « skipped », et sans cette étape cet agrégateur —
      # qui est un check REQUIS — passerait au VERT alors qu'AUCUN test backend
      # n'a tourné. Un échec d'image doit bloquer la fusion, pas la déverrouiller.
      - name: Fail if the CI image could not be resolved
        if: ${{ needs.ci-image-check.result == 'failure' || needs.ci-image-check.result == 'cancelled' }}
        run: |
          echo "ci-image-check=${{ needs.ci-image-check.result }} — l'image CI backend n'a pas pu être publiée/résolue."
          echo "Les shards n'ont donc PAS tourné. Repli manuel : workflow_dispatch sur ci-image.yml."
          exit 1
      - name: Fail if any shard failed or was cancelled
        if: ${{ needs.backend-tests-shard.result == 'failure' || needs.backend-tests-shard.result == 'cancelled' }}
        run: |
          echo "A backend-tests shard did not pass (result=${{ needs.backend-tests-shard.result }})."
          exit 1
      - name: All shards passed (or were skipped)
        run: echo "backend-tests-shard result=${{ needs.backend-tests-shard.result }} — gate OK."

  # ---------------------------------------------------------------------------
  # WOW-CI (2026-08-18) — le job `frontend-lint` était MESURÉ à 19 min 33 s sur le
  # run 32167530769, et 15 min 59 s de ce total étaient la SEULE étape Vitest :
  # 792 fichiers *.test.jsx sous jsdom, dont le rapport interne dit
  # « transform 38 s, setup 207 s, import 470 s, tests 978 s, environment 843 s ».
  # Le poste dominant (`environment`) est le montage d'un jsdom NEUF par fichier :
  # c'est du CPU pur, donc ça se divise en ajoutant des machines, pas en changeant
  # la config. On applique donc à la lettre le patron WOW6 déjà éprouvé côté
  # backend : la charge part dans une matrice `frontend-vitest-shard` (Vitest
  # `--shard`, découpage par fichier, aucun test retiré ni ignoré), les gardes
  # statiques (eslint + check-hex + node:test) partent dans `frontend-static` pour
  # rendre leur verdict en ~3 min au lieu d'attendre derrière les tests, et le nom
  # de check REQUIS `frontend-lint` est préservé à l'identique par l'agrégateur
  # mince défini juste après.
  #
  # NE RENOMMEZ PAS `frontend-lint` : la protection de branche exige le contexte
  # LITTÉRAL `frontend-lint` (avec e2e/backend-lint/backend-tests/stage-names/
  # web-build-test). Un renommage laisserait ce check « Pending » pour toujours et
  # bloquerait toute fusion.
  # ---------------------------------------------------------------------------
  frontend-static:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Lint frontend (eslint)
        working-directory: frontend
        run: npm run lint
      # VX121 — garde « zéro couleur hors token » : les blocs de composants déjà
      # tokenisés d'index.css (form-control/modal/table/lead-nav/page-loading…)
      # ne doivent plus jamais réintroduire un hex codé en dur (script maison,
      # zéro dépendance — frontend/scripts/check_hex.mjs).
      - name: Check hex colors outside design tokens (index.css)
        working-directory: frontend
        run: npm run check-hex
      # Logique pure (sizing solaire, parité catalogue, utils…) : node:test, AUTO-
      # DÉCOUVERTE via glob — tout nouveau *.test.mjs tourne sans liste à tenir.
      - name: Frontend unit tests (node:test — pure logic, auto-discovered)
        working-directory: frontend
        # --experimental-test-coverage : % visible de la logique pure couverte
        # (informatif — n'échoue que sur un test rouge, pas sur un seuil).
        run: node --test --experimental-test-coverage "src/**/*.test.mjs"
      # YHARD7 — budget de performance du bundle SPA ERP : échoue si un chunk
      # (ou le total gzippé) dépasse son budget. Dev-only
      # (frontend/scripts/check_bundle_budget.mjs, Node stdlib pur).
      #
      # WOW-CI2 (2026-08-18) — REPLIÉ ICI depuis l'ancien job `frontend-perf`,
      # qui mesurait 27 s et payait pourtant un runner entier (checkout +
      # setup-node + npm ci). Le dépôt public plafonne à 20 jobs SIMULTANÉS et
      # ce plafond était atteint : le slot libéré finance une lane de tests
      # backend, ce qui raccourcit le chemin critique. Aucun contrôle n'est
      # perdu — build et budget tournent ici, sur les dépendances déjà installées.
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Check bundle budget
        working-directory: frontend
        run: npm run check-bundle-budget

  # Couche UX : rendu/interaction (Testing Library) + accessibilité (axe),
  # exécutée par Vitest (fichiers *.test.jsx, jsdom) + résumé de couverture.
  # Le decoupage en lanes explicites (VITEST_INCLUDE, WOW-CI4 ci-dessous)
  # decoupe la liste de fichiers, jamais le contenu d'un fichier : l'union des
  # 4 lanes est EXACTEMENT la suite complète d'aujourd'hui (completude prouvee
  # par scripts/tests/test_ci_frontend_shard.py).
  # `--coverage` reste sur chaque lane : le rapport devient un résumé par tranche
  # (il est purement informatif — aucun seuil ne gate, cf. vitest.config.js).
  frontend-vitest-shard:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund
      # WOW-CI4 — `--shard=i/n` de Vitest repartit le NOMBRE de fichiers, pas le
      # TRAVAIL. Mesure du run 32206663106 : 265 / 265 / 264 fichiers pour
      # 381 s / 266 s / 193 s de travail. On passe donc a des LISTES EXPLICITES
      # equilibrees sur les durees mesurees (794 fichiers, 840 s ;
      # scripts/ci_vitest_timings.json), placees par le meme LPT que le backend.
      # La liste transite par VITEST_INCLUDE et non par des arguments
      # positionnels : Vitest traite ces derniers comme des FILTRES par
      # sous-chaine, donc un chemin prefixe d'un autre embarquerait des fichiers
      # en trop. Completude de l'union prouvee par
      # scripts/tests/test_ci_frontend_shard.py (job stage-names).
      - name: Frontend component + a11y tests — lane ${{ matrix.shard }}/4 (Vitest + Testing Library + axe)
        working-directory: frontend
        run: |
          set -euo pipefail
          VITEST_INCLUDE="$(python3 ../scripts/ci_frontend_shard.py $(( ${{ matrix.shard }} - 1 )) 4)"
          export VITEST_INCLUDE
          echo "Lane ${{ matrix.shard }}/4 -> $(echo "$VITEST_INCLUDE" | tr ',' '\n' | wc -l) fichiers"
          npm run test:coverage

  # Agrégateur mince qui PRÉSERVE le nom de check requis `frontend-lint` (patron
  # WOW6, identique à `backend-tests`). Vert ssi aucune lane n'a échoué ; vert
  # aussi quand les lanes sont SAUTÉES (frontend=false), ce qui conserve la
  # sémantique « un check requis sauté compte comme réussi » du filtre de chemins.
  frontend-lint:
    needs: [changes, frontend-static, frontend-vitest-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a frontend lane failed or was cancelled
        if: ${{ needs.frontend-static.result == 'failure' || needs.frontend-static.result == 'cancelled' || needs.frontend-vitest-shard.result == 'failure' || needs.frontend-vitest-shard.result == 'cancelled' }}
        run: |
          echo "frontend-static=${{ needs.frontend-static.result }} frontend-vitest-shard=${{ needs.frontend-vitest-shard.result }}"
          echo "Une lane frontend n'est pas passée — voir les jobs ci-dessus."
          exit 1
      - name: All frontend lanes passed (or were skipped)
        run: echo "frontend-static=${{ needs.frontend-static.result }} frontend-vitest-shard=${{ needs.frontend-vitest-shard.result }} — gate OK."

  stage-names:
    # Intentionally UNGATED: this is the fast, broad drift guard. It must run on
    # docs/plan changes (plan fingerprint), on STAGES.py, and on any structural
    # change that feeds the CODEMAP fingerprint or the stage-name scan — so it
    # always runs, on every push and PR.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # MUST match prod (django_core/fastapi Dockerfiles: python:3.11.x). A 3.12+/3.13 CI would not catch 3.11-only SyntaxErrors (e.g. backslash in f-string) that crash the live PDF generator.
      - name: Check pipeline stage names against STAGES.py
        run: python scripts/check_stages.py
      - name: Check module registry <-> frontend consistency (ODX21)
        run: python scripts/check_modules.py
      # CONTRAT FRONT<->BACK (incident du 03/08/2026 : l'écran AO Bibliothèque
      # appelait /ao/bibliotheque/, une route jamais enregistrée -> 404 en
      # production ; 8 autres ressources du même module étaient dans le même
      # cas). Résolution statique de l'URLconf Django + des routers FastAPI,
      # confrontée aux chemins réellement appelés par frontend/src : tout appel
      # sans route correspondante échoue. Dette historique gelée dans
      # scripts/api_contract_allow.txt (elle ne peut que RÉTRÉCIR).
      #
      # ICI et pas dans `backend-lint` À DESSEIN : `backend-lint` est gaté sur
      # `backend == true`, donc une PR qui ne touche QUE le frontend (le cas
      # exact de aoApi.js) ne le déclenche pas. `stage-names` est le seul job
      # non gaté — et ce contrôle est en stdlib pure, sans base de données ni
      # dépendance, comme les autres check_*.py de ce job (~25 s).
      - name: Check front<->back API contract (aucun appel vers une route inexistante)
        run: python scripts/check_api_contract.py
      - name: Test the API-contract checker itself
        run: python -m unittest scripts.tests.test_check_api_contract -v
      # FORME DES RÉPONSES (même incident du 03/08/2026 : l'écran AO Tableau de
      # bord a planté alors que sa route existait, parce que son test mockait
      # l'INVERSE EXACT de ce que le serveur renvoie — `echeances_dues` est un
      # entier côté serveur, un tableau dans le mock ; 6 lectures sur 6 étaient
      # fausses, les deux suites vertes). Le contrat est dérivé du CODE serveur
      # et versionné dans docs/api-contracts.md ; un mock qui le contredit
      # échoue. Le schéma OpenAPI ne peut PAS jouer ce rôle (l'endpoint qui a
      # planté y est documenté `type: object` sans aucune propriété) — voir
      # l'en-tête du script.
      - name: Check API response shapes (aucun mock ne contredit le serveur)
        run: python scripts/check_api_shapes.py
      - name: Test the API-shapes checker itself
        run: python -m unittest scripts.tests.test_check_api_shapes -v
      # PACT7 — pour que le schéma OpenAPI PUISSE un jour jouer ce rôle, il
      # faut d'abord qu'il cesse de se taire et de mentir : `response=dict`
      # documente « type: object » SANS AUCUNE PROPRIÉTÉ (c'était la
      # déclaration exacte de /ao/tableau-marches/ le jour du plantage), et un
      # agrégat sans `@extend_schema` est publié avec le `serializer_class` du
      # ViewSet — `/flotte/vehicules/tableau-bord/` était documenté
      # VehiculeSerializer alors qu'il renvoie {vehicules, engins, echeances,
      # couts, entretien, pool}. Analyse statique pure (~35 s), sans base de
      # données ni dépendance, comme les autres check_*.py de ce job.
      - name: Check OpenAPI response shapes (aucun agrégat ne se déclare « un objet »)
        run: python scripts/check_openapi_shapes.py
      - name: Test the OpenAPI-shapes checker itself (PACT7)
        run: python -m unittest scripts.tests.test_check_openapi_shapes -v
      # VOCABULAIRE À SOURCE DÉCLARÉE (PACT159). Une liste de choix frontend
      # qui porte `// source-choix: app.Modele.champ` PROMET que son
      # vocabulaire vient du serveur ; la garde échoue si elle invente une
      # valeur. Volontairement OPT-IN : la détection par ressemblance a été
      # MESURÉE à 72 % de faux positifs (13 sur 18) et ratait le cas fondateur
      # (ExigencesPage ne partageait AUCUNE valeur avec son champ). Une liste
      # sans marqueur n'est jamais un rouge. Stdlib pure, ~5 s.
      - name: Check listes de choix à source déclarée (PACT159)
        run: python scripts/check_choices_declares.py
      - name: Test the declared-choices checker itself (PACT159)
        run: python -m unittest scripts.tests.test_check_choices_declares -v
      # ÉCRANS ATTEIGNABLES (incident du 03/08/2026, troisième défaut du même
      # jour) : le module « Appels d'offres » a été livré et déclaré TERMINÉ —
      # 194 tâches cochées, CI verte, déployé — alors que 68 écrans existaient
      # sur le disque dans frontend/src/features/ao/, 7 seulement atteignables
      # depuis le menu, 61 non. Cause racine identique au défaut front<->back :
      # les écrans sont construits par des lanes PARALLÈLES, mais le SEUL
      # fichier qui les relie au menu (`features/<app>/module.config.jsx`) a un
      # propriétaire UNIQUE — chaque lane livre son écran, personne ne revient
      # le brancher. Un écran orphelin compile, passe eslint et ses propres
      # tests : aucune autre étape de CI ne peut le voir.
      #
      # ICI et pas dans `frontend-lint` À DESSEIN : `frontend-lint` est gaté sur
      # `frontend == true`, donc une PR qui ne touche QUE le backend (ou que les
      # docs) ne le déclenche pas, alors qu'un module.config peut se périmer
      # depuis n'importe où. `stage-names` est le seul job non gaté — et ce
      # contrôle est en stdlib pure, sans node, sans build (~11 s).
      # Passif du 03/08/2026 gelé dans scripts/ecrans_atteignables_allow.txt
      # (80 entrées : il ne peut que RÉTRÉCIR).
      - name: Check écrans atteignables (aucun écran livré hors du menu)
        run: python scripts/check_ecrans_atteignables.py
      - name: Test the reachable-screens checker itself
        run: python -m unittest scripts.tests.test_check_ecrans_atteignables -v
      # TÂCHES DE PLAN QUI COMMANDENT DU TRAVAIL MORT (même incident du
      # 03/08/2026, pris UN CRAN PLUS HAUT). check_ecrans_atteignables /
      # check_api_contract attrapent l'écran orphelin et la route inexistante
      # APRÈS leur livraison ; cette garde-ci lit le TEXTE DES TÂCHES, là où le
      # défaut naît. Une tâche qui dit « crée features/<app>/MonEcran.jsx » sans
      # nommer son fichier de montage INTERDIT à l'agent de le brancher (règle
      # « touche uniquement les fichiers nommés ») : l'agent qui obéit livre
      # mécaniquement un écran mort. Deux formes bloquent — écran sans câblage,
      # et deux moitiés backend+frontend sans contrat partagé ; deux autres sont
      # mesurées mais NON bloquantes (backend sans consommateur, composant
      # redéfini) parce que leur taux de faux positifs a été MESURÉ trop élevé
      # (64 % sur les doublons, vérifié à la lecture du code) — voir l'en-tête
      # du script. Passif gelé dans scripts/taches_cablage_allow.txt (175
      # entrées : il ne peut que RÉTRÉCIR).
      #
      # ICI et pas dans `backend-lint` À DESSEIN : `backend-lint` est gaté sur
      # `backend == true`, donc une PR qui ne touche QUE des fichiers de plan
      # (le cas exact de cette garde) ne le déclencherait jamais.
      # `stage-names` est le seul job non gaté — et ce contrôle est en stdlib
      # pure, sans base de données ni dépendance, comme les autres check_*.py.
      - name: Check tâches de plan (aucune ne commande du travail mort)
        run: python scripts/check_taches_cablage.py
      # PACT12 — une tâche dont `Files:` nomme un fichier backend ET un fichier
      # frontend ANNONCE deux moitiés. En juillet 2026,
      # docs/FRONTEND_GAP_PLAN.md a constaté que « the paired frontend half of
      # each task was never built, EVEN THOUGH most tasks named a `frontend/`
      # file in their own Files: line » : la ligne annonçait les deux moitiés
      # et RIEN ne vérifiait qu'elles avaient été touchées toutes les deux.
      # 147 tâches de rattrapage écrites, 145 encore ouvertes un mois plus tard.
      - name: Check tâches mixtes (une moitié livrée ne peut pas être cochée)
        run: python scripts/check_plan_taches_mixtes.py
      - name: Test the mixed-task checker itself (PACT12)
        run: python -m unittest scripts.tests.test_check_plan_taches_mixtes -v
      - name: Test the plan-task wiring checker itself
        run: python -m unittest scripts.tests.test_check_taches_cablage -v
      - name: Check no raw JSON / bare error object is shown to the user (EZ16)
        run: python scripts/check_frontend_errors.py
      - name: Test the anti-jargon checker itself (EZ16)
        run: python -m unittest scripts.tests.test_check_frontend_errors -v
      - name: Check test determinism (no sleeps / unfrozen live-clock assertions)
        run: python scripts/check_test_determinism.py
      - name: Check tenant distinctness (a "second tenant" in a test must be a real second row)
        run: python scripts/check_test_tenant_distinctness.py
      - name: Test the tenant-distinctness checker itself
        run: python -m unittest scripts.tests.test_check_test_tenant_distinctness -v
      - name: Check heavy tests carry a @tag (WOW5 — keep the fast tier fast)
        run: python scripts/check_test_tags.py
      - name: Check invariant registry (docs/invariants.md still points at real tests)
        run: python scripts/check_invariants.py
      - name: Check CODEMAP structural fingerprint
        run: python scripts/codemap_fingerprint.py --check
      - name: Check for unsafe migration DDL patterns (YOPSB4)
        run: python scripts/check_safe_migrations.py
      - name: Test the safe-migrations checker itself (YOPSB4)
        run: python -m unittest scripts.tests.test_check_safe_migrations -v
      - name: Validate docs/BUILD_ORDER.yml (SCA5 — acyclic DAG, parseable thresholds, no orphaned plan prefix)
        run: python scripts/check_build_order.py
      - name: Test the BUILD_ORDER.yml checker itself (SCA5)
        run: python -m unittest scripts.tests.test_check_build_order -v
      - name: Test the testdb-cache safety guard itself (WOW8 — a wrong DELTA verdict false-greens a stale schema)
        run: python -m unittest scripts.tests.test_ci_testdb_manifest_diff -v
      # WOW-CI2 — le decoupage des tests backend decide QUELS tests tournent.
      # Si un module tombait du split, ses tests cesseraient de tourner pendant
      # que tous les checks requis resteraient VERTS : un gate qui a
      # silencieusement cesse de garder. Ce test prouve que l'union des lanes
      # est exactement l'ensemble des modules `test*.py`, sans doublon, pour
      # plusieurs totaux de shards. Stdlib pure, ~6 s.
      - name: Test the backend-test shard split itself (WOW-CI2 — completude du decoupage)
        run: python -m unittest scripts.tests.test_ci_shard -v
      # WOW-CI4 — meme garde pour les lanes Vitest : un fichier qui tomberait du
      # decoupage cesserait d'etre teste pendant que `frontend-lint` resterait
      # vert. Stdlib pure, ~2 s.
      - name: Test the frontend-test lane split itself (WOW-CI4 — completude du decoupage)
        run: python -m unittest scripts.tests.test_ci_frontend_shard -v

  web-build-test:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install apps/web dependencies
        working-directory: apps/web
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Type-check apps/web logic (tsc — src/lib estimator/math surface)
        working-directory: apps/web
        run: npm run check
      - name: Build marketing site (astro build)
        working-directory: apps/web
        run: npm run build
      - name: Run apps/web test suite (vitest)
        working-directory: apps/web
        run: npm test

  # End-to-end browser suite (Playwright). Reuses the SAME throwaway services as
  # backend-tests (Postgres+pgvector, Redis, MinIO — never production), serves
  # the real built app via vite preview (same-origin proxy to Django), and drives
  # 16 flows headless. Seeds only throwaway demo data (manage.py seed_demo).
  # Gated on `code` (backend OR frontend, incl. the STAGES.py contract): it is
  # the cross-surface integration net and must NOT skip on a backend- or
  # frontend-only change; it skips only on website-only and docs-only changes.
  # WOW-CI2 (2026-08-18, run 32182877239) — les specs prenaient 5 min 22 s :
  # « Running 55 tests using 1 worker » (chromium, 4,0 min) puis « Running 16
  # tests using 1 worker » (mobile-safari, 1,3 min). Le worker unique est
  # DÉLIBÉRÉ et on n'y touche pas : les specs partagent un seul gunicorn et une
  # seule base de démonstration, les paralléliser sur la même base est la
  # recette à flakes. On garde donc 1 worker par base, et on donne à chaque lane
  # SA base : deux lanes, `--shard` natif de Playwright sur la partie chromium.
  # Le nom de check REQUIS `e2e` est préservé par l'agrégateur mince plus bas —
  # NE PAS le renommer (protection de branche : contexte littéral).
  # ---------------------------------------------------------------------------
  # WOW-CI RONDE 5 (20/08/2026) — CE JOB RESTE SUR LE CHEMIN CLASSIQUE (runner
  # nu + apt/pip caches), DÉLIBÉRÉMENT. Une variante `ci-e2e` de l'image
  # pré-construite avait été envisagée ; l'arithmétique ne la justifie pas :
  #   - ce qu'elle supprimerait : `npm ci` ~13 s + `playwright install` ~31-37 s
  #     (cache navigateurs chaud) + la part apt/pip de `backend-env` ~20-60 s,
  #     soit ~65-110 s ;
  #   - ce qu'elle coûterait : une image portant en plus Node 22, chromium ET
  #     webkit avec leurs dépendances système (~2 Go), donc ~30-45 s de pull, et
  #     un `node_modules` qui devrait de toute façon être réinstallé à chaque
  #     changement du lock — le vrai contenu de `npm ci`.
  # Le gain net (~30-60 s) ne paie pas le doublement de la surface d'images à
  # entretenir sur un job qui n'est pas le plancher du gate. À rouvrir si
  # `e2e-shard` redevient la lane la plus lente.
  # ---------------------------------------------------------------------------
  e2e-shard:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: erp_db
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
    env:
      DJANGO_SETTINGS_MODULE: erp_agentique.settings.dev
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
      DJANGO_DEBUG: 'True'
      DB_NAME: erp_db
      DB_USER: erp_user
      DB_PASSWORD: ci_password
      DB_HOST: localhost
      DB_PORT: '5432'
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      MINIO_ENDPOINT: localhost:9000
      MINIO_ROOT_USER: erp_admin
      MINIO_ROOT_PASSWORD: erp_minio_password
      MINIO_BUCKET_PDF: erp-pdf
      MINIO_BUCKET_UPLOADS: erp-uploads
      # NTPLT42/PACT8 — throttle par tenant DÉSACTIVÉ ici, comme sous le test
      # runner Django (base.py : « une suite qui boucle des centaines de
      # requêtes pour la même société ne doit jamais échouer sur un 429
      # parasite »). Ce gunicorn n'est PAS sous TESTING, donc sans cette env le
      # budget 1200/min s'applique : la fumée PACT8 (~300 boots × ~15 appels
      # API, une seule société démo) le dépasse, `/auth/me/` répond 429, le
      # routeur croit la session expirée → /login → « page blanche » (mesuré le
      # 2026-08-12 : compta/budgets, flotte/conformite, production/abonnements).
      # Le throttle garde son test dédié : core/tests/test_tenant_throttle.py.
      TENANT_RATE_LIMIT: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # MUST match prod (django_core/fastapi Dockerfiles: python:3.11.x). A 3.12+/3.13 CI would not catch 3.11-only SyntaxErrors (e.g. backslash in f-string) that crash the live PDF generator.
          cache: 'pip'   # WOW4 — cache les deps Python (npm l'était déjà, pas pip) ; clé sur requirements-dev.txt.
          cache-dependency-path: backend/django_core/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # -----------------------------------------------------------------------
      # WOW-CI (2026-08-18) — CACHE DES PAQUETS APT. Mesuré sur le run
      # 32167530769 : l'étape « Install Playwright browsers » a duré 9 min 10 s,
      # et son propre journal dit « Fetched 114 MB in 8min 41s (219 kB/s) ».
      # Autrement dit 95 % du coût est le TÉLÉCHARGEMENT APT des dépendances
      # système de WebKit (fontes CJK, gstreamer, libavcodec, librsvg…) — pas les
      # navigateurs : leurs binaires (177 Mo + 101 Mo depuis le CDN Playwright)
      # descendent en ~14 s. On redirige donc le magasin de .deb d'apt vers un
      # dossier que `actions/cache` sait restaurer : sur un cache chaud apt trouve
      # tous les paquets sur place (il revérifie leurs sommes de contrôle) et ne
      # télécharge RIEN — il ne reste que le dépaquetage. Sur un cache froid, le
      # comportement est EXACTEMENT celui d'avant : rien n'est sauté, aucune
      # dépendance n'est retirée, WebKit reste installé et testé.
      #
      # Placé AVANT `backend-env` à dessein : ses paquets WeasyPrint passent par
      # le même magasin et deviennent gratuits eux aussi.
      #
      # On ne met VOLONTAIREMENT PAS `~/.cache/ms-playwright` dans le cache :
      # ~450 Mo pour ~14 s gagnées, alors que le quota de cache du dépôt est déjà
      # saturé (10,49 Go pour 10 Go au 18/08) — et évincer un dump testdb (WOW8)
      # coûterait un rebuild à froid d'environ 40 min.
      # -----------------------------------------------------------------------
      - name: Redirect apt's .deb store into a cacheable directory
        # JAMAIS BLOQUANT : ce n'est qu'une optimisation. Si quoi que ce soit
        # échoue ici, apt reprend son magasin par défaut et le job se comporte
        # exactement comme avant — une accélération ne doit pas pouvoir faire
        # rougir un check REQUIS.
        run: |
          set -uo pipefail
          mkdir -p "$HOME/apt-archives/partial" || true
          # apt abandonne ses privilèges vers l'utilisateur `_apt` pour écrire
          # dans `partial/` : sans droits larges il retombe (bruyamment) sur un
          # téléchargement non bac-à-sable, ou échoue.
          chmod -R 777 "$HOME/apt-archives" || true
          printf 'Dir::Cache::archives "%s";\nBinary::apt::APT::Keep-Downloaded-Packages "true";\n' \
            "$HOME/apt-archives" | sudo tee /etc/apt/apt.conf.d/99-ci-archive-cache >/dev/null \
            || echo "AVERTISSEMENT : redirection du cache apt impossible — on continue sans."
          exit 0
      - name: Cache apt packages (Playwright system deps + WeasyPrint)
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          # WOW-CI7 (19/08) — LA CLE NE DEPEND PLUS QUE DU LOCK. Elle portait
          # aussi l'empreinte de `.github/actions/backend-env/action.yml`, ce qui
          # etait une faute : ce fichier change pour des raisons qui n'ont RIEN a
          # voir avec la liste des paquets .deb. Mon propre correctif de la ronde 6
          # (cache de l'environnement Python) l'a modifie, a invalide ce cache, et
          # le run qui a suivi est tombe sur un miroir Ubuntu etrangle a 32 ko/s :
          # « Fetched 114 MB in 59min 15s ». Une heure de silence pour une cle
          # couplee a un fichier sans rapport.
          # Ce qui determine reellement le jeu de paquets, c'est la version de
          # Playwright (donc le lock). Si la liste WeasyPrint de backend-env
          # change un jour, apt telechargera ces quelques paquets en plus et le
          # cache se recalera tout seul au prochain run `push` — auto-correcteur,
          # au lieu de tout jeter a chaque edition.
          key: apt-e2e-v2-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            apt-e2e-v2-${{ runner.os }}-
      # WOW7 — shared WeasyPrint + pip (requirements-dev.txt) + MinIO setup.
      # WOW8 — restore the cached pre-migrated dump straight into erp_db
      # (measured: this job's migrate+seed step was 1796s of a 1915s total —
      # 94% — while the E2E specs themselves ran in 36s). The migrate below
      # becomes a fast no-op; the seeds still run fresh.
      - uses: ./.github/actions/backend-env
        with:
          testdb-cache-into: erp_db
      - name: Migrate + seed throwaway demo data
        working-directory: backend/django_core
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo
          # The simulator catalogue (defaults to the seeded `taqinor-demo`
          # company) is what the auto-devis sizing matches against.
          python manage.py seed_catalogue
          # AOF186/AOF190 — the AO demo affaire (marker `FRDISI`, built FROM
          # the AOF183 goldens) is the fixture every `ao-*.spec.js` opens via
          # `openAoDemoAffaire`. `seed_demo` does NOT create it: without this
          # line the AO specs time out looking for an affaire nobody seeded —
          # a red that says nothing about the code under test.
          python manage.py seed_ao_demo --company taqinor-demo --confirmer
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund
      # WOW-CI5 (19/08) — le cache apt du round 2 fonctionne desormais : ce run
      # a bien restaure `apt-e2e-v1-...`, donc les dependances systeme de WebKit
      # ne se retelechargent plus. Les 37 s qui restent sont le telechargement
      # des NAVIGATEURS depuis le CDN Playwright (chromium 177 Mo + webkit
      # 101 Mo + ffmpeg). On les cache a leur tour, cle EXACTE sur le lock (donc
      # sur la version de Playwright) et sans `restore-keys` : un binaire d'une
      # autre version ferait echouer le lancement avec « Executable doesn't
      # exist ». `npx playwright install` continue de tourner juste apres — il
      # est idempotent et ne fait rien quand les binaires sont deja la.
      # (Au round 1 j'avais ecarte ce cache : ~250 Mo pour ~14 s ne le valaient
      # pas quand le quota du depot etait sature. Le gain mesure est maintenant
      # de ~30 s par lane, et les caches evinces en LRU sont les bases CodeQL
      # par-commit, jamais relues — pas les dumps testdb, relus a chaque run.)
      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-browsers-v1-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Playwright browsers (chromium + webkit)
        # WOW-CI7 — plafond au niveau de l'ETAPE, pas seulement du job : quand
        # cette etape est le point de blocage, l'echec doit la NOMMER. Le
        # 19/08 elle a tourne 59 min 44 s sur un miroir apt etrangle et le job
        # est mort en silence a 1 h 05. 10 min est large : mesure a 31-37 s sur
        # un miroir sain, ~9 min sur le pire miroir observe avant celui-ci.
        timeout-minutes: 10
        working-directory: frontend
        # VX68 — WebKit (Safari réel) en plus de Chromium : le smoke ajoute un
        # passage `mobile-safari` pour attraper ce qui ne casse QUE sur Safari.
        # `--with-deps` est CONSERVÉ tel quel (mêmes navigateurs, mêmes
        # dépendances système) ; c'est le magasin apt caché plus haut qui rend
        # sa partie « téléchargement » gratuite sur un cache chaud.
        run: npx playwright install --with-deps chromium webkit
      - name: Build frontend (no service worker for E2E)
        working-directory: frontend
        env:
          VITE_E2E: '1'
        run: npm run build
      - name: Start Django + run E2E specs
        working-directory: backend/django_core
        run: |
          gunicorn erp_agentique.wsgi:application \
            --bind 127.0.0.1:8000 --workers 3 --timeout 120 --worker-class sync &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              http://127.0.0.1:8000/api/django/admin/login/ || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "Django prêt (HTTP $code)"; break
            fi
            echo "Attente Django ($i)…"; sleep 2
            if [ "$i" = "30" ]; then echo "Django indisponible"; exit 1; fi
          done
          cd ../../frontend
          # Palier « smoke » par-merge : parcours UTILISATEUR critiques + santé.
          # `devis.spec` = lead → devis → PDF (le projet `setup` se connecte aussi
          # via la dépendance Playwright). On garde des specs SELF-CONTAINED ici :
          # `leads.spec` (E7 → Signé) dépend d'un devis créé par un spec antérieur
          # dans la matrice ordonnée → reste en e2e COMPLET (release-verify), pas
          # en smoke. La matrice complète + mobile tourne dans release-verify.yml.
          # PACT8 — les `fumee-ecrans-{1,2,3}.spec.js` ouvrent CHAQUE route déclarée par les
          # `features/*/module.config.jsx` (302 écrans lus automatiquement,
          # aucune liste à tenir) sur ce vrai Django et cette vraie base, et
          # échoue sur un ErrorBoundary affiché, une exception non rattrapée,
          # un lien `…/undefined` ou une page blanche. C'est LE filet
          # transversal que ce commentaire promettait sans l'avoir : le
          # 03/08/2026, `/ao` était déclaré dans `e2e/helpers.js` et visité par
          # AUCUNE spec, nulle part. Ne le retirez pas de cette ligne.
          # WOW-CI5 — repartition MESUREE sur les specs SCINDEES.
          # `fumee-ecrans.spec.js` pesait 183,4 s dans un seul fichier, soit
          # 84 % du temps chromium, et Playwright affecte un fichier ENTIER a un
          # shard : ce fichier fixait donc seul le plancher du job. Il est
          # desormais scinde en trois groupes de modules equilibres
          # (141/141/140 routes sur 422 — voir e2e/fumee-ecrans.partition.js,
          # dont la garde d'union prouve qu'aucun module ni aucune route ne
          # tombe du decoupage). Durees mesurees sur le run 32206663106 :
          #   fumee (3 groupes) 61,1 s chacun | devis 20,7 s | health 13,9 s
          #   mobile-safari 71,3 s
          # Repartition retenue : 61,1+61,1+20,7 = 142,9 s contre
          # 61,1+13,9+71,3 = 146,3 s. Une 3e lane descendrait a ~96 s mais le
          # budget de creneaux est plein (bloc CRENEAUX en tete de fichier) ;
          # le decoupage la rend possible des qu'un creneau se libere.
          if [ "${{ matrix.shard }}" = "1" ]; then
            npx playwright test --project=chromium \
              fumee-ecrans-1.spec.js fumee-ecrans-2.spec.js devis.spec.js
          else
            npx playwright test --project=chromium \
              fumee-ecrans-3.spec.js health.spec.js
          fi
          # VX68 — passage WebKit RÉEL (Safari) sur le spec mobile : capte les
          # régressions qui n'apparaissent que sur Safari (VX48 window.open
          # post-await, sticky, backdrop-blur). PR-only, hors matrice complète.
          # Sur la lane 2 seulement : 1,3 min mesurées, c'est le contrepoids de
          # la moitié chromium. Il n'est PAS shardé (16 tests, un seul worker).
          if [ "${{ matrix.shard }}" = "2" ]; then
            npx playwright test --project=mobile-safari
          fi
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: frontend/playwright-report
          retention-days: 7
      # WOW-CI2 — la sauvegarde du cache apt du round 1 a ÉCHOUÉ sur le run
      # 32182877239 : « tar: ../../../apt-archives/lock: Cannot open: Permission
      # denied », idem pour `partial/`. apt tourne en root et recrée ces deux
      # entrées en root ; le tar de post-job, lancé en `runner`, ne peut pas les
      # lire — donc RIEN n'était sauvegardé et chaque run repayait les 114 Mo.
      # On retire les deux entrées qui ne sont pas des paquets et on rend le
      # dossier lisible, juste avant l'étape post d'actions/cache.
      # `if: always()` : le cache doit s'écrire même quand une spec est rouge,
      # sinon un run rouge condamne le suivant à repayer le téléchargement.
      - name: Make the apt store readable for the cache save
        if: ${{ always() }}
        run: |
          set -uo pipefail
          sudo rm -rf "$HOME/apt-archives/partial" "$HOME/apt-archives/lock" || true
          sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-archives" || true
          exit 0

  # Agrégateur mince qui PRÉSERVE le nom de check requis `e2e` (patron WOW6,
  # identique à `backend-tests` / `frontend-lint` / `backend-lint`).
  e2e:
    needs: [changes, e2e-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail if an e2e lane failed or was cancelled
        if: ${{ needs.e2e-shard.result == 'failure' || needs.e2e-shard.result == 'cancelled' }}
        run: |
          echo "Une lane e2e n'est pas passée (result=${{ needs.e2e-shard.result }})."
          exit 1
      - name: All e2e lanes passed (or were skipped)
        run: echo "e2e-shard result=${{ needs.e2e-shard.result }} — gate OK."

  # ---------------------------------------------------------------------------
  # NTPLT5 — suite d'étanchéité RLS, job FACULTATIF (non-required). N'entre
  # PAS dans ci-gate → la protection de branche reste intacte. Lance la seule
  # suite core.tests.test_rls avec POSTGRES_RLS_ENABLED=1 (elle est sautée
  # partout ailleurs, donc n'alourdit jamais le gate backend-tests requis).
  # ---------------------------------------------------------------------------
  rls-tests:
    needs: [changes, ci-image-check]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      packages: read
    # WOW-CI RONDE 5 — même image CI figée que les shards (cf. leur en-tête).
    container:
      image: ${{ needs.ci-image-check.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: erp_db
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
    env:
      DJANGO_SETTINGS_MODULE: erp_agentique.settings.dev
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
      DJANGO_DEBUG: 'True'
      DB_NAME: erp_db
      DB_USER: erp_user
      DB_PASSWORD: ci_password
      # WOW-CI RONDE 5 — job `container:` : services joignables par leur NOM
      # (voir le même commentaire sur `backend-tests-shard`).
      DB_HOST: postgres
      DB_PORT: '5432'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      MINIO_ENDPOINT: localhost:9000
      MINIO_ROOT_USER: erp_admin
      MINIO_ROOT_PASSWORD: erp_minio_password
      MINIO_BUCKET_PDF: erp-pdf
      MINIO_BUCKET_UPLOADS: erp-uploads
      # WOW-CI RONDE 5 — même élargissement que sur les shards : cette suite EST
      # un `TransactionTestCase`, donc chacun de ses tests se termine par la
      # purge large de 16-31 s que le garde-fou de 30 s annulerait tôt ou tard.
      DB_STATEMENT_TIMEOUT_MS: '600000'
      # Active la suite RLS (sautée partout ailleurs).
      POSTGRES_RLS_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      # WOW-CI (2026-07-16): reuse the WOW8 pre-migrated dump + --keepdb exactly
      # like the shards. Before this, rls-tests cold-replayed the full ~1,150-
      # migration history on every run (measured 36-52 min, 94-97% of the job;
      # the RLS assertions themselves run <1 min) — it was the job that made the
      # whole workflow read as ~45 min. Safe because the suite applies its own
      # policies in setUp and reverts them in tearDown (no env-gated migration:
      # POSTGRES_RLS_ENABLED changes nothing about migrate output), so the
      # restored dump exercises the RLS seal identically to a cold build.
      - uses: ./.github/actions/backend-env
        with:
          testdb-cache-into: test_erp_db
          prebuilt-image: 'true'
      # WOW-CI RONDE 5 — CE JOB RESTE DÉLIBÉRÉMENT EN `--parallel 1` (B3).
      # Deux raisons, pas une :
      #  1. Il n'exécute qu'UN module, qui ne contient qu'UNE classe
      #     (`RlsSealTests`). Django affecte une classe entière à un seul
      #     worker : `--parallel` n'aurait donc STRICTEMENT rien à répartir, il
      #     ne ferait qu'ajouter le coût de N clones de base.
      #  2. Cette classe est justement celle qui a fait sauter `max_locks` en
      #     juillet (commit 0d66f6e1) : c'est un `TransactionTestCase` dont
      #     chaque test purge tout le schéma. La paralléliser serait reprendre
      #     le risque en échange de zéro gain.
      # Ce job n'est de toute façon pas sur le chemin critique du gate : ses
      # assertions tournent en moins d'une minute, le reste est la restauration
      # WOW8 que le volet A raccourcit déjà.
      - name: Run RLS seal suite (opt-in — flag ON)
        working-directory: backend/django_core
        run: python manage.py test core.tests.test_rls -v 2 --keepdb --parallel 1

  # ---------------------------------------------------------------------------
  # Always-running aggregate gate. Pin THIS one job as the single required
  # status check on `main`: because it always runs (if: always()) it can never
  # be left "Pending", and it passes only when no job that actually ran failed
  # or was cancelled. A SKIPPED job (path-filtered out) counts as acceptable —
  # `contains(needs.*.result, 'failure')` is false for 'skipped'/'success'.
  # ---------------------------------------------------------------------------
  ci-gate:
    if: ${{ always() }}
    needs:
      - changes
      - ci-image-check
      - backend-lint-fast
      - backend-openapi
      - backend-lint
      - backend-tests-shard
      - backend-tests
      - frontend-static
      - frontend-vitest-shard
      - frontend-lint
      - stage-names
      - web-build-test
      - e2e-shard
      - e2e
    runs-on: ubuntu-latest
    steps:
      - name: Report job results
        run: |
          echo "changes=${{ needs.changes.result }}"
          echo "ci-image-check=${{ needs.ci-image-check.result }}"
          echo "backend-lint-fast=${{ needs.backend-lint-fast.result }}"
          echo "backend-openapi=${{ needs.backend-openapi.result }}"
          echo "backend-lint=${{ needs.backend-lint.result }}"
          echo "backend-tests-shard=${{ needs.backend-tests-shard.result }}"
          echo "backend-tests=${{ needs.backend-tests.result }}"
          echo "frontend-static=${{ needs.frontend-static.result }}"
          echo "frontend-vitest-shard=${{ needs.frontend-vitest-shard.result }}"
          echo "frontend-lint=${{ needs.frontend-lint.result }}"
          echo "e2e-shard=${{ needs.e2e-shard.result }}"
          echo "stage-names=${{ needs.stage-names.result }}"
          echo "web-build-test=${{ needs.web-build-test.result }}"
          echo "e2e=${{ needs.e2e.result }}"
      - name: Fail if any required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "A required CI job failed or was cancelled — see results above."
          exit 1
      - name: All clear
        run: echo "All CI jobs that ran passed (skipped jobs are acceptable)."
