name: CI

on:
  # Run push-triggered CI ONLY on the integration branches. Feature/PR
  # branches are fully covered by the pull_request trigger below, which diffs
  # against the PR base (main) so the change-detector skips heavy jobs
  # correctly. Without this filter every feature-branch push (branch creation,
  # main-integration merges, each commit) re-ran the whole suite a second time
  # with a stale baseline — pure waste. The PR run remains the merge gate.
  push:
    branches: [main, dev]
  pull_request:

# Cancel a superseded run on the same PR when a newer commit is pushed, so
# rapid pushes don't pile up redundant runs. Never cancels push runs on
# main/dev (those gate the deploy and must finish).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# NOTE on path filtering (see docs/CODEMAP.md §7):
# We do NOT use top-level `on: paths`/`paths-ignore`. A workflow skipped by a
# top-level path filter leaves its checks stuck in "Pending", which would
# *block* a PR that requires them (GitHub Docs: "Troubleshooting required
# status checks"). Instead, every heavy/lint job is gated by a per-job `if:`
# on the `changes` detector below. A job skipped by an `if:` conditional
# reports "Success" to branch protection, so it never deadlocks a merge.
# `stage-names` is intentionally left ungated (it is fast and is the broad
# drift guard), and `ci-gate` is an always-running aggregate so a single
# required check can be pinned safely.

# ---------------------------------------------------------------------------
# CRENEAUX — BUDGET : 18 JOBS SIMULTANES A NOUS (mesure du 19/08/2026, majoree
# ronde 4).
#
# Le depot public plafonne a 20 jobs simultanes, et ce plafond est PARTAGE avec
# les workflows d'analyse lances sur le meme commit. Mesure sur le run
# 32206663106 : CodeQL en prend 3 (javascript-typescript / actions / python).
# Notre vague en demandait alors 20 : `backend-openapi` et
# `backend-tests-shard (5)` n'avaient TOUJOURS PAS DEMARRE a T+11 min.
#
# UN JOB QUI NE DEMARRE PAS EST LA PIRE LANE POSSIBLE. Moins de lanes bien
# equilibrees battent toujours plus de lanes dont une partie fait la queue.
#
# La vague simultanee = tous les jobs qui declarent `needs: changes` (ils
# partent ensemble des que `changes` finit, ~16 s) PLUS `stage-names`, qui ne
# declare aucun `needs` et tourne donc en parallele. `changes` est termine avant
# que la vague parte ; les agregateurs (backend-lint, backend-tests,
# frontend-lint, e2e, ci-gate) attendent leurs lanes. Ni l'un ni les autres ne
# comptent — verifie contre l'ordonnancement reel du run ci-dessus.
#
#   stage-names 1 + backend-lint-fast 1 + backend-openapi 1 + frontend-static 1
#   + web-build-test 1 + rls-tests 1                                     =  6
#   + backend-tests-shard 6 + frontend-vitest-shard 4 + e2e-shard 2      = 12
#                                                              TOTAL     = 18
#
# SOLMVP54 (21/09/2026) — LA VAGUE RESTE A 18, RECOMPOSEE : `rls-tests` est
# replie dans la lane 0 de `backend-tests-shard` (-1), `backend-tests-shard`
# passe de 6 a 8 lanes (+2), et CodeQL ne tourne plus sur ce depot depuis le
# 19/08/2026 (ses 3 creneaux sont libres). Detail par job dans les commentaires
# de chaque job ; chiffres avant/apres dans le DONE LOG de docs/PLAN.md.
#
#   stage-names 1 + backend-lint-fast 1 + backend-openapi 1 + frontend-static 1
#   + web-build-test 1                                                  =  5
#   + backend-tests-shard 8 + frontend-vitest-shard 4 + e2e-shard 2     = 14
#                                                              TOTAL     = 19
#   (web-build-test ne tourne que sur un diff apps/web — 18 le reste du temps)
#
# VOLET F (20/08) — 18 -> 17 : `backend-tests-shard` etait passe de 6 a 5 lanes
# SANS rien ralentir. Le palier backend etait borne par UNE classe de test
# indivisible (~195 s) ; a 5 comme a 6 lanes la pire lane valait 196 s, la 6e
# ne servait qu'a alleger des lanes qui n'etaient deja plus le chemin critique.
#
# VOLET G (21/08) — 17 -> 18 : la classe qui bornait tout (3 tests, MESURES a
# ~380 s a eux seuls sur trois runs verts — voir l'en-tete de
# `backend-tests-shard`) est eclatee en trois classes/modules d'un test. Le
# plancher indivisible tombe de 195 s a 135 s, et une 6e lane redevient utile :
# elle fait passer le palier de 211 s a 176 s, ce qui pose le job backend a
# ~296 s, SOUS `e2e-shard` (306-336 s). Le creneau depense achete donc un vrai
# raccourcissement du gate ; la 7e et la 8e lane, elles, n'achetent plus rien
# (le chemin critique n'est plus le backend) et sont refusees pour cela.
# Marge restante sous le plafond de 20 : deux creneaux.
#
# RONDE 5 (20/08) — `ci-image-check` AJOUTE UN CRENEAU, MAIS PAS DANS LA VAGUE.
# Il ne declare AUCUN `needs` : il part a T=0 en meme temps que `changes` et
# finit en ~25-35 s sur le chemin normal, donc AVANT que la vague backend parte
# (elle attend `changes` ET lui). Les deux fenetres ne se recouvrent pas :
#
#   Fenetre 1 (T=0 a ~T+35 s) — `changes` 1 + `ci-image-check` 1
#     + stage-names 1 + frontend-static 1 + frontend-vitest-shard 4
#     + web-build-test 1                                            =  9
#     (`e2e-shard` a quitte cette fenetre : il attend desormais lui aussi
#      `ci-image-check`, car il tourne dans l'image `ci-e2e`.)
#   Fenetre 2 (apres) — `changes` et `ci-image-check` sont sortis :
#     stage-names 1 + backend-lint-fast 1 + backend-openapi 1
#     + frontend-static 1 + web-build-test 1 + rls-tests 1  = 6,
#     + backend-tests-shard 6 + frontend-vitest-shard 4
#     + e2e-shard 2                                        = 12     = 18
#
# LE PIC EST DONC 18 (volet G : 17 + 1 lane backend), soit DEUX creneaux de
# marge mesuree sous le plafond de 20. Le chemin LENT de `ci-image-check`
# (construction en ligne, ~8-12 min, uniquement quand un requirements, un
# lockfile frontend ou un Dockerfile CI change) allonge sa fenetre mais ne
# l'elargit pas : c'est toujours 1 creneau, et la vague attend simplement plus
# longtemps pour demarrer.
#
# 3e LANE e2e — TOUJOURS REFUSEE, et le calcul est ici pour qu'on ne le reprenne
# pas a zero. Sur le run vert 32307320397, les etapes de specs des deux lanes
# valent 129 s et 126 s : elles sont deja equilibrees a 3 s pres, et une 3e lane
# ramenerait le pire bloc de specs de 123 s a 86 s, soit ~37 s. C'est SOUS le
# seuil de 60 s qui justifierait de depenser un creneau — et une lane e2e a
# ~306 s est de toute facon talonnee par `frontend-vitest-shard` (291 s
# mesurees), qui deviendrait le nouveau plancher : les 37 s ne rapporteraient
# qu'environ 15 s sur le gate.
#
# VOLET G (21/08) — CE CALCUL A ETE REVERIFIE APRES LE RECALAGE BACKEND, ET IL
# TIENT TOUJOURS. Maintenant que le backend descend a ~296 s, `e2e-shard` EST
# le chemin critique — mais son plancher n'est pas la repartition des specs
# (deja droite a 3 s pres), c'est sa MISE EN PLACE, qui vaut 57 % du job. Une
# 3e lane e2e paierait donc une TROISIEME mise en place complete pour ne
# gagner que ~15 s de gate, plafonnes par vitest a 291 s. Le prochain vrai
# levier est la mise en place e2e/vitest elle-meme, pas un creneau de plus.
#
# PLIER DEUX JOBS COURTS EN SERIE POUR FINANCER UN CRENEAU — LES DEUX PISTES
# ONT ETE INSTRUITES LE 21/08 (volet G) ET LES DEUX SONT REFUSEES. Le calcul
# est ici pour qu'on ne le reprenne pas a zero.
#
#   a) `rls-tests` (114 s) plie dans une lane `backend-tests-shard`.
#      TECHNIQUEMENT possible : meme image CI, meme `backend-env`, meme base
#      `test_erp_db`, et `POSTGRES_RLS_ENABLED=1` se pose au niveau de l'etape.
#      REFUSE POUR DEUX RAISONS, dont une purement arithmetique :
#      1. `rls-tests` tourne aujourd'hui EN PARALLELE et n'est JAMAIS sur le
#         chemin critique. Le plier convertirait 114 s de temps gratuit en
#         ~30-60 s de temps SERIE ajoutes a une lane qui, elle, est sur le
#         chemin critique. On echangerait un creneau (dont on a la marge)
#         contre des secondes de gate (dont on n'a pas la marge).
#      2. Le job est DELIBEREMENT non-requis (voir son en-tete). Le plier dans
#         `backend-tests-shard` le ferait entrer dans le check REQUIS
#         `backend-tests` : une suite consultative deviendrait bloquante pour
#         toute fusion. C'est une decision du fondateur, pas un reglage de CI.
#
#   b) `backend-openapi` (150-168 s) plie dans `backend-lint-fast` (78-102 s).
#      REFUSE. `backend-lint-fast` est le SEUL job backend qui ne declare pas
#      `needs: ci-image-check` : il rend le verdict qui attrape 99 % des rouges
#      en ~1,5 min, sans attendre l'image et meme si GHCR est indisponible.
#      `backend-openapi`, lui, ne peut tourner QUE dans l'image. Les plier
#      obligerait `backend-lint-fast` a entrer dans le conteneur, donc a
#      attendre `ci-image-check` : +25-35 s sur le chemin rapide, mais surtout
#      +8 a 12 min sur le chemin LENT (toute PR qui touche un requirements ou
#      le Dockerfile CI) — c'est-a-dire precisement sur les PR les plus
#      risquees. WOW-CI2 avait SEPARE ces deux moities sur mesure ; les
#      recoller pour un creneau dont on a la marge serait defaire ce gain.
#
# CONCLUSION DU VOLET G SUR LES CRENEAUX : rien n'est a financer. Depuis que le
# backend est sorti du chemin critique, une lane de plus (backend, e2e ou
# vitest) n'achete plus de temps de mur — le plancher est la MISE EN PLACE de
# `e2e-shard` (57 % du job) et de `frontend-vitest-shard`. C'est la qu'ira le
# prochain volet, pas dans un creneau supplementaire.
#
# RONDE 4 (19/08) — la 4e lane vitest depense 1 des 3 creneaux libres MESURES
# sur le run 32265590843 (17 lanes a nous, 3 creneaux encore idle sous le
# plafond de 20 a ce moment-la — la contention CodeQL varie d'un run a l'autre,
# contrairement au pire cas fige ci-dessus). Il reste donc 2 creneaux de marge
# mesuree ; si une lane se met a faire la queue au demarrage, revenir a 3 lanes
# vitest en premier reflexe.
#
# PLAFONDS DE TEMPS (WOW-CI7, 19/08) — chaque lane porte un `timeout-minutes`.
# Le 19/08, `e2e-shard (2)` a brule 1 h 05 min 43 s sans qu'aucun garde-fou ne
# l'arrete : 59 min 44 s d'apt sur un miroir a 32 ko/s. Un plafond qui NOMME la
# lane est honnete ; une heure de silence ne l'est pas. Les valeurs sont ~2x la
# duree mesuree la plus longue, donc elles n'attrapent qu'une vraie pathologie.
#
# TOUTE augmentation d'une matrice doit etre compensee ailleurs. Si le fondateur
# desactive le CodeQL par defaut (reglage GitHub, pas un fichier de ce depot),
# des creneaux supplementaires se liberent jusqu'au plafond de 20.
# ---------------------------------------------------------------------------
jobs:
  # ---------------------------------------------------------------------------
  # Change detector. Resolves which surfaces a push/PR touched, using pure git
  # (no third-party action). It FAILS OPEN: whenever a precise diff range can't
  # be resolved (new branch, force-push, shallow history, missing base) it runs
  # the full suite, so a real code change can never silently skip its tests.
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
      web: ${{ steps.detect.outputs.web }}
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          backend=false; frontend=false; web=false
          run_all=false

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          elif [ "$EVENT_NAME" = "push" ]; then
            base="$PUSH_BEFORE"; head="$PUSH_AFTER"
          else
            base=""; head=""
          fi

          # Fail open on anything we cannot resolve to a precise diff range.
          if [ -z "$base" ] || [ -z "$head" ]; then run_all=true; fi
          case "$base" in *[!0]*) : ;; *) run_all=true ;; esac   # all-zeros => new branch
          if [ "$run_all" = false ]; then
            git cat-file -e "${base}^{commit}" 2>/dev/null || run_all=true
          fi
          if [ "$run_all" = false ]; then
            git cat-file -e "${head}^{commit}" 2>/dev/null || run_all=true
          fi

          if [ "$run_all" = true ]; then
            echo "Could not resolve a precise diff range — running the FULL suite (fail-open)."
            backend=true; frontend=true; web=true
          else
            changed="$(git diff --name-only "$base" "$head")"
            echo "Changed files between ${base} and ${head}:"
            echo "$changed"
            # CI / infra / docs / config changes (.github/**, docker-compose*,
            # docs, *.md, .gitignore, .claude/**, top-level state) do NOT run
            # the heavy jobs: they cannot change application behaviour, so the
            # only signal that matters is the always-on `stage-names` drift
            # guard (check_stages + CODEMAP fingerprint), which is ungated
            # below. A ci.yml edit that changes a test command is therefore not
            # re-validated on its own PR — by design (minimal CI); the fail-open
            # above still runs the FULL suite when the diff range itself is
            # unresolvable (new branch / force-push / shallow clone). The
            # `|| true` keeps a no-match (grep exit 1) from tripping `set -e`.
            # Use here-strings (NOT `echo | grep -q`): with a large `$changed`,
            # `grep -q` exits on first match before `echo` finishes writing, so
            # `echo` takes SIGPIPE and (under `set -o pipefail`) the pipeline
            # returns 141 — which made `&& backend=true` silently NOT run, so a
            # huge backend diff was mis-detected as backend=false and skipped the
            # required backend-tests gate. A here-string has no pipe writer to
            # kill, so grep's real exit status drives the `&&`.
            # Shared backend<->frontend contract: exercise both sides + e2e.
            grep -qE '^STAGES\.py$'  <<< "$changed" && { backend=true; frontend=true; } || true
            grep -qE '^backend/'     <<< "$changed" && backend=true  || true
            grep -qE '^frontend/'    <<< "$changed" && frontend=true || true
            grep -qE '^apps/web/'    <<< "$changed" && web=true      || true
            # AUD826 — `scripts/` EST une surface backend. 27 des 32 gardes de
            # `backend-lint-fast` + 2 de `backend-openapi` sont gatees sur
            # `backend == true` et lisent leur BASELINE ici
            # (on_delete_allowlist.txt, tenant_view_allowlist.txt,
            # read_modify_write_allow.txt, ...). Sans cette regle, un commit
            # d'hygiene « allowlists rebasees » qui ELARGIT une exemption
            # rendait backend=false : la garde modifiee ne tournait pas, les
            # six checks requis restaient satisfaits (un `skipped` ne fait pas
            # rougir un agregateur), et la PR fusionnait sans que la garde ne
            # se soit JAMAIS validee elle-meme. Garde de non-regression :
            # scripts/tests/test_ci_changes_filter.py (job `stage-names`).
            grep -qE '^scripts/'     <<< "$changed" && backend=true  || true
            # Everything else (docs/**, *.md, top-level state files, etc.)
            # affects none of the heavy jobs — only the always-on stage-names
            # guard, which is not gated here.
          fi

          # The e2e browser suite is the cross-surface net: any application
          # code (backend OR frontend, incl. the STAGES.py contract) runs it;
          # website-only and docs-only changes do not.
          code=false
          if [ "$backend" = true ] || [ "$frontend" = true ]; then code=true; fi

          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "web=$web"
            echo "code=$code"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved -> backend=$backend frontend=$frontend web=$web e2e(code)=$code"

  # ---------------------------------------------------------------------------
  # WOW-CI RONDE 5 (20/08/2026) — L'IMAGE CI BACKEND PRE-CONSTRUITE.
  #
  # Les lanes backend ne reconstruisent plus leur environnement : elles tournent
  # DANS une image figee (`.github/ci-image/Dockerfile`, poussee sur GHCR par
  # `.github/workflows/ci-image.yml`) qui contient deja les bibliotheques
  # WeasyPrint, tout `requirements-dev.txt`, `postgresql-client-16` et les
  # binaires MinIO. Ce job calcule l'etiquette (empreinte des deux requirements
  # + du Dockerfile CI), verifie que le manifeste existe sur GHCR, et l'expose.
  #
  # POURQUOI IL NE DECLARE PAS `needs: changes` — pour ne RIEN ajouter au chemin
  # critique. Il part a T=0, en meme temps que `changes` (~16 s) ; sur le chemin
  # normal (image presente) il finit en ~25-35 s, soit ~15 s apres `changes`.
  # Les lanes backend attendent donc les deux et demarrent ~15 s plus tard
  # qu'avant — contre ~60 a 150 s d'apt+pip+setup-python economisees CHACUNE.
  #
  # CHEMIN LENT (miss) : si l'etiquette n'existe pas encore — la PREMIERE PR qui
  # modifie un requirements ou ce Dockerfile — l'image est construite et poussee
  # ICI, en ligne (~8-12 min). Ce cout est paye UNE fois : au merge, le workflow
  # `ci-image.yml` republie la meme etiquette sur `main` et toutes les PR
  # suivantes retombent sur le chemin rapide.
  #
  # PAS DE REPLI SILENCIEUX (regle explicite) : si le pull echoue cote lane, la
  # lane echoue FRANCHEMENT. On ne garde pas un second chemin « ancien style »
  # vivant en parallele — deux chemins finissent toujours par diverger, et
  # l'ancien serait teste par personne. Le repli est MANUEL et visible :
  # `workflow_dispatch` sur `ci-image.yml`.
  #
  # LIMITE CONNUE : une PR issue d'un FORK recoit un GITHUB_TOKEN degrade en
  # lecture seule ; elle peut PULLER l'image mais pas la construire en ligne.
  # Ce depot travaille sur des branches internes (`claude/...`), donc le cas ne
  # se presente pas aujourd'hui ; il est note comme risque residuel.
  # ---------------------------------------------------------------------------
  ci-image-check:
    runs-on: ubuntu-latest
    # 30 min = le chemin LENT (construction en ligne) avec de la marge. Le
    # chemin normal rend son verdict en ~25-35 s.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
      image_e2e: ${{ steps.tag.outputs.image_e2e }}
    steps:
      - uses: actions/checkout@v4
      # Source UNIQUE des etiquettes, partagee avec `ci-image.yml` : si les deux
      # les calculaient separement, la moindre divergence reconstruirait les
      # images a chaque run.
      - name: Calculer les etiquettes des images
        id: tag
        run: bash .github/ci-image/tag.sh "${{ github.repository }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Les images sont-elles deja publiees ?
        id: exists
        run: |
          set -uo pipefail
          for couple in "backend:${{ steps.tag.outputs.image }}" "e2e:${{ steps.tag.outputs.image_e2e }}"; do
            cle="${couple%%:*}"; ref="${couple#*:}"
            if docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "Presente — chemin rapide : $ref"
              echo "${cle}=true" >> "$GITHUB_OUTPUT"
            else
              echo "ABSENTE — construction en ligne : $ref"
              echo "${cle}=false" >> "$GITHUB_OUTPUT"
            fi
          done
          exit 0
      - uses: docker/setup-buildx-action@v3
        if: ${{ steps.exists.outputs.backend != 'true' || steps.exists.outputs.e2e != 'true' }}
      - name: Construire et pousser ci-backend si elle manque (chemin lent)
        if: ${{ steps.exists.outputs.backend != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: backend/django_core
          file: .github/ci-image/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      # Construite PAR-DESSUS ci-backend, donc APRES elle, jamais en parallele.
      - name: Construire et pousser ci-e2e si elle manque (chemin lent)
        if: ${{ steps.exists.outputs.e2e != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: .github/ci-image/Dockerfile.e2e
          build-args: |
            CI_BACKEND_IMAGE=${{ steps.tag.outputs.image }}
          push: true
          tags: ${{ steps.tag.outputs.image_e2e }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Resume
        run: |
          echo "ci-backend = ${{ steps.tag.outputs.image }} (deja presente = ${{ steps.exists.outputs.backend }})"
          echo "ci-e2e     = ${{ steps.tag.outputs.image_e2e }} (deja presente = ${{ steps.exists.outputs.e2e }})"

  # ---------------------------------------------------------------------------
  # WOW-CI2 (2026-08-18, run 32182877239) — `backend-lint` durait 8 min 25 s, et
  # la mesure par étape a montré que TOUT tenait dans une seule : la génération
  # du schéma OpenAPI (YAPIC6) a pris 5 min 53 s à elle seule, en silence, sans
  # écrire une ligne. Sa vraie durée avait toujours été masquée par des rouges
  # antérieurs qui coupaient le job avant d'y arriver. Les 23 gardes statiques,
  # elles, coûtent 30 s EN TOUT.
  #
  # On sépare donc les deux moitiés en lanes parallèles : `backend-lint-fast`
  # rend son verdict en ~2 min 30 s (c'est celui qui attrape 99 % des rouges),
  # et `backend-openapi` paie seul sa génération. Le nom de check REQUIS
  # `backend-lint` est préservé par l'agrégateur mince plus bas — NE PAS le
  # renommer (protection de branche : contexte littéral).
  #
  # WOW-CI3 (2026-08-18) — la génération elle-même est désormais raccourcie,
  # mais dans le SCRIPT, pas ici. Profil par phase dans l'image de prod :
  # `get_schema()` 284 s (dont la moitié est le miroir `api/v1/` de l'arbre
  # `api/django/`, monté deux fois par urls.py), rendu YAML 99 s, `--validate`
  # 102 s, et surtout `yaml.safe_load` de 22,8 Mo 231 s. Corrigé par un
  # générateur qui n'introspecte qu'une fois puis reconstitue le miroir
  # (`erp_agentique/openapi_check.py`) et par un document intermédiaire JSON.
  # Aucune route d'exécution ne change, et l'instantané de contrat continue
  # d'être régénéré (`--write`) par le générateur de RÉFÉRENCE.
  # ---------------------------------------------------------------------------
  backend-lint-fast:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # MUST match prod (django_core/fastapi Dockerfiles: python:3.11.x). A 3.12+/3.13 CI would not catch 3.11-only SyntaxErrors (e.g. backslash in f-string) that crash the live PDF generator.
          cache: 'pip'
          cache-dependency-path: backend/django_core/requirements-dev.txt
      - run: pip install flake8 import-linter==2.11
      # SOLMVP54 (21/09/2026) — les 44 gardes de ce job (compileall 3.11, flake8,
      # lint-imports et les check_*.py gates sur `backend == true`) tournent en
      # PARALLELE via `scripts/ci_guards.py` (`GARDES['backend-lint-fast']`) :
      # 2 min 04 s en serie sur le run 35601218482. Meme regle que `stage-names`
      # (voir son commentaire) : la liste vit dans ci_guards.py, jamais ici, et
      # le POURQUOI de chaque garde est l'en-tete de son script. Rappel de la
      # frontiere : ICI = gardes gatees sur `backend == true` (elles lisent leur
      # baseline dans scripts/*_allow.txt) ; `stage-names` = gardes qui doivent
      # tourner sur TOUTE PR (docs, plan, frontend seul).
      - name: Gardes hôte en parallèle (scripts/ci_guards.py backend-lint-fast)
        run: python scripts/ci_guards.py backend-lint-fast
  # Lane dédiée : génération + validation du schéma OpenAPI. Mesurée à 5 min 53 s
  # sur le run 32182877239 (une seule invocation de `manage.py spectacular
  # --validate`, aucune sortie intermédiaire), puis raccourcie par WOW-CI3
  # (générateur `openapi_check.SchemaGeneratorAliasV1` + document JSON) — voir
  # l'en-tête de scripts/check_openapi_schema.py pour le profil par phase.
  # Elle tourne EN PARALLÈLE de `backend-lint-fast` et des 8 lanes de tests.
  backend-openapi:
    needs: [changes, ci-image-check]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    # WOW-CI RONDE 5 — l'image CI porte deja Python 3.11 (MEME version que la
    # prod), les bibliotheques WeasyPrint et TOUT requirements-dev.txt (qui
    # commence par `-r requirements.txt`, donc le sur-ensemble des deps prod
    # dont ce generateur a besoin). Les quatre etapes qui suivaient — cache apt,
    # apt-get, setup-python, pip install — ont disparu avec lui.
    #
    # UNE DIFFERENCE ASSUMEE, ET SES LIMITES. Ce job installait auparavant le
    # seul `requirements.txt` ; il voit desormais aussi les deps de dev. Or
    # `settings/dev.py` — que `check_openapi_schema.py` charge — ajoute
    # `nplusone.ext.django` a INSTALLED_APPS/MIDDLEWARE DES QUE le paquet est
    # importable. L'inventaire d'operations OpenAPI, lui, ne bouge pas : il est
    # derive du seul ROOT_URLCONF, et `nplusone` n'enregistre aucune route (il
    # n'expose qu'un middleware de journalisation des requetes N+1). Les
    # lanes `backend-tests-shard` tournent d'ailleurs deja sous `settings.dev`
    # AVEC ce paquet installe, donc la combinaison est eprouvee. Si un diff de
    # contrat inattendu apparaissait un jour ici, c'est la premiere piste.
    defaults:
      run:
        # WOW-CI RONDE 5 — dans un job `container:`, GitHub lance les scripts
        # avec `sh` (dash) par défaut : le premier `set -o pipefail` (bashisme)
        # tuait les six shards en ~90 s (run 32316154505). bash est présent
        # dans l'image — déclaré une fois pour toutes au niveau du job.
        shell: bash
    container:
      image: ${{ needs.ci-image-check.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # YAPIC6 — le schéma OpenAPI (YAPIC5) doit rester GÉNÉRABLE, VALIDE
      # (validation OpenAPI 3 de drf-spectacular) et sans NOUVEL avertissement
      # de génération : un serializer non résolu ou une collision d'operationId
      # introduits par une PR font rougir ce job. Le repo porte ~990 constats
      # préexistants (386 vues sans serializer resolvable, champs
      # SerializerMethod non typés, collisions d'énums) qu'aucune tâche unique
      # ne peut solder : ils sont figés dans scripts/openapi_schema_allow.txt,
      # et SEULE une signature nouvelle échoue — c'est un `--fail-on-warn`
      # borné. docs/openapi-schema.yml versionne l'inventaire des opérations
      # (le document complet fait ~20 Mo, illisible en revue) pour que le diff
      # de contrat apparaisse dans la PR.
      #
      # COÛT : le générateur importe TOUT l'URLconf, donc les vraies
      # dépendances backend (WeasyPrint & co). AUCUNE base de données n'est
      # nécessaire (le générateur ne fait qu'introspecter vues et serializers).
      # WOW-CI RONDE 5 (20/08/2026) — les quatre étapes de mise en place qui
      # tenaient ici (redirection du magasin apt, cache apt partagé, `apt-get
      # install` des bibliothèques WeasyPrint, `pip install -r
      # requirements.txt`) ont été SUPPRIMÉES : l'image CI déclarée en
      # `container:` plus haut les contient déjà, figées. Le cache apt partagé
      # `apt-e2e-v2-…` reste alimenté et consommé par `e2e-shard`, qui n'est pas
      # conteneurisé — cette suppression ne le prive de rien.
      # YOPSB5 — anti-dérive modèle<->migration : échoue si un changement de
      # modèle n'a pas sa migration (index nommé à la main divergent,
      # contrainte sans migration…). SOLMVP54 (21/09/2026) : DÉPLACÉ ICI depuis
      # `backend-tests-shard`, où CHAQUE lane le payait (8 s x 6 lanes, sur le
      # chemin critique du run). L'autodétecteur ne lit que les fichiers de
      # migration et les modèles ; sans serveur Postgres il émet un
      # RuntimeWarning (« Got an error checking a consistent migration
      # history ») et rend quand même son verdict — comportement documenté de
      # Django. Même env minimal que le job de tests, sans base.
      - name: Check for missing migrations (makemigrations --check)
        working-directory: backend/django_core
        env:
          DJANGO_SETTINGS_MODULE: erp_agentique.settings.dev
          DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
          DJANGO_DEBUG: 'True'
          DB_HOST: localhost
        run: python manage.py makemigrations --check --dry-run
      - name: Test the OpenAPI-schema checker itself (YAPIC6)
        run: python -m unittest scripts.tests.test_check_openapi_schema -v
      - name: OpenAPI schema — generate, validate, no NEW warning (YAPIC6)
        run: python scripts/check_openapi_schema.py


  # Agrégateur mince qui PRÉSERVE le nom de check requis `backend-lint`
  # (patron WOW6, identique à `backend-tests` et `frontend-lint`). Vert ssi
  # aucune des deux lanes n'a échoué ; vert aussi quand elles SAUTENT
  # (backend=false), ce qui conserve la sémantique « un check requis sauté
  # compte comme réussi » du filtre de chemins.
  backend-lint:
    needs: [changes, ci-image-check, backend-lint-fast, backend-openapi]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      # WOW-CI RONDE 5 — même garde que sur `backend-tests` : `backend-openapi`
      # dépend de l'image CI, donc un échec de `ci-image-check` le laisserait
      # « skipped » et ferait passer ce check REQUIS au vert sans rien valider.
      - name: Fail if the CI image could not be resolved
        if: ${{ needs.ci-image-check.result == 'failure' || needs.ci-image-check.result == 'cancelled' }}
        run: |
          echo "ci-image-check=${{ needs.ci-image-check.result }} — le job backend-openapi n'a pas tourné."
          exit 1
      - name: Fail if a backend-lint lane failed or was cancelled
        if: ${{ needs.backend-lint-fast.result == 'failure' || needs.backend-lint-fast.result == 'cancelled' || needs.backend-openapi.result == 'failure' || needs.backend-openapi.result == 'cancelled' }}
        run: |
          echo "backend-lint-fast=${{ needs.backend-lint-fast.result }} backend-openapi=${{ needs.backend-openapi.result }}"
          echo "Une lane backend-lint n'est pas passée — voir les jobs ci-dessus."
          exit 1
      - name: All backend-lint lanes passed (or were skipped)
        run: echo "backend-lint-fast=${{ needs.backend-lint-fast.result }} backend-openapi=${{ needs.backend-openapi.result }} — gate OK."

  # WOW6 — the fast backend suite is sharded across free public-repo runners
  # (matrix legs run concurrently, each on its own 4-vCPU runner + Postgres). The
  # REQUIRED `backend-tests` status check name is preserved by the thin
  # `backend-tests` aggregator job defined right after this one.
  #
  # WOW-CI2 (2026-08-18, run 32182877239) — 6 lanes -> 8, et surtout un découpage
  # ÉQUILIBRÉ. Le run à 6 lanes a mesuré des tests de 83 s à 767 s selon la lane :
  # le tourniquet alphabétique avait mis les deux poids lourds (`apps.crm` ET
  # `apps.ventes`) dans la MÊME lane. Comme le temps de mur = mise en place + la
  # PIRE lane, ce seul hasard d'ordre alphabétique fixait le gate backend à
  # ~12 min. `scripts/ci_shard.py` découpe désormais au MODULE de test (Django
  # accepte `apps.ventes.tests.test_x`) et place les modules par LPT sur les
  # durées MESURÉES (`scripts/ci_shard_timings.json`) : 1 692 s de tests répartis
  # à 1,00x d'équilibre. La complétude de l'union des lanes est prouvée par
  # `scripts/tests/test_ci_shard.py`, exécuté dans le job `stage-names` — un
  # module qui tomberait du découpage ne serait plus jamais testé pendant que la
  # CI resterait verte, c'est le seul risque que ce mécanisme doit interdire.
  #
  # ---------------------------------------------------------------------------
  # WOW-CI RONDE 5 (20/08/2026) — `--parallel` REPASSE DE 1 À 4.
  #
  # CE QUI LE REND SÛR : `max_locks_per_transaction=2048` sur le Postgres que
  # `backend-env` démarre maintenant DANS le conteneur du job. Ce n'est PAS la
  # garde décrite plus bas — elle a été écrite d'abord, elle a échoué en
  # conditions réelles (run 32316744098, 4 shards rouges), et elle n'est
  # conservée que comme ceinture. Son erreur : elle comptait les purges larges
  # des `TransactionTestCase`, alors qu'un simple `Company.delete()` prend un
  # verrou sur chacune des ~900 tables en cascade sans qu'aucun
  # `TransactionTestCase` soit impliqué. Le mécanisme décrit ci-dessous reste
  # exact ; c'est la liste des consommateurs de verrous qui était incomplète, et
  # l'énumérer était un puits sans fond.
  #
  # POURQUOI ÇA AVAIT CASSÉ (commit 0d66f6e1, 16/07 : « --parallel 2->1
  # max_locks OOM shard 3 test_rls+QW10 »). Le coupable n'est PAS la mémoire du
  # runner, c'est la TABLE DE VERROUS de Postgres. Un `TransactionTestCase`
  # termine chaque test par un `flush` = UN SEUL `TRUNCATE` qui, `CASCADE`
  # aidant, ratisse les ~900 tables du dépôt (c'est écrit noir sur blanc dans
  # `core/test_utils.WideTeardownTimeoutMixin`, qui existe parce que cette purge
  # dure 16 à 31 s). Chaque table, chaque index, chaque table TOAST y prend un
  # `AccessExclusiveLock` : de l'ordre de 4 500 verrous d'un coup. Or la table
  # de verrous d'un cluster vaut `max_locks_per_transaction × max_connections`
  # = 64 × 100 = 6 400 entrées, et un service `postgres:` d'Actions ne peut PAS
  # recevoir de `command:` — donc ce réglage n'est pas relevable ici. DEUX
  # purges simultanées = ~9 000 > 6 400 = « out of shared memory ». C'est
  # exactement ce que `--parallel 2` avait déclenché.
  #
  # LA GARDE. Django affecte une CLASSE de test entière à UN worker : le risque
  # n'apparaît donc que si un même shard contient DEUX modules à purge large.
  # Il n'en existe que trois dans tout le dépôt (`apps/crm/tests_webhook.py`,
  # `apps/ventes/tests/test_premium_security.py`, `core/tests/test_rls.py` — ce
  # dernier étant intégralement sauté ici, faute de `POSTGRES_RLS_ENABLED`), et
  # le découpage LPT actuel les place dans des shards différents. Mais ce
  # découpage se recalcule sur des durées mesurées : rien ne garantit qu'il en
  # sera de même demain. L'étape ci-dessous COMPTE donc, à chaque run, les
  # modules à purge large de SON shard et retombe à `--parallel 1` s'il y en a
  # deux ou plus. Un shard devient lent au lieu de devenir rouge — et la garde
  # s'adapte toute seule au prochain `TransactionTestCase` ajouté.
  #
  # PARALLÉLISME PROUVÉ AILLEURS : le harnais local canonique
  # (`scripts/test-backend.ps1`) tourne en `--keepdb --parallel 4` par défaut
  # depuis toujours — la sûreté des tests eux-mêmes est donc déjà éprouvée ;
  # seule la contention de verrous ci-dessus était propre à la CI.
  # ---------------------------------------------------------------------------
  # ROUND 3 (run 32200473257) — `backend-openapi` est retombé à 3 min 20 s une
  # fois son cache pip chaud : il n'est PLUS le plancher, les tests backend le
  # sont. Étape `Run Django test suite` par lane sur ce run :
  #   158 / 310 / 242 / 251 / 128 / 167 / 147 / 218 s — total 1 621 s, moyenne
  #   203 s, PIRE lane 310 s = 1,53x la moyenne. La pondération « durée mesurée
  #   par APPLICATION, repartie au prorata du nombre de tests » etait trop
  #   grossiere : le cout par test varie AUSSI fortement a l'interieur d'une
  #   meme application. La table est donc passee en durees MESUREES PAR MODULE
  #   (2 680 modules, 1 457 s ; scripts/ci_shard_timings.json, regeneree par
  #   `ci_shard.py --update-timings` sur les journaux de ce run).
  #
  # ---------------------------------------------------------------------------
  # VOLET F (20/08/2026) — POURQUOI 5, ET POURQUOI LE PLANIFICATEUR MENTAIT.
  #
  # Constat du fondateur : « les shards ne sont pas equilibres du tout ». Mesure
  # sur le run 32320058346 (6/6 verts), etape `Run Django test suite` :
  #     152 / 163 / 116 / 121 / 298 / 125 s   -> ecart (max-min)/max = 61 %
  # …pendant que `ci_shard.py --plan 6` affichait « desequilibre 1.00x ». Les
  # deux etaient vrais : le planificateur optimisait la mauvaise quantite, sur
  # des mesures fausses. Deux defauts, corriges tous les deux :
  #
  # 1. LES MESURES ETAIENT INVERSEES D'UN CRAN. La sortie `-v 2` est TAMPONNEE :
  #    le runner horodate au vidage, pas a l'execution (15 lignes consecutives a
  #    23 ms d'intervalle ; ecart nul entre deux lignes d'une meme classe dans
  #    100 % des cas). Un trou mesure donc le travail de la rafale QUI LE SUIT,
  #    or le parser l'imputait a la PRECEDENTE. Resultat :
  #    `test_gammes_offre` etait pesee 26 s alors que sa classe
  #    `TestAcceptationGamme` consomme 195 s — 70 % du shard le plus lent,
  #    totalement invisible dans la table.
  # 2. LE MODELE IGNORAIT L'INDIVISIBILITE. Sous `--parallel`, Django repartit
  #    des CLASSES ; une classe ne se scinde pas. Le cout d'une lane est donc
  #    `max(somme de ses contributions, sa plus grosse classe)`, pas une somme.
  #
  # CE QUI BORNAIT ALORS : `TestAcceptationGamme` a ~195 s. Aucun decoupage ne
  # descendait sous ce chiffre — c'est pour cela que 6 lanes ne valaient pas
  # mieux que 5 (196 s dans les deux cas). Le volet F concluait : « POUR
  # DESCENDRE PLUS BAS il faut scinder cette classe ». C'est fait.
  #
  # ---------------------------------------------------------------------------
  # VOLET G (21/08/2026) — LA CLASSE QUI BORNAIT TOUT EST ECLATEE, ET LE
  # PLANIFICATEUR SE TROMPAIT ENCORE D'UN FACTEUR DEUX.
  #
  # Point de depart mesure : `backend-tests-shard (0)` ne contenait QU'UN
  # module — `apps.ventes.tests.test_gammes_offre` — et durait ~8,7 min. Il
  # etait le chemin critique de CHAQUE run pendant que les cinq autres lanes
  # attendaient. Les journaux de trois runs verts consecutifs :
  #
  #   run 32439017665 : « Ran 42 tests in 350,345s » ; 348,81 s de SILENCE
  #                     entre la derniere ligne de TestPayloadPublic
  #                     (02:14:39.2014982Z) et la premiere de
  #                     TestAcceptationGamme (02:20:28.0130228Z)
  #   run 32434442077 : « Ran 42 tests in 406,976s » ; silence 405,38 s
  #   run 32400031804 : « Ran 42 tests in 385,627s » ; silence 383,97 s
  #
  # DEUX FAITS, ET ILS CHANGENT LA CONCLUSION DU VOLET F :
  #  1. TROIS tests valaient 99,5 a 99,7 % du module (~110 a 150 s chacun,
  #     decoupage visible aux trois triplets de diagnostics n+1 identiques
  #     pendant le silence) pendant que les 39 autres pesaient ~1,5 s ENSEMBLE.
  #  2. La table disait 194,83 s pour cette classe : la moitie de la realite.
  #     Le plan annoncait donc « pire lane 196 s » pour un job qui en mesurait
  #     520. Les poids sont recales sur ces journaux (poids = MAX des runs
  #     recents, la garde de variance de `--update-timings`).
  #
  # CE QUI A ETE FAIT — DANS LE CODE DE TEST, pas dans la CI. Une CLASSE est
  # l'unite INDIVISIBLE de `manage.py test --parallel` : Django affecte une
  # classe entiere a UN worker. Les trois tests sont donc passes a UN TEST PAR
  # CLASSE, UNE CLASSE PAR MODULE (test_gammes_offre_acceptation.py,
  # _acceptation_signature.py, _acceptation_choix.py), ce qui les rend a la
  # fois parallelisables par Django DANS une lane et deplacables par
  # `ci_shard.py` ENTRE les lanes. Deplacement PUR : les 54 fonctions du
  # fichier d'origine ont un AST identique a l'octet pres.
  #
  # LE NOUVEAU PALIER (`python scripts/ci_shard.py --plan N`) :
  #     4 lanes 264 s | 5 lanes 211 s | 6 lanes 176 s | 7 lanes 151 s
  #     8 lanes 135 s  <- la borne indivisible est passee de 195 s a 135 s
  #
  # POURQUOI 6 ET PAS 8 : le critere est le gain sur le GATE, pas sur la lane.
  # Avec ~2 min de mise en place par lane, 6 lanes posent le job backend a
  # ~296 s, donc SOUS `e2e-shard` (306-336 s mesurees) et a peine au-dessus de
  # `frontend-vitest-shard` (291 s). A partir de la, le chemin critique du run
  # n'est PLUS le backend : les 25 s d'une 7e lane et les 41 s d'une 8e ne se
  # voient nulle part sur le temps de mur, et elles couteraient les deux
  # derniers creneaux (bloc CRENEAUX — un job qui fait la queue est la pire
  # lane possible). Le prochain levier n'est donc pas ici : il est dans la
  # mise en place e2e/vitest.
  #
  # ---------------------------------------------------------------------------
  # VOLET H (24/08/2026) — LA TABLE DE POIDS AVAIT DECROCHE DU DEPOT, ET LE
  # PLANIFICATEUR S'AUTO-DECLARAIT PARFAIT PENDANT UN ECART DE 2,6x.
  #
  # Mesure, run VERT 32711511999 (PR #560), etape « Run Django test suite » de
  # chacune des six lanes — c'est le temps de TEST, mise en place deduite :
  #
  #     shard | tests mesures | modules | job complet | part fixe
  #        0  |   218,4 s     |   407   |   363 s     |  115 s
  #        1  |   171,2 s     |   407   |   287 s     |   92 s
  #        2  |   218,2 s     |   407   |   372 s     |  122 s
  #        3  |   245,7 s     |   508   |   407 s     |  126 s
  #        4  |   367,7 s     |   515   |   493 s     |  100 s  <- chemin critique
  #        5  |   139,0 s     |   519   |   285 s     |  117 s
  #
  # Le run precedent (32691264853) donne le meme diagnostic en pire : shard 4 a
  # 637 s quand ses cinq freres tenaient en 332-353 s. Pendant ce temps
  # `ci_shard.py --plan 6` affichait « pire lane 178 s / desequilibre 1.00x ».
  #
  # CAUSE UNIQUE, ET ELLE N'EST PAS DANS LA CI : `--update-timings` sur les
  # journaux de ce run montre que `apps.ventes.tests.test_roof_pipeline` est
  # passe de 38,43 s a 257,03 s — dont 254,8 s pour la SEULE classe
  # `TestQ7ProposalAccept`. Le travail du palier est passe de 17,8 a 25,9 min
  # sans que la table le sache, donc le LPT plaçait au hasard le seul module
  # qui compte. Les poids sont recales sur ce run (44 autres modules corriges
  # au passage, dont test_gammes_offre_acceptation_signature 135 -> 168 s).
  #
  # NOUVEAU PALIER MESURE (`python scripts/ci_shard.py --plan N`) :
  #     6 lanes 258 s  |  7 lanes 257 s  <- plancher indivisible : 255 s
  # La capacite de calcul d'une 7e lane (222 s par lane a 7x4 workers) passe
  # SOUS la classe qui borne tout : une lane de plus rapporte 1 s et couterait
  # ~112 s de mise en place plus un creneau. ON RESTE A 6 — le critere du
  # fondateur (« n'ajoute un shard que si son gain depasse la part fixe ») est
  # ici tranche par la mesure, pas par le gout. Le prochain levier backend est
  # de scinder `TestQ7ProposalAccept`, exactement comme le volet G avait scinde
  # `TestAcceptationGamme` ; tant qu'elle existe, 6 lanes EST l'optimum.
  #
  # ATTENDU SUR LE GATE : pire lane 367,7 -> ~258 s de tests, soit un job a
  # ~370 s au lieu de 493 s. Le backend repasse alors SOUS `e2e-shard`
  # (352-379 s mesurees sur le meme run), qui redevient le chemin critique.
  #
  # EFFET DE BORD ATTRAPE AVANT LA FUSION — LA GARDE `max_locks` EST UNE
  # CONTRAINTE DE PLAN, PAS SEULEMENT UNE CEINTURE. Le seul recalage des poids
  # posait `apps.crm.tests_webhook` ET `apps.ventes.tests.test_premium_security`
  # sur la lane 4 : deux classes a purge large dans un shard, donc `--parallel 1`
  # (cf. l'etape « Run Django test suite » plus bas) et une lane ~4x plus
  # lente — un « equilibrage » qui aurait EMPIRE le gate. `ci_shard.py` connait
  # desormais la contrainte (`wide_purge_classes`, meme detection AST et memes
  # marqueurs que la garde) et refuse d'en reunir deux tant qu'il y a plus de
  # lanes que de modules concernes ; le depot n'en compte que deux (5,7 s et
  # 3,9 s), les separer ne coute rien. Prouve par
  # `scripts/tests/test_ci_shard.py` (job `stage-names`) a 2, 4, 6 et 8 lanes.
  # ---------------------------------------------------------------------------
  backend-tests-shard:
    needs: [changes, ci-image-check]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # VOLET G (21/08/2026) — 5 lanes -> 6, une fois la classe qui bornait
        # tout eclatee (cf. l'en-tete ci-dessus). Plans mesures par
        # `python scripts/ci_shard.py --plan N`, poids recales sur les
        # journaux de trois runs verts :
        #     4 lanes 264 s | 5 lanes 211 s | 6 lanes 176 s
        #     7 lanes 151 s | 8 lanes 135 s (= la borne indivisible)
        # On s'arrete a 6, et le critere n'est PAS « le gain par lane » mais
        # « le gain sur le GATE » : avec ~2 min de mise en place, 6 lanes
        # posent le job backend a ~296 s, c'est-a-dire SOUS `e2e-shard`
        # (306-336 s mesurees) qui devient alors le chemin critique. Les
        # 25 s que rapporterait une 7e lane ne se voient donc nulle part sur
        # le temps de mur du run, et elles couteraient le dernier creneau de
        # marge. Le pic passe de 17 a 18 (bloc CRENEAUX en tete de fichier).
        #
        # VOLET H (24/08) — REVERIFIE APRES LE RECALAGE DES POIDS, ET 6 TIENT
        # POUR UNE RAISON PLUS FORTE QU'EN VOLET G : le plancher indivisible
        # est remonte a 255 s (`test_roof_pipeline.TestQ7ProposalAccept`), donc
        # `--plan 7` rend 257 s la ou `--plan 6` rend 258 s. Une 7e lane
        # rapporte UNE seconde. Ce n'est plus « le gain ne se voit pas sur le
        # gate », c'est « il n'y a plus de gain du tout tant que cette classe
        # n'est pas scindee ».
        #
        # SOLMVP54 (21/09/2026) — 6 -> 8 lanes, ET les poids RECALES sur le run
        # 35601218482 (le premier apres la sortie des 47 apps parquees : -43 %
        # de modules, table de 3 393 modules chronometres). Avant recalage la
        # table datait d'avant SOLMVP et le plan « equilibre » rendait des lanes
        # de 111 s a 317 s (shard 3 = chemin critique de tout le run, 7,3 min).
        # Plans mesures (`ci_shard.py --plan N`) : 6 lanes 231 s | 7 = 198 s |
        # 8 = 173 s | 10 = 139 s. Les deux creneaux viennent de `rls-tests`
        # (replie dans la lane 0, voir plus bas) et de la marge liberee par
        # l'arret de CodeQL (dernier run le 19/08/2026) : vague = 18 jobs.
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    # 02/09/2026 — 15 → 45 : couvre le replay froid des migrations quand le
    # dump WOW8 est évicté du cache (LRU, journée à forte activité CI — run
    # 33668521748 : les 6 shards tués à 15:03 pile, e2e à ~19 min, rls à 30:07,
    # AUCUN n'a atteint ses tests). Le chemin cache-HIT reste ~6-10 min ; le
    # push du merge re-sauve le dump et rend le plafond théorique.
    timeout-minutes: 240
    permissions:
      contents: read
      packages: read
    # WOW-CI RONDE 5 (20/08/2026) — la lane tourne DANS l'image CI figée
    # (`.github/ci-image/Dockerfile`) : plus d'apt, plus de pip, plus de
    # setup-python, et `postgresql-client-16` + MinIO sont déjà là. Le pull
    # (~20-40 s) remplace 60 à 150 s d'installation. AUCUN repli silencieux :
    # si le pull échoue, la lane échoue — cf. l'en-tête de `ci-image-check`.
    defaults:
      run:
        # WOW-CI RONDE 5 — dans un job `container:`, GitHub lance les scripts
        # avec `sh` (dash) par défaut : le premier `set -o pipefail` (bashisme)
        # tuait les six shards en ~90 s (run 32316154505). bash est présent
        # dans l'image — déclaré une fois pour toutes au niveau du job.
        shell: bash
    container:
      image: ${{ needs.ci-image-check.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      # WOW-CI RONDE 5 (20/08/2026) — LE SERVICE `postgres` A DISPARU D'ICI.
      # Il est remplacé par un serveur local que `backend-env` démarre DANS le
      # conteneur du job (voir son étape « Demarrer Postgres »). Raison unique
      # et non négociable : un `services:` d'Actions n'accepte pas de
      # `command:`, donc `max_locks_per_transaction` y était inatteignable — et
      # les shards mouraient en `out of shared memory` dès qu'un test purgeait
      # une société entière (DELETE en cascade sur ~900 tables dans UNE
      # transaction, contre 6 400 verrous disponibles). Le serveur local tourne
      # avec 2048 verrous par transaction, ce qui règle la classe entière.
      # `redis` reste un service : rien à y configurer.
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
    env:
      DJANGO_SETTINGS_MODULE: erp_agentique.settings.dev
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
      DJANGO_DEBUG: 'True'
      DB_NAME: erp_db
      DB_USER: erp_user
      DB_PASSWORD: ci_password
      # WOW-CI RONDE 5 — `localhost` désigne le conteneur du job, et c'est bien
      # là que tournent désormais Postgres (démarré par `backend-env`, cf. le
      # commentaire du bloc `services:`) et MinIO. Seul `redis`, resté un
      # service, s'atteint par son NOM sur le réseau du job.
      DB_HOST: localhost
      DB_PORT: '5432'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      # WOW-CI RONDE 5 — LE GARDE-FOU DE PRODUCTION ÉLARGI POUR LE RUNNER DE
      # TESTS, ET UNIQUEMENT LUI. NTPLT18 pose `statement_timeout = 30 s` sur
      # CHAQUE connexion (settings/base.py) pour qu'une requête ORM folle ne
      # puisse pas épingler un worker gunicorn. Deux opérations légitimes du
      # runner dépassent ce seuil : le `CREATE DATABASE … WITH TEMPLATE` que
      # Django exécute pour cloner la base une fois par worker `--parallel`, et
      # la purge `TRUNCATE` de tout le schéma d'un `TransactionTestCase`
      # (mesurée 16 à 31 s — c'est précisément la raison d'être de
      # `core/test_utils.WideTeardownTimeoutMixin`). Annulées, elles laissent la
      # base à moitié purgée et le test SUIVANT échoue en doublon de clé, très
      # loin de la vraie cause. On élargit donc à 10 min ICI, dans le job de
      # test — le réglage de production n'est pas touché, et la variable reste
      # DÉFINIE, donc `core.tests.test_db_guards` (qui vérifie sa présence dans
      # OPTIONS, pas sa valeur) continue de passer.
      DB_STATEMENT_TIMEOUT_MS: '600000'
      MINIO_ENDPOINT: localhost:9000
      MINIO_ROOT_USER: erp_admin
      MINIO_ROOT_PASSWORD: erp_minio_password
      MINIO_BUCKET_PDF: erp-pdf
      MINIO_BUCKET_UPLOADS: erp-uploads
    steps:
      - uses: actions/checkout@v4
      # WOW7 — shared WeasyPrint + pip (requirements-dev.txt) + MinIO setup.
      # WOW8 — restore the cached pre-migrated test DB (measured: the ~850-
      # migration replay was 2255s of a 2388s shard — 97% of the job); the test
      # step's --keepdb then reuses it and only clones the 4 parallel workers.
      # WOW-CI RONDE 5 — `prebuilt-image: 'true'` : l'action saute apt/pip (déjà
      # dans l'image), lance MinIO via son binaire natif et appelle
      # pg_restore/pg_dump directement au lieu de passer par `docker run`
      # (indisponible dans un job `container:`).
      - uses: ./.github/actions/backend-env
        with:
          testdb-cache-into: test_erp_db
          prebuilt-image: 'true'
      # YOPSB5 (makemigrations --check) tourne dans `backend-openapi` depuis
      # SOLMVP54 (21/09/2026) : une seule fois par run au lieu d'une fois par
      # lane (8 s x 6 lanes, sur le chemin critique).
      # Palier « par-merge » : tout SAUF les tests lourds étiquetés `pdf`/`slow`
      # (rendu WeasyPrint, golden PDF…). Ceux-ci tournent dans release-verify
      # (manuel + nightly), pour un retour rapide sur chaque merge.
      # WOW6/WOW-CI2 — ce shard n'exécute QUE sa tranche de MODULES de test
      # (placement LPT déterministe via scripts/ci_shard.py) ; l'union des
      # shards == exactement l'ensemble des modules `test*.py` de `apps`,
      # `authentication` et `core`, prouvé par scripts/tests/test_ci_shard.py.
      # `coverage` reste hors du gate (WOW3).
      # AUD830 — le total passait en litteral (6) A COTE de la matrice
      # (`shard: [0, 1, 2, 3, 4, 5]`) : une PR qui retire une entree de la
      # liste sans toucher ce litteral rendait chaque shard vert alors qu'un
      # sixieme des modules backend n'etait plus jamais demande a Django,
      # sans un seul signal rouge. `${{ strategy.job-total }}` (contexte
      # GitHub Actions natif) lit TOUJOURS la longueur reelle de la matrice.
      - name: Run Django test suite — shard ${{ matrix.shard }}/${{ strategy.job-total }} (fast tier — excludes pdf/slow)
        working-directory: backend/django_core
        run: |
          set -euo pipefail
          LABELS=$(python ../../scripts/ci_shard.py ${{ matrix.shard }} ${{ strategy.job-total }})
          echo "Shard ${{ matrix.shard }}/${{ strategy.job-total }} -> $(echo "$LABELS" | wc -w) modules"

          # WOW-CI RONDE 5 — GARDE ANTI-`max_locks`, DEVENUE UNE CEINTURE.
          #
          # ELLE N'EST PLUS LA PROTECTION PRINCIPALE, et il faut savoir pourquoi
          # avant de s'y fier. Écrite d'abord seule, elle comptait les modules
          # déclarant un `TransactionTestCase` — dont le TRUNCATE de fin de test
          # verrouille tout le schéma. Elle a échoué en conditions réelles (run
          # 32316744098, 4 shards rouges) parce que la purge large n'est PAS le
          # seul consommateur de verrous : un simple `Company.delete()` descend
          # en cascade sur les ~900 tables et en prend autant dans UNE
          # transaction, sans aucun `TransactionTestCase` à l'horizon
          # (`test_purges_demo_company_expired_over_90_days`). Énumérer les
          # classes coupables est un puits sans fond — c'était la mauvaise
          # couche pour corriger ce défaut.
          #
          # LA VRAIE CORRECTION EST EN AMONT : Postgres tourne maintenant dans
          # le conteneur du job avec `max_locks_per_transaction=2048`, ce qui
          # règle la classe entière, présente et future (voir l'étape
          # « Demarrer Postgres » de `.github/actions/backend-env`). Avec ce
          # budget, deux purges simultanées passent largement.
          #
          # ON LA GARDE QUAND MÊME, pour un coût d'une seconde : si un jour le
          # démarrage local régressait vers un serveur aux réglages par défaut,
          # elle rendrait un shard lent plutôt que rouge. Elle ne doit plus être
          # lue comme « ce qui rend `--parallel 4` sûr ».
          # `core/tests/test_rls.py` reste exclu du compte : sans
          # `POSTGRES_RLS_ENABLED` toute sa classe est sautée ici (elle a son
          # propre job `rls-tests`).
          # Détection par AST, et non par `grep` : `core/test_utils.py` CITE
          # `TransactionTestCase` une dizaine de fois (docstring du mixin, exemple
          # d'usage) sans en déclarer un seul — un grep textuel le comptait et
          # déclenchait la garde pour rien. On ne retient donc que les CLASSES
          # dont une base est réellement `TransactionTestCase` (ou le mixin
          # maison `WideTeardownTimeoutMixin`, qui est précisément le marqueur de
          # cette purge large dans ce dépôt).
          # On compte des CLASSES, pas des FICHIERS : c'est la classe qui est
          # l'unité d'affectation de Django à un worker, donc deux classes à
          # purge large dans UN MÊME module suffiraient à faire tourner deux
          # purges en parallèle — un comptage par fichier les aurait vues comme
          # une seule et serait passé à côté.
          cat > /tmp/purge_large.py <<'PY'
          import ast
          import sys

          MARQUEURS = {'TransactionTestCase', 'WideTeardownTimeoutMixin'}


          def noms_de_bases(classe):
              for base in classe.bases:
                  if isinstance(base, ast.Name):
                      yield base.id
                  elif isinstance(base, ast.Attribute):
                      # `django.test.TransactionTestCase` -> `TransactionTestCase`
                      yield base.attr


          for chemin in sys.argv[1:]:
              try:
                  with open(chemin, encoding='utf-8') as fichier:
                      arbre = ast.parse(fichier.read(), chemin)
              except (OSError, SyntaxError, UnicodeDecodeError):
                  # Un fichier illisible n'est pas une raison de bloquer le shard :
                  # au pire la garde ne le compte pas, au mieux il n'existe pas.
                  continue
              for noeud in ast.walk(arbre):
                  if isinstance(noeud, ast.ClassDef) and MARQUEURS & set(noms_de_bases(noeud)):
                      print(f'{chemin}::{noeud.name}')
          PY
          FILES=""
          for label in $LABELS; do
            case "$label" in *test_rls*) continue ;; esac
            p="$(printf '%s' "$label" | tr '.' '/').py"
            if [ -f "$p" ]; then FILES="$FILES $p"; fi
          done
          WIDE_FILES=""
          if [ -n "$FILES" ]; then
            WIDE_FILES=$(python /tmp/purge_large.py $FILES)
          fi
          WIDE=$(printf '%s' "$WIDE_FILES" | grep -c . || true)
          if [ "${WIDE:-0}" -ge 2 ]; then
            PARALLEL=1
            echo "GARDE max_locks : $WIDE classes a purge large dans ce shard —"
            echo "$WIDE_FILES"
            echo "on retombe a --parallel 1 pour ce shard (lent, mais jamais rouge)."
          else
            PARALLEL=4
            echo "Classes a purge large dans ce shard : ${WIDE:-0} — --parallel 4."
          fi

          python manage.py test $LABELS -v 2 --exclude-tag=pdf --exclude-tag=slow --parallel "$PARALLEL" --keepdb
      # NTPLT5 — suite d'étanchéité RLS (`core.tests.test_rls*`, sautée sans
      # POSTGRES_RLS_ENABLED). SOLMVP54 (21/09/2026) : c'était un job séparé
      # `rls-tests` (2 min 18 s dont 1 min 30 s de mise en place pour 33 s de
      # tests, un créneau de la vague, et NON requis — il n'entrait pas dans
      # ci-gate). Repliée ICI, sur la lane 0, APRÈS sa tranche normale : même
      # base `test_erp_db` déjà restaurée, +33 s sur une seule lane, un créneau
      # rendu à une 7e/8e lane backend — et la suite devient de fait REQUISE
      # (elle rougit l'agrégateur `backend-tests`), ce qui est plus strict
      # qu'avant, pas moins. `--parallel 1` comme avant (la suite manipule les
      # politiques RLS de la base partagée).
      - name: Run RLS seal suite (opt-in — flag ON, lane 0 only)
        if: ${{ matrix.shard == 0 }}
        working-directory: backend/django_core
        env:
          POSTGRES_RLS_ENABLED: '1'
        run: >-
          python manage.py test
          core.tests.test_rls
          core.tests.test_rls_cross_tenant_denial
          -v 2 --keepdb --parallel 1

  # WOW6 — thin aggregator that PRESERVES the required `backend-tests` status
  # check name. Branch protection requires the literal `backend-tests` context
  # (NOT `ci-gate`), so the real job renamed to `backend-tests-shard` above must
  # be paired with a job still literally named `backend-tests`. Passes iff no
  # shard failed; also passes when the shards SKIP (backend=false), preserving the
  # path-filter "a skipped required check counts as success" behaviour.
  backend-tests:
    needs: [changes, ci-image-check, backend-tests-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      # WOW-CI RONDE 5 — GARDE OBLIGATOIRE. Les shards déclarent désormais
      # `needs: ci-image-check` ; si ce job échoue, les shards ne sont pas
      # « failure » mais « skipped », et sans cette étape cet agrégateur —
      # qui est un check REQUIS — passerait au VERT alors qu'AUCUN test backend
      # n'a tourné. Un échec d'image doit bloquer la fusion, pas la déverrouiller.
      - name: Fail if the CI image could not be resolved
        if: ${{ needs.ci-image-check.result == 'failure' || needs.ci-image-check.result == 'cancelled' }}
        run: |
          echo "ci-image-check=${{ needs.ci-image-check.result }} — l'image CI backend n'a pas pu être publiée/résolue."
          echo "Les shards n'ont donc PAS tourné. Repli manuel : workflow_dispatch sur ci-image.yml."
          exit 1
      - name: Fail if any shard failed or was cancelled
        if: ${{ needs.backend-tests-shard.result == 'failure' || needs.backend-tests-shard.result == 'cancelled' }}
        run: |
          echo "A backend-tests shard did not pass (result=${{ needs.backend-tests-shard.result }})."
          exit 1
      - name: All shards passed (or were skipped)
        run: echo "backend-tests-shard result=${{ needs.backend-tests-shard.result }} — gate OK."

  # ---------------------------------------------------------------------------
  # WOW-CI (2026-08-18) — le job `frontend-lint` était MESURÉ à 19 min 33 s sur le
  # run 32167530769, et 15 min 59 s de ce total étaient la SEULE étape Vitest :
  # 792 fichiers *.test.jsx sous jsdom, dont le rapport interne dit
  # « transform 38 s, setup 207 s, import 470 s, tests 978 s, environment 843 s ».
  # Le poste dominant (`environment`) est le montage d'un jsdom NEUF par fichier :
  # c'est du CPU pur, donc ça se divise en ajoutant des machines, pas en changeant
  # la config. On applique donc à la lettre le patron WOW6 déjà éprouvé côté
  # backend : la charge part dans une matrice `frontend-vitest-shard` (Vitest
  # `--shard`, découpage par fichier, aucun test retiré ni ignoré), les gardes
  # statiques (eslint + check-hex + node:test) partent dans `frontend-static` pour
  # rendre leur verdict en ~3 min au lieu d'attendre derrière les tests, et le nom
  # de check REQUIS `frontend-lint` est préservé à l'identique par l'agrégateur
  # mince défini juste après.
  #
  # NE RENOMMEZ PAS `frontend-lint` : la protection de branche exige le contexte
  # LITTÉRAL `frontend-lint` (avec e2e/backend-lint/backend-tests/stage-names/
  # web-build-test). Un renommage laisserait ce check « Pending » pour toujours et
  # bloquerait toute fusion.
  # ---------------------------------------------------------------------------
  frontend-static:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund
      # SOLMVP54 (21/09/2026) — eslint (69 s) et node:test (69 s) tournaient l'un
      # APRÈS l'autre sur un runner à 4 vCPU : ils partent ensemble, chacun
      # dans son processus, sortie capturée puis rejouée par bloc, verdict = les
      # deux. `--experimental-test-coverage` est retiré : personne ne lisait ce
      # rapport (aucun consommateur dans scripts/, frontend/scripts/, docs/) et
      # l'instrumentation V8 ralentissait chaque fichier pour rien. Les tests
      # exécutés sont exactement les mêmes (logique pure, AUTO-DÉCOUVERTE via
      # glob — tout nouveau *.test.mjs tourne sans liste à tenir).
      - name: Lint frontend (eslint + no-danger) + unit tests (node:test) — en parallèle
        working-directory: frontend
        run: |
          set -uo pipefail
          npm run lint > /tmp/eslint.log 2>&1 & PID_LINT=$!
          node --test "src/**/*.test.mjs" > /tmp/node-test.log 2>&1 & PID_UNIT=$!
          rc=0
          wait "$PID_LINT" || { echo "::error title=eslint::eslint / check_no_danger en échec — voir le bloc eslint ci-dessous"; rc=1; }
          wait "$PID_UNIT" || { echo "::error title=node:test::tests de logique pure en échec — voir le bloc node:test ci-dessous"; rc=1; }
          echo "::group::eslint + check_no_danger"; cat /tmp/eslint.log; echo "::endgroup::"
          echo "::group::node:test (src/**/*.test.mjs)"; cat /tmp/node-test.log; echo "::endgroup::"
          exit "$rc"
      # VX121 — garde « zéro couleur hors token » : les blocs de composants déjà
      # tokenisés d'index.css (form-control/modal/table/lead-nav/page-loading…)
      # ne doivent plus jamais réintroduire un hex codé en dur (script maison,
      # zéro dépendance — frontend/scripts/check_hex.mjs).
      - name: Check hex colors outside design tokens (index.css)
        working-directory: frontend
        run: npm run check-hex
      # YHARD7 — budget de performance du bundle SPA ERP : échoue si un chunk
      # (ou le total gzippé) dépasse son budget. Dev-only
      # (frontend/scripts/check_bundle_budget.mjs, Node stdlib pur).
      #
      # WOW-CI2 (2026-08-18) — REPLIÉ ICI depuis l'ancien job `frontend-perf`,
      # qui mesurait 27 s et payait pourtant un runner entier (checkout +
      # setup-node + npm ci). Le dépôt public plafonne à 20 jobs SIMULTANÉS et
      # ce plafond était atteint : le slot libéré finance une lane de tests
      # backend, ce qui raccourcit le chemin critique. Aucun contrôle n'est
      # perdu — build et budget tournent ici, sur les dépendances déjà installées.
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Check bundle budget
        working-directory: frontend
        run: npm run check-bundle-budget

  # Couche UX : rendu/interaction (Testing Library) + accessibilité (axe),
  # exécutée par Vitest (fichiers *.test.jsx, jsdom) + résumé de couverture.
  # Le decoupage en lanes explicites (VITEST_INCLUDE, WOW-CI4 ci-dessous)
  # decoupe la liste de fichiers, jamais le contenu d'un fichier : l'union des
  # 4 lanes est EXACTEMENT la suite complète d'aujourd'hui (completude prouvee
  # par scripts/tests/test_ci_frontend_shard.py).
  # SOLMVP54 (21/09/2026) : plus de `--coverage` sur les lanes — le résumé
  # n'avait aucun consommateur et l'instrumentation coûtait sur chaque fichier.
  frontend-vitest-shard:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund
      # WOW-CI4 — `--shard=i/n` de Vitest repartit le NOMBRE de fichiers, pas le
      # TRAVAIL. Mesure du run 32206663106 : 265 / 265 / 264 fichiers pour
      # 381 s / 266 s / 193 s de travail. On passe donc a des LISTES EXPLICITES
      # equilibrees sur les durees mesurees (794 fichiers, 840 s ;
      # scripts/ci_vitest_timings.json), placees par le meme LPT que le backend.
      # La liste transite par VITEST_INCLUDE et non par des arguments
      # positionnels : Vitest traite ces derniers comme des FILTRES par
      # sous-chaine, donc un chemin prefixe d'un autre embarquerait des fichiers
      # en trop. Completude de l'union prouvee par
      # scripts/tests/test_ci_frontend_shard.py (job stage-names).
      # AUD830 — même défaut que backend-tests-shard : le total passait en
      # litteral (4) a cote de la matrice (`shard: [1, 2, 3, 4]`).
      # `${{ strategy.job-total }}` lit TOUJOURS la longueur reelle.
      - name: Frontend component + a11y tests — lane ${{ matrix.shard }}/${{ strategy.job-total }} (Vitest + Testing Library + axe)
        working-directory: frontend
        run: |
          set -euo pipefail
          VITEST_INCLUDE="$(python3 ../scripts/ci_frontend_shard.py $(( ${{ matrix.shard }} - 1 )) ${{ strategy.job-total }})"
          export VITEST_INCLUDE
          echo "Lane ${{ matrix.shard }}/${{ strategy.job-total }} -> $(echo "$VITEST_INCLUDE" | tr ',' '\n' | wc -l) fichiers"
          # SOLMVP54 (21/09/2026) — `test:unit` (vitest run) et non plus
          # `test:coverage` : le rapport de couverture V8 n'avait AUCUN
          # consommateur (ni scripts/, ni frontend/scripts/, ni docs/) et
          # l'instrumentation coûte sur chacun des 612 fichiers. Les tests
          # exécutés sont exactement les mêmes.
          npm run test:unit

  # Agrégateur mince qui PRÉSERVE le nom de check requis `frontend-lint` (patron
  # WOW6, identique à `backend-tests`). Vert ssi aucune lane n'a échoué ; vert
  # aussi quand les lanes sont SAUTÉES (frontend=false), ce qui conserve la
  # sémantique « un check requis sauté compte comme réussi » du filtre de chemins.
  frontend-lint:
    needs: [changes, frontend-static, frontend-vitest-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a frontend lane failed or was cancelled
        if: ${{ needs.frontend-static.result == 'failure' || needs.frontend-static.result == 'cancelled' || needs.frontend-vitest-shard.result == 'failure' || needs.frontend-vitest-shard.result == 'cancelled' }}
        run: |
          echo "frontend-static=${{ needs.frontend-static.result }} frontend-vitest-shard=${{ needs.frontend-vitest-shard.result }}"
          echo "Une lane frontend n'est pas passée — voir les jobs ci-dessus."
          exit 1
      - name: All frontend lanes passed (or were skipped)
        run: echo "frontend-static=${{ needs.frontend-static.result }} frontend-vitest-shard=${{ needs.frontend-vitest-shard.result }} — gate OK."


  stage-names:
    # Intentionally UNGATED: this is the fast, broad drift guard. It must run on
    # docs/plan changes (plan fingerprint), on STAGES.py, and on any structural
    # change that feeds the CODEMAP fingerprint or the stage-name scan — so it
    # always runs, on every push and PR.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # MUST match prod (django_core/fastapi Dockerfiles: python:3.11.x). A 3.12+/3.13 CI would not catch 3.11-only SyntaxErrors (e.g. backslash in f-string) that crash the live PDF generator.
      # SOLMVP54 (21/09/2026) — LES 44 GARDES DE CE JOB TOURNENT EN PARALLELE.
      # Mesure sur le run 35601218482 (main) : 3 min 07 s pour 42 etapes `run:`
      # executees en serie (une garde = un processus Python de 0,5 a 23 s) sur
      # un runner a 4 vCPU dont trois dormaient. La LISTE des gardes vit
      # desormais dans `scripts/ci_guards.py` (`GARDES['stage-names']`), UNE
      # seule fois ; le POURQUOI de chaque garde est l'en-tete de son script.
      # Pourquoi elles sont ICI et pas dans `backend-lint` : `stage-names` est
      # le seul job NON GATE, donc une PR purement frontend, docs ou plan les
      # declenche aussi (incidents du 03/08/2026 : route inexistante, mock
      # inverse du serveur, ecrans orphelins — tous invisibles a un job gate).
      # Le runner lance les gardes sur N processus, rejoue la sortie de chacune
      # dans un bloc `::group::`, nomme les echecs et rend 1 des qu'une garde
      # rougit. `scripts/preflight.ps1` continue de les voir une par une :
      # `ci_fast_gate_steps.py` developpe cette etape en ses gardes.
      # AJOUTER UNE GARDE = une ligne dans `ci_guards.GARDES`, JAMAIS une etape
      # `run: python scripts/check_*.py` ici — `scripts/tests/test_ci_guards.py`
      # (execute par le runner lui-meme) refuse toute garde restee en serie.
      # PyYAML PRECEDE le runner : lu par test_ci_shard, test_ci_frontend_shard,
      # check_query_budgets et ci_fast_gate_steps (AUD830).
      - name: Install PyYAML (shard-split + query-budgets — lu par 4 gardes)
        run: pip install PyYAML
      - name: Gardes hôte en parallèle (scripts/ci_guards.py stage-names)
        run: python scripts/ci_guards.py stage-names

  web-build-test:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install apps/web dependencies
        working-directory: apps/web
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Type-check apps/web logic (tsc — src/lib estimator/math surface)
        working-directory: apps/web
        run: npm run check
      - name: Build marketing site (astro build)
        working-directory: apps/web
        run: npm run build
      - name: Run apps/web test suite (vitest)
        working-directory: apps/web
        run: npm test

  # End-to-end browser suite (Playwright). Reuses the SAME throwaway services as
  # backend-tests (Postgres+pgvector, Redis, MinIO — never production), serves
  # the real built app via vite preview (same-origin proxy to Django), and drives
  # 16 flows headless. Seeds only throwaway demo data (manage.py seed_demo).
  # Gated on `code` (backend OR frontend, incl. the STAGES.py contract): it is
  # the cross-surface integration net and must NOT skip on a backend- or
  # frontend-only change; it skips only on website-only and docs-only changes.
  # WOW-CI2 (2026-08-18, run 32182877239) — les specs prenaient 5 min 22 s :
  # « Running 55 tests using 1 worker » (chromium, 4,0 min) puis « Running 16
  # tests using 1 worker » (mobile-safari, 1,3 min). Le worker unique est
  # DÉLIBÉRÉ et on n'y touche pas : les specs partagent un seul gunicorn et une
  # seule base de démonstration, les paralléliser sur la même base est la
  # recette à flakes. On garde donc 1 worker par base, et on donne à chaque lane
  # SA base : deux lanes, `--shard` natif de Playwright sur la partie chromium.
  # Le nom de check REQUIS `e2e` est préservé par l'agrégateur mince plus bas —
  # NE PAS le renommer (protection de branche : contexte littéral).
  # ---------------------------------------------------------------------------
  # WOW-CI RONDE 5 (20/08/2026) — CE JOB PASSE DANS L'IMAGE `ci-e2e`.
  #
  # J'avais d'abord écarté cette variante sur une estimation. Les mesures du
  # dernier run VERT (32307320397) l'ont renversée. `e2e-shard (1)` = 369 s,
  # dont 240 s de MISE EN PLACE pour 129 s de specs, et l'écart entre les deux
  # lanes (369 s contre 305 s) vient à 62 s sur 64 de cette mise en place.
  # Ce que l'image supprime, mesuré :
  #     Install Playwright browsers (chromium + webkit) ....... 55 s
  #     Cache Playwright browser binaries .....................  7 s
  #     part apt + pip + MinIO de backend-env ................. ~40 s
  #     setup-python + redirection/cache apt ..................   7 s
  #                                                        total ~109 s
  # Ce qu'elle coûte : le pull de l'image (~40-50 s de plus que les 15 s
  # d'« Initialize containers » actuels, pour ~950 Mo compressés).
  # GAIN NET ATTENDU ~60 s : 369 s -> ~306 s.
  #
  # Le poste dominant restait `Install Playwright browsers` À 55 s ALORS QUE LES
  # BINAIRES ÉTAIENT DÉJÀ CACHÉS (l'étape de cache qui les restaure ne coûte que
  # 7 s) : ces 55 s sont le `--with-deps`, c'est-à-dire le dépaquetage apt des
  # dépendances système de WebKit. Ni le cache apt ni le cache des binaires ne
  # l'évitent — seule une image pré-construite le fait.
  #
  # POURQUOI CE JOB DEVIENT PRIORITAIRE : une fois les volets A+B appliqués, le
  # pire `backend-tests-shard` tombe de 425 s à ~263 s, et c'est `e2e-shard` qui
  # devient le job qui ferme la marche. Le corriger n'est plus un confort.
  #
  # `actions/setup-node` RESTE dans le job (il coûte 4 s et apporte le cache npm,
  # sans lequel `npm ci` passerait de 5 s à plusieurs dizaines) — voir l'en-tête
  # de `.github/ci-image/Dockerfile.e2e` pour les deux choses qu'il n'embarque
  # volontairement pas.
  # ---------------------------------------------------------------------------
  e2e-shard:
    needs: [changes, ci-image-check]
    if: ${{ needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        # WOW-CI RONDE 5 — dans un job `container:`, GitHub lance les scripts
        # avec `sh` (dash) par défaut : le premier `set -o pipefail` (bashisme)
        # tuait les six shards en ~90 s (run 32316154505). bash est présent
        # dans l'image — déclaré une fois pour toutes au niveau du job.
        shell: bash
    container:
      image: ${{ needs.ci-image-check.outputs.image_e2e }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    # 03/09/2026 — 60 → 240 (marge REELLE au-dessus du pire cas, pas au milieu de l estimation) : le dump WOW8 restauré est DISCARDÉ à raison
    # (SOL2 a réécrit qhse/0057, garde byte-identique) → replay froid COMPLET
    # obligatoire une fois, et la chaîne dépasse largement 60 min aujourd'hui
    # (~1500 migrations). Le push du merge re-sauve le dump ; hit-path inchangé.
    timeout-minutes: 240
    services:
      # WOW-CI RONDE 5 (20/08/2026) — LE SERVICE `postgres` A DISPARU D'ICI.
      # Il est remplacé par un serveur local que `backend-env` démarre DANS le
      # conteneur du job (voir son étape « Demarrer Postgres »). Raison unique
      # et non négociable : un `services:` d'Actions n'accepte pas de
      # `command:`, donc `max_locks_per_transaction` y était inatteignable — et
      # les shards mouraient en `out of shared memory` dès qu'un test purgeait
      # une société entière (DELETE en cascade sur ~900 tables dans UNE
      # transaction, contre 6 400 verrous disponibles). Le serveur local tourne
      # avec 2048 verrous par transaction, ce qui règle la classe entière.
      # `redis` reste un service : rien à y configurer.
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
    env:
      DJANGO_SETTINGS_MODULE: erp_agentique.settings.dev
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
      DJANGO_DEBUG: 'True'
      DB_NAME: erp_db
      DB_USER: erp_user
      DB_PASSWORD: ci_password
      # WOW-CI RONDE 5 — `localhost` désigne le conteneur du job : Postgres
      # (démarré par `backend-env`), MinIO et gunicorn (127.0.0.1:8000, lancé
      # par l'étape des specs) y tournent tous. Seul `redis`, resté un service,
      # s'atteint par son NOM sur le réseau du job.
      DB_HOST: localhost
      DB_PORT: '5432'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      # Emplacement des navigateurs BAKÉS dans l'image. Doit être identique à
      # l'`ENV PLAYWRIGHT_BROWSERS_PATH` du Dockerfile.e2e : sans lui Playwright
      # les chercherait dans `~/.cache/ms-playwright`, ne les trouverait pas, et
      # les retéléchargerait — l'image ne servirait à rien.
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      MINIO_ENDPOINT: localhost:9000
      MINIO_ROOT_USER: erp_admin
      MINIO_ROOT_PASSWORD: erp_minio_password
      MINIO_BUCKET_PDF: erp-pdf
      MINIO_BUCKET_UPLOADS: erp-uploads
      # NTPLT42/PACT8 — throttle par tenant DÉSACTIVÉ ici, comme sous le test
      # runner Django (base.py : « une suite qui boucle des centaines de
      # requêtes pour la même société ne doit jamais échouer sur un 429
      # parasite »). Ce gunicorn n'est PAS sous TESTING, donc sans cette env le
      # budget 1200/min s'applique : la fumée PACT8 (~300 boots × ~15 appels
      # API, une seule société démo) le dépasse, `/auth/me/` répond 429, le
      # routeur croit la session expirée → /login → « page blanche » (mesuré le
      # 2026-08-12 : compta/budgets, flotte/conformite, production/abonnements).
      # Le throttle garde son test dédié : core/tests/test_tenant_throttle.py.
      TENANT_RATE_LIMIT: '0'
    steps:
      - uses: actions/checkout@v4
      # WOW-CI RONDE 5 — `actions/setup-python` a disparu (Python 3.11 et toutes
      # les dépendances sont dans l'image). `actions/setup-node` RESTE : il ne
      # coûte que 4 s et il apporte le cache npm, sans lequel `npm ci` passerait
      # de 5 s (mesuré) à plusieurs dizaines de secondes. C'est pour cette raison
      # précise que l'image n'embarque pas `node_modules`.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # -----------------------------------------------------------------------
      # WOW-CI RONDE 5 (20/08/2026) — TOUT LE DISPOSITIF DE CACHE APT A DISPARU
      # D'ICI, et c'est le but. Il existait parce que `playwright install
      # --with-deps` retéléchargeait 114 Mo de dépendances système WebKit à
      # chaque run (jusqu'à « Fetched 114 MB in 59min 15s » sur un miroir
      # étranglé, le 19/08). Ces paquets sont maintenant DANS l'image `ci-e2e`,
      # dépaquetés une fois pour toutes : il n'y a plus rien à télécharger, donc
      # plus rien à cacher, et la pathologie du miroir lent disparaît avec.
      # Le cache `apt-e2e-v2-…` reste alimenté et consommé par
      # `.github/actions/backend-env` sur son chemin NON conteneurisé, qui sert
      # encore `release-verify.yml`.
      # -----------------------------------------------------------------------
      # WOW7 — shared WeasyPrint + pip (requirements-dev.txt) + MinIO setup.
      # WOW8 — restore the cached pre-migrated dump straight into erp_db
      # (measured: this job's migrate+seed step was 1796s of a 1915s total —
      # 94% — while the E2E specs themselves ran in 36s). The migrate below
      # becomes a fast no-op; the seeds still run fresh.
      # WOW-CI RONDE 5 — `prebuilt-image: 'true'` : apt et pip sont déjà dans
      # l'image, MinIO démarre par son binaire natif et pg_restore/pg_dump sont
      # appelés directement (docker n'existe pas dans un job `container:`).
      - uses: ./.github/actions/backend-env
        with:
          testdb-cache-into: erp_db
          prebuilt-image: 'true'
      - name: Migrate + seed throwaway demo data
        working-directory: backend/django_core
        run: |
          # SOLMVP54 (21/09/2026) — plus de `migrate` ici : `backend-env` vient
          # de restaurer `erp_db` depuis le dump WOW8 et l'a migré si (et
          # seulement si) l'ensemble de migrations a bougé ; sur un hit exact
          # cette ligne ne faisait qu'imprimer « No migrations to apply »
          # après ~9 s de démarrage Django, sur chacune des deux lanes.
          python manage.py seed_demo
          # The simulator catalogue (defaults to the seeded `taqinor-demo`
          # company) is what the auto-devis sizing matches against.
          python manage.py seed_catalogue
          # SOLMVP (21/09/2026) — plus de `seed_ao_demo` : l'app AO est une coquille.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund
      # WOW-CI RONDE 5 (20/08/2026) — LE CACHE DES BINAIRES A DISPARU, ET
      # `--with-deps` AVEC LUI. Les deux navigateurs (VX68 : chromium ET webkit,
      # le passage Safari réel) sont BAKÉS dans l'image `ci-e2e`, à
      # `PLAYWRIGHT_BROWSERS_PATH=/ms-playwright`, dans la version que
      # `package-lock.json` fixe — c'est cette même version qui étiquette
      # l'image, donc un binaire ne peut pas se désynchroniser du
      # `@playwright/test` que `npm ci` vient d'installer.
      #
      # LA MESURE QUI JUSTIFIE CE CHANGEMENT (run vert 32307320397) : l'étape
      # de cache restaurait bien les binaires en 7 s, et pourtant
      # `playwright install --with-deps` durait encore 55 s sur la lane 1 (20 s
      # sur la lane 2, 31 s sur le run précédent). Ces secondes n'étaient donc
      # PAS les navigateurs : c'était le dépaquetage apt de `--with-deps`. Ni le
      # cache apt ni le cache des binaires ne pouvaient l'éviter.
      #
      # L'appel est CONSERVÉ, sans `--with-deps` : idempotent, il ne fait rien
      # quand les binaires sont là, et il échouera franchement s'ils manquaient —
      # ce qui vaut mieux qu'un `playwright test` mourant sur « Executable
      # doesn't exist ». Le plafond de 10 min reste : si cette étape se met à
      # retélécharger, l'échec doit la NOMMER (le 19/08 elle a tourné 59 min 44 s
      # en silence sur un miroir apt étranglé).
      - name: Install Playwright browsers (chromium + webkit)
        timeout-minutes: 10
        working-directory: frontend
        run: npx playwright install chromium webkit
      - name: Build frontend (no service worker for E2E)
        working-directory: frontend
        env:
          VITE_E2E: '1'
        run: npm run build
      - name: Start Django + run E2E specs
        working-directory: backend/django_core
        run: |
          # SOLMVP54 — 4 workers sync (était 3) : trois pages Playwright en
          # parallèle ouvrent chacune plusieurs requêtes API à la fois.
          gunicorn erp_agentique.wsgi:application \
            --bind 127.0.0.1:8000 --workers 4 --timeout 120 --worker-class sync &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              http://127.0.0.1:8000/api/django/admin/login/ || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "Django prêt (HTTP $code)"; break
            fi
            echo "Attente Django ($i)…"; sleep 2
            if [ "$i" = "30" ]; then echo "Django indisponible"; exit 1; fi
          done
          cd ../../frontend
          # Palier « smoke » par-merge : parcours UTILISATEUR critiques + santé.
          # `devis.spec` = lead → devis → PDF (le projet `setup` se connecte aussi
          # via la dépendance Playwright). On garde des specs SELF-CONTAINED ici :
          # `leads.spec` (E7 → Signé) dépend d'un devis créé par un spec antérieur
          # dans la matrice ordonnée → reste en e2e COMPLET (release-verify), pas
          # en smoke. La matrice complète + mobile tourne dans release-verify.yml.
          # PACT8 — les `fumee-ecrans-{1,2,3}.spec.js` ouvrent CHAQUE route déclarée par les
          # `features/*/module.config.jsx` (302 écrans lus automatiquement,
          # aucune liste à tenir) sur ce vrai Django et cette vraie base, et
          # échoue sur un ErrorBoundary affiché, une exception non rattrapée,
          # un lien `…/undefined` ou une page blanche. C'est LE filet
          # transversal que ce commentaire promettait sans l'avoir : le
          # 03/08/2026, `/ao` était déclaré dans `e2e/helpers.js` et visité par
          # AUCUNE spec, nulle part. Ne le retirez pas de cette ligne.
          # WOW-CI5 — repartition MESUREE sur les specs SCINDEES.
          # `fumee-ecrans.spec.js` pesait 183,4 s dans un seul fichier, soit
          # 84 % du temps chromium, et Playwright affecte un fichier ENTIER a un
          # shard : ce fichier fixait donc seul le plancher du job. Il est
          # scinde en groupes de modules equilibres — voir
          # e2e/fumee-ecrans.partition.js, dont la garde d'union prouve
          # qu'aucun module ni aucune route ne tombe du decoupage.
          #
          # LE MODELE EST ADDITIF, ET C'EST VERIFIABLE : playwright.config.js
          # declare `workers: 1, fullyParallel: false`, donc une lane execute
          # ses fichiers en SERIE et son temps est la SOMME de ses blocs.
          #
          # WOW-CI RONDE 5 (20/08/2026) — MESURES REELLES, ET DEUX CHANGEMENTS
          # QU'ELLES ONT FAIT ABANDONNER. Les durees ci-dessus venaient du run
          # 32206663106, qui est ANNULE (« cancelled ») : ce n'etait pas une
          # mesure de reference. Relevees sur le dernier run VERT (32307320397,
          # etape « Start Django + run E2E specs », attente gunicorn comprise) :
          #
          #     lane 1 (fumee-1 + fumee-2 + devis)          129 s
          #     lane 2 (fumee-3 + health + mobile-safari)   126 s
          #
          # LES DEUX LANES SONT DEJA EQUILIBREES A 3 s PRES. Le plafond de tout
          # rééquilibrage a 2 lanes est donc 3 s — quel que soit le nombre de
          # groupes de fumee. Scinder la fumee plus finement (essai a 5 groupes)
          # a bien ete calcule puis ABANDONNE pour cette raison : ca ne rachete
          # rien tant qu'il n'y a que 2 lanes.
          #
          # ET LE DESEQUILIBRE REEL N'EST PAS LA. Sur ce meme run, le job entier
          # fait 369 s (lane 1) contre 305 s (lane 2) — 64 s d'ecart, dont 62 s
          # viennent de la MISE EN PLACE, pas des specs :
          #     backend-env            102 s (lane 1) contre  75 s (lane 2)
          #     playwright install      55 s (lane 1) contre  20 s (lane 2)
          # C'est la variance de la mise en place qui fixe le pire e2e, pas la
          # repartition des specs. On ne corrige donc pas ce qui est deja droit.
          #
          # UNE 3e LANE, elle, vaudrait 123 -> 86 s, soit ~37 s : sous le seuil
          # de 60 s qui justifierait de depenser un des 2 derniers creneaux
          # (bloc CRENEAUX en tete de fichier — un job qui fait la queue est la
          # pire lane possible). Le vrai levier reste la mise en place : voir
          # l'en-tete de ce job.
          #
          # SOLMVP54 (21/09/2026) — LE MODELE N'EST PLUS ADDITIF POUR LA FUMEE.
          # `workers: 1` du playwright.config.js protege les specs de PARCOURS
          # (elles mutent des donnees partagees : devis.spec cree un lead) ;
          # les trois fichiers de fumee, eux, ne font que VISITER des ecrans
          # (lecture seule, un test par module — fumee-ecrans.partition.js).
          # On les confie a UNE lane sur `--workers 3` : Playwright distribue
          # les FICHIERS entre workers (fullyParallel reste false, l'ordre
          # interne d'un fichier est inchange), donc les trois groupes tournent
          # de front. Mesure avant (run 35601218482) : lane 1 = fumee 1+2+devis
          # 102 s, lane 2 = fumee 3 + health + mobile-safari 122 s.
          # CALX386/CALX387 (lot 8, 23/09/2026) — le parcours calepinage
          # COMPLET (atelier → simulation → électrique → documents → devis →
          # retour CRM, CALX386) et le balayage systématique de CHAQUE onglet
          # du rail (CALX387, lu depuis le registre atelier/onglets.js, aucune
          # clé en dur) ne tournaient QUE dans release-verify.yml (nightly/
          # manuel), jamais sur une PR — la seule spec calepinage jouée en PR
          # restait la fumée générique. Temps NON MESURÉ (aucune infra e2e
          # disponible dans la lane qui a écrit ces extensions — mesurer au
          # premier run réel et reporter ici, comme le veut la note WOW-CI
          # RONDE 5 ci-dessus) : les deux fichiers mutent leurs propres leads
          # (comme calepinage-parcours.spec.js l'a toujours fait), donc les
          # ajouter à CETTE invocation `--workers 3` suit le même principe
          # que les fichiers de fumée (fichiers indépendants distribués entre
          # workers, ordre interne d'un fichier inchangé).
          if [ "${{ matrix.shard }}" = "1" ]; then
            npx playwright test --project=chromium --workers 3 \
              fumee-ecrans-1.spec.js fumee-ecrans-2.spec.js fumee-ecrans-3.spec.js \
              calepinage-parcours.spec.js calepinage-onglets.spec.js
          else
            # VX68 — passage WebKit RÉEL (Safari) sur le spec mobile : capte les
            # régressions qui n'apparaissent que sur Safari (VX48 window.open
            # post-await, sticky, backdrop-blur). PR-only, hors matrice complète.
            # SOLMVP54 — `devis.spec` tourne SEUL d'abord : son parcours génère
            # un PDF (WeasyPrint côté serveur) et attend le téléchargement sous
            # l'actionTimeout de 15 s ; lancé en même temps que les tests WebKit
            # (run 35609730995, tout dans une invocation à 2 workers) il a pris
            # 56 s et le téléchargement a dépassé 15 s — un délai produit qu'on
            # ne desserre pas pour la CI. Puis health (chromium, lecture seule)
            # et mobile-safari partagent 2 workers dans UNE invocation :
            # Playwright répartit les FICHIERS (mobile.spec.js reste sériel à
            # l'intérieur). Le filtre `mobile.spec.js` couvre aussi
            # adsengine-mobile.spec.js ; chromium ignore ces deux fichiers par
            # `testIgnore`, mobile-safari n'exécute qu'eux par `testMatch` —
            # chaque test tourne exactement une fois, comme avant. Mesuré avant
            # (run 35607493246) : 51 s + 66 s en série ; attendu ~47 s + ~66 s
            # avec health absorbé par le worker libre.
            npx playwright test --project=chromium devis.spec.js
            npx playwright test --project=chromium --project=mobile-safari --workers 2 \
              health.spec.js mobile.spec.js
          fi
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: frontend/playwright-report
          retention-days: 7
      # WOW-CI RONDE 5 — l'étape « Make the apt store readable for the cache
      # save » a été retirée avec le cache apt qu'elle servait : ce job n'écrit
      # plus dans `~/apt-archives` (les paquets sont dans l'image), et `sudo`
      # n'existe de toute façon pas dans le conteneur.

  # Agrégateur mince qui PRÉSERVE le nom de check requis `e2e` (patron WOW6,
  # identique à `backend-tests` / `frontend-lint` / `backend-lint`).
  e2e:
    needs: [changes, ci-image-check, e2e-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      # WOW-CI RONDE 5 — même garde que sur `backend-tests` et `backend-lint` :
      # `e2e-shard` dépend désormais de l'image CI, donc un `ci-image-check`
      # rouge le laisserait « skipped » et ferait passer ce check REQUIS au vert
      # sans qu'aucune spec n'ait tourné.
      - name: Fail if the CI image could not be resolved
        if: ${{ needs.ci-image-check.result == 'failure' || needs.ci-image-check.result == 'cancelled' }}
        run: |
          echo "ci-image-check=${{ needs.ci-image-check.result }} — les lanes e2e n'ont pas tourné."
          exit 1
      - name: Fail if an e2e lane failed or was cancelled
        if: ${{ needs.e2e-shard.result == 'failure' || needs.e2e-shard.result == 'cancelled' }}
        run: |
          echo "Une lane e2e n'est pas passée (result=${{ needs.e2e-shard.result }})."
          exit 1
      - name: All e2e lanes passed (or were skipped)
        run: echo "e2e-shard result=${{ needs.e2e-shard.result }} — gate OK."

  # ---------------------------------------------------------------------------
  # NTPLT5 / AUD422 — la suite d'étanchéité RLS (`core.tests.test_rls` +
  # `test_rls_cross_tenant_denial`, opt-in par POSTGRES_RLS_ENABLED) était ici
  # un job `rls-tests` séparé, non requis. SOLMVP54 (21/09/2026) : repliée sur
  # la lane 0 de `backend-tests-shard` (voir son étape « Run RLS seal suite »),
  # même dump WOW8 restauré, `--parallel 1` conservé (la suite applique ses
  # propres policies en setUp et les retire en tearDown — le dump restauré
  # exerce le sceau exactement comme un build froid, WOW-CI 16/07/2026).
  # ---------------------------------------------------------------------------
  # Always-running aggregate gate. Pin THIS one job as the single required
  # status check on `main`: because it always runs (if: always()) it can never
  # be left "Pending", and it passes only when no job that actually ran failed
  # or was cancelled. A SKIPPED job (path-filtered out) counts as acceptable —
  # `contains(needs.*.result, 'failure')` is false for 'skipped'/'success'.
  # ---------------------------------------------------------------------------
  # SOLMVP54 (21/09/2026) — ci-gate dépend des LANES, plus des agrégateurs
  # (backend-lint, backend-tests, frontend-lint, e2e). Un agrégateur n'est
  # qu'une fonction de ses lanes (il rougit ssi une lane a échoué/été annulée,
  # ou si ci-image-check a échoué — les deux sont déjà dans `needs` ici) : le
  # faire attendre par ci-gate ajoutait un SAUT de plus sur le chemin critique,
  # et chaque saut coûte une attribution de runner (3 s à vide, MESURÉ 43 à
  # 124 s quand l'organisation frôle le plafond de 20 jobs — run 35601218482 :
  # les deux sauts successifs backend-tests puis ci-gate ont coûté 4 min à un
  # run dont la dernière lane avait fini à 7,4 min). ci-gate part maintenant
  # en même temps que les agrégateurs, un seul saut après la dernière lane,
  # et son verdict est identique.
  ci-gate:
    if: ${{ always() }}
    needs:
      - changes
      - ci-image-check
      - backend-lint-fast
      - backend-openapi
      - backend-tests-shard
      - frontend-static
      - frontend-vitest-shard
      - stage-names
      - web-build-test
      - e2e-shard
    runs-on: ubuntu-latest
    steps:
      - name: Report job results
        run: |
          echo "changes=${{ needs.changes.result }}"
          echo "ci-image-check=${{ needs.ci-image-check.result }}"
          echo "backend-lint-fast=${{ needs.backend-lint-fast.result }}"
          echo "backend-openapi=${{ needs.backend-openapi.result }}"
          echo "backend-tests-shard=${{ needs.backend-tests-shard.result }}"
          echo "frontend-static=${{ needs.frontend-static.result }}"
          echo "frontend-vitest-shard=${{ needs.frontend-vitest-shard.result }}"
          echo "e2e-shard=${{ needs.e2e-shard.result }}"
          echo "stage-names=${{ needs.stage-names.result }}"
          echo "web-build-test=${{ needs.web-build-test.result }}"
      - name: Fail if any required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "A required CI job failed or was cancelled — see results above."
          exit 1
      - name: All clear
        run: echo "All CI jobs that ran passed (skipped jobs are acceptable)."
