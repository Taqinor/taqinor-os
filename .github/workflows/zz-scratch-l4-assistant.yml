name: zz scratch - L4 assistant tour 1 (TEMPORAIRE)

# ESSAI (21/11/2026, D-COP-5) : rejoue avec le VRAI modèle (secret CLAUDE_API_KEY du dépôt, moteur natif,
# copilote allumé) les deux conversations de Reda du 20/11 (anonymisées) et des questions simples, puis lit la base.
# Jamais la production. Déclenché seulement par un push sur la branche de la PR ; supprimé au dernier commit.
on:
  push:
    branches: [claude/assistant-l4]

concurrency:
  group: zz-scratch-l4-assistant
  cancel-in-progress: true

jobs:
  ci-image-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image_e2e: ${{ steps.tag.outputs.image_e2e }}
    steps:
      - uses: actions/checkout@v4
      - name: Calculer les etiquettes des images
        id: tag
        run: bash .github/ci-image/tag.sh "${{ github.repository }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Les images sont-elles deja publiees ?
        id: exists
        run: |
          set -uo pipefail
          for couple in "backend:${{ steps.tag.outputs.image }}" "e2e:${{ steps.tag.outputs.image_e2e }}"; do
            cle="${couple%%:*}"; ref="${couple#*:}"
            if docker manifest inspect "$ref" >/dev/null 2>&1; then echo "${cle}=true" >> "$GITHUB_OUTPUT"
            else echo "${cle}=false" >> "$GITHUB_OUTPUT"; fi
          done
          exit 0
      - uses: docker/setup-buildx-action@v3
        if: ${{ steps.exists.outputs.backend != 'true' || steps.exists.outputs.e2e != 'true' }}
      - name: Construire et pousser ci-backend si elle manque
        if: ${{ steps.exists.outputs.backend != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: backend/django_core
          file: .github/ci-image/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Construire et pousser ci-e2e si elle manque
        if: ${{ steps.exists.outputs.e2e != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: .github/ci-image/Dockerfile.e2e
          build-args: |
            CI_BACKEND_IMAGE=${{ steps.tag.outputs.image }}
          push: true
          tags: ${{ steps.tag.outputs.image_e2e }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  assistant:
    needs: [ci-image-check]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    container:
      image: ${{ needs.ci-image-check.outputs.image_e2e }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      redis:
        image: mirror.gcr.io/library/redis:7.4-alpine
        ports:
          - 6379:6379
    env:
      DJANGO_SETTINGS_MODULE: erp_agentique.settings.dev
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
      DJANGO_DEBUG: 'True'
      DB_NAME: erp_db
      DB_USER: erp_user
      DB_PASSWORD: ci_password
      DB_HOST: localhost
      DB_PORT: '5432'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      MINIO_ENDPOINT: localhost:9000
      MINIO_ROOT_USER: erp_admin
      MINIO_ROOT_PASSWORD: erp_minio_password
      MINIO_BUCKET_PDF: erp-pdf
      MINIO_BUCKET_UPLOADS: erp-uploads
      TENANT_RATE_LIMIT: '0'
      LOGIN_RATE_LIMIT: '1000/minute'
      ASSISTANT_COPILOTE: tous
      ASSISTANT_MOTEUR: natif
      AGENT_HMAC_SECRET: ci-essai-hmac-local
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/backend-env
        with:
          testdb-cache-into: erp_db
          prebuilt-image: 'true'
          testdb-save: 'false'
      - name: Migrate + seed demo + catalogue + roles
        working-directory: backend/django_core
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo
          python manage.py seed_catalogue
          python manage.py init_roles
      - name: Role Postgres lecture seule de l'agent
        run: |
          set -euo pipefail
          PSQL="/usr/lib/postgresql/16/bin/psql -h localhost -U erp_user -d erp_db -v ON_ERROR_STOP=1 -q"
          { sed -n '/^-- 4) AANA30/,$p' backend/db/rls_roles.sql; echo "ALTER ROLE sql_agent_ro PASSWORD 'ci-sql-agent-ro';"; } | $PSQL
      - name: Venv FastAPI (service IA reel)
        run: |
          set -euo pipefail
          python -m venv /tmp/venv-ia
          /tmp/venv-ia/bin/pip install -q --disable-pip-version-check --upgrade pip
          /tmp/venv-ia/bin/pip install -q --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu || true
          grep -vE '^faster-whisper' backend/fastapi_ia/requirements.txt > /tmp/req-ia.txt
          /tmp/venv-ia/bin/pip install -q --disable-pip-version-check -r /tmp/req-ia.txt
      - name: Django + service IA reel + scenarios
        working-directory: backend/django_core
        env:
          DJANGO_INTERNAL_URL: http://127.0.0.1:8000
          SQL_AGENT_PROVIDER: claude
          SQL_AGENT_MODEL: claude-sonnet-5-5
          SQL_AGENT_EFFORT: low
          SQL_AGENT_FALLBACK_PROVIDER: groq
          SQL_AGENT_DB_USER: sql_agent_ro
          SQL_AGENT_DB_PASSWORD: ci-sql-agent-ro
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -n "$CLAUDE_API_KEY" ]; then echo "Cle Claude : presente"; else echo "Cle Claude : ABSENTE"; fi
          unset POSTGRES_RLS_ENABLED
          gunicorn erp_agentique.wsgi:application --bind 127.0.0.1:8000 --workers 4 --timeout 300 \
            --error-logfile /tmp/gunicorn-error.log --access-logfile /tmp/gunicorn-access.log --capture-output &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/django/admin/login/ || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then echo "Django pret"; break; fi
            sleep 2; [ "$i" = "30" ] && { echo "Django indisponible"; exit 1; }
          done
          ( cd ../fastapi_ia && RUN_DB_DDL=1 /tmp/venv-ia/bin/uvicorn app.main:app --host 127.0.0.1 --port 8100 --workers 1 > /tmp/uvicorn.log 2>&1 & )
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8100/health || true)
            if [ "$code" = "200" ]; then echo "Service IA pret"; break; fi
            sleep 2; [ "$i" = "60" ] && { tail -n 60 /tmp/uvicorn.log; exit 1; }
          done
          python manage.py shell < ../../.github/zz-l4-comptes.py > /tmp/l4-shell.log 2>&1 || { tail -n 30 /tmp/l4-shell.log; exit 1; }
          echo "Controle instrument : EMAIL_BACKEND=$(python manage.py shell -c 'from django.conf import settings; print(settings.EMAIL_BACKEND)' 2>/dev/null | tail -n 1) ; SENDGRID=${SENDGRID_API_KEY:+PRESENTE}"
          /tmp/venv-ia/bin/python ../../.github/zz-l4-assistant.py http://127.0.0.1:8100 /tmp/l4-jetons.json /tmp/l4-prix.json
      - name: Journaux (cles masquees)
        if: ${{ !cancelled() }}
        run: |
          grep -aE '" (4|5)[0-9][0-9] ' /tmp/gunicorn-access.log | tail -n 40 || true
          tail -n 60 /tmp/gunicorn-error.log || true
          tail -n 120 /tmp/uvicorn.log 2>/dev/null | sed -E 's/(sk-ant-|gsk_)[A-Za-z0-9_-]+/MASQUE/g' || true
