name: ci-image

# ---------------------------------------------------------------------------
# WOW-CI RONDE 5 (20/08/2026) — CONSTRUCTION DE L'IMAGE CI BACKEND.
#
# Ce workflow ne garde AUCUN check requis et n'entre dans aucune protection de
# branche : il produit seulement l'image que `ci.yml` consomme ensuite via
# `container:`. Son seul role est de faire payer UNE FOIS, hors du chemin
# critique d'une PR, ce que chaque lane backend re-installait a chaque run.
#
# QUAND IL TOURNE :
#   - push sur `main` touchant l'un des trois fichiers qui DEFINISSENT
#     l'environnement (les deux requirements + le Dockerfile CI). C'est
#     exactement l'ensemble dont `.github/ci-image/tag.sh` calcule l'empreinte :
#     si le tag peut changer, ce workflow tourne ; sinon il ne sert a rien.
#   - `workflow_dispatch` — le REPLI MANUEL. Si un pull d'image echoue en CI, le
#     job backend echoue FRANCHEMENT (aucun repli silencieux vers l'ancien
#     chemin : deux chemins vivants finissent toujours par diverger) et c'est
#     ce bouton qui reconstruit l'image.
#
# CHEMIN LENT DE SECOURS : `ci.yml` sait aussi construire+pousser l'image en
# ligne quand elle manque (job `ci-image-check`). Ce workflow-ci existe pour que
# ce chemin lent ne soit JAMAIS paye par une PR quand un merge sur `main` a deja
# fait le travail.
# ---------------------------------------------------------------------------
on:
  push:
    branches: [main]
    paths:
      - 'backend/django_core/requirements.txt'
      - 'backend/django_core/requirements-dev.txt'
      - '.github/ci-image/Dockerfile'
      - '.github/ci-image/tag.sh'
      - '.github/workflows/ci-image.yml'
  workflow_dispatch:
    inputs:
      force:
        description: "Reconstruire meme si l'etiquette existe deja sur GHCR"
        type: boolean
        default: false

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Source UNIQUE de l'etiquette, partagee avec `ci.yml` — voir l'en-tete
      # de `.github/ci-image/tag.sh`.
      - name: Calculer l'etiquette de l'image
        id: tag
        run: bash .github/ci-image/tag.sh "${{ github.repository }}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rien a faire si l'etiquette est deja publiee : le contenu est fige par
      # construction (l'etiquette EST l'empreinte du contenu), donc reconstruire
      # produirait le meme resultat en 10 minutes.
      - name: L'etiquette existe-t-elle deja ?
        id: exists
        run: |
          set -uo pipefail
          if [ "${{ github.event.inputs.force }}" = 'true' ]; then
            echo "Reconstruction FORCEE demandee."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if docker manifest inspect '${{ steps.tag.outputs.image }}' >/dev/null 2>&1; then
            echo "Image deja publiee : ${{ steps.tag.outputs.image }}"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "Image absente — construction."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: ${{ steps.exists.outputs.present != 'true' }}

      # Contexte = `backend/django_core` (le Dockerfile y prend les deux
      # requirements par COPY), fichier = le Dockerfile CI dedie. L'image de
      # PRODUCTION (`backend/django_core/Dockerfile`) n'est ni lue ni touchee.
      - name: Construire et pousser
        if: ${{ steps.exists.outputs.present != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: backend/django_core
          file: .github/ci-image/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Resume
        run: |
          echo "Etiquette : ${{ steps.tag.outputs.tag }}"
          echo "Image     : ${{ steps.tag.outputs.image }}"
          echo "Deja presente : ${{ steps.exists.outputs.present }}"
