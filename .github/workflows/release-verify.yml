name: Release verify (full suite)

# ─────────────────────────────────────────────────────────────────────────────
# PALIER 3 — la « grosse » vérification, volontairement DÉCOUPLÉE du gate par-merge.
#
# Le gate par-merge (ci.yml) reste rapide : lint + logique pure + tests d'intégration
# + un smoke e2e. Ce workflow-ci rassemble TOUT ce qui est lent/coûteux/flaky :
#   • suite Django COMPLÈTE, y compris les tests étiquetés `pdf`/`slow` (rendu
#     WeasyPrint, golden PDF…),
#   • matrice e2e Playwright COMPLÈTE (toutes les specs, desktop + mobile),
#   • régression VISUELLE (captures de référence, non bloquante au départ),
#   • site vitrine : type-check + vitest + build + Lighthouse.
#
# Déclenchement : MANUEL (bouton « Run workflow ») + filet NIGHTLY. On lance
# `work on the plan` 2–3 fois (chaque merge passe le gate rapide), puis on tire
# ce workflow UNE fois « à la toute fin » avant de livrer. Il NE garde PAS `main`
# (non requis) — c'est une vérif d'ampleur, pas le gate de merge.
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
  schedule:
    # Filet de sécurité nightly — 03:00 UTC, pour que rien ne pourrisse en silence.
    - cron: '0 3 * * *'

concurrency:
  group: release-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # CAD177 (28/09/2026) — IMAGE CI PRE-CONSTRUITE, REPRISE A L'IDENTIQUE DE
  # ci.yml (job `ci-image-check`).
  #
  # `docker run minio/minio:latest` (ancien chemin non-conteneurise de
  # `backend-env`) echouait CHAQUE nuit depuis le 12/09/2026 :
  #   "docker: Error response from daemon: pull access denied for minio/minio,
  #    repository does not exist or may require 'docker login': denied"
  # constate identique sur les 5 derniers runs nightly (36308120730,
  # 36229704409, 36113984137, 35974170731, 35836805834) dans `backend-full` ET
  # `e2e-full`, a la meme etape "Start MinIO + create buckets". Docker Hub ne
  # sert plus les images `minio/minio` gratuitement ; `.github/ci-image/
  # Dockerfile` porte deja la parade (WOW-CI ronde 5, 20/08/2026) : les
  # binaires MinIO sont copies depuis `quay.io/minio/minio:
  # RELEASE.2025-01-20T14-49-07Z` (registre toujours accessible sans
  # authentification) et lances SANS docker par `backend-env`
  # (`prebuilt-image: true`) — exactement le meme mecanisme que docker-compose.yml.
  # `backend-full`/`e2e-full` tournent donc desormais DANS cette image
  # conteneurisee, comme ci.yml le fait deja pour ses lanes backend/e2e.
  #
  # Ce job est une COPIE du `ci-image-check` de ci.yml — a dessein : la source
  # unique des etiquettes (`.github/ci-image/tag.sh`) est deja concue pour
  # etre appelee par plusieurs workflows (cf. son en-tete), donc les deux
  # copies tombent TOUJOURS d'accord au caractere pres sur l'etiquette
  # d'image, et ce workflow independant n'a pas besoin d'attendre qu'un run de
  # `ci.yml` ait publie l'image au prealable — s'il la trouve absente sur
  # GHCR, il la construit lui-meme (chemin lent, ~8-12 min, ne se produit que
  # si aucun push recent sur `main` ne l'a deja fait). Aucun repli silencieux :
  # un pull qui echoue fait echouer la lane franchement, comme dans ci.yml.
  # ---------------------------------------------------------------------------
  ci-image-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
      image_e2e: ${{ steps.tag.outputs.image_e2e }}
    steps:
      - uses: actions/checkout@v4
      - name: Calculer les etiquettes des images
        id: tag
        run: bash .github/ci-image/tag.sh "${{ github.repository }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Les images sont-elles deja publiees ?
        id: exists
        run: |
          set -uo pipefail
          for couple in "backend:${{ steps.tag.outputs.image }}" "e2e:${{ steps.tag.outputs.image_e2e }}"; do
            cle="${couple%%:*}"; ref="${couple#*:}"
            if docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "Presente — chemin rapide : $ref"
              echo "${cle}=true" >> "$GITHUB_OUTPUT"
            else
              echo "ABSENTE — construction en ligne : $ref"
              echo "${cle}=false" >> "$GITHUB_OUTPUT"
            fi
          done
          exit 0
      - uses: docker/setup-buildx-action@v3
        if: ${{ steps.exists.outputs.backend != 'true' || steps.exists.outputs.e2e != 'true' }}
      - name: Construire et pousser ci-backend si elle manque (chemin lent)
        if: ${{ steps.exists.outputs.backend != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: backend/django_core
          file: .github/ci-image/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Construire et pousser ci-e2e si elle manque (chemin lent)
        if: ${{ steps.exists.outputs.e2e != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: .github/ci-image/Dockerfile.e2e
          build-args: |
            CI_BACKEND_IMAGE=${{ steps.tag.outputs.image }}
          push: true
          tags: ${{ steps.tag.outputs.image_e2e }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Resume
        run: |
          echo "ci-backend = ${{ steps.tag.outputs.image }} (deja presente = ${{ steps.exists.outputs.backend }})"
          echo "ci-e2e     = ${{ steps.tag.outputs.image_e2e }} (deja presente = ${{ steps.exists.outputs.e2e }})"

  # ── Suite Django COMPLÈTE (inclut pdf/slow) ────────────────────────────────
  # CAD177 — conteneurisee dans l'image CI (comme ci.yml) : MinIO tourne par
  # son binaire natif au lieu de `docker run minio/minio:latest`, dont le pull
  # est refuse depuis le 12/09/2026 (cf. l'en-tete de `ci-image-check`).
  backend-full:
    needs: ci-image-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        # Un job `container:` lance ses scripts avec `sh` (dash) par defaut —
        # meme regle que les jobs conteneurises de ci.yml.
        shell: bash
    container:
      image: ${{ needs.ci-image-check.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      # Le service `postgres` a disparu d'ici : `backend-env` demarre un
      # serveur LOCAL dans le conteneur du job (memes reglages que ci.yml —
      # voir son etape "Demarrer Postgres dans le conteneur"). `redis` reste
      # un service Actions, mais s'atteint desormais par son NOM (`redis`) et
      # non plus `localhost`, une fois le job conteneurise.
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
    env:
      DJANGO_SETTINGS_MODULE: erp_agentique.settings.dev
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
      DJANGO_DEBUG: 'True'
      DB_NAME: erp_db
      DB_USER: erp_user
      DB_PASSWORD: ci_password
      DB_HOST: localhost
      DB_PORT: '5432'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      MINIO_ENDPOINT: localhost:9000
      MINIO_ROOT_USER: erp_admin
      MINIO_ROOT_PASSWORD: erp_minio_password
      MINIO_BUCKET_PDF: erp-pdf
      MINIO_BUCKET_UPLOADS: erp-uploads
    steps:
      - uses: actions/checkout@v4
      # Python 3.11 + les DEUX requirements (dont weasyprint) sont deja dans
      # l'image CI — plus de `setup-python` ni de `pip install -r
      # requirements.txt` ici (memes suppressions que les jobs conteneurises
      # de ci.yml). `requirements-dev.txt` commence par `-r requirements.txt`
      # (voir son en-tete) : c'est donc toujours le sur-ensemble qui rend les
      # PDF sur la meme pile que la prod, comme avant.
      - uses: ./.github/actions/backend-env
        with:
          testdb-cache-into: test_erp_db
          prebuilt-image: 'true'
      - name: Run FULL Django test suite (incl. pdf/slow) + coverage
        working-directory: backend/django_core
        # WOW3 — la couverture vit ICI (nightly/manuel), plus dans le gate
        # par-merge : on paie l'instrumentation là où la latence est sans enjeu.
        # CAD177 — factory_boy/Faker/freezegun ne sont PLUS installes ici : les
        # trois sont dans `requirements-dev.txt`, deja bakes dans l'image CI
        # (`prebuilt-image: true` ci-dessus). Seul `coverage` reste a
        # installer (aucun des deux requirements ne le porte).
        run: |
          pip install coverage
          coverage run manage.py test apps authentication core -v 2 --keepdb
          coverage report

  # ── Front : logique pure (node:test) + composants/UX (Vitest) ──────────────
  frontend-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend (eslint)
        working-directory: frontend
        run: npm run lint
      - name: Frontend unit tests (node:test — auto-discovered)
        working-directory: frontend
        run: node --test "src/**/*.test.mjs"
      - name: Frontend component + a11y tests (Vitest)
        working-directory: frontend
        run: npm run test:unit

  # ── Matrice e2e COMPLÈTE + régression visuelle (bootstrap, non bloquante) ──
  # CAD177 — conteneurisée dans l'image CI `ci-e2e` (comme ci.yml, job
  # `e2e-shard`) : chromium ET webkit sont déjà bakés, et MinIO tourne par son
  # binaire natif au lieu de `docker run minio/minio:latest` + `minio/mc:latest`
  # (les DEUX pulls sont refusés depuis le 12/09/2026, cf. l'en-tête de
  # `ci-image-check`).
  e2e-full:
    needs: ci-image-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    container:
      image: ${{ needs.ci-image-check.outputs.image_e2e }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      # Même raison que `backend-full` : `postgres` disparait (serveur local
      # dans le conteneur, via `backend-env`), `redis` reste un service mais
      # s'atteint par son NOM (`redis`), plus par `localhost`.
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
    env:
      DJANGO_SETTINGS_MODULE: erp_agentique.settings.dev
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
      DJANGO_DEBUG: 'True'
      DB_NAME: erp_db
      DB_USER: erp_user
      DB_PASSWORD: ci_password
      DB_HOST: localhost
      DB_PORT: '5432'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      # AGR423 / CIQ424 — secret de TEST du récepteur de leads du site : sans
      # lui, le récepteur répond 401 et les étapes « lead arrivé du site » des
      # specs se sautent. Valeur factice, propre au CI (jamais celle de prod) ;
      # Playwright lit la même via E2E_WEBHOOK_SECRET (frontend/e2e/helpers.js).
      WEBSITE_LEAD_WEBHOOK_SECRET: e2e-webhook-secret
      E2E_WEBHOOK_SECRET: e2e-webhook-secret
      # Emplacement des navigateurs bakés dans l'image `ci-e2e` (chromium ET
      # webkit, VX68) — doit rester identique à l'ENV PLAYWRIGHT_BROWSERS_PATH
      # de `.github/ci-image/Dockerfile.e2e`, sinon Playwright les chercherait
      # dans `~/.cache/ms-playwright`, ne les trouverait pas, et les
      # retéléchargerait — l'image ne servirait à rien.
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      MINIO_ENDPOINT: localhost:9000
      MINIO_ROOT_USER: erp_admin
      MINIO_ROOT_PASSWORD: erp_minio_password
      MINIO_BUCKET_PDF: erp-pdf
      MINIO_BUCKET_UPLOADS: erp-uploads
      # NTPLT42/PACT8 — même règle que le job `e2e` de ci.yml : throttle par
      # tenant OFF pour la matrice complète (encore plus de requêtes pour la
      # même société démo que la fumée par-merge). Sans cette env, `/auth/me/`
      # finit en 429 → redirection /login → faux « page blanche ».
      TENANT_RATE_LIMIT: '0'
    steps:
      - uses: actions/checkout@v4
      # Python 3.11 + les navigateurs Playwright sont déjà dans l'image
      # `ci-e2e` — plus de `setup-python` ici (même suppression que `e2e-shard`
      # dans ci.yml). Node reste (cache npm, sans lequel `npm ci` serait
      # beaucoup plus lent).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # WOW7 — shared WeasyPrint + pip (requirements-dev.txt) + MinIO setup.
      # WOW8 — restore the cached pre-migrated dump into erp_db (the migrate
      # step below becomes a fast no-op; the demo seeds still run fresh).
      - uses: ./.github/actions/backend-env
        with:
          testdb-cache-into: erp_db
          prebuilt-image: 'true'
      - name: Migrate + seed throwaway demo data
        working-directory: backend/django_core
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo
          python manage.py seed_catalogue
          # AOF186/AOF190 — fixture des specs `ao-*.spec.js` (l'affaire de
          # démonstration `FRDISI`, construite DEPUIS les goldens AOF183).
          # La matrice complète ci-dessous inclut `mobile-safari`, donc la
          # même dépendance qu'en CI : sans ce seed, les specs AO expirent.
          # SOLMVP (21/09/2026) — plus de seed_ao_demo : app AO en coquille.
          # NTDMO37/38 — fixture de `demo-first-login.spec.js`/
          # `demo-reset-isolation.spec.js` (auto-découvertes par le
          # `--grep-invert @visual` ci-dessous, comme tout spec). CAD177 :
          # `Faker` est déjà dans `requirements-dev.txt`, bakée dans l'image
          # par `prebuilt-image` ci-dessus ; ce `pip install` explicite reste
          # inoffensif (déjà satisfait) et documente la dépendance de cette
          # étape.
          pip install Faker==40.28.1
          python manage.py seed_demo_company
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers (chromium + webkit)
        working-directory: frontend
        # CAD177 — chromium ET webkit sont déjà bakés dans l'image `ci-e2e`
        # (VX68) : plus de `--with-deps` (dépaquetage apt inutile) — même
        # changement que `e2e-shard` dans ci.yml. L'appel reste, sans
        # `--with-deps` : idempotent si les binaires sont déjà là, il échoue
        # franchement s'ils manquaient.
        run: npx playwright install chromium webkit
      - name: Build frontend (no service worker for E2E)
        working-directory: frontend
        env:
          VITE_E2E: '1'
        run: npm run build
      # QAH7 — le projet dédié `monkey` (frontend/playwright.config.js) tourne
      # ICI : `--grep-invert @visual` ne filtre que le tag visuel, donc TOUS
      # les projets non filtrés (dont `monkey`) s'exécutent faute de
      # `--project` explicite. `monkey.spec.js` (marcheur aléatoire
      # gremlins.js, un test par module MVP) n'apparaît JAMAIS dans le shard
      # par-merge de ci.yml (qui liste ses fichiers explicitement) — cette
      # matrice complète est le SEUL endroit où il tourne. Ajoute ~15 min au
      # budget par défaut (19 modules x 4 s/écran, voir DUREE_PAR_ECRAN_MS) ;
      # surchargeable via `MONKEY_MS_PAR_ECRAN` sur ce job si besoin. Sécurité
      # : boutons destructifs/d'envoi neutralisés par sélecteur dans le spec
      # lui-même, jamais une écriture vers un service externe.
      - name: Start Django + run FULL e2e matrix (desktop + mobile + monkey)
        working-directory: backend/django_core
        run: |
          gunicorn erp_agentique.wsgi:application \
            --bind 127.0.0.1:8000 --workers 3 --timeout 120 --worker-class sync &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              http://127.0.0.1:8000/api/django/admin/login/ || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "Django prêt (HTTP $code)"; break
            fi
            echo "Attente Django ($i)…"; sleep 2
            if [ "$i" = "30" ]; then echo "Django indisponible"; exit 1; fi
          done
          cd ../../frontend
          # Toutes les specs SAUF les captures visuelles (qui ont leur propre étape).
          npx playwright test --grep-invert @visual
      - name: Visual regression (bootstrap baselines — non bloquant)
        # Au 1er run il n'y a pas de baseline → --update-snapshots les génère ;
        # elles sont uploadées ci-dessous pour que le fondateur les relise et les
        # commit (alors la comparaison devient un vrai garde-fou). continue-on-error
        # car ce palier ne garde pas `main`.
        continue-on-error: true
        working-directory: frontend
        run: npx playwright test --grep @visual --update-snapshots
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full
          path: frontend/playwright-report
          retention-days: 14
      - name: Upload visual baselines (à relire + commiter)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: frontend/e2e/**/*-snapshots/**
          retention-days: 14
          if-no-files-found: ignore

  # ── Site vitrine : type-check + vitest + build + Lighthouse ────────────────
  web-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install apps/web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Type-check apps/web (tsc)
        working-directory: apps/web
        run: npm run check
      - name: apps/web unit tests (vitest)
        working-directory: apps/web
        run: npm test
      - name: Build marketing site (astro build)
        working-directory: apps/web
        run: npm run build
      - name: Lighthouse (perf/SEO/a11y — non bloquant)
        continue-on-error: true
        working-directory: apps/web
        run: |
          npm run preview -- --port 4321 &
          for i in $(seq 1 20); do
            if curl -sf http://localhost:4321/ >/dev/null; then echo "preview prêt"; break; fi
            sleep 2
          done
          npx lighthouse http://localhost:4321/ \
            --quiet --chrome-flags="--headless --no-sandbox" \
            --output=html --output-path=./lighthouse-report.html || true
      - name: Upload Lighthouse report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: apps/web/lighthouse-report.html
          retention-days: 14
          if-no-files-found: ignore

  # ── Service IA (FastAPI) : sécurité agent NL→SQL, JWT, OCR, garde-marge ─────
  # Dépendances lourdes (langchain/torch) → palier 3 plutôt que par-merge. Les
  # suites se sautent proprement si une dépendance manque ; avec les requirements
  # complètes installées, elles s'exécutent réellement.
  fastapi-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: erp_db
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
      DB_NAME: erp_db
      DB_USER: erp_user
      DB_PASSWORD: ci_password
      DB_HOST: localhost
      DB_PORT: '5432'
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # MUST match prod (python:3.11.x) — the full PDF/golden suite must run on the same Python that generates client PDFs.
      - name: Install FastAPI service dependencies
        working-directory: backend/fastapi_ia
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run FastAPI test suite (NL→SQL security / JWT / OCR / margin guard)
        working-directory: backend/fastapi_ia
        run: python -m unittest discover -s tests -v

  # ---------------------------------------------------------------------------
  # QAH6 (28/09/2026) — FUZZING PROPERTY-BASED DU SCHEMA OPENAPI (Schemathesis).
  #
  # Recherche L2 du 27/09/2026 (GROUPE QAH) : un agent LLM explore bien et juge
  # MAL (GUI Testing Arena, GUITester) — les ORACLES DURS doivent porter le
  # jugement. Schemathesis EST un oracle dur pour l'API : il lit le schema
  # drf-spectacular DEJA validé en CI (YAPIC6, job `backend-openapi`) et genere
  # des requetes (positives ET négatives) contre CHAQUE opération documentée,
  # verifiant 5xx/conformite de reponse/en-tetes — sans jugement humain a
  # simuler. Non-bloquant (`continue-on-error`), palier 3 (nightly + dispatch,
  # comme tout ce fichier) : c'est un DECOUVREUR, jamais un gate.
  #
  # Conteneurise dans l'image CI (`ci-backend`, pas besoin des navigateurs
  # `ci-e2e`) — meme raison que `backend-full`/`e2e-full` : MinIO par binaire
  # natif, jamais `docker run minio/minio` (CAD177). Setup DB/demo repris tel
  # quel du job `e2e-full` (migrate + seed_demo + seed_catalogue).
  #
  # EXCLUSIONS (destructif / envois externes REELS) — documentees ici, jamais
  # dans une invention : verifie contre le code, pas une supposition.
  #   - `adsengine/` : moteur Meta Ads/Instagram de l'ERP (PUBLICATION reelle,
  #     reponse/suppression/masquage de commentaires Instagram, connexions
  #     Meta) — surface entiere exclue, trop large et trop connectee a l'API
  #     Graph pour un tri operation-par-operation fiable ici.
  #   - `/contact/` : formulaire de contact public -> e-mail SendGrid (parqué
  #     par defaut, mais exclu par principe — PLAN.md « Public contact form »).
  #   - `statuspage/public/(abonner|confirmer|desabonner)/` : abonnement au
  #     statut public -> e-mail de confirmation (`apps/statuspage/views.py`
  #     `_envoyer_email_confirmation`).
  #   - `automation/approvals/<id>/approve/` : approuver une approbation
  #     RELANCE reellement l'action differee (`engine.run_approved`) — laquelle
  #     peut envoyer e-mail/SMS/WhatsApp selon la regle configuree. `reject` et
  #     `simuler` (dry-run explicite, « rien n'est ecrit ni envoye ») restent
  #     fuzzables.
  #   NOTE — sans clés API réelles dans l'environnement CI (SENDGRID_API_KEY,
  #   identifiants Meta), ces intégrations échouent déjà gracieusement (voir
  #   CLAUDE.md « Key-gated features ») ; l'exclusion reste utile en défense en
  #   profondeur ET pour la qualité du signal (un 5xx dû à une clé absente
  #   n'est pas un vrai bug d'API).
  #
  # Chaque échec REPRODUCTIBLE devient une tâche ERR dans docs/ERROR_PLAN.md —
  # jamais un gate (règle explicite du groupe QAH, « canonisation d'oracle
  # interdite » : on ne rend jamais un test vert en l'alignant sur un bug).
  # Recette locale (docker) : docs/TESTING.md, section « Fuzz API
  # (Schemathesis) — QAH6 ».
  # ---------------------------------------------------------------------------
  api-fuzz:
    needs: ci-image-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    container:
      image: ${{ needs.ci-image-check.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
    env:
      DJANGO_SETTINGS_MODULE: erp_agentique.settings.dev
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
      DJANGO_DEBUG: 'True'
      DB_NAME: erp_db
      DB_USER: erp_user
      DB_PASSWORD: ci_password
      DB_HOST: localhost
      DB_PORT: '5432'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      MINIO_ENDPOINT: localhost:9000
      MINIO_ROOT_USER: erp_admin
      MINIO_ROOT_PASSWORD: erp_minio_password
      MINIO_BUCKET_PDF: erp-pdf
      MINIO_BUCKET_UPLOADS: erp-uploads
      # Meme garde que `e2e-full`/`e2e-shard` : sans elle, les centaines de
      # requetes de Schemathesis contre la meme societe demo epuisent le
      # budget 1200/min et font pleuvoir des 429 (bruit, pas un vrai bug).
      TENANT_RATE_LIMIT: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/backend-env
        with:
          testdb-cache-into: erp_db
          prebuilt-image: 'true'
      - name: Migrate + seed throwaway demo data (repris de e2e-full)
        working-directory: backend/django_core
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo
          python manage.py seed_catalogue
      - name: Démarrer Django (gunicorn)
        working-directory: backend/django_core
        run: |
          gunicorn erp_agentique.wsgi:application \
            --bind 127.0.0.1:8000 --workers 3 --timeout 120 --worker-class sync &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              http://127.0.0.1:8000/api/django/admin/login/ || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "Django prêt (HTTP $code)"; break
            fi
            echo "Attente Django ($i)…"; sleep 2
            if [ "$i" = "30" ]; then echo "Django indisponible"; exit 1; fi
          done
      - name: Obtenir un JWT demo_admin
        id: jwt
        run: |
          set -euo pipefail
          # Identifiants seedés en dur par `seed_demo` (authentication/
          # management/commands/seed_demo.py) — jamais un compte de prod.
          # ERR118 — `CustomTokenObtainPairView` pose le JWT dans le cookie
          # httpOnly `access_token` (corps de réponse vide) : on le lit du
          # cookie-jar ; `CookieJWTAuthentication` accepte aussi le Bearer.
          curl -sf -c cookies.txt -X POST http://127.0.0.1:8000/api/django/token/ \
            -H "Content-Type: application/json" \
            -d '{"username": "demo_admin", "password": "Demo@2026!"}' > /dev/null
          ACCESS=$(python -c "import http.cookiejar as c; j=c.MozillaCookieJar('cookies.txt'); j.load(ignore_discard=True, ignore_expires=True); t=[x.value for x in j if x.name=='access_token']; assert t, 'cookie access_token absent'; print(t[0])")
          rm -f cookies.txt
          # Le jeton ne va JAMAIS dans les logs (masqué) ni dans un output lu
          # par un autre job — consommé dans CE job, à l'étape suivante.
          echo "::add-mask::$ACCESS"
          echo "access=$ACCESS" >> "$GITHUB_OUTPUT"
      - name: schemathesis run (fuzzing + stateful contre api/schema/)
        working-directory: backend/django_core
        env:
          ACCESS_TOKEN: ${{ steps.jwt.outputs.access }}
        run: |
          set -euo pipefail
          schemathesis run \
            --url http://127.0.0.1:8000 \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            --checks all \
            --phases examples,coverage,fuzzing,stateful \
            --mode all \
            --max-time 1800 \
            --exclude-path-regex '(adsengine/|/contact/|statuspage/public/(abonner|confirmer|desabonner)/|automation/approvals/[0-9]+/approve/)' \
            --report junit,json \
            --report-dir ../../schemathesis-report \
            http://127.0.0.1:8000/api/schema/ \
            2>&1 | tee ../../schemathesis-output.log
      - name: Upload le rapport Schemathesis
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: schemathesis-report
          path: |
            schemathesis-report/
            schemathesis-output.log
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # CAD177 (28/09/2026) — ALERTE SI LE NOCTURNE ECHOUE/SAUTE 2 NUITS DE SUITE.
  #
  # `release-verify` a echoue chaque nuit du 12/09 au 27/09/2026 (MinIO, cf.
  # `ci-image-check`) et AUCUN signal n'a alerte pendant DOUZE nuits — c'est le
  # constat exact que ce job ferme. Il ne tourne QUE sur le declenchement
  # `schedule` (jamais un `workflow_dispatch` manuel du fondateur, qui ne dit
  # rien de la sante du cron), a la fin de chaque run nocturne.
  #
  # DECISION (isolee et testee en hote — scripts/nightly_alert_gate.py) :
  # alerter ssi CE run n'est pas entierement vert ET que le run nocturne
  # PRECEDENT (deja termine) ne l'etait pas non plus. Le run COURANT n'apparait
  # jamais dans `gh run list --status completed` tant que CE job n'a pas fini —
  # la requete ne peut donc renvoyer QUE le run nocturne precedent, jamais
  # celui-ci (pas de course avec sa propre conclusion pas encore ecrite).
  #
  # Meme patron « opens-or-updates » que `.github/workflows/dependency-audit.yml`
  # (seul autre workflow du depot a ouvrir des issues) : une issue labellisee
  # `nightly-alert` est creee ou commentee, jamais dupliquee. Le job ECHOUE
  # aussi FRANCHEMENT dans ce cas (rouge visible dans l'onglet Actions), pour
  # qu'un oeil qui ne lit pas les issues voie quand meme le signal.
  # ---------------------------------------------------------------------------
  alert-on-repeated-failure:
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: [ci-image-check, backend-full, frontend-full, e2e-full, web-full, fastapi-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      # Job non conteneurisé (ubuntu-latest nu) : `python` n'est pas garanti
      # présent/aliasé sans cette étape — même règle que
      # `.github/workflows/dependency-audit.yml`.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Le run nocturne PRECEDENT (deja termine) etait-il vert ?
        id: prev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CONCLUSION=$(gh run list --repo "${{ github.repository }}" \
            --workflow release-verify.yml --event schedule --status completed \
            --limit 1 --json conclusion --jq '.[0].conclusion // empty')
          echo "Run nocturne precedent (deja termine) : ${CONCLUSION:-aucun historique}"
          echo "conclusion=${CONCLUSION}" >> "$GITHUB_OUTPUT"
      - name: Decider s'il faut alerter (scripts/nightly_alert_gate.py)
        id: decision
        run: |
          set -euo pipefail
          ALERTE=$(python scripts/nightly_alert_gate.py \
            --job-result "${{ needs.ci-image-check.result }}" \
            --job-result "${{ needs.backend-full.result }}" \
            --job-result "${{ needs.frontend-full.result }}" \
            --job-result "${{ needs.e2e-full.result }}" \
            --job-result "${{ needs.web-full.result }}" \
            --job-result "${{ needs.fastapi-tests.result }}" \
            --previous-conclusion "${{ steps.prev.outputs.conclusion }}")
          echo "Alerter ? $ALERTE"
          echo "alerte=$ALERTE" >> "$GITHUB_OUTPUT"
      - name: Ouvrir/mettre à jour l'issue d'alerte (2 nuits rouges de suite)
        if: ${{ steps.decision.outputs.alerte == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[release-verify] Le nocturne échoue depuis 2 nuits ou plus';
            const body = [
              '`release-verify.yml` (vérification nightly, palier 3) n\'a produit',
              'aucun run VERT lors des 2 dernières exécutions planifiées (`schedule`).',
              '',
              `Run qui a déclenché cette alerte : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Historique : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/release-verify.yml`,
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'nightly-alert',
            });
            const dup = existing.data.find(i => i.title === title);
            if (dup) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: dup.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['nightly-alert'],
              });
            }
      - name: Échouer franchement (2 nuits rouges de suite)
        if: ${{ steps.decision.outputs.alerte == 'true' }}
        run: |
          echo "::error::release-verify a échoué (ou sauté) les 2 dernières nuits de suite — voir l'issue nightly-alert."
          exit 1
