name: semgrep

# NTPLT53 — SAST par PATTERNS de code : le pack Django public + règles MAISON
# (.semgrep/taqinor.yml) encodant les invariants du repo (pas de SQL formaté /
# objects.raw, pas de `company` lu du body, pas de count()+1 pour une
# référence, pas de nouveau chemin PDF devis hors /proposal — RÈGLE #4).
#
# ENF12 (règle fondateur 09/10/2026, docs/claude-memory/enforce-all-checks.md) :
# job BLOQUANT — plus de `continue-on-error`, plus de `|| true`.
# Seuil : ZÉRO découverte (`--error`). Mesure du 09/10/2026 : 38 découvertes
# masquées (6 injections CSV, XSS HTML→PDF, 3 challenges webhook réfléchis,
# 3 NaN, 10 SQL formatés, 9 count()+1, mot de passe par défaut '', csrf_token
# hors portée de la règle, 2 `company` lus du body) — toutes CORRIGÉES dans le
# code ; la seule précision de règle (console superutilisateur éditeur) est
# commentée dans .semgrep/taqinor.yml. Aucune baseline, aucune exception.
#
# Déclencheurs : PR backend (un seul passage ≈ 3 min), push sur main, manuel.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'backend/**'
      - '.semgrep/**'
      - '.github/workflows/semgrep.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.semgrep/**'

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Pas de conteneur Docker Hub : la limite anonyme (toomanyrequests)
    # faisait tomber le job ; semgrep s'installe depuis PyPI.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer semgrep
        run: pip install 'semgrep>=1.90,<2'
      - name: Semgrep (pack Django + règles maison, zéro découverte)
        run: |
          semgrep --config p/django --config .semgrep/ --metrics=off \
            --error --sarif-output=semgrep.sarif backend/django_core
      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
