name: load smoke (Locust, opt-in)

# NTPLT49 — job de charge NIGHTLY OPT-IN (workflow_dispatch + cron hebdo),
# NON-REQUIRED (protection de branche intacte). Monte les services CI, applique
# les migrations, seed_scale RÉDUIT (NTPLT47), lance Locust headless ~10 min
# (load/locustfile.py, NTPLT48), publie le rapport HTML en artifact et ÉCHOUE
# si le p95 agrégé dépasse 2× le seuil LISTE documenté (500 ms → 1000 ms, cf.
# docs/load-testing.md) — la régression de perf se voit AVANT le client.
#
# ENF12 (règle fondateur 09/10/2026, docs/claude-memory/enforce-all-checks.md) :
# plus de `|| true` sur Locust, plus de sortie 0 « non concluant ». Mesure du
# 05/10/2026 : 4 813 requêtes, 100 % d'échecs (POST /auth/login/ en 404 →
# tout le reste en 401 de 3 ms : « p95 = 4 ms » trompeur). Seuils désormais :
#   * Locust échoue sur toute requête en échec (code de sortie natif 1) ;
#   * p95 agrégé ≤ 1000 ms (2× le seuil LISTE 500 ms de docs/load-testing.md) ;
#   * CSV ou ligne Aggregated absents = ÉCHEC (la passe n'a pas tourné).

on:
  workflow_dispatch:
    inputs:
      run_time:
        description: 'Durée Locust (ex. 10m, 2m)'
        default: '10m'
  schedule:
    - cron: '0 5 * * 1'   # lundi 05:00 UTC, hebdomadaire

permissions:
  contents: read

jobs:
  load-smoke:
    # ADCG117 (15/11/2026) — 24.04 épinglé : les paquets système de WeasyPrint ci-dessous y portent ces noms
    # (ubuntu-latest est passé à 26.04, noms renommés — vu au rejeu ADCG116).
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: mirror.gcr.io/pgvector/pgvector:pg16
        env:
          POSTGRES_DB: erp_db
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: public.ecr.aws/docker/library/redis:7
        ports:
          - 6379:6379
    env:
      DJANGO_SETTINGS_MODULE: erp_agentique.settings.dev
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
      DJANGO_DEBUG: 'True'
      DB_NAME: erp_db
      DB_USER: erp_user
      DB_PASSWORD: ci_password
      DB_HOST: localhost
      DB_PORT: '5432'
      REDIS_URL: redis://localhost:6379/0
      # ADCG117 (15/11) — les réglages lisent REDIS_HOST/REDIS_PORT (défaut `redis`, introuvable ici :
      # 6 201 ConnectionError au run 43670968244) et `/proposal` range l'aperçu PDF dans MinIO
      # (`minio:9000` par défaut : 156/156 en 500). Mêmes valeurs que les jobs backend de ci.yml.
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      MINIO_ENDPOINT: localhost:9000
      MINIO_ROOT_USER: erp_admin
      MINIO_ROOT_PASSWORD: erp_minio_password
      MINIO_BUCKET_PDF: erp-pdf
      MINIO_BUCKET_UPLOADS: erp-uploads
      # ADCG117 — Redis joignable, le limiteur de connexion mord enfin : 20 utilisateurs virtuels qui se
      # connectent ensemble prenaient 429 (16/20 au run 43679878813) puis 401 partout. Mêmes valeurs que les
      # workflows d'acceptation (un seul compte de charge, aucune société tierce à protéger ici).
      LOGIN_RATE_LIMIT: '1000/minute'
      TENANT_RATE_LIMIT: '0'
      PYTHONPATH: ${{ github.workspace }}   # STAGES.py (racine du dépôt) importable
      LOCUST_USER: charge
      LOCUST_PASSWORD: charge-password-not-secret
      LOAD_USERNAME: charge
      LOAD_PASSWORD: charge-password-not-secret
      P95_LIMIT_MS: '1000'   # 2× le seuil LISTE documenté (500 ms)
    steps:
      - uses: actions/checkout@v4
      # ADCG117 — `/proposal` rend le PDF par WeasyPrint : sans pango/harfbuzz le rendu tombe en 500
      # (190/190 au run 43664234819). Mêmes bibliothèques que l'image CI (.github/ci-image/Dockerfile).
      # ADCG117 — MinIO : Docker Hub `minio/minio` n'existe plus (« pull access denied », run 43679719669) ;
      # mêmes binaires que l'image CI (.github/ci-image/Dockerfile : archive gelée bitnamilegacy), lancés en natif
      # comme le chemin pré-construit de .github/actions/backend-env (sonde `ready`, buckets).
      - name: MinIO (aperçus PDF de /proposal)
        run: |
          docker create --name minio-src bitnamilegacy/minio:2025.1.20-debian-12-r0 >/dev/null
          sudo docker cp minio-src:/opt/bitnami/minio/bin/minio /usr/local/bin/minio
          sudo docker cp minio-src:/opt/bitnami/minio-client/bin/mc /usr/local/bin/mc
          docker rm minio-src >/dev/null
          sudo chmod +x /usr/local/bin/minio /usr/local/bin/mc
          mkdir -p /tmp/minio-data
          MINIO_ROOT_USER=erp_admin MINIO_ROOT_PASSWORD=erp_minio_password \
            nohup minio server /tmp/minio-data --address ':9000' > /tmp/minio.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -sf http://localhost:9000/minio/health/ready; then echo "MinIO prêt"; break; fi
            sleep 0.25
            if [ "$i" = "120" ]; then echo "MinIO indisponible"; tail -50 /tmp/minio.log; exit 1; fi
          done
          for i in $(seq 1 20); do
            if mc alias set local http://localhost:9000 erp_admin erp_minio_password; then break; fi
            sleep 0.5
            if [ "$i" = "20" ]; then echo "MinIO n'accepte pas l'alias mc"; exit 1; fi
          done
          mc mb -p local/erp-pdf local/erp-uploads
      - name: Bibliothèques système de WeasyPrint
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 \
            libpangocairo-1.0-0 libharfbuzz0b libharfbuzz-subset0 libcairo2 shared-mime-info fonts-liberation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend + dev deps (Faker, Locust)
        working-directory: backend/django_core
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Migrate + charge user + seed_scale (réduit)
        working-directory: backend/django_core
        run: |
          python manage.py migrate --noinput
          python ../../scripts/load/creer_compte_charge.py
          python manage.py seed_scale --tag CHARGE --companies 1 --users 20 \
            --leads 5000 --devis 500 --lignes 5000 --mouvements 5000 \
            --force-je-sais

      - name: Run Django server (background)
        working-directory: backend/django_core
        run: |
          nohup python manage.py runserver 0.0.0.0:8000 > server.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:8000/api/django/token/ || echo 000)
            case "$code" in 2*|4*) echo "Django prêt ($code)"; break;; esac
            echo "Attente Django ($i)…"; sleep 1
          done

      - name: Locust headless (~10 min)
        working-directory: backend/django_core
        run: |
          locust -f ../../load/locustfile.py \
            --host http://localhost:8000 \
            --headless -u 20 -r 2 \
            --run-time "${{ github.event.inputs.run_time || '10m' }}" \
            --html ../../locust-report.html \
            --csv ../../locust

      - name: Upload Locust report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-report
          path: |
            locust-report.html
            locust_stats.csv
            backend/django_core/server.log

      - name: Gate on p95 (échoue si > 2× le seuil documenté)
        if: success() || failure()
        run: |
          python - <<'PY'
          import csv, os, sys
          limit = float(os.environ.get('P95_LIMIT_MS', '1000'))
          path = 'locust_stats.csv'
          if not os.path.exists(path):
              print('::error::Pas de CSV Locust — la passe n\'a pas tourné.')
              sys.exit(1)
          agg = None
          with open(path) as f:
              for row in csv.DictReader(f):
                  if row.get('Name') == 'Aggregated':
                      agg = row
          if not agg:
              print('::error::Ligne Aggregated absente — la passe n\'a pas tourné.')
              sys.exit(1)
          col = next((k for k in agg if '95%' in k), None)
          p95 = float(agg.get(col) or 0)
          print(f'p95 agrégé = {p95} ms (limite {limit} ms)')
          if p95 > limit:
              print('::error::Régression de perf : p95 au-delà de 2× le seuil.')
              sys.exit(1)
          PY
