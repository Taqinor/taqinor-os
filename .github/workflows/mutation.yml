name: mutation (nightly, non-blocking)

# YTEST9 — mutation testing measures ASSERTION QUALITY (coverage only proves
# a line executed, not that a wrong result would be caught). Runs on a small,
# hand-picked set of high-risk modules (quote_engine builder, reference
# numbering, roles model, the ventes money chain, company-scoping mixins/
# permissions — QAH5) — never the whole repo, and NEVER as a per-commit
# gate (mutmut is O(mutants x full test run); see setup.cfg [mutmut]).
# Surviving-mutant triage: docs/TESTING.md (Mutation section).
#
# QAH5 — mutmut 3.x dropped the 2.x `runner=<shell command>` config entirely:
# it now drives `pytest` directly, in-process, and this repo has no
# pytest-django bridge (no conftest.py calling `django.setup()`, no test-DB
# fixture) — `manage.py test`'s own DiscoverRunner is what created/migrated
# the test DB before, and mutmut 3 never calls it. Until that bridge is
# built (out of QAH5's scope — see setup.cfg [mutmut] and docs/TESTING.md),
# `mutmut run` below is EXPECTED to fail to execute any real test and the
# summary/artifact will show empty or errored data. `continue-on-error`
# below means that blocks nothing; do not read an empty score as "0% caught
# mutants" — it means "did not run", not "ran and failed".
on:
  workflow_dispatch: {}
  schedule:
    - cron: '30 3 * * *'   # nightly, after release-verify's 03:00 run

jobs:
  mutation-score:
    runs-on: ubuntu-latest
    # Informational only — a low/regressed score never blocks a merge.
    continue-on-error: true
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: erp_db
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: erp_agentique.settings.dev
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
      DJANGO_DEBUG: 'True'
      DB_NAME: erp_db
      DB_USER: erp_user
      DB_PASSWORD: ci_password
      DB_HOST: localhost
      DB_PORT: '5432'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies (incl. mutmut 3)
        working-directory: backend/django_core
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run mutmut on high-risk modules
        working-directory: backend/django_core
        run: |
          # mutmut 3's `run` has no `--CI` flag any more (see the top-of-file
          # note) — plain `run` is the whole command. `|| true`: informational,
          # never fails the step even if the pytest bridge above is missing.
          mutmut run || true
      - name: Export mutation results (per-mutant text + CI/CD JSON stats)
        working-directory: backend/django_core
        run: |
          # `mutmut junitxml` was removed in 3.x (no JUnit output any more) —
          # `results --all` (every mutant, not just survivors) is the closest
          # human-readable text report, `export-cicd-stats` writes the
          # machine-readable global rollup to mutants/mutmut-cicd-stats.json.
          mutmut results --all > mutmut-results.txt || true
          mutmut export-cicd-stats || true
      - name: Write per-module score to the job summary
        working-directory: backend/django_core
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          print("## Mutation score (mutmut 3, nightly, informational — QAH5)")
          print()

          try:
              from mutmut.utils.file_utils import walk_mutatable_files
              from mutmut.mutation.data import SourceFileMutationData
              from mutmut.stats import collect_stat
          except Exception as exc:  # pragma: no cover - defensive, mutmut internals moved
              print(f"_Could not load mutmut's internal stats API ({exc}) — see the "
                    "`mutation-report` artifact for raw output._")
              raise SystemExit(0)

          rows = []
          try:
              paths = list(walk_mutatable_files())
          except Exception as exc:
              paths = []
              print(f"_Could not list mutated files ({exc})._")

          for path in paths:
              data = SourceFileMutationData(path=path)
              try:
                  data.load()
              except Exception:
                  continue
              if not data.exit_code_by_key:
                  continue
              stat = collect_stat(data)
              score = (stat.killed / stat.total * 100) if stat.total else 0.0
              rows.append((str(path), stat.killed, stat.survived, stat.total, score))

          if not rows:
              print("_No mutation data recorded this run — this is expected while "
                    "the pytest/Django bridge described at the top of "
                    "`.github/workflows/mutation.yml` is missing: `mutmut run` had no "
                    "working test runner to execute, so no mutant was ever tried. "
                    "à remplir par la première exécution nocturne une fois ce pont "
                    "posé (voir `docs/TESTING.md`, section Mutation)._")
              raise SystemExit(0)

          print("| Module | Killed | Survived | Total | Score |")
          print("|---|---:|---:|---:|---:|")
          for path, killed, survived, total, score in sorted(rows):
              print(f"| `{path}` | {killed} | {survived} | {total} | {score:.0f}% |")
          PY
      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: |
            backend/django_core/mutmut-results.txt
            backend/django_core/mutants/mutmut-cicd-stats.json
          if-no-files-found: ignore
