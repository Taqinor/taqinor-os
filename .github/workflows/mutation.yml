name: mutation (nightly)

# YTEST9 — mutation testing measures ASSERTION QUALITY (coverage only proves
# a line executed, not that a wrong result would be caught). Runs on a small,
# hand-picked set of high-risk modules (quote_engine builder, reference
# numbering, roles model, the ventes money chain, company-scoping mixins/
# permissions — QAH5) — never the whole repo, and NEVER as a per-commit
# gate (mutmut is O(mutants x full test run); see setup.cfg [mutmut]).
# Surviving-mutant triage: docs/TESTING.md (Mutation section).
#
# QAH5 — mutmut 3.x dropped the 2.x `runner=<shell command>` config entirely:
# it now drives `pytest` directly, in-process. QAH5 (deepened) built the
# missing pytest-django bridge: `pytest`/`pytest-django` in requirements-dev,
# `[tool:pytest]` in setup.cfg (DJANGO_SETTINGS_MODULE, this repo's real test
# file patterns, `--no-migrations`). Two of the targeted test files import
# `apps.ventes.utils.pdf`, which imports WeasyPrint, which `dlopen`s
# `libgobject`/`libpango` at import time — missing on a bare `ubuntu-latest`
# runner (confirmed: `mutmut run` crashed on exactly that `OSError` before
# the apt step below was added) — same packages `.github/actions/backend-env`
# installs for every other backend job. No Redis/MinIO here: the targeted
# scope only touches storage/MinIO inside `@tag('pdf')` tests, which
# setup.cfg's `addopts` already deselects. Root cause of why this job
# silently ran ZERO mutants for a long time before QAH5: setup.cfg's own
# history comment + docs/TESTING.md's Mutation section.
#
# ENF12 (règle fondateur 09/10/2026, docs/claude-memory/enforce-all-checks.md) :
# job BLOQUANT — plus de `continue-on-error`, plus de `|| true`. Mesure : de
# la nuit du 28/09 à celle du 08/10/2026, CHAQUE passe a fini « runner
# shutdown signal » ~10 min après le début de `mutmut run` (5 608 mutants
# générés, 0 tué / 0 survivant) — masqué en « success ». Désormais :
#   * `scripts/check_mutation_score.py` échoue si < 100 mutants ont été jugés
#     (« n'a pas tourné » n'est plus un vert) ou si le score est sous le
#     plancher (50 % — CONSERVATEUR, aucune passe n'a encore produit de score ;
#     à recalibrer sur la première nuit verte, à monter par paliers de 5) ;
#   * `--max-children 2` (au lieu de 4) : 4 workers Django en parallèle
#     épuisaient la mémoire du runner (arrêt au démarrage des tests).
#   * la borne `timeout 170m` (code 124) est une fin NORMALE d'une passe
#     partielle : le score porte sur les mutants jugés avant la borne ; tout
#     autre code de sortie de mutmut fait échouer l'étape.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '30 3 * * *'   # nightly, after release-verify's 03:00 run

jobs:
  mutation-score:
    runs-on: ubuntu-latest
    # Bounded (QAH5 deepened): the targeted scope is small (7 files, ~360
    # tests per mutant re-run) but mutation testing is O(mutants x test run)
    # — a sensible ceiling so a runaway mutant count/hang doesn't tie up a
    # runner all night instead of failing loud enough to notice.
    # 28/09/2026 (PR #722) : 45 -> 200. Mesuré au premier vrai run : la
    # seule génération des mutants prend ~9 min ; la passe complète est
    # bornée DANS l'étape mutmut (`timeout 170m`) pour que l'export et le
    # résumé tournent toujours, même sur une nuit longue.
    timeout-minutes: 200
    services:
      postgres:
        image: mirror.gcr.io/pgvector/pgvector:pg16
        env:
          POSTGRES_DB: erp_db
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: erp_agentique.settings.dev
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
      DJANGO_DEBUG: 'True'
      DB_NAME: erp_db
      DB_USER: erp_user
      DB_PASSWORD: ci_password
      DB_HOST: localhost
      DB_PORT: '5432'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install WeasyPrint system dependencies
        # QAH5 (deepened) — same packages as `.github/actions/backend-env`
        # (WOW7): two of the targeted test files import a module that
        # imports weasyprint, and weasyprint dlopen()s these at import time.
        # No apt cache here (unlike backend-env) — this job runs once a
        # night, not once per PR lane, so the ~10s apt-get isn't worth the
        # cache-key plumbing.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libpangocairo-1.0-0 libcairo2 libgdk-pixbuf2.0-0 libffi8 libharfbuzz0b shared-mime-info fonts-liberation fonts-noto-core libxmlsec1-openssl
      - name: Install dependencies (incl. mutmut 3 + the pytest-django bridge)
        working-directory: backend/django_core
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Create the Postgres extensions in template1 (pytest --no-migrations)
        # 28/09/2026 (PR #722) — `--no-migrations` crée les tables depuis les
        # modèles SANS jouer les migrations qui posent les extensions : le
        # premier run a échoué sur `type "vector" does not exist`. Les créer
        # dans template1 (l'utilisateur du service est superuser) fait hériter
        # la base de test `test_erp_db`. Liste = les extensions que posent les
        # migrations du dépôt (VectorExtension, BtreeGistExtension, RunSQL
        # unaccent / pg_trgm). Reproduit en local dans l'image CI : 48 tests OK.
        env:
          PGPASSWORD: ci_password
        run: >-
          psql -h localhost -U erp_user -d template1 -v ON_ERROR_STOP=1 -c
          "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS btree_gist;
          CREATE EXTENSION IF NOT EXISTS unaccent; CREATE EXTENSION IF NOT EXISTS pg_trgm;"
      - name: Run mutmut on high-risk modules
        working-directory: backend/django_core
        run: |
          # mutmut 3's `run` has no `--CI` flag any more (see the top-of-file
          # note) — plain `run` is the whole command. `--max-children 2`:
          # modest concurrency for a small, bounded scope on a shared runner
          # (mutmut forks a worker per mutant batch).
          # `timeout 170m` : borne interne (voir timeout-minutes du job) pour
          # que les étapes d'export/résumé suivantes tournent toujours ; son
          # code 124 est la seule sortie non nulle tolérée (ENF12, voir en-tête).
          set +e
          timeout 170m mutmut run --max-children 2
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "mutmut run en échec (code $rc)"; exit "$rc"
          fi
      - name: Export mutation results (per-mutant text + CI/CD JSON stats)
        working-directory: backend/django_core
        run: |
          # `mutmut junitxml` was removed in 3.x (no JUnit output any more) —
          # `results --all` (every mutant, not just survivors) is the closest
          # human-readable text report, `export-cicd-stats` writes the
          # machine-readable global rollup to mutants/mutmut-cicd-stats.json.
          # `--all` attend une valeur en 3.7 (« Option '--all' requires an
          # argument » le 28/09/2026, masqué par `|| true`).
          mutmut results --all true > mutmut-results.txt
          mutmut export-cicd-stats
      - name: Write per-module score to the job summary
        working-directory: backend/django_core
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          print("## Mutation score (mutmut 3, nightly, gate ENF12 — QAH5)")
          print()

          try:
              from mutmut.mutation.data import SourceFileMutationData
              try:  # mutmut 3.8 layout
                  from mutmut.utils.file_utils import walk_mutatable_files
                  from mutmut.stats import collect_stat
              except ImportError:  # mutmut 3.7 (pinned) : both live in __main__
                  from mutmut.__main__ import walk_mutatable_files, collect_stat
          except Exception as exc:  # pragma: no cover - defensive, mutmut internals moved
              print(f"_Could not load mutmut's internal stats API ({exc}) — see the "
                    "`mutation-report` artifact for raw output._")
              raise SystemExit(0)

          rows = []
          try:
              paths = list(walk_mutatable_files())
          except Exception as exc:
              paths = []
              print(f"_Could not list mutated files ({exc})._")

          for path in paths:
              data = SourceFileMutationData(path=path)
              try:
                  data.load()
              except Exception:
                  continue
              if not data.exit_code_by_key:
                  continue
              stat = collect_stat(data)
              score = (stat.killed / stat.total * 100) if stat.total else 0.0
              rows.append((str(path), stat.killed, stat.survived, stat.total, score))

          if not rows:
              print("_No mutation data recorded this run. QAH5 built the pytest/Django "
                    "bridge (see the top-of-file note and setup.cfg's `[tool:pytest]`), "
                    "so an empty table here now means something genuinely went wrong "
                    "(collection error, DB setup failure, a changed dependency) rather "
                    "than the expected state — check the raw `mutmut run` step's log "
                    "and the `mutation-report` artifact. à remplir par la première "
                    "exécution nocturne réussie (voir `docs/TESTING.md`, section "
                    "Mutation, for the baseline once one lands)._")
              raise SystemExit(0)

          print("| Module | Killed | Survived | Total | Score |")
          print("|---|---:|---:|---:|---:|")
          for path, killed, survived, total, score in sorted(rows):
              print(f"| `{path}` | {killed} | {survived} | {total} | {score:.0f}% |")
          PY
      - name: Garde score de mutation (ENF12, bloquante)
        run: python scripts/check_mutation_score.py backend/django_core/mutants/mutmut-cicd-stats.json
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: |
            backend/django_core/mutmut-results.txt
            backend/django_core/mutants/mutmut-cicd-stats.json
          if-no-files-found: ignore
