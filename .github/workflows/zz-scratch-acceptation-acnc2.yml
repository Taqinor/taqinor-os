name: zz scratch - acceptation ACNC lot 2 (essai runner, TEMPORAIRE)

# ESSAI (14/11/2026) : preuves en direct ACNC (parcours PF9, spec acnc2.spec.js, METHODE §C.4 point 7)
# sur un runner GitHub. Squelette = `ci-image-check` + `e2e-full` de release-verify.yml, avec DEUX
# differences : gunicorn a 6 workers synchrones (deux requetes « simultanees » doivent etre servies en
# parallele, sinon la course n'est pas jouee) et le service IA (FastAPI, uvicorn) pour ACNC42.
# Declenche seulement par un push sur la branche d'essai ; supprime au dernier commit.
on:
  push:
    branches: [acceptation-acnc2-runner]

concurrency:
  group: zz-scratch-acceptation-acnc2
  cancel-in-progress: true

jobs:
  ci-image-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
      image_e2e: ${{ steps.tag.outputs.image_e2e }}
    steps:
      - uses: actions/checkout@v4
      - name: Calculer les etiquettes des images
        id: tag
        run: bash .github/ci-image/tag.sh "${{ github.repository }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Les images sont-elles deja publiees ?
        id: exists
        run: |
          set -uo pipefail
          for couple in "backend:${{ steps.tag.outputs.image }}" "e2e:${{ steps.tag.outputs.image_e2e }}"; do
            cle="${couple%%:*}"; ref="${couple#*:}"
            if docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "Presente : $ref"; echo "${cle}=true" >> "$GITHUB_OUTPUT"
            else
              echo "ABSENTE : $ref"; echo "${cle}=false" >> "$GITHUB_OUTPUT"
            fi
          done
          exit 0
      - uses: docker/setup-buildx-action@v3
        if: ${{ steps.exists.outputs.backend != 'true' || steps.exists.outputs.e2e != 'true' }}
      - name: Construire et pousser ci-backend si elle manque
        if: ${{ steps.exists.outputs.backend != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: backend/django_core
          file: .github/ci-image/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Construire et pousser ci-e2e si elle manque
        if: ${{ steps.exists.outputs.e2e != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: .github/ci-image/Dockerfile.e2e
          build-args: |
            CI_BACKEND_IMAGE=${{ steps.tag.outputs.image }}
          push: true
          tags: ${{ steps.tag.outputs.image_e2e }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  acceptation-acnc2:
    needs: ci-image-check
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    container:
      image: ${{ needs.ci-image-check.outputs.image_e2e }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      redis:
        image: mirror.gcr.io/library/redis:7.4-alpine
        ports:
          - 6379:6379
    env:
      DJANGO_SETTINGS_MODULE: erp_agentique.settings.dev
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
      DJANGO_DEBUG: 'True'
      DB_NAME: erp_db
      DB_USER: erp_user
      DB_PASSWORD: ci_password
      DB_HOST: localhost
      DB_PORT: '5432'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      WEBSITE_LEAD_WEBHOOK_SECRET: e2e-webhook-secret
      E2E_WEBHOOK_SECRET: e2e-webhook-secret
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      MINIO_ENDPOINT: localhost:9000
      MINIO_ROOT_USER: erp_admin
      MINIO_ROOT_PASSWORD: erp_minio_password
      MINIO_BUCKET_PDF: erp-pdf
      MINIO_BUCKET_UPLOADS: erp-uploads
      TENANT_RATE_LIMIT: '0'
      LOGIN_RATE_LIMIT: '1000/minute'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: ./.github/actions/backend-env
        with:
          testdb-cache-into: erp_db
          prebuilt-image: 'true'
          testdb-save: 'false'
      - name: Migrate + seed demo
        working-directory: backend/django_core
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo
          python manage.py seed_catalogue
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Playwright chromium (deja dans l'image)
        working-directory: frontend
        run: npx playwright install chromium
      - name: Build frontend (sans service worker)
        working-directory: frontend
        env:
          VITE_E2E: '1'
        run: npm run build
      - name: Service IA (FastAPI) - environnement isole pour ACNC42
        working-directory: backend/fastapi_ia
        run: |
          # Sous-ensemble des dependances : ni torch (sentence-transformers), ni whisper, ni langchain,
          # tous importes paresseusement ; la route /sql-agent/confirm n'en a pas besoin.
          grep -vE '^(langchain|openai|sentence-transformers|pypdf|Pillow|pymupdf|faster-whisper)' requirements.txt > /tmp/req-ia.txt
          python -m venv /tmp/ia
          /tmp/ia/bin/pip install -q --disable-pip-version-check -r /tmp/req-ia.txt
          /tmp/ia/bin/python -c "import fastapi, uvicorn, jwt, redis, httpx, sqlalchemy; print('IA ok')"
      - name: Django + service IA + spec d'acceptation ACNC (lot 2)
        working-directory: backend/django_core
        env:
          E2E_ACCEPTATION: '1'
          E2E_SONDE_LOCALE: '1'
          ACCEPTATION_SHA: ${{ github.sha }}
          E2E_IA_URL: http://127.0.0.1:8100
          E2E_IA_PYTHON: /tmp/ia/bin/python
          DJANGO_INTERNAL_URL: http://127.0.0.1:8000
        run: |
          # 6 workers synchrones : deux requetes paralleles sont servies EN MEME TEMPS (la spec le
          # verifie dans Postgres : pg_locks montre les deux requetes bloquees ensemble).
          gunicorn erp_agentique.wsgi:application             --bind 127.0.0.1:8000 --workers 6 --timeout 120 --worker-class sync             --access-logfile /tmp/gunicorn-access.log             --error-logfile /tmp/gunicorn-error.log --capture-output &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/django/admin/login/ || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then echo "Django pret (HTTP $code)"; break; fi
            echo "Attente Django ($i)"; sleep 2
            if [ "$i" = "30" ]; then echo "Django indisponible"; exit 1; fi
          done
          echo "Workers gunicorn : $(pgrep -f 'gunicorn erp_agentique' | wc -l) processus (1 maitre + workers)"
          ( cd ../fastapi_ia && /tmp/ia/bin/uvicorn app.main:app --host 127.0.0.1 --port 8100 --workers 1               > /tmp/uvicorn.log 2>&1 & )
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8100/health || true)
            if [ "$code" = "200" ]; then echo "Service IA pret"; break; fi
            echo "Attente service IA ($i)"; sleep 2
            if [ "$i" = "30" ]; then echo "Service IA indisponible"; tail -n 60 /tmp/uvicorn.log; fi
          done
          export E2E_DJANGO_EXEC="env -C ${GITHUB_WORKSPACE}/backend/django_core"
          cd ../../frontend
          npx playwright test --project=acceptation e2e/acceptation/acnc2.spec.js
      - name: Queue des journaux gunicorn (diagnostic)
        if: ${{ !cancelled() }}
        run: |
          tail -n 120 /tmp/gunicorn-error.log || true
          echo '--- service IA ---'
          tail -n 80 /tmp/uvicorn.log || true
      - name: Upload enregistrement d'acceptation (petit)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: acceptation-acnc2-enregistrement
          path: |
            docs/audits/acceptation/ACNC/
            docs/qa-explorer/captures/*/ACCEPTATION-ACNC-PF9.*.jpg
          retention-days: 7
          if-no-files-found: warn
      - name: Upload rapport Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: acceptation-acnc2-rapport-playwright
          path: frontend/playwright-report
          retention-days: 7
          if-no-files-found: ignore
