# TEMPORAIRE (vague all-plans 6, 24/10/2026) — recapture des goldens du moteur
# dans l'image CI (Docker Desktop local indisponible). Supprimé avant le merge.
name: zz-scratch-goldens-w6

on:
  push:
    branches: [claude/all-plans-loop-w6-e165af]

concurrency:
  group: zz-scratch-goldens-w6
  cancel-in-progress: true

jobs:
  ci-image-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Calculer les etiquettes des images
        id: tag
        run: bash .github/ci-image/tag.sh "${{ github.repository }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: L'image est-elle deja publiee ?
        id: exists
        run: |
          if docker manifest inspect "${{ steps.tag.outputs.image }}" >/dev/null 2>&1; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
        if: ${{ steps.exists.outputs.backend != 'true' }}
      - name: Construire et pousser ci-backend si elle manque
        if: ${{ steps.exists.outputs.backend != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: backend/django_core
          file: .github/ci-image/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  goldens:
    needs: ci-image-check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    container:
      image: ${{ needs.ci-image-check.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      redis:
        image: mirror.gcr.io/library/redis:7.4-alpine
        ports:
          - 6379:6379
    env:
      DJANGO_SETTINGS_MODULE: erp_agentique.settings.dev
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
      DJANGO_DEBUG: 'True'
      DB_NAME: erp_db
      DB_USER: erp_user
      DB_PASSWORD: ci_password
      DB_HOST: localhost
      DB_PORT: '5432'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      MINIO_ENDPOINT: localhost:9000
      MINIO_ROOT_USER: erp_admin
      MINIO_ROOT_PASSWORD: erp_minio_password
      MINIO_BUCKET_PDF: erp-pdf
      MINIO_BUCKET_UPLOADS: erp-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/backend-env
        with:
          testdb-cache-into: test_erp_db
          prebuilt-image: 'true'
          testdb-save: 'false'
      - name: Recapturer les goldens du moteur (UPDATE_GOLDEN=1)
        working-directory: backend/django_core
        run: |
          UPDATE_GOLDEN=1 python manage.py test \
            apps.ventes.tests.test_moteur_golden_build_quote_data \
            apps.ventes.tests.test_moteur_golden_legacy \
            -v 2 --keepdb || true
      - name: Rejouer les goldens recapturés + empreintes figées (sans UPDATE_GOLDEN)
        working-directory: backend/django_core
        run: |
          python manage.py test \
            apps.ventes.tests.test_moteur_golden_build_quote_data \
            apps.ventes.tests.test_moteur_golden_legacy \
            apps.ventes.tests.test_quote_engine_formats.TestQjr307PreuveOctetsOnepageAgricole \
            apps.ventes.tests.test_split_devis_solar.RenduHtmlSolarTests \
            apps.ventes.tests.test_regles_calcul_rendu_origine \
            -v 2 --keepdb || true
      - uses: actions/upload-artifact@v4
        with:
          name: goldens-moteur-w6
          path: backend/django_core/apps/ventes/tests/golden/moteur/
          retention-days: 3
