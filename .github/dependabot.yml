version: 2
# ADCG66 — chaque groupe hebdo ne porte que mineures + correctifs : une MAJEURE
# (souvent incompatible) arrive en PR individuelle et ne rougit plus tout le groupe.
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "chore"
    groups:
      npm-weekly:
        patterns:
          - "*"
        update-types: ["minor", "patch"]

  # Sécurité 2026-08-24 — apps/web et backend/fastapi_ia n'étaient PAS
  # surveillés : leurs alertes (astro/wrangler/undici, PyJWT/langchain…)
  # s'accumulaient sans jamais produire de PR. Mêmes réglages groupés hebdo.
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "chore"
    groups:
      npm-web-weekly:
        patterns:
          - "*"
        update-types: ["minor", "patch"]

  # YBW1 — site public YanBow (apps/yanbow-web), memes reglages groupes hebdo.
  - package-ecosystem: "npm"
    directory: "/apps/yanbow-web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "chore"
    groups:
      npm-yanbow-web-weekly:
        patterns:
          - "*"
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/backend/fastapi_ia"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "chore"
    groups:
      pip-ia-weekly:
        patterns:
          - "*"
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/backend/django_core"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "chore"
    # Django 6.x exige Python >= 3.12 ; la prod tourne en python:3.11 (Dockerfile) :
    # à retirer quand l'image passe en 3.12.
    ignore:
      - dependency-name: "django"
        versions: [">=6.0"]
    groups:
      pip-weekly:
        patterns:
          - "*"
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "chore"
    groups:
      github-actions-weekly:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
