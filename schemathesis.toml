# ─────────────────────────────────────────────────────────────────────────────
# ENF1 (09/10/2026) — configuration Schemathesis v4 du job `api-fuzz`
# (`.github/workflows/release-verify.yml`). Découverte automatique : le job lance
# `schemathesis run` depuis la RACINE du dépôt, où vit ce fichier.
#
# Règle fondateur du 09/10 (docs/claude-memory/enforce-all-checks.md) : TOUS les
# checks (`--checks all`, posé dans le workflow), job BLOQUANT. Ce fichier ne
# retire donc QUE deux familles d'opérations, chacune justifiée ci-dessous :
#   1. les opérations qui DÉTRUISENT le harnais lui-même (la session du fuzzeur)
#      ou ont des effets externes RÉELS ;
#   2. le miroir `/api/v1/` (mêmes vues que `/api/django/`).
# Jamais un vrai endpoint retiré pour « faire baisser » les constats.
#
# Le reste du harnais :
#   - authentification (cookie `access_token` du compte `fuzz_admin`, re-login
#     périodique + sur 401) : `scripts/fuzz/schemathesis_hooks.py` (variable
#     SCHEMATHESIS_HOOKS posée par le workflow) ;
#   - compte de fuzz dédié + ids FK connus : `scripts/fuzz/prepare_fuzz_env.py` ;
#   - throttles DRF coupés dans le seul serveur de fuzz : `scripts/fuzz/gunicorn_fuzz.py`.
# ─────────────────────────────────────────────────────────────────────────────

# ── 1a. Auto-destruction de la session du fuzzeur (cluster C1 du 09/10) ─────
# Run 37856987210 : le fuzzeur appelait `POST /auth/logout/` et
# `POST /auth/sessions/{id}/revoke/`, révoquait SA PROPRE session (AUD408 :
# `access_session_revoked`) et ~3 800 réponses suivantes étaient des 401
# « Session révoquée » — ~4 000 opérations jamais réellement testées.
# `change-password` révoque aussi les sessions (AUD408) et rendrait le mot de
# passe du re-login caduc. Ces vues restent couvertes par leurs tests Django.
[[operations]]
include-path-regex = '^/api/django/auth/(logout|change-password|sessions/[^/]+/revoke)/$'
enabled = false

# ── 1b. Envois externes RÉELS / actions destructrices (repris de QAH6) ──────
#   - `adsengine/` : moteur Meta Ads/Instagram (publication réelle, réponses /
#     suppression de commentaires, connexions Meta) — surface entière.
#   - `/contact/` : formulaire public -> e-mail SendGrid (parqué, exclu par principe).
#   - `statuspage/public/(abonner|confirmer|desabonner)/` : e-mail de confirmation
#     (`apps/statuspage/views.py` `_envoyer_email_confirmation`).
#   - `automation/approvals/{id}/approve/` : RELANCE l'action différée
#     (`engine.run_approved`) — e-mail/SMS/WhatsApp selon la règle. `reject` et
#     `simuler` restent fuzzés.
# NB : l'ancienne regex écrivait `approvals/[0-9]+/approve/` ; or le filtre
# s'applique au GABARIT (`approvals/{id}/approve/`) — elle ne correspondait
# donc à rien et l'opération était fuzzée (constaté dans le run du 09/10).
[[operations]]
include-path-regex = '(adsengine/|/contact/|statuspage/public/(abonner|confirmer|desabonner)/|automation/approvals/[^/]+/approve/)'
enabled = false

# ── 2. Miroir `/api/v1/` ────────────────────────────────────────────────────
# `erp_agentique/urls.py` monte la MÊME liste `_APP_URLS` sous `api/django/` et
# sous `api/v1/` (YAPIC7 : « mêmes vues, mêmes ViewSets »). Fuzzer les deux
# doublait chaque opération (7 013 sélectionnées le 09/10, la moitié en double)
# et chaque constat — pour le même code. Seul `/api/v1/` est retiré : les
# opérations hors de ces deux préfixes (publiques, schéma…) restent fuzzées.
[[operations]]
include-path-regex = '^/api/v1/'
enabled = false

# ── 3. Précondition requise : 428 est un REJET (ACAL316) ────────────────────
# `POST …/calepinages/{id}/layout/` exige l'en-tête `If-Match` (déclaré
# `required`) : absent, la vue répond 428 Precondition Required (RFC 6585) et
# n'écrit rien — le code sémantiquement exact, à ne pas changer. Le check
# `missing_required_header` de Schemathesis 4.28 n'admet par défaut que
# 400/401/403/406/415/422 (`MISSING_REQUIRED_HEADER_EXPECTED_STATUSES`) : CI
# #993 (cas KAogBl) a pris le 428 pour « en-tête manquant non rejeté ». On
# AJOUTE 428 aux statuts attendus de CE check pour CETTE seule opération
# (`include-name` = libellé exact « MÉTHODE chemin » — un seul filtre, car deux
# filtres include se combinent en OU) ; le check reste actif, partout.
[[operations]]
include-name = 'POST /api/django/calepinage/calepinages/{id}/layout/'
checks.missing_required_header.expected-statuses = [400, 401, 403, 406, 415, 422, 428]

# ── 4. Route RETIRÉE : le 410 est la réponse VOULUE (ASAV27) ────────────────
# `POST /api/django/sav/portail/tickets/` est déclarée `deprecated` (contrat
# public conservé, snapshot PACT6) mais répond TOUJOURS 410 « Formulaire
# retiré » — sans lire le corps ni le jeton, sans créer de ticket. Pour
# `positive_data_acceptance`, un 410 n'est pas dans les statuts attendus
# (`POSITIVE_DATA_ACCEPTANCE_EXPECTED_STATUSES` de Schemathesis 4.28) : le
# fuzz prenait cette retraite pour un corps conforme « refusé ». On AJOUTE
# 410 aux statuts attendus de CE check pour CETTE seule opération (un seul
# filtre `include-name`) ; le check reste actif partout ailleurs.
[[operations]]
include-name = 'POST /api/django/sav/portail/tickets/'
checks.positive_data_acceptance.expected-statuses = ["2xx", 401, 403, 404, 409, 410, 429, "5xx"]

# ── 5. Clé OCR absente : la 503 « douce » est la réponse VOULUE (XSAL8) ─────
# `POST /api/django/crm/leads/scan-carte/` lit une photo valide puis, sans
# fournisseur OCR configuré (`ZHIPU_API_KEY` absent — l'état du serveur de fuzz),
# répond 503 `{detail}` sans appel réseau : le front en dépend (il retire le
# bouton « Scanner »). La 503 est déclarée au schéma ; pour `not_a_server_error`
# elle n'est pourtant pas dans les statuts attendus par défaut
# (`["2xx", "3xx", "4xx"]`, Schemathesis 4.28). On AJOUTE 503 aux statuts
# attendus de CE check pour CETTE seule opération (un seul filtre
# `include-name`) ; le check reste actif partout ailleurs.
[[operations]]
include-name = 'POST /api/django/crm/leads/scan-carte/'
checks.not_a_server_error.expected-statuses = ["2xx", "3xx", "4xx", 503]

# ── 6. Créneau hors grille : le 400 est la règle métier (D-ENF11-CRENEAU-400) ─
# `POST …/portail-fournisseur/{token}/reserver-creneau/` refuse un début qui ne
# tombe pas sur la grille proposée (heure pleine, plage d'ouverture, jours
# ouvrés du calendrier société, horizon) par 400 `{debut: [...]}` — contrat
# ASTK191, inchangé. Cette grille est un ÉTAT du serveur qu'aucun schéma
# OpenAPI ne peut exprimer : un `debut` conforme au format `date-time` mais
# hors grille n'est pas « refusé à tort ». Décision fondateur du 29-30/10/2026 :
# 400 AJOUTÉ aux statuts attendus de `positive_data_acceptance` pour CETTE
# SEULE opération (un seul filtre `include-name`) ; le check reste actif partout.
[[operations]]
include-name = 'POST /api/django/public/stock/portail-fournisseur/{token}/reserver-creneau/'
checks.positive_data_acceptance.expected-statuses = ["2xx", 400, 401, 403, 404, 409, 429, "5xx"]

# ── 7. Lien de dépôt public expiré : le 410 est la réponse VOULUE (ENF45 b) ──
# `GET` / `POST /api/django/ged/depot/{token}/` (XGED7) résolvent le lien par
# son seul jeton : un lien expiré, révoqué ou au quota épuisé répond 410 Gone
# (déclaré au schéma, `oa.PUBLIC_ERREUR`) — l'écran public `PublicDepotPage.jsx`
# lit ce 410 pour afficher « lien expiré ». Le lien d'inventaire du fuzz peut
# s'épuiser en cours de run (nocturne 41958593088) : un jeton conforme au
# schéma qui n'ouvre plus rien n'est pas une requête « refusée à tort ». Comme
# la § 4 (ASAV27), 410 est AJOUTÉ aux statuts attendus de
# `positive_data_acceptance` pour CES SEULES deux opérations (un filtre
# `include-name` par entrée — deux filtres include se combineraient en OU) ;
# le check reste actif partout ailleurs et l'endpoint est inchangé.
[[operations]]
include-name = 'GET /api/django/ged/depot/{token}/'
checks.positive_data_acceptance.expected-statuses = ["2xx", 401, 403, 404, 409, 410, 429, "5xx"]

[[operations]]
include-name = 'POST /api/django/ged/depot/{token}/'
checks.positive_data_acceptance.expected-statuses = ["2xx", 401, 403, 404, 409, 410, 429, "5xx"]

# ── 8. Étape de workflow qui se désigne elle-même : le 400 est la règle ─────
# (D-ENF11-WORKFLOW-BOUCLE-400) — `PUT`/`PATCH …/core/workflow-definitions/{id}/`
# refusent une étape dont `etape_alternative_si_echec` la désigne elle-même
# (boucle infinie, NTWFL9) par 400. « Ce graphe n'a pas de cycle » n'est
# exprimable par aucun schéma OpenAPI 3.0 : une étape conforme au format mais
# en boucle n'est pas « refusée à tort ». Décision fondateur du 06/11/2026,
# même forme que la § 6 : 400 AJOUTÉ aux statuts attendus de
# `positive_data_acceptance` pour CES SEULES deux opérations (un filtre
# `include-name` par entrée) ; le check reste actif partout ailleurs.
[[operations]]
include-name = 'PUT /api/django/core/workflow-definitions/{id}/'
checks.positive_data_acceptance.expected-statuses = ["2xx", 400, 401, 403, 404, 409, 429, "5xx"]

[[operations]]
include-name = 'PATCH /api/django/core/workflow-definitions/{id}/'
checks.positive_data_acceptance.expected-statuses = ["2xx", 400, 401, 403, 404, 409, 429, "5xx"]

# ── 9. Parrainage refusé : le 400 est la règle métier (D-ASOC71-PARRAINAGE-400) ─
# `POST`/`PUT`/`PATCH …/crm/parrainages/` refusent l'auto-parrainage (parrain =
# filleul) et le second parrainage d'un même filleul par 400 nommant le champ
# (ASOC71). « Le parrain diffère du filleul » et « ce filleul n'a pas déjà un
# parrain » ne sont exprimables par aucun schéma OpenAPI 3.0 : un corps conforme
# mais dans ce cas n'est pas « refusé à tort ». Décision fondateur du 10/11/2026,
# même forme que les § 6 et 8 : 400 AJOUTÉ aux statuts attendus de
# `positive_data_acceptance` pour CES SEULES trois opérations ; le check reste
# actif partout ailleurs.
[[operations]]
include-name = 'POST /api/django/crm/parrainages/'
checks.positive_data_acceptance.expected-statuses = ["2xx", 400, 401, 403, 404, 409, 429, "5xx"]

[[operations]]
include-name = 'PUT /api/django/crm/parrainages/{id}/'
checks.positive_data_acceptance.expected-statuses = ["2xx", 400, 401, 403, 404, 409, 429, "5xx"]

[[operations]]
include-name = 'PATCH /api/django/crm/parrainages/{id}/'
checks.positive_data_acceptance.expected-statuses = ["2xx", 400, 401, 403, 404, 409, 429, "5xx"]

# ── 10. Jeton de version manquant : le 428 est la précondition (ACON9) ─────
# `POST …/ventes/devis/{id}/sync-layout/` et `POST …/ventes/devis/{id}/layout/`
# exigent `If-Match` (jeton de version du calepinage) dès qu'un calepinage est
# lié au devis : sans jeton, 428 Precondition Required (déclaré au schéma,
# ACON9). Le fuzz envoie un `If-Match` vide, conforme au format mais sans jeton
# lisible : ce n'est pas une requête « refusée à tort ». Comme les § 7 (410),
# 428 est AJOUTÉ aux statuts attendus de `positive_data_acceptance` pour CES
# SEULES deux opérations (un filtre `include-name` par entrée) ; le check reste
# actif partout ailleurs et les endpoints sont inchangés.
[[operations]]
include-name = 'POST /api/django/ventes/devis/{id}/sync-layout/'
checks.positive_data_acceptance.expected-statuses = ["2xx", 401, 403, 404, 409, 428, 429, "5xx"]

[[operations]]
include-name = 'POST /api/django/ventes/devis/{id}/layout/'
checks.positive_data_acceptance.expected-statuses = ["2xx", 401, 403, 404, 409, 428, 429, "5xx"]

# ── 11. E-mail qui ne part pas : le 502 est la réponse VOULUE (AMSG28/AMSG61) ─
# PR #1377 (12/11/2026). Vague 13 : le backend console/dummy n'est plus un faux
# « envoyé » (AMSG28 : `EMAIL_BACKENDS_SANS_ENVOI`) et l'enveloppe AMSG61
# (`core/email_backends.py`) ne remet, sous `DEBUG`, qu'aux destinataires de la
# liste autorisée — l'état du serveur de fuzz. Ces six envois répondent alors
# 502 Bad Gateway `{detail}` (« l'e-mail n'est pas parti », déclaré au schéma :
# AARG69, AAPV46, ASAV68), sans changer le statut du document : c'est leur
# contrat, lu par le front, jamais un faux succès. Comme la § 5 (503 OCR, XSAL8),
# 502 est AJOUTÉ aux statuts attendus de `not_a_server_error` pour CES SEULES
# opérations (un filtre `include-name` par entrée) ; le check reste actif partout
# ailleurs, et un vrai crash (500) reste rouge sur elles aussi.
[[operations]]
include-name = 'POST /api/django/ventes/devis/{id}/envoyer-email/'
checks.not_a_server_error.expected-statuses = ["2xx", "3xx", "4xx", 502]

[[operations]]
include-name = 'POST /api/django/achats/bons-commande-fournisseur/{id}/envoyer-email/'
checks.not_a_server_error.expected-statuses = ["2xx", "3xx", "4xx", 502]

[[operations]]
include-name = 'POST /api/django/stock/bons-commande-fournisseur/{id}/envoyer-email/'
checks.not_a_server_error.expected-statuses = ["2xx", "3xx", "4xx", 502]

[[operations]]
include-name = 'POST /api/django/facturation/factures/{id}/relancer/'
checks.not_a_server_error.expected-statuses = ["2xx", "3xx", "4xx", 502]

[[operations]]
include-name = 'POST /api/django/ventes/factures/{id}/relancer/'
checks.not_a_server_error.expected-statuses = ["2xx", "3xx", "4xx", 502]

[[operations]]
include-name = 'POST /api/django/monitoring/configs/{id}/email-om-report/'
