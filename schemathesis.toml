# ─────────────────────────────────────────────────────────────────────────────
# ENF1 (09/10/2026) — configuration Schemathesis v4 du job `api-fuzz`
# (`.github/workflows/release-verify.yml`). Découverte automatique : le job lance
# `schemathesis run` depuis la RACINE du dépôt, où vit ce fichier.
#
# Règle fondateur du 09/10 (docs/claude-memory/enforce-all-checks.md) : TOUS les
# checks (`--checks all`, posé dans le workflow), job BLOQUANT. Ce fichier ne
# retire donc QUE deux familles d'opérations, chacune justifiée ci-dessous :
#   1. les opérations qui DÉTRUISENT le harnais lui-même (la session du fuzzeur)
#      ou ont des effets externes RÉELS ;
#   2. le miroir `/api/v1/` (mêmes vues que `/api/django/`).
# Jamais un vrai endpoint retiré pour « faire baisser » les constats.
#
# Le reste du harnais :
#   - authentification (cookie `access_token` du compte `fuzz_admin`, re-login
#     périodique + sur 401) : `scripts/fuzz/schemathesis_hooks.py` (variable
#     SCHEMATHESIS_HOOKS posée par le workflow) ;
#   - compte de fuzz dédié + ids FK connus : `scripts/fuzz/prepare_fuzz_env.py` ;
#   - throttles DRF coupés dans le seul serveur de fuzz : `scripts/fuzz/gunicorn_fuzz.py`.
# ─────────────────────────────────────────────────────────────────────────────

# ── 1a. Auto-destruction de la session du fuzzeur (cluster C1 du 09/10) ─────
# Run 37856987210 : le fuzzeur appelait `POST /auth/logout/` et
# `POST /auth/sessions/{id}/revoke/`, révoquait SA PROPRE session (AUD408 :
# `access_session_revoked`) et ~3 800 réponses suivantes étaient des 401
# « Session révoquée » — ~4 000 opérations jamais réellement testées.
# `change-password` révoque aussi les sessions (AUD408) et rendrait le mot de
# passe du re-login caduc. Ces vues restent couvertes par leurs tests Django.
[[operations]]
include-path-regex = '^/api/django/auth/(logout|change-password|sessions/[^/]+/revoke)/$'
enabled = false

# ── 1b. Envois externes RÉELS / actions destructrices (repris de QAH6) ──────
#   - `adsengine/` : moteur Meta Ads/Instagram (publication réelle, réponses /
#     suppression de commentaires, connexions Meta) — surface entière.
#   - `/contact/` : formulaire public -> e-mail SendGrid (parqué, exclu par principe).
#   - `statuspage/public/(abonner|confirmer|desabonner)/` : e-mail de confirmation
#     (`apps/statuspage/views.py` `_envoyer_email_confirmation`).
#   - `automation/approvals/{id}/approve/` : RELANCE l'action différée
#     (`engine.run_approved`) — e-mail/SMS/WhatsApp selon la règle. `reject` et
#     `simuler` restent fuzzés.
# NB : l'ancienne regex écrivait `approvals/[0-9]+/approve/` ; or le filtre
# s'applique au GABARIT (`approvals/{id}/approve/`) — elle ne correspondait
# donc à rien et l'opération était fuzzée (constaté dans le run du 09/10).
[[operations]]
include-path-regex = '(adsengine/|/contact/|statuspage/public/(abonner|confirmer|desabonner)/|automation/approvals/[^/]+/approve/)'
enabled = false

# ── 2. Miroir `/api/v1/` ────────────────────────────────────────────────────
# `erp_agentique/urls.py` monte la MÊME liste `_APP_URLS` sous `api/django/` et
# sous `api/v1/` (YAPIC7 : « mêmes vues, mêmes ViewSets »). Fuzzer les deux
# doublait chaque opération (7 013 sélectionnées le 09/10, la moitié en double)
# et chaque constat — pour le même code. Seul `/api/v1/` est retiré : les
# opérations hors de ces deux préfixes (publiques, schéma…) restent fuzzées.
[[operations]]
include-path-regex = '^/api/v1/'
enabled = false

# ── 3. Précondition requise : 428 est un REJET (ACAL316) ────────────────────
# `POST …/calepinages/{id}/layout/` exige l'en-tête `If-Match` (déclaré
# `required`) : absent, la vue répond 428 Precondition Required (RFC 6585) et
# n'écrit rien — le code sémantiquement exact, à ne pas changer. Le check
# `missing_required_header` de Schemathesis 4.28 n'admet par défaut que
# 400/401/403/406/415/422 (`MISSING_REQUIRED_HEADER_EXPECTED_STATUSES`) : CI
# #993 (cas KAogBl) a pris le 428 pour « en-tête manquant non rejeté ». On
# AJOUTE 428 aux statuts attendus de CE check pour CETTE seule opération
# (`include-name` = libellé exact « MÉTHODE chemin » — un seul filtre, car deux
# filtres include se combinent en OU) ; le check reste actif, partout.
[[operations]]
include-name = 'POST /api/django/calepinage/calepinages/{id}/layout/'
checks.missing_required_header.expected-statuses = [400, 401, 403, 406, 415, 422, 428]

# ── 4. Route RETIRÉE : le 410 est la réponse VOULUE (ASAV27) ────────────────
# `POST /api/django/sav/portail/tickets/` est déclarée `deprecated` (contrat
# public conservé, snapshot PACT6) mais répond TOUJOURS 410 « Formulaire
# retiré » — sans lire le corps ni le jeton, sans créer de ticket. Pour
# `positive_data_acceptance`, un 410 n'est pas dans les statuts attendus
# (`POSITIVE_DATA_ACCEPTANCE_EXPECTED_STATUSES` de Schemathesis 4.28) : le
# fuzz prenait cette retraite pour un corps conforme « refusé ». On AJOUTE
# 410 aux statuts attendus de CE check pour CETTE seule opération (un seul
# filtre `include-name`) ; le check reste actif partout ailleurs.
[[operations]]
include-name = 'POST /api/django/sav/portail/tickets/'
checks.positive_data_acceptance.expected-statuses = ["2xx", 401, 403, 404, 409, 410, 429, "5xx"]
